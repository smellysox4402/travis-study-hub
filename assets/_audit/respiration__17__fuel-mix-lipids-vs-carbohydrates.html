<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fuel comparison at the club: carbohydrate tank shows glucose entering glycolysis first so anaerobic respiration is possible with 17 kilojoules per gram and more than fifty percent of its mass is oxygen, while the lipid tank shows fatty acids broken down to acetyl groups in the mitochondrial matrix feeding the Krebs cycle so anaerobic respiration is impossible, with 37 kilojoules per gram and nearly ninety percent of its mass being carbon and hydrogen">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">FUEL MIX — LIPIDS VS CARBOHYDRATES</text>

      <rect x="30" y="52" width="290" height="180" rx="9" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="2"/>
      <text x="175" y="74" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">CARBOHYDRATES</text>
      <text x="175" y="98" fill="#b9a3d6" font-size="9.5" text-anchor="middle">first stage = GLYCOLYSIS</text>
      <text x="175" y="116" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">anaerobic respiration POSSIBLE</text>
      <text x="175" y="136" fill="#b9a3d6" font-size="9.5" text-anchor="middle">pyruvate → acetyl via link reaction</text>
      <text x="175" y="154" fill="#b9a3d6" font-size="9.5" text-anchor="middle">(needs O₂ for the Krebs road)</text>
      <text x="175" y="182" fill="#4ade80" font-size="13" font-weight="900" text-anchor="middle">17 kJ / gram</text>
      <text x="175" y="204" fill="#b9a3d6" font-size="9" text-anchor="middle">&gt;50% of mass is oxygen</text>
      <text x="175" y="220" fill="#b9a3d6" font-size="9" text-anchor="middle">oxygen yields no energy when oxidised</text>

      <rect x="340" y="52" width="290" height="180" rx="9" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2"/>
      <text x="485" y="74" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">LIPIDS (fats + oils)</text>
      <text x="485" y="98" fill="#b9a3d6" font-size="9.5" text-anchor="middle">first stage = fatty acids → acetyl</text>
      <text x="485" y="116" fill="#b9a3d6" font-size="9.5" text-anchor="middle">groups in the MATRIX</text>
      <text x="485" y="134" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">anaerobic respiration IMPOSSIBLE</text>
      <text x="485" y="152" fill="#b9a3d6" font-size="9.5" text-anchor="middle">both stages need oxygen</text>
      <text x="485" y="182" fill="#4ade80" font-size="13" font-weight="900" text-anchor="middle">37 kJ / gram</text>
      <text x="485" y="204" fill="#b9a3d6" font-size="9" text-anchor="middle">~90% of mass is carbon + hydrogen</text>
      <text x="485" y="220" fill="#b9a3d6" font-size="9" text-anchor="middle">C and H both yield energy when oxidised</text>

      <text x="330" y="272" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">LIPIDS ≈ 2× THE ENERGY PER GRAM</text>
      <text x="330" y="296" fill="#b9a3d6" font-size="9.5" text-anchor="middle">why? nearly 90% of lipid mass is C + H · more than 50% of carbohydrate mass is O (no energy yield)</text>
      <text x="330" y="320" fill="#b9a3d6" font-size="9.5" text-anchor="middle">both are oxidised in respiration → both work as energy-yielding foods and energy stores</text>
      <text x="330" y="344" fill="#22d3ee" font-size="9.5" font-weight="800" text-anchor="middle">acetyl groups (2C) from both fuels enter the Krebs cycle via acetyl CoA</text>
    </svg></body></html>
