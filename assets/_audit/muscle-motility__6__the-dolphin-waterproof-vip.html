<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a streamlined dolphin showing fluke, dorsal fin, flipper and blowhole adaptations">
      <rect width="640" height="360" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE DOLPHIN — WATERPROOF VIP</text>
      <!-- body -->
      <path d="M 70 200 C 90 150 220 108 360 120 C 470 130 520 160 545 185
               L 590 175 L 610 200 L 590 215 L 545 205
               C 520 230 470 255 360 260 C 240 265 120 250 70 200 Z"
            fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="3.5"/>
      <!-- dorsal fin -->
      <path d="M 330 122 Q 350 70 392 92 Q 400 98 395 124 Z" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="3"/>
      <!-- flipper -->
      <path d="M 260 225 Q 290 290 330 285 Q 320 255 300 238 Z" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="3"/>
      <!-- eye + blowhole -->
      <circle cx="150" cy="178" r="5" fill="#0b0214" stroke="#67e8f9" stroke-width="2"/>
      <ellipse cx="140" cy="140" rx="6" ry="4" fill="#fbbf24"/>
      <!-- labels -->
      <line x1="140" y1="150" x2="140" y2="168" stroke="#fbbf24" stroke-width="1"/>
      <text x="140" y="110" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">BLOWHOLE</text>
      <text x="140" y="130" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">(breathing, not mouth)</text>
      <line x1="362" y1="102" x2="352" y2="120" stroke="#a855f7" stroke-width="1"/>
      <text x="380" y="72" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">DORSAL FIN</text>
      <text x="380" y="92" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">(stops rolling)</text>
      <line x1="300" y1="262" x2="298" y2="280" stroke="#ff2ec4" stroke-width="1"/>
      <text x="300" y="298" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">FLIPPER (steering)</text>
      <line x1="600" y1="190" x2="600" y2="150" stroke="#4ade80" stroke-width="1"/>
      <text x="560" y="138" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">FLUKE</text>
      <text x="560" y="158" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">(up-down thrust)</text>
      <text x="320" y="336" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">widest near the front, tapering to the tail = teardrop → minimal drag in water</text>
    </svg></body></html>
