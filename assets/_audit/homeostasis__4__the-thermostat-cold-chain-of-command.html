<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="thermoregulation chain diagram: cold detected by thermoreceptors, hypothalamus secretes TRH, anterior pituitary secretes TSH, thyroid secretes thyroxin which increases metabolic rate in liver muscle and brain generating heat">
      <rect width="660" height="420" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE THERMOSTAT — COLD CHAIN OF COMMAND</text>
      <!-- cold trigger -->
      <rect x="30" y="70" width="180" height="56" rx="12" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="120" y="92" fill="#22d3ee" font-size="12" font-weight="800" text-anchor="middle">CORE TOO COLD ⬇</text>
      <text x="120" y="110" fill="#b9a3d6" font-size="10" text-anchor="middle">thermoreceptors detect</text>
      <!-- hypothalamus -->
      <rect x="30" y="180" width="180" height="56" rx="12" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="120" y="202" fill="#ff2ec4" font-size="12" font-weight="800" text-anchor="middle">HYPOTHALAMUS</text>
      <text x="120" y="220" fill="#b9a3d6" font-size="10" text-anchor="middle">integrating centre + secretes TRH</text>
      <!-- pituitary -->
      <rect x="240" y="180" width="180" height="56" rx="12" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="330" y="202" fill="#fbbf24" font-size="12" font-weight="800" text-anchor="middle">ANTERIOR PITUITARY</text>
      <text x="330" y="220" fill="#b9a3d6" font-size="10" text-anchor="middle">secretes TSH (glycoprotein)</text>
      <!-- thyroid -->
      <rect x="450" y="180" width="180" height="56" rx="12" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="2.5"/>
      <text x="540" y="202" fill="#4ade80" font-size="12" font-weight="800" text-anchor="middle">THYROID GLAND</text>
      <text x="540" y="220" fill="#b9a3d6" font-size="10" text-anchor="middle">secretes thyroxin (has iodine)</text>
      <!-- effectors -->
      <rect x="240" y="310" width="390" height="56" rx="12" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="435" y="332" fill="#a855f7" font-size="12" font-weight="800" text-anchor="middle">EFFECTORS: LIVER · MUSCLE · BRAIN</text>
      <text x="435" y="350" fill="#b9a3d6" font-size="10" text-anchor="middle">metabolic rate increases → more heat → core returns to 37°C</text>
      <!-- arrows -->
      <path d="M 120 126 L 120 176" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 210 208 L 236 208" stroke="#ff2ec4" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <text x="223" y="198" fill="#b9a3d6" font-size="9.5" text-anchor="middle">TRH</text>
      <path d="M 420 208 L 446 208" stroke="#fbbf24" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <text x="433" y="198" fill="#b9a3d6" font-size="9.5" text-anchor="middle">TSH</text>
      <path d="M 540 240 L 540 280 L 435 280 L 435 306" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="500" y="272" fill="#b9a3d6" font-size="9.5" text-anchor="middle">thyroxin</text>
      <!-- feedback -->
      <path d="M 435 366 L 435 400 L 120 400 L 120 240" stroke="#a855f7" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="4 4"/>
      <text x="280" y="412" fill="#a855f7" font-size="10.5" font-weight="700" text-anchor="middle">heat restores set point → TRH secretion stops (negative feedback)</text>
      <!-- warm path note -->
      <text x="330" y="60" fill="#4ade80" font-size="10.5" text-anchor="middle">Core too hot? Same centre, opposite output — heat-loss responses (Act 6), not thyroxin</text>
    </svg></body></html>
