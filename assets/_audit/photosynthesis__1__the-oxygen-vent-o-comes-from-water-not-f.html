<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="diagram showing that oxygen released by photosynthesis comes from splitting water: a chloroplast splits H2O into O2, protons and electrons, and isotope-labelling experiments with 18O confirm water is the source, not carbon dioxide">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <defs>
        <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ade80"/></marker>
        <marker id="arC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker>
      </defs>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE OXYGEN VENT — O₂ COMES FROM WATER, NOT FROM CO₂</text>

      <!-- chloroplast -->
      <rect x="30" y="56" width="260" height="210" rx="16" fill="rgba(34,211,238,0.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="160" y="78" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">CHLOROPLAST</text>
      <text x="160" y="108" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">2H₂O → O₂ + 4H⁺ + 4e⁻</text>
      <text x="160" y="128" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">photolysis: water is split by light energy</text>
      <text x="160" y="148" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">protons and electrons are kept and used</text>
      <text x="160" y="168" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">oxygen = waste product</text>

      <!-- O2 bubbles out -->
      <circle cx="268" cy="82" r="9" fill="rgba(74,222,128,0.25)" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="278" cy="104" r="6" fill="rgba(74,222,128,0.25)" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="272" cy="128" r="4" fill="rgba(74,222,128,0.25)" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M 290 70 C 310 58 330 52 360 48" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arG)"/>
      <text x="366" y="52" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">O₂ out</text>

      <!-- water in -->
      <rect x="60" y="240" width="100" height="40" rx="8" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="110" y="256" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">H₂O in</text>
      <text x="110" y="274" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">water from the soil</text>
      <path d="M 110 240 L 110 222" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arC)"/>

      <!-- isotope experiment -->
      <rect x="330" y="56" width="90" height="150" rx="10" fill="rgba(255,46,196,0.05)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="375" y="80" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">EXPERIMENT 1</text>
      <circle cx="360" cy="110" r="7" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="385" cy="126" r="5" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="368" cy="146" r="4" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="375" y="176" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">supply ¹⁸O-labelled</text>
      <text x="375" y="192" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">WATER to the plant</text>

      <rect x="440" y="56" width="90" height="150" rx="10" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="2"/>
      <text x="485" y="80" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">EXPERIMENT 2</text>
      <circle cx="470" cy="110" r="7" fill="rgba(255,46,196,0.15)" stroke="#ff2ec4" stroke-width="1.5"/>
      <circle cx="495" cy="126" r="5" fill="rgba(255,46,196,0.15)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="485" y="176" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">supply ¹⁸O-labelled</text>
      <text x="485" y="192" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">CO₂ to the plant</text>

      <rect x="550" y="56" width="86" height="150" rx="10" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="2"/>
      <text x="593" y="80" text-anchor="middle" fill="#a855f7" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">RESULT</text>
      <text x="593" y="112" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">¹⁸O₂ appears in</text>
      <text x="593" y="128" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">the bubbles</text>
      <text x="593" y="152" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">no labelled O₂</text>
      <text x="593" y="168" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">is produced</text>

      <text x="375" y="240" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">The O₂ must come from splitting water</text>
      <text x="375" y="260" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">isotope ¹⁸O is a heavy tracer — it shows up wherever oxygen goes</text>

      <text x="330" y="316" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">Prokaryotes did this first ~3.5 billion years ago — photolysis oxygen reshaped the whole planet</text>
      <text x="330" y="334" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">O₂ diffuses: thylakoid space → stroma → cytoplasm → out through stomata</text>
    </svg></body></html>
