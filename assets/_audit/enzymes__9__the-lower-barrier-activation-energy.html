<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="two energy hill graphs side by side: left no enzyme with a tall transition state peak and a long activation energy arrow; right with enzyme the same start substrate level and same end product level but a much shorter peak and shorter activation energy arrow, with a note that the net energy change is identical and reactions run about a million times faster">
      <defs><marker id="ah10" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker></defs>
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE LOWER BARRIER — ACTIVATION ENERGY</text>

      <rect x="30" y="52" width="290" height="180" rx="9" fill="rgba(34,211,238,.07)" stroke="rgba(34,211,238,.4)" stroke-width="1.5"/>
      <text x="175" y="72" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">NO ENZYME</text>
      <path d="M 55 210 L 75 208 L 175 60 L 275 208 L 295 210" stroke="#b9a3d6" stroke-width="2" fill="none"/>
      <text x="55" y="228" fill="#b9a3d6" font-size="9" text-anchor="middle">SUBSTRATE</text>
      <text x="295" y="228" fill="#b9a3d6" font-size="9" text-anchor="middle">PRODUCT</text>
      <path d="M 175 60 L 175 210" stroke="#ff2ec4" stroke-width="2.5"/>
      <path d="M 165 66 L 165 204" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="175" y="50" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">TRANSITION STATE</text>
      <text x="190" y="140" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">Ea — HUGE</text>
      <text x="175" y="252" fill="#b9a3d6" font-size="9" text-anchor="middle">bonds must break first</text>

      <rect x="340" y="52" width="290" height="180" rx="9" fill="rgba(74,222,128,.07)" stroke="rgba(74,222,128,.4)" stroke-width="1.5"/>
      <text x="485" y="72" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">WITH ENZYME</text>
      <path d="M 365 210 L 385 208 L 470 130 L 555 208 L 575 210" stroke="#4ade80" stroke-width="2" fill="none"/>
      <text x="365" y="228" fill="#b9a3d6" font-size="9" text-anchor="middle">SUBSTRATE</text>
      <text x="575" y="228" fill="#b9a3d6" font-size="9" text-anchor="middle">PRODUCT</text>
      <path d="M 470 130 L 470 210" stroke="#ff2ec4" stroke-width="2.5"/>
      <path d="M 460 136 L 460 204" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="470" y="120" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">TRANSITION STATE</text>
      <text x="485" y="172" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">Ea — SMALL</text>
      <text x="485" y="252" fill="#4ade80" font-size="9" font-weight="700" text-anchor="middle">substrate bonds weakened by binding</text>

      <text x="330" y="306" fill="#b9a3d6" font-size="10.5" text-anchor="middle">net energy released: IDENTICAL in both — only the hill is lower</text>
      <text x="330" y="328" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">rate typically increases by a factor of a MILLION or more</text>
      <text x="330" y="348" fill="#b9a3d6" font-size="9.5" text-anchor="middle">two peaks with enzyme? catalytic cycle: substrate → product, site resets — the graph shows one lower peak</text>
