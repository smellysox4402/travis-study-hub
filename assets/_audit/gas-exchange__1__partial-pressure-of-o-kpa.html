<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 520 310" xmlns="http://www.w3.org/2000/svg">
        <!-- axes -->
        <line x1="70" y1="240" x2="490" y2="240" stroke="#b9a3d6" stroke-width="2"/>
        <line x1="70" y1="240" x2="70" y2="25" stroke="#b9a3d6" stroke-width="2"/>
        <!-- x ticks: 0 / 5 / 10 / 15 kPa -->
        <line x1="70" y1="240" x2="70" y2="246" stroke="#b9a3d6"/>
        <line x1="210" y1="240" x2="210" y2="246" stroke="#b9a3d6"/>
        <line x1="350" y1="240" x2="350" y2="246" stroke="#4ade80" stroke-width="2"/>
        <line x1="490" y1="240" x2="490" y2="246" stroke="#b9a3d6"/>
        <text x="70" y="257" fill="#b9a3d6" font-size="11" text-anchor="middle">0</text>
        <text x="210" y="257" fill="#b9a3d6" font-size="11" text-anchor="middle">5</text>
        <text x="350" y="257" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">10</text>
        <text x="490" y="257" fill="#b9a3d6" font-size="11" text-anchor="middle">15</text>
        <text x="280" y="294" fill="#b9a3d6" font-size="12" text-anchor="middle">partial pressure of O₂ / kPa</text>
        <!-- y ticks: 0 / 50 / 100 % -->
        <line x1="64" y1="240" x2="70" y2="240" stroke="#b9a3d6"/>
        <line x1="64" y1="132" x2="70" y2="132" stroke="#b9a3d6"/>
        <line x1="64" y1="25" x2="70" y2="25" stroke="#b9a3d6"/>
        <text x="58" y="244" fill="#b9a3d6" font-size="11" text-anchor="end">0</text>
        <text x="58" y="146" fill="#b9a3d6" font-size="11" text-anchor="end">50</text>
        <text x="58" y="29" fill="#b9a3d6" font-size="11" text-anchor="end">100</text>
        <text x="22" y="126" fill="#b9a3d6" font-size="12" transform="rotate(-90 22 126)" text-anchor="middle">% saturation</text>
        <!-- 10 kPa marker -->
        <line x1="350" y1="45" x2="350" y2="240" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="350" y="274" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">10 kPa — full saturation above this</text>
        <!-- curves: HbF left (magenta), HbA middle (cyan), Bohr right (gold dashed) -->
        <path d="M 70 238 C 95 236, 125 230, 155 218 C 185 202, 215 170, 250 120 C 280 78, 325 45, 470 30" fill="none" stroke="#ff2ec4" stroke-width="3.5"/>
        <path d="M 70 239 C 110 238, 150 234, 185 224 C 220 210, 260 180, 305 130 C 345 88, 395 52, 470 40" fill="none" stroke="#22d3ee" stroke-width="3.5"/>
        <path d="M 70 240 C 125 239, 175 237, 220 230 C 265 218, 315 190, 360 145 C 400 112, 445 70, 480 52" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-dasharray="7 5"/>
        <!-- legend -->
        <rect x="385" y="138" width="112" height="74" rx="8" fill="rgba(20,8,40,0.85)" stroke="#b9a3d6" stroke-opacity="0.35"/>
        <line x1="389" y1="152" x2="399" y2="152" stroke="#ff2ec4" stroke-width="3.5"/>
        <line x1="389" y1="174" x2="399" y2="174" stroke="#22d3ee" stroke-width="3.5"/>
        <line x1="389" y1="196" x2="399" y2="196" stroke="#fbbf24" stroke-width="3.5" stroke-dasharray="5 3"/>
        <text x="405" y="156" fill="#e8def8" font-size="11" font-weight="600">HbF (foetal)</text>
        <text x="405" y="178" fill="#e8def8" font-size="11" font-weight="600">HbA (adult)</text>
        <text x="405" y="200" fill="#e8def8" font-size="11" font-weight="600">+ CO₂ (Bohr)</text>
        <!-- hints -->
        <text x="78" y="42" fill="#4ade80" font-size="13" font-weight="700">LEFT = grips harder</text>
        <text x="508" y="135" fill="#fbbf24" font-size="13" font-weight="700" transform="rotate(90 508 135)" text-anchor="middle">RIGHT = releases more</text>
      </svg></body></html>
