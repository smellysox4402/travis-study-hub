<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="placenta catering corridor cross section: umbilical cord with vein and artery at the top, foetal villi bathed in maternal blood in intervillous spaces, a five micrometre barrier, nutrients and oxygen and antibodies flowing to the foetus while carbon dioxide and urea flow out to the mother">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE CATERING CORRIDOR — THE PLACENTA (AHL)</text>

      <rect x="280" y="50" width="100" height="36" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="65" fill="#ff2ec4" font-size="8.5" font-weight="800" text-anchor="middle">UMBILICAL CORD</text>
      <text x="330" y="79" fill="#b9a3d6" font-size="8" text-anchor="middle">vein + artery</text>

      <text x="330" y="118" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">maternal blood — intervillous spaces</text>
      <rect x="60" y="130" width="540" height="130" rx="9" fill="rgba(255,46,196,.05)" stroke="#ff2ec4" stroke-width="1.5"/>

      <rect x="120" y="130" width="40" height="110" rx="8" fill="rgba(168,85,247,.15)" stroke="#a855f7" stroke-width="2"/>
      <rect x="300" y="130" width="60" height="110" rx="8" fill="rgba(168,85,247,.15)" stroke="#a855f7" stroke-width="2"/>
      <text x="330" y="158" fill="#a855f7" font-size="9.5" font-weight="800" text-anchor="middle">VILLUS</text>
      <text x="330" y="172" fill="#b9a3d6" font-size="8.5" text-anchor="middle">foetal tissue</text>
      <text x="330" y="186" fill="#b9a3d6" font-size="8.5" text-anchor="middle">capillaries near surface</text>
      <rect x="480" y="130" width="40" height="110" rx="8" fill="rgba(168,85,247,.15)" stroke="#a855f7" stroke-width="2"/>

      <path d="M 520 172 L 572 172" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
      <text x="580" y="176" fill="#fbbf24" font-size="9" font-weight="800">5 μm barrier</text>

      <text x="330" y="246" fill="#b9a3d6" font-size="9" text-anchor="middle">exchange: diffusion · facilitated diffusion · osmosis · endocytosis</text>

      <rect x="60" y="300" width="250" height="44" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="185" y="318" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">→ TO FOETUS: O₂ · glucose · amino acids</text>
      <text x="185" y="332" fill="#b9a3d6" font-size="9" text-anchor="middle">water · antibodies (endocytosis)</text>
      <path d="M 185 296 L 185 264" stroke="#4ade80" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="350" y="300" width="250" height="44" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="475" y="318" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">FROM FOETUS →: CO₂ · urea</text>
      <text x="475" y="332" fill="#b9a3d6" font-size="9" text-anchor="middle">diffusion out to mother</text>
      <path d="M 475 296 L 475 264" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
    </svg></body></html>
