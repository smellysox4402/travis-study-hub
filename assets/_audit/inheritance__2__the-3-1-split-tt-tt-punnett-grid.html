<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a monohybrid cross Punnett grid: two tall heterozygotes Tt crossed give a 3 tall to 1 dwarf ratio in offspring">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE 3:1 SPLIT — Tt × Tt PUNNETT GRID</text>
      <!-- parents -->
      <text x="320" y="58" fill="#f3e8ff" font-size="12" font-weight="800" text-anchor="middle">PARENTS: tall (Tt) × tall (Tt) — both heterozygous</text>
      <!-- gamete labels -->
      <text x="430" y="86" fill="#22d3ee" font-size="11" font-weight="800">male gametes</text>
      <text x="365" y="112" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">T</text>
      <text x="445" y="112" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">t</text>
      <text x="252" y="156" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="end">T</text>
      <text x="252" y="236" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="end">t</text>
      <text x="150" y="107" fill="#b9a3d6" font-size="10" font-weight="700">female</text>
      <text x="150" y="124" fill="#b9a3d6" font-size="10" font-weight="700">gametes</text>
      <!-- grid cells -->
      <rect x="300" y="132" width="80" height="60" rx="8" fill="rgba(255,46,196,.10)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="340" y="158" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">TT</text>
      <text x="340" y="178" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">tall · homo</text>
      <rect x="392" y="132" width="80" height="60" rx="8" fill="rgba(255,46,196,.10)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="432" y="158" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">Tt</text>
      <text x="432" y="178" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">tall · hetero</text>
      <rect x="300" y="204" width="80" height="60" rx="8" fill="rgba(255,46,196,.10)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="340" y="230" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">Tt</text>
      <text x="340" y="250" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">tall · hetero</text>
      <rect x="392" y="204" width="80" height="60" rx="8" fill="rgba(34,211,238,.10)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="432" y="230" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">tt</text>
      <text x="432" y="250" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">dwarf · homo</text>
      <!-- why box -->
      <rect x="120" y="300" width="400" height="72" rx="10" fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="320" y="322" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">WHY 3:1? — dominant vs recessive</text>
      <text x="320" y="342" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">T (dominant) = functional allele · t (recessive) = mutated, less function</text>
      <text x="320" y="358" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">one working copy of the gene is enough for the trait to show</text>
      <text x="320" y="400" fill="#4ade80" font-size="13" font-weight="900" text-anchor="middle">PHENOTYPE RATIO: 3 tall : 1 dwarf</text>
      <text x="320" y="424" fill="#b9a3d6" font-size="10.5" font-weight="700" text-anchor="middle">genotype ratio 1 TT : 2 Tt : 1 tt</text>
    </svg></body></html>
