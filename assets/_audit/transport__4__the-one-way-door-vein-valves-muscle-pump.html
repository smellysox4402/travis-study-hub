<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vein with pocket valves: one valve open with blood flowing toward the heart, one valve closed with cup-shaped flaps catching backflow, and a skeletal muscle squeezing the thin flexible vein wall to pump blood upward">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE ONE-WAY DOOR — VEIN VALVES + MUSCLE PUMP</text>
      <!-- vein tube -->
      <path d="M 120 60 L 120 300" stroke="#a855f7" stroke-width="10" fill="none"/>
      <path d="M 200 60 L 200 300" stroke="#a855f7" stroke-width="10" fill="none"/>
      <!-- flow arrows up -->
      <path d="M 160 80 L 160 50" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 160 120 L 160 96" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="245" y="84" fill="#22d3ee" font-size="10" font-weight="800">TO THE HEART</text>
      <!-- open valve -->
      <path d="M 120 150 L 160 166 L 200 150" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="2"/>
      <text x="160" y="188" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">OPEN</text>
      <text x="160" y="204" fill="#b9a3d6" font-size="9" text-anchor="middle">blood flows past,</text>
      <text x="160" y="218" fill="#b9a3d6" font-size="9" text-anchor="middle">flaps pressed flat</text>
      <!-- closed valve -->
      <path d="M 120 262 C 145 236 175 236 200 262" fill="rgba(255,46,196,.2)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="160" y="250" fill="#ff2ec4" font-size="9.5" font-weight="700" text-anchor="middle">CLOSED</text>
      <text x="160" y="292" fill="#ff2ec4" font-size="9" text-anchor="middle">backflow fills the cups</text>
      <text x="160" y="308" fill="#b9a3d6" font-size="9" text-anchor="middle">→ seals the lumen</text>
      <!-- muscle pump -->
      <rect x="280" y="110" width="60" height="120" rx="10" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="310" y="176" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle" transform="rotate(-90 310 176)">MUSCLE</text>
      <line x1="340" y1="140" x2="380" y2="140" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <line x1="340" y1="200" x2="380" y2="200" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="430" y="110" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">MUSCLE PUMP</text>
      <text x="430" y="128" fill="#b9a3d6" font-size="9.5" text-anchor="middle">muscle contraction squeezes</text>
      <text x="430" y="144" fill="#b9a3d6" font-size="9.5" text-anchor="middle">the thin flexible wall</text>
      <text x="430" y="162" fill="#b9a3d6" font-size="9.5" text-anchor="middle">→ blood pushed upward</text>
      <text x="430" y="184" fill="#b9a3d6" font-size="9.5" text-anchor="middle">valves stop backflow</text>
      <text x="430" y="226" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">thin walls = distensible</text>
      <text x="430" y="244" fill="#b9a3d6" font-size="9.5" text-anchor="middle">~80% of blood at rest</text>
      <text x="430" y="260" fill="#b9a3d6" font-size="9.5" text-anchor="middle">is in the veins</text>
      <text x="430" y="288" fill="#ff2ec4" font-size="10" font-weight="700" text-anchor="middle">valves fail → varicose veins</text>
      <text x="430" y="306" fill="#b9a3d6" font-size="9.5" text-anchor="middle">blood pools in the legs</text>
      <text x="330" y="330" fill="#b9a3d6" font-size="10" text-anchor="middle">Valves every few centimetres — one-way doors all the way to the heart</text>
    </svg></body></html>
