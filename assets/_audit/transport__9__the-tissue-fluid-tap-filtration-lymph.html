<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="capillary bed with tissue fluid exchange: high blood pressure at the arteriole end forces plasma out into the tissue, most fluid drains back at the venule end, and excess fluid is collected by a blind-ended lymph vessel with valves that returns it to the blood via lymph ducts">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE TISSUE-FLUID TAP — FILTRATION + LYMPH</text>
      <!-- arteriole -->
      <rect x="20" y="120" width="70" height="26" rx="13" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="55" y="112" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">ARTERIOLE</text>
      <text x="55" y="160" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">HIGH BP</text>
      <text x="55" y="176" fill="#b9a3d6" font-size="9" text-anchor="middle">forces fluid out</text>
      <!-- capillary -->
      <path d="M 90 133 C 200 120 280 140 400 133 C 460 130 520 133 570 133" fill="none" stroke="#22d3ee" stroke-width="5"/>
      <!-- venule -->
      <rect x="570" y="120" width="70" height="26" rx="13" fill="rgba(168,85,247,.15)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="605" y="112" fill="#a855f7" font-size="9.5" font-weight="800" text-anchor="middle">VENULE</text>
      <text x="605" y="160" fill="#a855f7" font-size="9.5" font-weight="800" text-anchor="middle">LOW BP</text>
      <text x="605" y="176" fill="#b9a3d6" font-size="9" text-anchor="middle">fluid drains back</text>
      <!-- fluid out arrows -->
      <path d="M 150 140 C 140 160 140 170 145 185" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 200 140 C 190 160 190 170 195 185" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 250 140 C 240 160 240 170 245 185" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <!-- fluid in arrows -->
      <path d="M 420 185 C 425 170 425 160 415 140" stroke="#a855f7" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 470 185 C 475 170 475 160 465 140" stroke="#a855f7" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 520 185 C 525 170 525 160 515 140" stroke="#a855f7" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <!-- tissue fluid zone -->
      <text x="330" y="210" fill="#b9a3d6" font-size="10" text-anchor="middle">tissue fluid bathes the cells</text>
      <text x="330" y="226" fill="#b9a3d6" font-size="9.5" text-anchor="middle">= plasma minus large proteins</text>
      <text x="120" y="210" fill="#b9a3d6" font-size="9" text-anchor="middle">O₂ + glucose</text>
      <text x="120" y="224" fill="#b9a3d6" font-size="9" text-anchor="middle">diffuse into cells</text>
      <text x="540" y="210" fill="#b9a3d6" font-size="9" text-anchor="middle">CO₂ + wastes out</text>
      <!-- lymph vessel -->
      <path d="M 300 250 L 300 320" stroke="#4ade80" stroke-width="8" fill="none"/>
      <path d="M 340 250 L 340 320" stroke="#4ade80" stroke-width="8" fill="none"/>
      <path d="M 300 270 L 340 270" fill="none" stroke="#150a26" stroke-width="3"/>
      <path d="M 300 300 L 340 300" fill="none" stroke="#150a26" stroke-width="3"/>
      <path d="M 300 268 C 315 262 325 262 340 268" fill="rgba(74,222,128,.3)" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M 300 298 C 315 292 325 292 340 298" fill="rgba(74,222,128,.3)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="320" y="252" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">LYMPH</text>
      <text x="320" y="334" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">VESSEL</text>
      <path d="M 245 240 C 250 255 265 262 296 262" stroke="#4ade80" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 370 262 L 420 262 L 420 230" stroke="#4ade80" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
      <text x="415" y="290" fill="#b9a3d6" font-size="9" text-anchor="middle">blind-ended, thin walls,</text>
      <text x="415" y="304" fill="#b9a3d6" font-size="9" text-anchor="middle">valves → one-way flow</text>
      <text x="415" y="326" fill="#4ade80" font-size="9.5" font-weight="700" text-anchor="middle">→ lymph ducts → subclavian</text>
      <text x="415" y="340" fill="#4ade80" font-size="9.5" font-weight="700" text-anchor="middle">veins → back to blood</text>
      <text x="330" y="356" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">~20 dm³ made · ~17 return · ~3 dm³ lymph · failure → oedema</text>
    </svg></body></html>
