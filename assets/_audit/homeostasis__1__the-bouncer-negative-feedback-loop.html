<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="circular negative feedback loop diagram: set point at centre, a stimulus pushes a variable above or below the set point, receptor detects, control centre compares, effector responds to reverse the change, and the response feeds back to cancel the stimulus">
      <rect width="660" height="400" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE BOUNCER — NEGATIVE FEEDBACK LOOP</text>
      <!-- set point centre -->
      <circle cx="330" cy="200" r="34" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="3"/>
      <text x="330" y="196" fill="#fbbf24" font-size="12" font-weight="900" text-anchor="middle">SET</text>
      <text x="330" y="212" fill="#fbbf24" font-size="12" font-weight="900" text-anchor="middle">POINT</text>
      <!-- stimulus node (top) -->
      <rect x="255" y="40" width="150" height="44" rx="10" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="330" y="60" fill="#ff2ec4" font-size="12" font-weight="800" text-anchor="middle">STIMULUS</text>
      <text x="330" y="76" fill="#b9a3d6" font-size="10" text-anchor="middle">variable drifts off set point</text>
      <!-- receptor (right) -->
      <rect x="500" y="150" width="130" height="48" rx="10" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="565" y="170" fill="#a855f7" font-size="12" font-weight="800" text-anchor="middle">RECEPTOR</text>
      <text x="565" y="187" fill="#b9a3d6" font-size="10" text-anchor="middle">detects the change</text>
      <!-- control centre (bottom) -->
      <rect x="255" y="320" width="150" height="48" rx="10" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="330" y="340" fill="#22d3ee" font-size="12" font-weight="800" text-anchor="middle">CONTROL CENTRE</text>
      <text x="330" y="357" fill="#b9a3d6" font-size="10" text-anchor="middle">compares vs set point</text>
      <!-- effector (left) -->
      <rect x="30" y="150" width="130" height="48" rx="10" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2.5"/>
      <text x="95" y="170" fill="#4ade80" font-size="12" font-weight="800" text-anchor="middle">EFFECTOR</text>
      <text x="95" y="187" fill="#b9a3d6" font-size="10" text-anchor="middle">muscle / gland / tissue</text>
      <!-- arrows -->
      <defs>
        <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M 0 0 L 8 3 L 0 6 Z" fill="#22d3ee"/>
        </marker>
      </defs>
      <path d="M 330 84 L 330 152" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 370 84 C 470 90 540 110 556 148" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 565 198 C 565 280 470 320 406 332" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 253 332 C 190 320 95 280 95 200" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 95 148 C 95 110 190 90 288 84" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <!-- response tag -->
      <text x="160" y="252" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">response REVERSES</text>
      <text x="160" y="268" fill="#b9a3d6" font-size="10" text-anchor="middle">the change</text>
      <!-- above/below note -->
      <text x="330" y="120" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">drift ABOVE or BELOW → same loop, opposite response</text>
      <text x="330" y="396" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Positive feedback = same wiring but the response AMPLIFIES the change (childbirth, ovulation, lactation)</text>
    </svg></body></html>
