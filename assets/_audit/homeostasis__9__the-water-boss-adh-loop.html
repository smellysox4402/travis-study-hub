<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ADH osmoregulation diagram: osmoreceptors in hypothalamus detect high blood osmolarity, posterior pituitary releases ADH, ADH triggers aquaporin vesicles to fuse with collecting duct cell membrane so water is reabsorbed into the salty medulla, producing concentrated urine">
      <rect width="660" height="420" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE WATER BOSS — ADH LOOP</text>
      <!-- osmoreceptors -->
      <rect x="30" y="70" width="200" height="56" rx="12" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="130" y="92" fill="#ff2ec4" font-size="12" font-weight="800" text-anchor="middle">BLOOD TOO SALTY ⬆</text>
      <text x="130" y="110" fill="#b9a3d6" font-size="10" text-anchor="middle">osmoreceptors in hypothalamus</text>
      <!-- pituitary -->
      <rect x="30" y="180" width="200" height="56" rx="12" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="130" y="202" fill="#fbbf24" font-size="12" font-weight="800" text-anchor="middle">POSTERIOR PITUITARY</text>
      <text x="130" y="220" fill="#b9a3d6" font-size="10" text-anchor="middle">releases ADH (vasopressin)</text>
      <!-- collecting duct -->
      <rect x="340" y="140" width="290" height="210" rx="12" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="485" y="164" fill="#22d3ee" font-size="12" font-weight="800" text-anchor="middle">COLLECTING DUCT</text>
      <!-- aquaporins -->
      <circle cx="410" cy="230" r="9" fill="rgba(74,222,128,.25)" stroke="#4ade80" stroke-width="2"/>
      <text x="410" y="233" fill="#4ade80" font-size="8" font-weight="800" text-anchor="middle">AQ</text>
      <circle cx="450" cy="250" r="9" fill="rgba(74,222,128,.25)" stroke="#4ade80" stroke-width="2"/>
      <text x="450" y="253" fill="#4ade80" font-size="8" font-weight="800" text-anchor="middle">AQ</text>
      <circle cx="500" cy="230" r="9" fill="rgba(74,222,128,.25)" stroke="#4ade80" stroke-width="2"/>
      <text x="500" y="233" fill="#4ade80" font-size="8" font-weight="800" text-anchor="middle">AQ</text>
      <text x="520" y="280" fill="#4ade80" font-size="9.5" font-weight="700" text-anchor="middle">aquaporins fuse</text>
      <text x="520" y="296" fill="#b9a3d6" font-size="9" text-anchor="middle">(from vesicles) → walls</text>
      <text x="520" y="310" fill="#b9a3d6" font-size="9" text-anchor="middle">permeable to water</text>
      <!-- water out -->
      <text x="600" y="330" fill="#22d3ee" font-size="9.5" text-anchor="middle">H₂O out → reabsorbed</text>
      <path d="M 580 320 L 580 360 L 500 360" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="380" y="330" fill="#b9a3d6" font-size="9" text-anchor="middle">urine: concentrated · low volume</text>
      <!-- arrows -->
      <path d="M 130 126 L 130 176" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 230 208 L 336 208" stroke="#fbbf24" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <text x="283" y="198" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">ADH</text>
      <!-- feedback -->
      <path d="M 340 350 L 130 350 L 130 240" stroke="#a855f7" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="4 4"/>
      <text x="235" y="368" fill="#a855f7" font-size="10" font-weight="700" text-anchor="middle">water reabsorbed → osmolarity falls → ADH stops (negative feedback)</text>
      <!-- hydrated branch -->
      <text x="330" y="404" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Well hydrated? Little ADH → aquaporins stay in vesicles → dilute, high-volume urine</text>
    </svg></body></html>
