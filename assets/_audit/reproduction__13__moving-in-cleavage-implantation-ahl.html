<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="blastocyst moving into the club: cleavage makes a hollow ball with inner cell mass forming the embryo body and trophoblast forming the placenta, cilia waft it down the oviduct, the zona pellucida breaks down and it implants into the endometrium, about 250 cells and 200 micrometres at day six to seven">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">MOVING IN — CLEAVAGE + IMPLANTATION (AHL)</text>

      <rect x="140" y="52" width="380" height="54" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="330" y="70" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">CLEAVAGE — cell cycles ~every 18 h</text>
      <text x="330" y="86" fill="#b9a3d6" font-size="9" text-anchor="middle">no cell growth → cells shrink · solid ball → blastocyst</text>

      <path d="M 40 130 C 100 90 170 120 200 190" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)" fill="none"/>
      <text x="95" y="110" fill="#22d3ee" font-size="9" text-anchor="middle">cilia waft it along</text>

      <circle cx="250" cy="235" r="72" fill="rgba(168,85,247,.12)" stroke="#a855f7" stroke-width="2"/>
      <text x="250" y="147" fill="#a855f7" font-size="9.5" font-weight="800" text-anchor="middle">TROPHOBLAST — → placenta</text>
      <circle cx="235" cy="220" r="32" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="235" y="215" fill="#ff2ec4" font-size="8.5" font-weight="800" text-anchor="middle">INNER CELL</text>
      <text x="235" y="228" fill="#ff2ec4" font-size="8.5" font-weight="800" text-anchor="middle">MASS → embryo</text>
      <circle cx="280" cy="268" r="14" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="300" y="272" fill="#22d3ee" font-size="8.5" text-anchor="start">blastocoele (fluid)</text>
      <text x="250" y="322" fill="#b9a3d6" font-size="8.5" text-anchor="middle">~250 cells · ~200 μm · days 6–7</text>

      <rect x="470" y="130" width="150" height="190" rx="9" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="545" y="152" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">ENDOMETRIUM</text>
      <text x="545" y="168" fill="#b9a3d6" font-size="9" text-anchor="middle">uterus lining —</text>
      <text x="545" y="182" fill="#b9a3d6" font-size="9" text-anchor="middle">implantation site</text>
      <path d="M 325 235 L 464 235" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="398" y="225" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">IMPLANTED ✓</text>

      <text x="330" y="348" fill="#b9a3d6" font-size="9.5" text-anchor="middle">zona pellucida breaks down · finger-like projections grow into the lining · 8 weeks → foetus (bone tissue)</text>
    </svg></body></html>
