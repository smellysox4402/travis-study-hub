<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="emergency backup generator loop: pyruvate plus reduced NAD becomes lactate plus NAD in the cytoplasm, the regenerated NAD feeds back into glycolysis so it can keep producing 2 ATP per glucose, with a side panel listing foods made by lactic fermentation — yoghurt, kimchi, sauerkraut, silage — and the oxygen debt note that clearing lactate later needs oxygen">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE EMERGENCY BACKUP — PYRUVATE → LACTATE</text>

      <rect x="40" y="52" width="200" height="62" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="140" y="76" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">PYRUVATE (3C)</text>
      <text x="140" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">from glycolysis · 2 per glucose</text>

      <rect x="420" y="52" width="200" height="62" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="520" y="76" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">LACTATE (3C)</text>
      <text x="520" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">takes 2H from reduced NAD</text>

      <path d="M 244 83 L 330 83" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah11)" fill="none"/>
      <defs><marker id="ah11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker></defs>
      <path d="M 416 83 L 330 83" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah11b)" fill="none"/>
      <defs><marker id="ah11b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker></defs>
      <text x="330" y="70" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">reduced NAD → NAD</text>
      <text x="330" y="102" fill="#b9a3d6" font-size="8.5" text-anchor="middle">2 H transferred · cytoplasm</text>

      <rect x="40" y="150" width="580" height="50" rx="9" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="330" y="172" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">NAD REGENERATED → GLYCOLYSIS KEEPS RUNNING → 2 ATP per glucose continues</text>
      <text x="330" y="190" fill="#b9a3d6" font-size="9" text-anchor="middle">all NAD used in glycolysis is recovered · continues as long as glucose is available + lactate not too high</text>

      <rect x="40" y="224" width="280" height="76" rx="9" fill="rgba(251,191,36,.07)" stroke="rgba(251,191,36,.5)" stroke-width="1.5"/>
      <text x="180" y="246" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">LACTIC FERMENTATION FOODS</text>
      <text x="180" y="268" fill="#b9a3d6" font-size="9.5" text-anchor="middle">yoghurt · kimchi · sauerkraut · silage</text>
      <text x="180" y="288" fill="#b9a3d6" font-size="9" text-anchor="middle">low pH preserves — blocks decomposers</text>

      <rect x="340" y="224" width="280" height="76" rx="9" fill="rgba(34,211,238,.07)" stroke="rgba(34,211,238,.5)" stroke-width="1.5"/>
      <text x="480" y="246" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">OXYGEN DEBT — THE BILL</text>
      <text x="480" y="268" fill="#b9a3d6" font-size="9.5" text-anchor="middle">lactate breakdown needs O₂</text>
      <text x="480" y="288" fill="#b9a3d6" font-size="9.5" text-anchor="middle">several minutes to clear after hard exercise</text>

      <text x="330" y="336" fill="#b9a3d6" font-size="9.5" text-anchor="middle">lactate limit ≈ the ~400 m sprint · weightlifters and sprinters live on the backup generator</text>
    </svg></body></html>
