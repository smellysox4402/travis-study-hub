<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a motor unit: one motor neuron branching to many muscle fibres via neuromuscular junctions">
      <rect width="640" height="400" rx="14" fill="#150a26"/>
      <text x="320" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">ONE MOTOR UNIT — ONE DJ, MANY DANCERS</text>
      <!-- neuron cell body -->
      <circle cx="90" cy="120" r="30" fill="rgba(168,85,247,.2)" stroke="#a855f7" stroke-width="3"/>
      <circle cx="90" cy="120" r="11" fill="rgba(168,85,247,.5)"/>
      <line x1="60" y1="95" x2="40" y2="75" stroke="#a855f7" stroke-width="2.5"/>
      <line x1="52" y1="100" x2="28" y2="95" stroke="#a855f7" stroke-width="2.5"/>
      <line x1="60" y1="145" x2="38" y2="165" stroke="#a855f7" stroke-width="2.5"/>
      <line x1="52" y1="140" x2="30" y2="148" stroke="#a855f7" stroke-width="2.5"/>
      <!-- axon -->
      <path d="M 118 120 C 150 120 160 130 165 160 L 170 200" stroke="#a855f7" stroke-width="5" fill="none"/>
      <path d="M 168 195 C 220 180 300 168 340 160" stroke="#a855f7" stroke-width="4" fill="none"/>
      <path d="M 168 205 C 230 210 300 218 340 220" stroke="#a855f7" stroke-width="4" fill="none"/>
      <path d="M 168 208 C 240 240 300 262 340 280" stroke="#a855f7" stroke-width="4" fill="none"/>
      <path d="M 168 208 C 240 280 300 320 340 330" stroke="#a855f7" stroke-width="4" fill="none"/>
      <!-- muscle fibres -->
      <g>
        <rect x="340" y="140" width="250" height="34" rx="10" fill="rgba(255,46,196,.16)" stroke="#ff2ec4" stroke-width="2.5"/>
        <rect x="340" y="203" width="250" height="34" rx="10" fill="rgba(255,46,196,.16)" stroke="#ff2ec4" stroke-width="2.5"/>
        <rect x="340" y="266" width="250" height="34" rx="10" fill="rgba(255,46,196,.16)" stroke="#ff2ec4" stroke-width="2.5"/>
        <rect x="340" y="318" width="250" height="28" rx="10" fill="rgba(255,46,196,.16)" stroke="#ff2ec4" stroke-width="2.5"/>
        <!-- striations -->
        <g stroke="rgba(255,255,255,.35)" stroke-width="1.5">
          <line x1="390" y1="140" x2="390" y2="174"/><line x1="440" y1="140" x2="440" y2="174"/><line x1="490" y1="140" x2="490" y2="174"/><line x1="540" y1="140" x2="540" y2="174"/>
          <line x1="390" y1="203" x2="390" y2="237"/><line x1="440" y1="203" x2="440" y2="237"/><line x1="490" y1="203" x2="490" y2="237"/><line x1="540" y1="203" x2="540" y2="237"/>
          <line x1="390" y1="266" x2="390" y2="300"/><line x1="440" y1="266" x2="440" y2="300"/><line x1="490" y1="266" x2="490" y2="300"/><line x1="540" y1="266" x2="540" y2="300"/>
          <line x1="390" y1="318" x2="390" y2="346"/><line x1="440" y1="318" x2="440" y2="346"/><line x1="490" y1="318" x2="490" y2="346"/><line x1="540" y1="318" x2="540" y2="346"/>
        </g>
      </g>
      <!-- NMJs -->
      <g fill="#4ade80" stroke="#166534" stroke-width="1.5">
        <circle cx="345" cy="157" r="7"/>
        <circle cx="345" cy="220" r="7"/>
        <circle cx="345" cy="283" r="7"/>
        <circle cx="345" cy="332" r="7"/>
      </g>
      <!-- labels -->
      <text x="90" y="78" fill="#a855f7" font-size="11.5" font-weight="800" text-anchor="middle">MOTOR NEURON</text>
      <line x1="90" y1="86" x2="90" y2="90" stroke="#a855f7" stroke-width="1"/>
      <text x="250" y="150" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">axon branches</text>
      <text x="410" y="120" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">neuromuscular junction</text>
      <text x="410" y="140" fill="#4ade80" font-size="10.5" font-weight="700" text-anchor="middle">(ACh released here)</text>
      <line x1="355" y1="127" x2="348" y2="150" stroke="#4ade80" stroke-width="1"/>
      <text x="560" y="196" fill="#ff2ec4" font-size="11.5" font-weight="800" text-anchor="middle">MUSCLE FIBRES</text>
      <text x="560" y="216" fill="#b9a3d6" font-size="10.5" font-weight="700" text-anchor="middle">(striated)</text>
      <text x="320" y="382" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">fire the neuron → ALL fibres in the unit contract together · more units → stronger contraction</text>
    </svg></body></html>
