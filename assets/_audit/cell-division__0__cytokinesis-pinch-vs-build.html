<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram comparing cytokinesis in animal and plant cells: cleavage furrow with contractile ring of actin and myosin vs cell plate formed from fusing vesicles with middle lamella">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">CYTOKINESIS — PINCH vs BUILD</text>
      <text x="165" y="58" fill="#22d3ee" font-size="12.5" font-weight="800" text-anchor="middle">ANIMAL CELL</text>
      <text x="165" y="76" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">cleavage furrow</text>
      <text x="475" y="58" fill="#4ade80" font-size="12.5" font-weight="800" text-anchor="middle">PLANT CELL</text>
      <text x="475" y="76" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">cell plate</text>
      <!-- animal cell -->
      <circle cx="165" cy="235" r="88" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="3"/>
      <path d="M 77 235 Q 98 214 108 235 Q 98 256 77 235" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
      <path d="M 253 235 Q 232 214 222 235 Q 232 256 253 235" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
      <ellipse cx="165" cy="235" rx="60" ry="14" fill="none" stroke="#ff2ec4" stroke-width="2" stroke-dasharray="4 3" opacity=".9"/>
      <text x="30" y="170" fill="#ff2ec4" font-size="11" font-weight="800">CLEAVAGE FURROW</text>
      <line x1="88" y1="178" x2="103" y2="216" stroke="#22d3ee" stroke-width="1"/>
      <text x="30" y="310" fill="#ff2ec4" font-size="11" font-weight="800">CONTRACTILE RING</text>
      <text x="30" y="328" fill="#b9a3d6" font-size="9.5" font-weight="700">(actin + myosin)</text>
      <line x1="95" y1="302" x2="155" y2="248" stroke="#ff2ec4" stroke-width="1"/>
      <!-- plant cell -->
      <rect x="400" y="140" width="150" height="190" rx="10" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="3"/>
      <line x1="475" y1="150" x2="475" y2="320" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="468" y="150" width="14" height="170" rx="3" fill="rgba(251,191,36,.35)" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="475" cy="165" r="5" fill="#fbbf24"/>
      <circle cx="475" cy="195" r="5" fill="#fbbf24"/>
      <circle cx="475" cy="225" r="5" fill="#fbbf24"/>
      <circle cx="475" cy="255" r="5" fill="#fbbf24"/>
      <circle cx="475" cy="285" r="5" fill="#fbbf24"/>
      <circle cx="475" cy="315" r="5" fill="#fbbf24"/>
      <text x="475" y="132" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">VESICLES FUSE</text>
      <text x="552" y="215" fill="#4ade80" font-size="11" font-weight="800">CELL PLATE</text>
      <line x1="546" y1="210" x2="490" y2="210" stroke="#4ade80" stroke-width="1"/>
      <text x="385" y="262" fill="#b9a3d6" font-size="10.5" font-weight="700" text-anchor="end">MIDDLE LAMELLA</text>
      <line x1="392" y1="256" x2="468" y2="256" stroke="#b9a3d6" stroke-width="1"/>
      <text x="552" y="290" fill="#b9a3d6" font-size="10" font-weight="700">new cell walls</text>
      <line x1="546" y1="285" x2="492" y2="285" stroke="#b9a3d6" stroke-width="1"/>
      <text x="320" y="425" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">animal = pinch with an actin + myosin ring · plant = build a wall from fusing vesicles</text>
    </svg></body></html>
