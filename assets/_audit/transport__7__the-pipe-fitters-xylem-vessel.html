<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="xylem vessel diagram: a column of dead cells with end walls removed forming one continuous tube, walls thickened with spiral and ring lignin deposits, pits where water enters and exits, flow arrows showing passive upward movement">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE PIPE FITTERS — XYLEM VESSEL</text>
      <!-- vessel tube -->
      <rect x="200" y="60" width="60" height="250" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2.5"/>
      <!-- spiral thickenings -->
      <path d="M 200 70 C 230 90 230 110 200 130 C 230 150 230 170 200 190 C 230 210 230 230 200 250" stroke="#4ade80" stroke-width="4" fill="none"/>
      <!-- ring thickenings -->
      <rect x="232" y="80" width="28" height="8" rx="4" fill="#4ade80"/>
      <rect x="232" y="140" width="28" height="8" rx="4" fill="#4ade80"/>
      <rect x="232" y="200" width="28" height="8" rx="4" fill="#4ade80"/>
      <rect x="232" y="260" width="28" height="8" rx="4" fill="#4ade80"/>
      <!-- pits -->
      <circle cx="215" cy="240" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="215" cy="290" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <!-- flow arrows -->
      <path d="M 230 296 L 230 80" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="6 4"/>
      <text x="250" y="66" fill="#22d3ee" font-size="10" font-weight="800">water up (passive)</text>
      <!-- cell boundaries (removed) -->
      <line x1="200" y1="130" x2="260" y2="130" stroke="#b9a3d6" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="200" y1="200" x2="260" y2="200" stroke="#b9a3d6" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="130" y="88" fill="#b9a3d6" font-size="9.5" text-anchor="end">end walls removed →</text>
      <text x="130" y="104" fill="#b9a3d6" font-size="9.5" text-anchor="end">one continuous tube</text>
      <text x="130" y="152" fill="#ff2ec4" font-size="9.5" font-weight="700" text-anchor="end">cells are DEAD:</text>
      <text x="130" y="168" fill="#b9a3d6" font-size="9.5" text-anchor="end">contents break down</text>
      <text x="130" y="184" fill="#b9a3d6" font-size="9.5" text-anchor="end">→ hollow, unblocked</text>
      <!-- labels right -->
      <line x1="260" y1="100" x2="330" y2="100" stroke="#4ade80" stroke-width="1.2"/>
      <text x="336" y="96" fill="#4ade80" font-size="10" font-weight="800">SPIRAL + RING LIGNIN</text>
      <text x="336" y="112" fill="#b9a3d6" font-size="9.5">young vessels: stretch as</text>
      <text x="336" y="126" fill="#b9a3d6" font-size="9.5">the plant grows</text>
      <line x1="260" y1="170" x2="330" y2="170" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="336" y="166" fill="#22d3ee" font-size="10" font-weight="800">LIGNIFIED WALLS</text>
      <text x="336" y="182" fill="#b9a3d6" font-size="9.5">withstand tension —</text>
      <text x="336" y="196" fill="#b9a3d6" font-size="9.5">no collapse under pull</text>
      <line x1="220" y1="242" x2="330" y2="242" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="336" y="238" fill="#fbbf24" font-size="10" font-weight="800">PITS</text>
      <text x="336" y="254" fill="#b9a3d6" font-size="9.5">gaps in the wall where</text>
      <text x="336" y="268" fill="#b9a3d6" font-size="9.5">water enters + exits</text>
      <text x="330" y="322" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Dead, hollow, lignified, pitted — the perfect tension-proof pipe</text>
    </svg></body></html>
