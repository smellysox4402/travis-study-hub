<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="street generator doors opening: glucose six-carbon enters, two ATP tokens are invested in stage one phosphorylation producing fructose-1,6-bisphosphate, then stage two lysis splits it into two triose phosphate molecules of three carbons each, all happening in the cytoplasm with each step catalysed by a different enzyme">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">STREET-LEVEL GENERATOR — GLYCOLYSIS STAGES 1–2</text>

      <rect x="30" y="56" width="140" height="52" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="100" y="78" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">GLUCOSE</text>
      <text x="100" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">6C · from the fuel tank</text>

      <path d="M 174 82 L 216 82" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah9)" fill="none"/>
      <defs><marker id="ah9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2ec4"/></marker></defs>

      <rect x="222" y="52" width="200" height="60" rx="9" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="322" y="72" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">STAGE 1 · PHOSPHORYLATION</text>
      <text x="322" y="92" fill="#b9a3d6" font-size="9" text-anchor="middle">2 ATP invested (2 phosphate groups)</text>
      <text x="322" y="106" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">→ fructose-1,6-bisphosphate</text>

      <path d="M 426 82 L 468 82" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah9b)" fill="none"/>
      <defs><marker id="ah9b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>

      <rect x="474" y="52" width="156" height="60" rx="9" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2"/>
      <text x="552" y="72" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">STAGE 2 · LYSIS</text>
      <text x="552" y="92" fill="#b9a3d6" font-size="9" text-anchor="middle">fructose-1,6-bisphosphate</text>
      <text x="552" y="106" fill="#b9a3d6" font-size="9" text-anchor="middle">splits in two</text>

      <rect x="150" y="140" width="160" height="48" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="230" y="162" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">TRIOSE PHOSPHATE</text>
      <text x="230" y="178" fill="#b9a3d6" font-size="9" text-anchor="middle">3C · × 2 molecules</text>
      <rect x="350" y="140" width="160" height="48" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="430" y="162" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">TRIOSE PHOSPHATE</text>
      <text x="430" y="178" fill="#b9a3d6" font-size="9" text-anchor="middle">3C · × 2 molecules</text>

      <text x="330" y="236" fill="#b9a3d6" font-size="10" text-anchor="middle">from here on, every event happens TWICE (two halves)</text>
      <text x="330" y="262" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">each step catalysed by a different enzyme</text>
      <text x="330" y="292" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">LOCATION: CYTOPLASM — no oxygen needed, no mitochondria required</text>
      <text x="330" y="322" fill="#b9a3d6" font-size="9.5" text-anchor="middle">the investment: 2 ATP per glucose · repaid with interest in stage 4 (Act 10)</text>
    </svg></body></html>
