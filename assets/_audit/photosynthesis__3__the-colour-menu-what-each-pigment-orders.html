<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="absorption spectra of chlorophyll a, chlorophyll b and carotenoids: chlorophylls show two peaks in the blue-violet around 430 nanometres and red around 660 nanometres with a green trough, carotenoids absorb mainly in the blue region">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <defs>
        <linearGradient id="specbar" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8b5cf6"/>
          <stop offset="0.18" stop-color="#3b82f6"/>
          <stop offset="0.36" stop-color="#22d3ee"/>
          <stop offset="0.5" stop-color="#4ade80"/>
          <stop offset="0.62" stop-color="#fbbf24"/>
          <stop offset="0.8" stop-color="#f97316"/>
          <stop offset="1" stop-color="#ef4444"/>
        </linearGradient>
      </defs>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE COLOUR MENU — WHAT EACH PIGMENT ORDERS</text>

      <!-- legend -->
      <rect x="420" y="44" width="14" height="14" rx="3" fill="#ff2ec4"/>
      <text x="440" y="56" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">chlorophyll a</text>
      <rect x="420" y="66" width="14" height="14" rx="3" fill="#84cc16"/>
      <text x="440" y="78" fill="#84cc16" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">chlorophyll b</text>
      <rect x="420" y="88" width="14" height="14" rx="3" fill="#fbbf24"/>
      <text x="440" y="100" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">carotenoids</text>

      <!-- axes -->
      <line x1="80" y1="52" x2="80" y2="280" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="80" y1="280" x2="620" y2="280" stroke="#b9a3d6" stroke-width="2"/>
      <text x="70" y="110" text-anchor="end" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">absorption</text>
      <text x="70" y="128" text-anchor="end" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">(%)</text>
      <text x="160" y="310" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="11">400</text>
      <text x="320" y="310" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="11">500</text>
      <text x="470" y="310" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="11">600</text>
      <text x="620" y="310" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="11">700</text>
      <text x="350" y="326" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">wavelength / nm</text>
      <rect x="80" y="284" width="540" height="12" rx="4" fill="url(#specbar)"/>

      <!-- chlorophyll a curve -->
      <polyline points="80,238 110,220 145,120 180,140 230,218 297,244 405,252 500,208 557,156 620,104" fill="none" stroke="#ff2ec4" stroke-width="3"/>
      <!-- chlorophyll b curve -->
      <polyline points="80,242 120,224 155,152 240,232 320,250 420,244 513,196 570,150 620,140" fill="none" stroke="#84cc16" stroke-width="2.5"/>
      <!-- carotenoids curve -->
      <polyline points="80,252 110,236 145,176 188,148 250,196 340,252 405,258 620,260" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

      <text x="145" y="104" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">blue-violet peak ~430 nm</text>
      <text x="612" y="88" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">red peak ~660 nm</text>
      <text x="380" y="190" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">green trough — green light is reflected, so leaves look green</text>
      <text x="330" y="264" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">carotenoids mop up blue-violet and hand the energy over to chlorophyll</text>
    </svg></body></html>
