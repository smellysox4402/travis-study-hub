<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of PKU inheritance from two carrier parents: Punnett grid Aa times Aa giving one in four chance of the disease, plus the enzyme pathway from phenylalanine to tyrosine on chromosome 12">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">PKU — THE HIDDEN CARRIER CROSS (Aa × Aa)</text>
      <text x="320" y="50" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">both parents are carriers — neither shows the disease</text>
      <!-- grid -->
      <text x="365" y="84" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">A</text>
      <text x="445" y="84" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">a</text>
      <text x="252" y="128" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="end">A</text>
      <text x="252" y="208" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="end">a</text>
      <rect x="300" y="104" width="80" height="60" rx="8" fill="rgba(74,222,128,.10)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="340" y="130" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">AA</text>
      <text x="340" y="150" fill="#4ade80" font-size="9.5" font-weight="700" text-anchor="middle">healthy</text>
      <rect x="392" y="104" width="80" height="60" rx="8" fill="rgba(251,191,36,.10)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="432" y="130" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">Aa</text>
      <text x="432" y="150" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">carrier</text>
      <rect x="300" y="176" width="80" height="60" rx="8" fill="rgba(251,191,36,.10)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="340" y="202" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">Aa</text>
      <text x="340" y="222" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">carrier</text>
      <rect x="392" y="176" width="80" height="60" rx="8" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="432" y="202" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">aa</text>
      <text x="432" y="222" fill="#ff2ec4" font-size="9.5" font-weight="700" text-anchor="middle">DISEASE</text>
      <text x="470" y="300" fill="#4ade80" font-size="12" font-weight="900" text-anchor="middle">1 : 2 : 1 genotypes</text>
      <text x="470" y="318" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">25% chance of aa each child</text>
      <!-- pathway -->
      <rect x="120" y="330" width="400" height="104" rx="10" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="320" y="352" fill="#22d3ee" font-size="11.5" font-weight="900" text-anchor="middle">THE ENZYME STORY — chromosome 12 (autosome)</text>
      <text x="200" y="382" fill="#f3e8ff" font-size="11" font-weight="800" text-anchor="middle">phenylalanine</text>
      <text x="320" y="382" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">──▶ tyrosine</text>
      <text x="245" y="398" fill="#b9a3d6" font-size="9" font-weight="700">phenylalanine hydroxylase</text>
      <text x="320" y="422" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">aa → no enzyme → phenylalanine builds up → brain damage</text>
      <text x="320" y="440" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">screen at birth + low-phenylalanine diet = preventable</text>
    </svg></body></html>
