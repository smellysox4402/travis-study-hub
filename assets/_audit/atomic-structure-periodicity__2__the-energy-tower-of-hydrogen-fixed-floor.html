<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 400" role="img" aria-label="Energy level diagram of hydrogen: electrons falling from higher levels to n=2 emit red, cyan, blue and violet light; convergence limit at the top corresponds to ionization">
      <rect x="0" y="0" width="640" height="400" rx="18" fill="#1d0f33"/>
      <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#f3e8ff" font-family="Segoe UI">THE ENERGY TOWER OF HYDROGEN — FIXED FLOORS, FIXED COLOURS</text>
      <!-- energy levels -->
      <line x1="60" y1="60" x2="300" y2="60" stroke="#b9a3d6" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="340" y="64" font-size="11" fill="#b9a3d6" font-family="Segoe UI">n = ∞ (ionization)</text>
      <line x1="60" y1="95" x2="300" y2="95" stroke="#b9a3d6" stroke-width="1.5"/>
      <text x="340" y="99" font-size="11" fill="#b9a3d6" font-family="Segoe UI">n = 6</text>
      <line x1="60" y1="120" x2="300" y2="120" stroke="#b9a3d6" stroke-width="1.5"/>
      <text x="340" y="124" font-size="11" fill="#b9a3d6" font-family="Segoe UI">n = 5</text>
      <line x1="60" y1="150" x2="300" y2="150" stroke="#b9a3d6" stroke-width="1.5"/>
      <text x="340" y="154" font-size="11" fill="#b9a3d6" font-family="Segoe UI">n = 4</text>
      <line x1="60" y1="185" x2="300" y2="185" stroke="#b9a3d6" stroke-width="1.5"/>
      <text x="340" y="189" font-size="11" fill="#b9a3d6" font-family="Segoe UI">n = 3</text>
      <line x1="60" y1="240" x2="300" y2="240" stroke="#22d3ee" stroke-width="3"/>
      <text x="340" y="244" font-size="11" font-weight="800" fill="#22d3ee" font-family="Segoe UI">n = 2 — landing pad</text>
      <line x1="60" y1="330" x2="300" y2="330" stroke="#ff2ec4" stroke-width="3"/>
      <text x="340" y="334" font-size="11" font-weight="800" fill="#ff2ec4" font-family="Segoe UI">n = 1 — ground state</text>
      <!-- transitions -->
      <line x1="150" y1="185" x2="150" y2="240" stroke="#ff2ec4" stroke-width="3" marker-end="url(#arrL)"/>
      <text x="150" y="205" text-anchor="middle" font-size="11" fill="#ff2ec4" font-family="Segoe UI">656 nm · red</text>
      <line x1="210" y1="150" x2="210" y2="240" stroke="#22d3ee" stroke-width="3"/>
      <text x="212" y="185" font-size="11" fill="#22d3ee" font-family="Segoe UI">486 nm · cyan</text>
      <line x1="260" y1="120" x2="260" y2="240" stroke="#a855f7" stroke-width="3"/>
      <text x="262" y="165" font-size="11" fill="#a855f7" font-family="Segoe UI">434 nm · blue</text>
      <line x1="60" y1="95" x2="60" y2="240" stroke="#fbbf24" stroke-width="3"/>
      <text x="46" y="170" font-size="11" fill="#fbbf24" font-family="Segoe UI">410 nm</text>
      <text x="46" y="184" font-size="11" fill="#fbbf24" font-family="Segoe UI">violet</text>
      <!-- ionization arrow -->
      <line x1="230" y1="330" x2="230" y2="62" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 4"/>
      <text x="238" y="200" font-size="11" fill="#4ade80" font-family="Segoe UI">absorb energy →</text>
      <text x="238" y="214" font-size="11" fill="#4ade80" font-family="Segoe UI">electron escapes</text>
      <!-- series zones -->
      <rect x="470" y="70" width="150" height="255" rx="10" fill="#150a26" stroke="#4ade80" stroke-width="1.2"/>
      <text x="545" y="96" text-anchor="middle" font-size="12" font-weight="800" fill="#4ade80" font-family="Segoe UI">THE SERIES</text>
      <text x="545" y="130" text-anchor="middle" font-size="11" fill="#b9a3d6" font-family="Segoe UI">to n = 1 → UV</text>
      <text x="545" y="150" text-anchor="middle" font-size="11" fill="#22d3ee" font-family="Segoe UI">to n = 2 → visible</text>
      <text x="545" y="170" text-anchor="middle" font-size="11" fill="#b9a3d6" font-family="Segoe UI">to n = 3 → IR</text>
      <text x="545" y="205" text-anchor="middle" font-size="11" fill="#4ade80" font-family="Segoe UI">lines converge</text>
      <text x="545" y="220" text-anchor="middle" font-size="11" fill="#4ade80" font-family="Segoe UI">at the ceiling =</text>
      <text x="545" y="235" text-anchor="middle" font-size="11" font-weight="800" fill="#4ade80" font-family="Segoe UI">ionization energy</text>
      <text x="545" y="310" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">H: 2.18 × 10⁻¹⁸ J per atom</text>
      <text x="545" y="324" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">= 1312 kJ mol⁻¹</text>
      <text x="320" y="392" text-anchor="middle" font-size="12" fill="#22d3ee" font-family="Segoe UI" font-weight="700">each arrow = one exact photon energy → evidence that electron energy is QUANTIZED</text>
    </svg></body></html>
