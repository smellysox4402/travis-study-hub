<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of meiosis I showing a bivalent with crossing over at a chiasma, then random orientation of bivalents producing 2 to the n possible combinations">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">MEIOSIS I — THE VARIATION SHUFFLE</text>
      <text x="320" y="58" fill="#b9a3d6" font-size="11" font-weight="800" text-anchor="middle">SYNAPSIS → BIVALENT (homologous pair)</text>
      <line x1="200" y1="95" x2="440" y2="95" stroke="#ff2ec4" stroke-width="6" stroke-linecap="round"/>
      <line x1="200" y1="115" x2="440" y2="115" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
      <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round">
        <path d="M 314 88 L 326 122 M 326 88 L 314 122"/>
      </g>
      <text x="320" y="145" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">chiasma = crossover point</text>
      <line x1="320" y1="136" x2="320" y2="128" stroke="#b9a3d6" stroke-width="1"/>
      <text x="320" y="182" fill="#ff2ec4" font-size="11.5" font-weight="800" text-anchor="middle">CROSSING OVER</text>
      <text x="320" y="200" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">non-sister chromatids swap allele segments</text>
      <!-- swapped rods -->
      <line x1="200" y1="228" x2="430" y2="228" stroke="#ff2ec4" stroke-width="6" stroke-linecap="round"/>
      <line x1="290" y1="228" x2="350" y2="228" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
      <line x1="200" y1="248" x2="430" y2="248" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
      <line x1="290" y1="248" x2="350" y2="248" stroke="#ff2ec4" stroke-width="6" stroke-linecap="round"/>
      <text x="320" y="288" fill="#22d3ee" font-size="11.5" font-weight="800" text-anchor="middle">RANDOM ORIENTATION</text>
      <text x="320" y="306" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">each bivalent faces either way — by chance</text>
      <!-- two orientations -->
      <circle cx="215" cy="380" r="45" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="215" y1="340" x2="215" y2="420" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="195" y1="362" x2="235" y2="362" stroke="#ff2ec4" stroke-width="4" stroke-linecap="round"/>
      <line x1="195" y1="398" x2="235" y2="398" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
      <text x="215" y="330" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">option A</text>
      <circle cx="425" cy="380" r="45" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="425" y1="340" x2="425" y2="420" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="405" y1="362" x2="445" y2="362" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
      <line x1="405" y1="398" x2="445" y2="398" stroke="#ff2ec4" stroke-width="4" stroke-linecap="round"/>
      <text x="425" y="330" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">option B</text>
      <text x="320" y="452" fill="#fbbf24" font-size="11.5" font-weight="800" text-anchor="middle">2ⁿ combos — humans: 2²³ = 8.4 MILLION + crossing over</text>
    </svg></body></html>
