<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 360" role="img" aria-label="Successive ionization energies of sodium, magnesium and aluminium showing the big jump after the valence electrons are removed">
      <rect x="0" y="0" width="640" height="360" rx="18" fill="#1d0f33"/>
      <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#f3e8ff" font-family="Segoe UI">SUCCESSIVE IE — FIND THE BIG JUMP, NAME THE GROUP</text>
      <!-- sodium -->
      <text x="100" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#22d3ee" font-family="Segoe UI">SODIUM (Na)</text>
      <rect x="55" y="70" width="30" height="120" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="55" y="150" width="30" height="40" fill="#22d3ee"/>
      <rect x="92" y="70" width="30" height="230" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="92" y="130" width="30" height="170" fill="#ff2ec4"/>
      <rect x="129" y="70" width="30" height="245" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="129" y="105" width="30" height="210" fill="#ff2ec4"/>
      <text x="70" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE1</text>
      <text x="107" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE2</text>
      <text x="144" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE3</text>
      <text x="107" y="315" text-anchor="middle" font-size="10" fill="#ff2ec4" font-family="Segoe UI" font-weight="700">jump after 1st → group 1</text>
      <!-- magnesium -->
      <text x="295" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#22d3ee" font-family="Segoe UI">MAGNESIUM (Mg)</text>
      <rect x="250" y="70" width="30" height="120" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="250" y="150" width="30" height="40" fill="#22d3ee"/>
      <rect x="287" y="70" width="30" height="150" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="287" y="130" width="30" height="90" fill="#22d3ee"/>
      <rect x="324" y="70" width="30" height="245" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="324" y="105" width="30" height="210" fill="#ff2ec4"/>
      <text x="265" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE1</text>
      <text x="302" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE2</text>
      <text x="339" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE3</text>
      <text x="302" y="315" text-anchor="middle" font-size="10" fill="#ff2ec4" font-family="Segoe UI" font-weight="700">jump after 2nd → group 2</text>
      <!-- aluminium -->
      <text x="500" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#22d3ee" font-family="Segoe UI">ALUMINIUM (Al)</text>
      <rect x="455" y="70" width="30" height="120" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="455" y="150" width="30" height="40" fill="#22d3ee"/>
      <rect x="492" y="70" width="30" height="150" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="492" y="130" width="30" height="90" fill="#22d3ee"/>
      <rect x="529" y="70" width="30" height="170" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="529" y="115" width="30" height="125" fill="#22d3ee"/>
      <rect x="566" y="70" width="30" height="245" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><rect x="566" y="105" width="30" height="210" fill="#ff2ec4"/>
      <text x="470" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE1</text>
      <text x="507" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE2</text>
      <text x="544" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE3</text>
      <text x="581" y="290" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">IE4</text>
      <text x="528" y="315" text-anchor="middle" font-size="10" fill="#ff2ec4" font-family="Segoe UI" font-weight="700">jump after 3rd → group 13</text>
      <text x="320" y="348" text-anchor="middle" font-size="12" fill="#22d3ee" font-family="Segoe UI" font-weight="700">bar height = IE value (not to scale) · count the short bars before the wall = valence electrons</text>
    </svg></body></html>
