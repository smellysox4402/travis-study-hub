<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="side by side comparison of type 1 and type 2 diabetes: type 1 has destroyed beta cells in the pancreas producing no insulin, type 2 has normal insulin but fewer receptors on target cells so cells cannot respond">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">SUGAR CRASH — TYPE 1 vs TYPE 2</text>
      <!-- type 1 panel -->
      <rect x="20" y="48" width="295" height="270" rx="12" fill="rgba(255,46,196,.05)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="167" y="72" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">TYPE 1 · no DJ</text>
      <!-- pancreas -->
      <ellipse cx="110" cy="140" rx="52" ry="34" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2"/>
      <text x="110" y="144" fill="#b9a3d6" font-size="10" text-anchor="middle">β cells destroyed</text>
      <text x="110" y="158" fill="#b9a3d6" font-size="10" text-anchor="middle">(autoimmune)</text>
      <line x1="60" y1="108" x2="160" y2="172" stroke="#ff2ec4" stroke-width="3"/>
      <line x1="160" y1="108" x2="60" y2="172" stroke="#ff2ec4" stroke-width="3"/>
      <!-- blood glucose line -->
      <text x="167" y="205" fill="#b9a3d6" font-size="10" text-anchor="middle">✗ no insulin released</text>
      <text x="167" y="222" fill="#b9a3d6" font-size="10" text-anchor="middle">✗ glucose channels stay shut</text>
      <text x="167" y="239" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">⬆ hyperglycaemia</text>
      <text x="167" y="262" fill="#b9a3d6" font-size="10" text-anchor="middle">early onset · autoimmune</text>
      <text x="167" y="278" fill="#b9a3d6" font-size="10" text-anchor="middle">treated: insulin injections</text>
      <text x="167" y="294" fill="#b9a3d6" font-size="10" text-anchor="middle">(timing critical — insulin is short-lived)</text>
      <!-- type 2 panel -->
      <rect x="345" y="48" width="295" height="270" rx="12" fill="rgba(251,191,36,.05)" stroke="#fbbf24" stroke-width="2"/>
      <text x="492" y="72" fill="#fbbf24" font-size="13" font-weight="900" text-anchor="middle">TYPE 2 · blown speakers</text>
      <!-- pancreas intact -->
      <ellipse cx="435" cy="140" rx="52" ry="34" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2"/>
      <text x="435" y="138" fill="#b9a3d6" font-size="10" text-anchor="middle">insulin IS produced</text>
      <text x="435" y="152" fill="#b9a3d6" font-size="10" text-anchor="middle">(β cells intact)</text>
      <!-- target cell -->
      <circle cx="555" cy="140" r="30" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="555" y="138" fill="#4ade80" font-size="9.5" text-anchor="middle">target cell</text>
      <text x="555" y="152" fill="#ff2ec4" font-size="9.5" text-anchor="middle">✗ few receptors</text>
      <!-- blood glucose line -->
      <text x="492" y="205" fill="#b9a3d6" font-size="10" text-anchor="middle">insulin present but ignored</text>
      <text x="492" y="222" fill="#b9a3d6" font-size="10" text-anchor="middle">✗ receptors down-regulated</text>
      <text x="492" y="239" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">⬆ hyperglycaemia</text>
      <text x="492" y="262" fill="#b9a3d6" font-size="10" text-anchor="middle">later onset · lifestyle-linked</text>
      <text x="492" y="278" fill="#b9a3d6" font-size="10" text-anchor="middle">risk: sugary/fatty diet, obesity,</text>
      <text x="492" y="294" fill="#b9a3d6" font-size="10" text-anchor="middle">no exercise + genetics</text>
      <!-- bottom note -->
      <text x="330" y="340" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Type 2 prevention/treatment: low-glycaemic-index foods, frequent small meals, fibre, exercise, weight loss</text>
    </svg></body></html>
