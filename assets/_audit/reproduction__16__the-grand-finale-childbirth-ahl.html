<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="positive feedback loop of childbirth: oxytocin stimulates myometrium contractions, stretch receptors detect them and trigger more oxytocin, stronger and more frequent contractions, with progesterone shown as the mute switch turned off at the end of pregnancy">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE GRAND FINALE — CHILDBIRTH (AHL)</text>

      <rect x="400" y="56" width="200" height="60" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="500" y="74" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">OXYTOCIN</text>
      <text x="500" y="90" fill="#b9a3d6" font-size="9" text-anchor="middle">pituitary secretes more</text>

      <rect x="60" y="56" width="200" height="60" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="160" y="74" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">MYOMETRIUM</text>
      <text x="160" y="90" fill="#b9a3d6" font-size="9" text-anchor="middle">uterus muscle contracts</text>

      <rect x="60" y="224" width="200" height="60" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="160" y="242" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">STRETCH RECEPTORS</text>
      <text x="160" y="258" fill="#b9a3d6" font-size="9" text-anchor="middle">detect the contraction</text>

      <rect x="400" y="224" width="200" height="60" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="500" y="242" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">MORE OXYTOCIN</text>
      <text x="500" y="258" fill="#b9a3d6" font-size="9" text-anchor="middle">stronger + more frequent</text>

      <path d="M 400 86 L 266 86" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="333" y="78" fill="#b9a3d6" font-size="9" text-anchor="middle">stimulates</text>
      <path d="M 160 116 L 160 220" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="150" y="168" fill="#b9a3d6" font-size="9" text-anchor="end">contraction</text>
      <path d="M 266 254 L 400 254" stroke="#4ade80" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="333" y="246" fill="#b9a3d6" font-size="9" text-anchor="middle">more, stronger</text>
      <path d="M 500 224 L 500 120" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="512" y="172" fill="#b9a3d6" font-size="9" text-anchor="start">more secretion</text>

      <text x="330" y="160" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">POSITIVE FEEDBACK</text>
      <text x="330" y="174" fill="#b9a3d6" font-size="9" text-anchor="middle">the encore chant —</text>
      <text x="330" y="188" fill="#b9a3d6" font-size="9" text-anchor="middle">each round strengthens</text>

      <text x="330" y="312" fill="#b9a3d6" font-size="9.5" text-anchor="middle">PROGESTERONE = the mute switch: inhibits oxytocin + contractions during pregnancy</text>
      <text x="330" y="330" fill="#b9a3d6" font-size="9.5" text-anchor="middle">foetal hormones → placenta stops progesterone → oxytocin · positive feedback is rare in physiology</text>
      <text x="330" y="348" fill="#b9a3d6" font-size="9.5" text-anchor="middle">advantage: contractions build gradually — just enough force to birth the baby</text>
    </svg></body></html>
