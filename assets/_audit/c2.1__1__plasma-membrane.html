<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a G protein-coupled receptor cascade: adrenaline to cAMP to response">
          <rect width="640" height="470" rx="14" fill="#150a26"/>
          <defs>
            <marker id="gcarw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4ade80"/></marker>
            <marker id="gcow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fbbf24"/></marker>
          </defs>
          <!-- membrane -->
          <rect x="30" y="170" width="580" height="30" rx="6" fill="rgba(34,211,238,.16)" stroke="#22d3ee" stroke-width="2"/>
          <text x="600" y="163" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="end">PLASMA MEMBRANE</text>
          <text x="38" y="90" fill="#67e8f9" font-size="11" font-weight="700">OUTSIDE</text>
          <text x="38" y="430" fill="#67e8f9" font-size="11" font-weight="700">INSIDE</text>
          <!-- ligand -->
          <circle cx="150" cy="118" r="17" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="3"/>
          <text x="150" y="116" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">adren-</text>
          <text x="150" y="134" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">aline</text>
          <text x="150" y="155" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">(1st messenger)</text>
          <!-- GPCR snake -->
          <path d="M 150 155 C 128 175 172 195 150 210 C 128 225 172 245 150 260 C 128 275 172 295 150 310 C 135 322 165 332 150 345" fill="none" stroke="#a855f7" stroke-width="9" stroke-linecap="round"/>
          <text x="200" y="238" fill="#a855f7" font-size="11.5" font-weight="800">GPCR — snakes</text>
          <text x="200" y="256" fill="#a855f7" font-size="11.5" font-weight="800">through ×7</text>
          <line x1="193" y1="240" x2="165" y2="252" stroke="#a855f7" stroke-width="1.5"/>
          <!-- G protein resting -->
          <circle cx="150" cy="378" r="19" fill="rgba(74,222,128,.22)" stroke="#4ade80" stroke-width="2.5"/>
          <text x="150" y="375" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">α</text>
          <text x="150" y="389" fill="#4ade80" font-size="8" font-weight="700" text-anchor="middle">GDP</text>
          <ellipse cx="188" cy="398" rx="15" ry="10" fill="rgba(74,222,128,.18)" stroke="#4ade80" stroke-width="2"/>
          <ellipse cx="215" cy="411" rx="15" ry="10" fill="rgba(74,222,128,.13)" stroke="#4ade80" stroke-width="2"/>
          <text x="190" y="395" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">βγ</text>
          <text x="245" y="425" fill="#4ade80" font-size="11" font-weight="800">G protein (α+βγ)</text>
          <!-- activation arrow -->
          <path d="M 165 380 L 345 200" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#gcarw)"/>
          <text x="205" y="368" fill="#4ade80" font-size="10" font-weight="800">GDP→GTP, α-GTP splits</text>
          <text x="205" y="386" fill="#4ade80" font-size="10" font-weight="800">off — docks the enzyme</text>
          <!-- adenylyl cyclase -->
          <rect x="330" y="174" width="95" height="24" rx="8" fill="rgba(56,189,248,.28)" stroke="#38bdf8" stroke-width="2.5"/>
          <text x="377" y="190" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle">adenylyl cyclase</text>
          <text x="377" y="215" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">(effector enzyme)</text>
          <!-- ATP -> cAMP -->
          <text x="377" y="248" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">ATP → cAMP</text>
          <circle cx="356" cy="272" r="10" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="2"/>
          <text x="356" y="276" fill="#fbbf24" font-size="8" font-weight="800" text-anchor="middle">cAMP</text>
          <circle cx="383" cy="288" r="10" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="2"/>
          <text x="383" y="292" fill="#fbbf24" font-size="8" font-weight="800" text-anchor="middle">cAMP</text>
          <circle cx="410" cy="304" r="10" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="2"/>
          <text x="410" y="308" fill="#fbbf24" font-size="8" font-weight="800" text-anchor="middle">cAMP</text>
          <text x="432" y="310" fill="#fbbf24" font-size="13" font-weight="800">…</text>
          <text x="377" y="338" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">SECOND MESSENGER</text>
          <text x="390" y="356" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">1 ligand → many cAMP</text>
          <!-- cascade -->
          <path d="M 377 362 L 377 400" stroke="#4ade80" stroke-width="2.5" marker-end="url(#gcarw)"/>
          <text x="392" y="380" fill="#4ade80" font-size="11" font-weight="800">protein kinase cascade</text>
          <text x="392" y="408" fill="#4ade80" font-size="11" font-weight="800">glycogen→glucose · heart ↑</text>
          <!-- amplification banner -->
          <rect x="40" y="438" width="560" height="26" rx="8" fill="rgba(251,191,36,.09)" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="320" y="455" fill="#fbbf24" font-size="12" font-weight="800" text-anchor="middle">⚡ AMPLIFICATION: one adrenaline → many cAMP → whole club mobilised</text>
        </svg></body></html>
