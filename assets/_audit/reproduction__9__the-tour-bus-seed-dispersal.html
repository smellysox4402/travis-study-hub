<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="a tour bus of seeds leaving the club with four dispersal routes: wind carrying feathery and winged seeds like maple samaras and dandelion, animal coats catching hooked burrs, animal guts carrying fleshy fruit seeds through digestion, and explosive pods popping open like gorse and jewelweed">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE TOUR BUS — SEED DISPERSAL</text>

      <rect x="40" y="56" width="200" height="66" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="140" y="76" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">WIND</text>
      <text x="140" y="92" fill="#b9a3d6" font-size="9" text-anchor="middle">feathery / winged seeds</text>
      <text x="140" y="106" fill="#b9a3d6" font-size="9" text-anchor="middle">maple samaras · dandelion</text>

      <rect x="420" y="56" width="200" height="66" rx="9" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="520" y="76" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">ANIMAL COAT</text>
      <text x="520" y="92" fill="#b9a3d6" font-size="9" text-anchor="middle">hooks catch on fur</text>
      <text x="520" y="106" fill="#b9a3d6" font-size="9" text-anchor="middle">burrs</text>

      <rect x="250" y="180" width="160" height="62" rx="9" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="200" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">THE TOUR BUS</text>
      <text x="330" y="216" fill="#b9a3d6" font-size="9" text-anchor="middle">seeds leave the club</text>
      <text x="330" y="232" fill="#b9a3d6" font-size="9" text-anchor="middle">less competition · species spreads</text>
      <circle cx="275" cy="242" r="7" fill="#b9a3d6"/>
      <circle cx="385" cy="242" r="7" fill="#b9a3d6"/>

      <rect x="420" y="236" width="200" height="66" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="520" y="256" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">ANIMAL GUT</text>
      <text x="520" y="272" fill="#b9a3d6" font-size="9" text-anchor="middle">fleshy fruit eaten</text>
      <text x="520" y="286" fill="#b9a3d6" font-size="9" text-anchor="middle">seeds pass through</text>

      <rect x="40" y="236" width="200" height="66" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="140" y="256" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">EXPLOSION</text>
      <text x="140" y="272" fill="#b9a3d6" font-size="9" text-anchor="middle">dry pods pop open</text>
      <text x="140" y="286" fill="#b9a3d6" font-size="9" text-anchor="middle">gorse · jewelweed</text>

      <path d="M 170 122 L 285 178" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 490 122 L 375 178" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 490 236 L 388 244" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 170 236 L 272 244" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <text x="330" y="336" fill="#b9a3d6" font-size="9.5" text-anchor="middle">dispersal ≠ pollination — pollen: anther → stigma · seeds: parent → new germination site</text>
    </svg></body></html>
