<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 400" role="img" aria-label="How rate responds to concentration for zero, first and second order">
