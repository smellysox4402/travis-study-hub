<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a steroid hormone passing through the membrane and acting on DNA via an intracellular receptor">
          <rect width="640" height="450" rx="14" fill="#150a26"/>
          <defs>
            <marker id="sterarw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fbbf24"/></marker>
            <marker id="stervw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a855f7"/></marker>
          </defs>
          <!-- cell membrane -->
          <rect x="100" y="52" width="460" height="348" rx="20" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="3"/>
          <text x="110" y="40" fill="#22d3ee" font-size="12" font-weight="800">PLASMA MEMBRANE</text>
          <!-- steroid entering -->
          <polygon points="45,200 62,193 79,200 62,207" fill="#fbbf24"/>
          <text x="62" y="176" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">steroid</text>
          <path d="M 78 200 L 110 200" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#sterarw)"/>
          <text x="26" y="230" fill="#fbbf24" font-size="10.5" font-weight="800">fat-soluble,</text>
          <text x="26" y="248" fill="#fbbf24" font-size="10.5" font-weight="800">diffuses</text>
          <text x="26" y="266" fill="#fbbf24" font-size="10.5" font-weight="800">through</text>
          <text x="120" y="382" fill="#67e8f9" font-size="11" font-weight="700">CYTOPLASM</text>
          <!-- intracellular receptor -->
          <rect x="150" y="312" width="105" height="30" rx="13" fill="rgba(168,85,247,.28)" stroke="#a855f7" stroke-width="2.5"/>
          <text x="202" y="331" fill="#a855f7" font-size="9.5" font-weight="800" text-anchor="middle">intracellular receptor</text>
          <!-- complex -->
          <rect x="205" y="228" width="105" height="30" rx="13" fill="rgba(168,85,247,.35)" stroke="#a855f7" stroke-width="2.5"/>
          <rect x="211" y="234" width="16" height="16" rx="4" fill="#fbbf24"/>
          <text x="257" y="240" fill="#a855f7" font-size="9" font-weight="800" text-anchor="middle">hormone–receptor</text>
          <text x="257" y="258" fill="#a855f7" font-size="9" font-weight="800" text-anchor="middle">complex</text>
          <text x="240" y="218" fill="#a855f7" font-size="10" font-weight="800" text-anchor="middle">= TRANSCRIPTION FACTOR</text>
          <!-- formation arrow receptor -> complex -->
          <path d="M 195 310 L 235 260" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#stervw)"/>
          <!-- complex -> nucleus -->
          <path d="M 312 243 L 322 235" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#stervw)"/>
          <!-- nucleus -->
          <circle cx="428" cy="215" r="112" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="3"/>
          <text x="428" y="62" fill="#a855f7" font-size="12" font-weight="800" text-anchor="middle">NUCLEUS</text>
          <!-- nuclear pore on right -->
          <rect x="533" y="172" width="14" height="18" fill="#150a26"/>
          <!-- DNA -->
          <path d="M 362 240 Q 384 228 406 244 T 448 236 T 486 248" fill="none" stroke="#4ade80" stroke-width="3"/>
          <text x="488" y="265" fill="#4ade80" font-size="10.5" font-weight="800">DNA</text>
          <!-- RNA polymerase -->
          <circle cx="400" cy="210" r="12" fill="rgba(56,189,248,.4)" stroke="#38bdf8" stroke-width="2.5"/>
          <text x="400" y="214" fill="#38bdf8" font-size="7" font-weight="800" text-anchor="middle">RNA pol</text>
          <text x="378" y="188" fill="#38bdf8" font-size="9.5" font-weight="800" text-anchor="middle">binds promoter</text>
          <!-- mRNA out -->
          <path d="M 470 200 Q 505 185 522 170 L 555 145" fill="none" stroke="#4ade80" stroke-width="3"/>
          <circle cx="556" cy="143" r="3.5" fill="#4ade80"/>
          <text x="505" y="128" fill="#4ade80" font-size="10.5" font-weight="800">mRNA → new protein</text>
          <!-- timing -->
          <text x="320" y="430" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">slow (minutes–hours) but it lasts — direct line to DNA, no cascade</text>
        </svg></body></html>
