<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 400" role="img" aria-label="Maxwell-Boltzmann energy distribution curves at two temperatures">
      <!-- axes -->
      <line x1="60" y1="335" x2="625" y2="335" stroke="#b9a3d6" stroke-width="2"/>
      <polygon points="625,335 612,330 612,340" fill="#b9a3d6"/>
      <line x1="60" y1="335" x2="60" y2="40" stroke="#b9a3d6" stroke-width="2"/>
      <polygon points="60,40 55,52 65,52" fill="#b9a3d6"/>
      <!-- T1 curve (cyan) -->
      <path d="M 62,335 C 85,190 135,88 205,92 C 285,97 355,205 425,282 C 475,332 530,336 570,336" fill="none" stroke="#22d3ee" stroke-width="3"/>
      <!-- T2 curve (pink) -->
      <path d="M 62,335 C 92,245 165,152 265,152 C 365,152 470,262 550,318 C 575,332 600,336 620,336" fill="none" stroke="#ff2ec4" stroke-width="3"/>
      <!-- Ea line -->
      <line x1="445" y1="335" x2="445" y2="62" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,5"/>
      <!-- labels -->
      <text x="205" y="80" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">T₁ (lower T)</text>
      <text x="300" y="138" fill="#ff2ec4" font-size="14" font-weight="700" text-anchor="middle">T₂ (higher T)</text>
      <text x="445" y="48" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">Eₐ</text>
      <text x="350" y="380" fill="#b9a3d6" font-size="12" text-anchor="middle">kinetic energy →</text>
      <text x="30" y="190" fill="#b9a3d6" font-size="12" text-anchor="middle" transform="rotate(-90 30 190)">proportion of particles →</text>
    </svg></body></html>
