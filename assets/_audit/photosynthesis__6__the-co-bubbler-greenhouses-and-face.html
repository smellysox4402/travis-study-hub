<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="carbon dioxide enrichment: a greenhouse where CO2 from CHP boilers or compost is dosed to raise yields, and a FACE experiment where a ring of towers releases CO2 over open-air forest plots at 550 ppm with control plots receiving plain air">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <defs>
        <marker id="arP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff2ec4"/></marker>
        <marker id="arC2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker>
      </defs>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE CO₂ BUBBLER — GREENHOUSES AND FACE</text>

      <!-- greenhouse -->
      <path d="M 40 230 L 40 100 L 160 48 L 280 100 L 280 230 Z" fill="rgba(74,222,128,0.06)" stroke="#4ade80" stroke-width="2.5"/>
      <rect x="70" y="170" width="14" height="60" fill="#22d3ee"/>
      <rect x="110" y="150" width="14" height="80" fill="#22d3ee"/>
      <rect x="150" y="120" width="14" height="110" fill="#22d3ee"/>
      <rect x="190" y="160" width="14" height="70" fill="#22d3ee"/>
      <text x="160" y="76" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">GREENHOUSE</text>
      <text x="160" y="96" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">light + temperature held optimal</text>
      <text x="160" y="112" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">only CO₂ is varied</text>
      <text x="160" y="128" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">~400 ppm → 550+ ppm</text>
      <path d="M 300 220 L 285 220" fill="none" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#arP)"/>
      <text x="160" y="252" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">CO₂ dosed on sunny days → tomato yields up</text>
      <text x="160" y="270" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">supply from CHP boilers or compost</text>

      <!-- FACE -->
      <circle cx="470" cy="140" r="72" fill="rgba(34,211,238,0.05)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 5"/>
      <rect x="462" y="62" width="16" height="10" fill="#a855f7"/>
      <rect x="536" y="134" width="10" height="16" fill="#a855f7"/>
      <rect x="462" y="208" width="16" height="10" fill="#a855f7"/>
      <rect x="392" y="134" width="10" height="16" fill="#a855f7"/>
      <path d="M 380 140 L 392 140" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arC2)"/>
      <path d="M 380 120 L 392 128" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arC2)"/>
      <path d="M 380 160 L 392 152" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arC2)"/>
      <text x="470" y="56" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">FACE (Free-Air CO₂ Enrichment)</text>
      <text x="470" y="132" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">ring of towers in open air</text>
      <text x="470" y="148" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">natural forest / grassland plot</text>
      <text x="470" y="164" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">CO₂ released upwind → held at 550 ppm</text>
      <text x="470" y="252" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">control plots: towers release plain air</text>
      <text x="470" y="270" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">test: does extra CO₂ boost carbon storage?</text>

      <text x="330" y="306" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">Questions FACE probes: carbon storage, nitrogen/phosphorus limits, biodiversity shifts at 550 ppm</text>
      <text x="330" y="324" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">results from real ecosystems, no walls or pots — but answers are provisional (NOS)</text>
    </svg></body></html>
