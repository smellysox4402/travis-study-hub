<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the water-wheel of chemiosmosis: protons cascade down from the intermembrane space through ATP synthase, ten protons pass through the rotor made of ten c subunits each carrying one proton, spinning the gamma stalk which sits inside a ring of three beta subunits each making one ATP per rotation, with the yield maths: 2.5 ATP per reduced NAD and 1.5 ATP per reduced FAD">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE WATER-WHEEL — CHEMIOSMOSIS + ATP SYNTHASE</text>

      <rect x="30" y="52" width="600" height="40" rx="8" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="330" y="76" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">PROTON WATERFALL — HIGH [H⁺] intermembrane space → through ATP synthase → matrix</text>

      <circle cx="330" cy="170" r="46" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 4"/>
      <text x="270" y="166" fill="#a855f7" font-size="9" font-weight="800" text-anchor="middle">ROTOR</text>
      <text x="270" y="180" fill="#b9a3d6" font-size="8" text-anchor="middle">10 c subunits</text>
      <text x="270" y="192" fill="#b9a3d6" font-size="8" text-anchor="middle">1 H⁺ each</text>
      <circle cx="330" cy="170" r="12" fill="rgba(251,191,36,.2)" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="174" fill="#fbbf24" font-size="7.5" font-weight="800" text-anchor="middle">γ</text>

      <path d="M 330 96 L 330 120" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah16)" fill="none"/>
      <defs><marker id="ah16" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>
      <text x="344" y="112" fill="#22d3ee" font-size="8.5" font-weight="800">10 H⁺</text>

      <rect x="230" y="238" width="200" height="46" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="258" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">3 β SUBUNITS</text>
      <text x="330" y="274" fill="#b9a3d6" font-size="8.5" text-anchor="middle">1 ATP each per rotation</text>

      <text x="330" y="318" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">10 protons per rotation → 3 ATP per rotation</text>
      <text x="330" y="342" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">→ 2.5 ATP per reduced NAD · 1.5 ATP per reduced FAD</text>
    </svg></body></html>
