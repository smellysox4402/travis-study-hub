<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="two panels: the menu of end products made from Calvin cycle triose phosphate, and the power cut showing how loss of light halts the Calvin cycle while loss of carbon dioxide stops photosystem II because reduced NADP accumulates and NADP runs out">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">MENU &amp; POWER CUT</text>

      <!-- menu panel -->
      <rect x="30" y="44" width="290" height="232" rx="14" fill="rgba(74,222,128,0.05)" stroke="#4ade80" stroke-width="2"/>
      <text x="175" y="66" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="12" font-weight="900">THE MENU — FROM TP TO EVERYTHING</text>
      <text x="175" y="92" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">TP from the Calvin cycle →</text>
      <text x="175" y="116" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">glucose → sucrose (transport sugar)</text>
      <text x="175" y="136" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">glucose → starch (stored in chloroplast)</text>
      <text x="175" y="156" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">TP → fatty acids + glycerol → triglycerides</text>
      <text x="175" y="176" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">GP / TP → all 20 amino acids</text>
      <text x="175" y="196" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">nitrogen from nitrate / ammonium · phosphate · sulfate</text>
      <text x="175" y="222" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">every carbon atom traces back to</text>
      <text x="175" y="240" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">a Calvin cycle intermediate</text>
      <text x="175" y="262" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">that is how CO₂ becomes the entire plant</text>

      <!-- power cut panel -->
      <rect x="340" y="44" width="290" height="232" rx="14" fill="rgba(255,46,196,0.05)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="485" y="66" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="12" font-weight="900">THE POWER CUT — INTERDEPENDENCE</text>
      <text x="485" y="90" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">LIGHT OFF →</text>
      <text x="485" y="108" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">no new ATP / reduced NADP</text>
      <text x="485" y="124" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">stocks used up → GP → TP stalls</text>
      <text x="485" y="140" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">Calvin cycle stops in seconds</text>
      <text x="485" y="168" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">NO CO₂ →</text>
      <text x="485" y="186" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">no GP forms → reduced NADP piles up</text>
      <text x="485" y="202" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">NADP runs out → electron chain backs up</text>
      <text x="485" y="218" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">photosystem II cannot function</text>
      <text x="485" y="244" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800">the halves trade: ATP / reduced NADP → stroma</text>
      <text x="485" y="260" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800">ADP / NADP → thylakoid · both directions</text>

      <text x="330" y="300" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">Two halves, one kitchen: the light-dependent reactions charge the batteries the Calvin cycle spends — cut either supply and the whole club goes dark</text>
      <text x="330" y="322" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">in high light, carbon fixation is rate-limiting · in no CO₂, even brilliant light cannot keep PSII running</text>
    </svg></body></html>
