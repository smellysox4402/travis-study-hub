<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the round-the-clock turbine loop of the Krebs cycle: acetyl CoA two-carbon feeds in and combines with oxaloacetate four-carbon to make citrate six-carbon, the loop converts citrate back to oxaloacetate through two decarboxylations releasing two carbon dioxides and four oxidations, paying out three reduced NAD one reduced FAD and one ATP per turn, and the regenerated oxaloacetate keeps the loop spinning">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE TURBINE LOOP — KREBS CYCLE (MATRIX)</text>

      <path d="M 330 92 A 110 110 0 1 1 329.9 92" stroke="#a855f7" stroke-width="0" fill="none"/>
      <circle cx="330" cy="92" r="110" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 4"/>
      <text x="330" y="180" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">KREBS CYCLE</text>
      <text x="330" y="199" fill="#b9a3d6" font-size="8.5" text-anchor="middle">spins forever</text>

      <rect x="30" y="56" width="150" height="52" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="105" y="76" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">ACETYL CoA</text>
      <text x="105" y="94" fill="#b9a3d6" font-size="9" text-anchor="middle">2C · from link reaction</text>

      <rect x="240" y="46" width="170" height="46" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="325" y="66" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">OXALOACETATE (4C)</text>
      <text x="325" y="84" fill="#b9a3d6" font-size="9" text-anchor="middle">+ acetyl → CITRATE (6C)</text>

      <rect x="470" y="56" width="150" height="52" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="545" y="76" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">CITRATE (6C)</text>
      <text x="545" y="94" fill="#b9a3d6" font-size="9" text-anchor="middle">first stop on the loop</text>

      <rect x="40" y="196" width="280" height="104" rx="9" fill="rgba(34,211,238,.07)" stroke="rgba(34,211,238,.5)" stroke-width="1.5"/>
      <text x="180" y="218" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">WHAT THE TURBINE PAYS OUT PER TURN</text>
      <text x="180" y="242" fill="#b9a3d6" font-size="9.5" text-anchor="middle">2 decarboxylations → 2 CO₂ released</text>
      <text x="180" y="262" fill="#b9a3d6" font-size="9.5" text-anchor="middle">4 oxidations (dehydrogenations)</text>
      <text x="180" y="282" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">3 reduced NAD + 1 reduced FAD + 1 ATP</text>

      <rect x="340" y="196" width="280" height="104" rx="9" fill="rgba(251,191,36,.07)" stroke="rgba(251,191,36,.5)" stroke-width="1.5"/>
      <text x="480" y="218" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">CITRATE → BACK TO OXALOACETATE</text>
      <text x="480" y="242" fill="#b9a3d6" font-size="9.5" text-anchor="middle">enzyme-catalysed series of reactions</text>
      <text x="480" y="262" fill="#b9a3d6" font-size="9.5" text-anchor="middle">oxaloacetate (4C) is REGENERATED</text>
      <text x="480" y="282" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">the loop never stops — hence "cycle"</text>

      <text x="330" y="332" fill="#b9a3d6" font-size="9.5" text-anchor="middle">reduced NAD + reduced FAD carry the energy to the ETC (Act 15) · CO₂ is the waste</text>
    </svg></body></html>
