<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of human sex determination: XX mother crossed with XY father gives a 1 to 1 ratio of XX daughters and XY sons, with the SRY gene on the Y chromosome as testis-determining factor">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">SEX DETERMINATION — THE SPERM DECIDES</text>
      <text x="320" y="48" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">father's sperm carries X or Y · mother's egg always carries X</text>
      <!-- parents -->
      <text x="140" y="76" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">MOTHER XX</text>
      <text x="500" y="76" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">FATHER XY</text>
      <!-- gamete labels -->
      <text x="365" y="104" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">X</text>
      <text x="445" y="104" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">Y</text>
      <text x="252" y="148" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="end">X</text>
      <text x="252" y="228" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="end">X</text>
      <text x="150" y="137" fill="#b9a3d6" font-size="10" font-weight="700">egg</text>
      <text x="150" y="154" fill="#b9a3d6" font-size="10" font-weight="700">(always X)</text>
      <!-- grid -->
      <rect x="300" y="124" width="80" height="60" rx="8" fill="rgba(255,46,196,.10)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="340" y="150" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">XX</text>
      <text x="340" y="170" fill="#ff2ec4" font-size="10" font-weight="700" text-anchor="middle">daughter</text>
      <rect x="392" y="124" width="80" height="60" rx="8" fill="rgba(34,211,238,.10)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="432" y="150" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">XY</text>
      <text x="432" y="170" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">son</text>
      <rect x="300" y="196" width="80" height="60" rx="8" fill="rgba(255,46,196,.10)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="340" y="222" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">XX</text>
      <text x="340" y="242" fill="#ff2ec4" font-size="10" font-weight="700" text-anchor="middle">daughter</text>
      <rect x="392" y="196" width="80" height="60" rx="8" fill="rgba(34,211,238,.10)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="432" y="222" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">XY</text>
      <text x="432" y="242" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">son</text>
      <text x="460" y="300" fill="#4ade80" font-size="12" font-weight="900" text-anchor="middle">1 daughter : 1 son</text>
      <!-- SRY box -->
      <rect x="110" y="314" width="420" height="74" rx="10" fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="320" y="336" fill="#fbbf24" font-size="11.5" font-weight="900" text-anchor="middle">SRY GENE ON THE Y = TESTIS-DETERMINING FACTOR</text>
      <text x="320" y="356" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">SRY → embryonic gonads → testes → testosterone → male development</text>
      <text x="320" y="372" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">no Y → no SRY → ovaries → oestradiol → female development</text>
      <text x="320" y="412" fill="#ff2ec4" font-size="11" font-weight="900" text-anchor="middle">XXY (Klinefelter) = male · XO (Turner) = female</text>
      <text x="320" y="432" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">→ it's the PRESENCE of Y that makes a male, not the number of X</text>
    </svg></body></html>
