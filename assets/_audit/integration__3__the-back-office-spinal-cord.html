<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spinal cord cross section and conscious versus unconscious control diagram: grey matter butterfly inside white matter, 31 pairs of spinal nerves, conscious voluntary control via cerebral hemispheres for striated muscle when awake, unconscious control for reflexes and smooth muscle and glands">
      <rect width="660" height="380" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE BACK OFFICE — SPINAL CORD</text>
      <!-- cord cross section -->
      <circle cx="160" cy="190" r="86" fill="rgba(168,85,247,.06)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="160" y="66" fill="#a855f7" font-size="10" font-weight="700" text-anchor="middle">WHITE MATTER</text>
      <text x="160" y="82" fill="#b9a3d6" font-size="8.5" text-anchor="middle">myelinated axons to/from brain</text>
      <!-- grey butterfly -->
      <path d="M 160 190 C 120 150 90 160 78 190 C 90 220 120 230 160 190 Z" fill="rgba(255,46,196,.14)" stroke="#ff2ec4" stroke-width="2"/>
      <path d="M 160 190 C 200 150 230 160 242 190 C 230 220 200 230 160 190 Z" fill="rgba(255,46,196,.14)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="160" y="185" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">GREY MATTER</text>
      <text x="160" y="200" fill="#b9a3d6" font-size="8.5" text-anchor="middle">motor neuron cell bodies</text>
      <text x="160" y="214" fill="#b9a3d6" font-size="8.5" text-anchor="middle">+ interneurons + synapses</text>
      <!-- spinal nerves -->
      <line x1="74" y1="150" x2="30" y2="120" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="74" y1="230" x2="30" y2="260" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="246" y1="150" x2="290" y2="120" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="246" y1="230" x2="290" y2="260" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="30" y="105" fill="#22d3ee" font-size="9" text-anchor="middle">spinal</text>
      <text x="30" y="117" fill="#22d3ee" font-size="9" text-anchor="middle">nerves</text>
      <text x="290" y="93" fill="#22d3ee" font-size="9" text-anchor="middle">31 pairs</text>
      <!-- conscious box -->
      <rect x="380" y="70" width="250" height="110" rx="12" fill="rgba(74,222,128,.06)" stroke="#4ade80" stroke-width="2"/>
      <text x="505" y="92" fill="#4ade80" font-size="12" font-weight="900" text-anchor="middle">CONSCIOUS</text>
      <text x="505" y="110" fill="#b9a3d6" font-size="9.5" text-anchor="middle">only while awake · voluntary</text>
      <text x="505" y="126" fill="#b9a3d6" font-size="9.5" text-anchor="middle">striated (skeletal) muscle</text>
      <text x="505" y="142" fill="#b9a3d6" font-size="9.5" text-anchor="middle">coordinated by cerebral hemispheres</text>
      <text x="505" y="160" fill="#b9a3d6" font-size="9.5" text-anchor="middle">e.g. standing up, writing</text>
      <!-- unconscious box -->
      <rect x="380" y="210" width="250" height="110" rx="12" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="2"/>
      <text x="505" y="232" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">UNCONSCIOUS</text>
      <text x="505" y="250" fill="#b9a3d6" font-size="9.5" text-anchor="middle">awake or asleep · involuntary</text>
      <text x="505" y="266" fill="#b9a3d6" font-size="9.5" text-anchor="middle">gland secretion + smooth muscle</text>
      <text x="505" y="282" fill="#b9a3d6" font-size="9.5" text-anchor="middle">reflexes coordinated by spinal cord</text>
      <text x="505" y="300" fill="#b9a3d6" font-size="9.5" text-anchor="middle">e.g. reflexes, peristalsis (Act 12)</text>
      <!-- brain link -->
      <path d="M 246 120 C 320 110 340 120 376 120" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ah)" fill="none"/>
      <text x="310" y="108" fill="#4ade80" font-size="9" text-anchor="middle">brain coordinates voluntary moves</text>
      <!-- bottom note -->
      <text x="330" y="366" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Reflexes are fast because the spinal cord decides — no detour up to the brain</text>
    </svg></body></html>
