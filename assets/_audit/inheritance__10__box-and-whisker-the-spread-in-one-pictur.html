<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled box-and-whisker plot of a continuous trait showing minimum, lower quartile, median, upper quartile, maximum, interquartile range and an outlier, compared with discrete categories of a single-gene trait">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">BOX-AND-WHISKER — THE SPREAD, IN ONE PICTURE</text>
      <!-- number line -->
      <line x1="80" y1="120" x2="560" y2="120" stroke="#b9a3d6" stroke-width="2"/>
      <g font-size="9.5" fill="#b9a3d6" text-anchor="middle">
        <text x="80" y="138">min</text><text x="200" y="138">Q1</text><text x="320" y="138">median</text>
        <text x="440" y="138">Q3</text><text x="560" y="138">max</text>
      </g>
      <g font-size="9" fill="#b9a3d6" text-anchor="middle">
        <text x="80" y="60">lowest</text><text x="560" y="60">tallest</text>
      </g>
      <!-- whiskers + box -->
      <line x1="80" y1="104" x2="200" y2="104" stroke="#22d3ee" stroke-width="3"/>
      <line x1="440" y1="104" x2="560" y2="104" stroke="#22d3ee" stroke-width="3"/>
      <rect x="200" y="88" width="240" height="32" fill="rgba(255,46,196,.14)" stroke="#ff2ec4" stroke-width="2.5"/>
      <line x1="320" y1="88" x2="320" y2="120" stroke="#fbbf24" stroke-width="3"/>
      <line x1="80" y1="104" x2="80" y2="92" stroke="#22d3ee" stroke-width="2"/>
      <line x1="560" y1="104" x2="560" y2="92" stroke="#22d3ee" stroke-width="2"/>
      <!-- outlier -->
      <circle cx="596" cy="104" r="5" fill="#ff2ec4"/>
      <text x="596" y="86" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">outlier</text>
      <text x="596" y="148" fill="#b9a3d6" font-size="8.5" font-weight="600" text-anchor="middle">&gt; 1.5 × IQR</text>
      <!-- labels -->
      <text x="120" y="176" fill="#22d3ee" font-size="10" font-weight="800">lower whisker</text>
      <line x1="200" y1="170" x2="135" y2="156" stroke="#22d3ee" stroke-width="1"/>
      <text x="240" y="176" fill="#ff2ec4" font-size="10" font-weight="800">box = IQR (Q1–Q3)</text>
      <line x1="300" y1="170" x2="270" y2="130" stroke="#ff2ec4" stroke-width="1"/>
      <text x="410" y="176" fill="#22d3ee" font-size="10" font-weight="800">upper whisker</text>
      <line x1="455" y1="170" x2="490" y2="148" stroke="#22d3ee" stroke-width="1"/>
      <text x="320" y="204" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">median — middle value · IQR = Q3 − Q1 = middle 50%</text>
      <!-- discrete vs continuous -->
      <line x1="80" y1="240" x2="560" y2="240" stroke="#4ade80" stroke-width="2"/>
      <text x="320" y="264" fill="#4ade80" font-size="12" font-weight="900" text-anchor="middle">WHY CONTINUOUS? — polygenic + environment</text>
      <g font-size="9.5" fill="#b9a3d6" text-anchor="middle">
        <text x="120" y="290">height: many genes</text>
        <text x="120" y="304">+ nutrition → smooth bell curve</text>
        <text x="480" y="290">blood type: one gene,</text>
        <text x="480" y="304">few alleles → discrete groups</text>
      </g>
      <path d="M 200 340 Q 320 330 440 340" stroke="#22d3ee" stroke-width="2" fill="none"/>
      <text x="320" y="360" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">continuous — any value between extremes</text>
      <g font-size="10.5" fill="#ff2ec4" text-anchor="middle" font-weight="800">
        <text x="180" y="396">A</text><text x="260" y="396">B</text><text x="340" y="396">AB</text><text x="420" y="396">O</text>
      </g>
      <line x1="150" y1="404" x2="450" y2="404" stroke="#ff2ec4" stroke-width="2"/>
      <g font-size="9" fill="#b9a3d6" text-anchor="middle">
        <text x="160" y="420">separate</text><text x="440" y="420">categories</text>
      </g>
      <text x="320" y="448" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">discrete = no in-between · continuous = full spectrum</text>
    </svg></body></html>
