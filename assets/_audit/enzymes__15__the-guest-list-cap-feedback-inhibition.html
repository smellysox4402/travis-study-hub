<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VIP chain diagram: threonine enters enzyme 1 threonine deaminase, then passes through four more enzymes and intermediates A B C D to become the end product isoleucine; when isoleucine accumulates it walks back and binds the allosteric switch of enzyme 1, capping the guest list, with a note that this is negative feedback and non-competitive inhibition and intermediates never accumulate">
      <defs><marker id="ah16" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker></defs>
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE GUEST-LIST CAP — FEEDBACK INHIBITION</text>

      <rect x="30" y="70" width="92" height="52" rx="9" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="2"/>
      <text x="76" y="92" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">THREONINE</text>
      <text x="76" y="108" fill="#b9a3d6" font-size="8" text-anchor="middle">initial substrate</text>
      <path d="M 127 96 L 152 96" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah16)" fill="none"/>

      <rect x="158" y="70" width="110" height="52" rx="9" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="213" y="92" fill="#ff2ec4" font-size="9" font-weight="800" text-anchor="middle">ENZYME 1</text>
      <text x="213" y="108" fill="#b9a3d6" font-size="8" text-anchor="middle">threonine deaminase</text>
      <rect x="282" y="70" width="110" height="52" rx="9" fill="rgba(168,85,247,.15)" stroke="#a855f7" stroke-width="2"/>
      <text x="337" y="92" fill="#a855f7" font-size="9" font-weight="800" text-anchor="middle">ENZYMES 2–5</text>
      <text x="337" y="108" fill="#b9a3d6" font-size="8" text-anchor="middle">4 more steps (A–D)</text>
      <path d="M 273 96 L 278 96" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah16)" fill="none"/>
      <path d="M 397 96 L 422 96" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah16)" fill="none"/>

      <rect x="428" y="70" width="110" height="52" rx="9" fill="rgba(74,222,128,.15)" stroke="#4ade80" stroke-width="2"/>
      <text x="483" y="92" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">ISOLEUCINE</text>
      <text x="483" y="108" fill="#b9a3d6" font-size="8" text-anchor="middle">end product</text>
      <text x="280" y="146" fill="#b9a3d6" font-size="9" text-anchor="middle">5 reactions · 5 enzymes · threonine → isoleucine</text>

      <path d="M 483 160 C 483 240, 213 240, 213 160" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>
      <path d="M 213 168 L 213 140" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah16)" fill="none"/>
      <text x="350" y="220" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">END PRODUCT WALKS BACK → ALLOSTERIC SITE OF ENZYME 1</text>
      <text x="350" y="238" fill="#b9a3d6" font-size="9.5" text-anchor="middle">= non-competitive inhibition + negative feedback</text>

      <rect x="120" y="260" width="420" height="58" rx="9" fill="rgba(74,222,128,.08)" stroke="rgba(74,222,128,.4)" stroke-width="1.5"/>
      <text x="330" y="282" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">TOO MUCH ISOLEUCINE → PATHWAY SWITCHED OFF</text>
      <text x="330" y="302" fill="#b9a3d6" font-size="9.5" text-anchor="middle">too little → minimal inhibition → production resumes · intermediates never accumulate</text>
      <text x="330" y="336" fill="#b9a3d6" font-size="10" text-anchor="middle">cap the guest list when the club is full — the first enzyme is the gatekeeper</text>
    </svg></body></html>
