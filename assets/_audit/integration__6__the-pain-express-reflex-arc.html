<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pain reflex arc diagram: drawing pin pierces skin, free sensory nerve ending detects pain, sensory neuron carries impulse into the spinal cord grey matter where a single interneuron relays to a motor neuron, motor neuron makes skeletal muscle contract so the foot lifts, brain receives the signal later">
      <rect width="660" height="380" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE PAIN EXPRESS — REFLEX ARC</text>
      <!-- pin + foot -->
      <polygon points="70,120 90,120 80,170" fill="rgba(251,191,36,.4)" stroke="#fbbf24" stroke-width="2"/>
      <text x="80" y="108" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">PIN</text>
      <rect x="40" y="170" width="90" height="26" rx="8" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="85" y="187" fill="#fbbf24" font-size="9" text-anchor="middle">SKIN</text>
      <text x="85" y="214" fill="#b9a3d6" font-size="8.5" text-anchor="middle">free sensory nerve ending</text>
      <text x="85" y="228" fill="#b9a3d6" font-size="8.5" text-anchor="middle">= pain receptor</text>

      <!-- spinal cord -->
      <rect x="290" y="120" width="80" height="170" rx="12" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2"/>
      <text x="330" y="144" fill="#a855f7" font-size="10" font-weight="900" text-anchor="middle">SPINAL</text>
      <text x="330" y="158" fill="#a855f7" font-size="10" font-weight="900" text-anchor="middle">CORD</text>
      <text x="330" y="196" fill="#ff2ec4" font-size="8.5" font-weight="800" text-anchor="middle">GREY MATTER</text>
      <text x="330" y="210" fill="#b9a3d6" font-size="8.5" text-anchor="middle">single interneuron</text>
      <text x="330" y="224" fill="#b9a3d6" font-size="8.5" text-anchor="middle">relays the signal</text>

      <!-- sensory neuron -->
      <path d="M 135 190 C 200 190 230 200 286 200" stroke="#22d3ee" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <text x="210" y="180" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">SENSORY NEURON</text>
      <text x="210" y="194" fill="#b9a3d6" font-size="8.5" text-anchor="middle">into grey matter</text>

      <!-- interneuron -->
      <circle cx="330" cy="280" r="16" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="277" fill="#ff2ec4" font-size="8" text-anchor="middle">INTER-</text>
      <text x="330" y="288" fill="#ff2ec4" font-size="8" text-anchor="middle">NEURON</text>

      <!-- motor neuron -->
      <path d="M 374 280 C 440 280 470 300 500 330" stroke="#4ade80" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <text x="455" y="270" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">MOTOR NEURON</text>
      <text x="455" y="284" fill="#b9a3d6" font-size="8.5" text-anchor="middle">to effector</text>

      <!-- muscle effector -->
      <rect x="500" y="330" width="120" height="30" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="560" y="349" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">SKELETAL MUSCLE</text>
      <text x="560" y="330" fill="#b9a3d6" font-size="9" text-anchor="middle">contracts → foot lifts ⬆</text>

      <!-- brain detour note -->
      <path d="M 330 120 C 330 60 120 60 120 90" stroke="#b9a3d6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)" fill="none"/>
      <text x="225" y="52" fill="#b9a3d6" font-size="9.5" text-anchor="middle">pain felt AFTER — brain not in the loop</text>

      <!-- bottom -->
      <text x="330" y="372" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Sensory → interneuron → motor = minimum crew for maximum speed</text>
    </svg></body></html>
