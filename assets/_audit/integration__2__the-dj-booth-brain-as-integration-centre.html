<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="brain as DJ booth integration diagram: sensory inputs from eye, ear, skin, taste, smell and internal pressure receptors feed into the brain, which processes, stores memory and sends instructions out to muscles and glands">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE DJ BOOTH — BRAIN AS INTEGRATION CENTRE</text>
      <!-- inputs -->
      <rect x="30" y="60" width="150" height="34" rx="9" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="105" y="81" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">👁 EYES · light</text>
      <rect x="30" y="106" width="150" height="34" rx="9" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="105" y="127" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">👂 EARS · sound</text>
      <rect x="30" y="152" width="150" height="34" rx="9" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="105" y="173" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">👃👅 NOSE · TONGUE</text>
      <rect x="30" y="198" width="150" height="34" rx="9" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="105" y="219" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">🖐 SKIN · touch / temp</text>
      <rect x="30" y="244" width="150" height="44" rx="9" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="105" y="262" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">🫀 INTERNAL</text>
      <text x="105" y="278" fill="#b9a3d6" font-size="9" text-anchor="middle">pressure receptors in vessels</text>

      <!-- arrows in -->
      <path d="M 180 77 L 250 77" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 180 123 L 250 123" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 180 169 L 250 169" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 180 215 L 250 215" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 180 266 L 250 266" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>

      <!-- brain -->
      <ellipse cx="385" cy="170" rx="95" ry="92" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="385" y="140" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">BRAIN</text>
      <text x="385" y="158" fill="#b9a3d6" font-size="9.5" text-anchor="middle">processes the input</text>
      <text x="385" y="174" fill="#b9a3d6" font-size="9.5" text-anchor="middle">stores memory (cerebrum)</text>
      <text x="385" y="190" fill="#b9a3d6" font-size="9.5" text-anchor="middle">makes decisions</text>
      <text x="385" y="206" fill="#b9a3d6" font-size="9.5" text-anchor="middle">learning → memory</text>

      <!-- memory box -->
      <rect x="300" y="272" width="170" height="34" rx="9" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="385" y="293" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">MEMORY STORE · cerebrum</text>
      <path d="M 385 262 L 385 268" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <!-- outputs -->
      <rect x="500" y="106" width="140" height="40" rx="10" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="570" y="123" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">MUSCLES</text>
      <text x="570" y="138" fill="#b9a3d6" font-size="9" text-anchor="middle">contract</text>
      <rect x="500" y="170" width="140" height="40" rx="10" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="570" y="187" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">GLANDS</text>
      <text x="570" y="202" fill="#b9a3d6" font-size="9" text-anchor="middle">secrete</text>
      <path d="M 480 126 L 496 126" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 480 190 L 496 190" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>

      <!-- top note -->
      <text x="330" y="50" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Sensory receptors → brain processes → stores / decides → instructions out to effectors</text>
      <text x="330" y="342" fill="#b9a3d6" font-size="10.5" text-anchor="middle">The cerebrum is the folded upper part of the brain — the seat of learning and memory</text>
    </svg></body></html>
