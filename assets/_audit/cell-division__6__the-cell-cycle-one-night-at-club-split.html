<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of the cell cycle: G1, S phase, G2 and M phase around a circle, with G0 exit and G1/S and G2/M checkpoints">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE CELL CYCLE — ONE NIGHT AT CLUB SPLIT</text>
      <circle cx="320" cy="240" r="150" fill="rgba(168,85,247,.05)" stroke="#a855f7" stroke-width="4"/>
      <line x1="320" y1="90" x2="320" y2="390" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="170" y1="240" x2="470" y2="240" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="320" y="120" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">G1</text>
      <text x="320" y="140" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">growth</text>
      <text x="428" y="240" fill="#22d3ee" font-size="13" font-weight="900" text-anchor="middle">S</text>
      <text x="428" y="260" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">DNA replicates</text>
      <text x="320" y="368" fill="#fbbf24" font-size="13" font-weight="900" text-anchor="middle">G2</text>
      <text x="320" y="388" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">prep for mitosis</text>
      <text x="212" y="240" fill="#4ade80" font-size="13" font-weight="900" text-anchor="middle">M</text>
      <text x="212" y="260" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">mitosis + cytokinesis</text>
      <text x="320" y="232" fill="#f3e8ff" font-size="12" font-weight="800" text-anchor="middle">INTERPHASE</text>
      <text x="320" y="252" fill="#b9a3d6" font-size="10.5" font-weight="700" text-anchor="middle">= G1 + S + G2</text>
      <text x="320" y="270" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">M = the split</text>
      <!-- arrows clockwise -->
      <path d="M 390 148 A 125 125 0 0 1 442 205" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrG)"/>
      <path d="M 445 275 A 125 125 0 0 1 380 342" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrG)"/>
      <path d="M 250 342 A 125 125 0 0 1 195 275" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrG)"/>
      <path d="M 195 205 A 125 125 0 0 1 250 148" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrG)"/>
      <!-- G0 exit -->
      <line x1="320" y1="90" x2="150" y2="72" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrG)"/>
      <text x="85" y="66" fill="#fbbf24" font-size="12.5" font-weight="900">G0</text>
      <text x="85" y="84" fill="#b9a3d6" font-size="9.5" font-weight="700">resting — no division</text>
      <!-- checkpoints -->
      <circle cx="470" cy="240" r="5" fill="#fbbf24"/>
      <text x="510" y="232" fill="#fbbf24" font-size="10" font-weight="800">G1/S CHECKPOINT</text>
      <text x="510" y="248" fill="#b9a3d6" font-size="9" font-weight="700">"ready to copy?"</text>
      <line x1="500" y1="238" x2="476" y2="240" stroke="#fbbf24" stroke-width="1"/>
      <circle cx="170" cy="240" r="5" fill="#fbbf24"/>
      <text x="56" y="232" fill="#fbbf24" font-size="10" font-weight="800">G2/M CHECKPOINT</text>
      <text x="56" y="248" fill="#b9a3d6" font-size="9" font-weight="700">"ready to split?"</text>
      <line x1="116" y1="238" x2="164" y2="240" stroke="#fbbf24" stroke-width="1"/>
      <defs>
        <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#67e8f9"/></marker>
      </defs>
      <text x="320" y="440" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">cyclins switch on CDKs → pass checkpoints → next phase (see Act 9)</text>
    </svg></body></html>
