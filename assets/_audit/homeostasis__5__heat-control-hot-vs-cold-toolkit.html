<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="two panel heat control diagram: left panel hot response with dilated skin arterioles and sweat droplets cooling the skin; right panel cold response with constricted arterioles, shivering muscle, raised hairs and brown fat releasing heat without ATP">
      <rect width="660" height="400" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">HEAT CONTROL — HOT vs COLD TOOLKIT</text>
      <!-- HOT panel -->
      <rect x="20" y="48" width="295" height="310" rx="12" fill="rgba(255,46,196,.05)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="167" y="64" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">HOT ⬆ → LOSE HEAT</text>
      <!-- skin -->
      <rect x="45" y="110" width="245" height="70" rx="10" fill="rgba(255,46,196,.04)" stroke="#b9a3d6" stroke-width="1.5"/>
      <text x="167" y="128" fill="#b9a3d6" font-size="10" text-anchor="middle">skin surface — hot &amp; pink</text>
      <!-- wide arteriole -->
      <ellipse cx="120" cy="210" rx="60" ry="14" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="2"/>
      <text x="120" y="214" fill="#22d3ee" font-size="9.5" text-anchor="middle">arteriole DILATED</text>
      <text x="120" y="240" fill="#b9a3d6" font-size="10" text-anchor="middle">more blood to skin →</text>
      <text x="120" y="256" fill="#b9a3d6" font-size="10" text-anchor="middle">heat radiates away</text>
      <!-- sweat -->
      <circle cx="230" cy="150" r="5" fill="#22d3ee"/>
      <circle cx="248" cy="140" r="5" fill="#22d3ee"/>
      <circle cx="266" cy="152" r="5" fill="#22d3ee"/>
      <text x="240" y="180" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">sweat evaporates</text>
      <text x="240" y="196" fill="#b9a3d6" font-size="9.5" text-anchor="middle">latent heat of vaporisation</text>
      <text x="167" y="300" fill="#ff2ec4" font-size="10.5" font-weight="700" text-anchor="middle">pink skin · sweating</text>
      <text x="167" y="318" fill="#b9a3d6" font-size="9.5" text-anchor="middle">sweat: up to 2 L per hour</text>
      <text x="167" y="334" fill="#b9a3d6" font-size="9.5" text-anchor="middle">sodium left on skin (salty sweat)</text>
      <!-- COLD panel -->
      <rect x="345" y="48" width="295" height="310" rx="12" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2"/>
      <text x="492" y="64" fill="#22d3ee" font-size="13" font-weight="900" text-anchor="middle">COLD ⬇ → KEEP HEAT</text>
      <!-- skin -->
      <rect x="370" y="110" width="245" height="70" rx="10" fill="rgba(34,211,238,.04)" stroke="#b9a3d6" stroke-width="1.5"/>
      <text x="492" y="128" fill="#b9a3d6" font-size="10" text-anchor="middle">skin surface — pale &amp; cold</text>
      <!-- narrow arteriole -->
      <ellipse cx="445" cy="210" rx="30" ry="9" fill="rgba(168,85,247,.15)" stroke="#a855f7" stroke-width="2"/>
      <text x="445" y="214" fill="#a855f7" font-size="9.5" text-anchor="middle">CONSTRICTED</text>
      <text x="445" y="240" fill="#b9a3d6" font-size="10" text-anchor="middle">less blood to skin →</text>
      <text x="445" y="256" fill="#b9a3d6" font-size="10" text-anchor="middle">less heat lost</text>
      <!-- shivering -->
      <text x="560" y="180" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">shivering ⚡⚡</text>
      <text x="560" y="196" fill="#b9a3d6" font-size="9.5" text-anchor="middle">muscle contraction heats</text>
      <!-- hairs -->
      <line x1="410" y1="86" x2="408" y2="72" stroke="#fbbf24" stroke-width="2"/>
      <line x1="492" y1="86" x2="492" y2="72" stroke="#fbbf24" stroke-width="2"/>
      <line x1="574" y1="86" x2="576" y2="72" stroke="#fbbf24" stroke-width="2"/>
      <text x="492" y="100" fill="#b9a3d6" font-size="9.5" text-anchor="middle">hairs raised (piloerection)</text>
      <text x="492" y="300" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">pale skin · shivering · goosebumps</text>
      <text x="492" y="318" fill="#b9a3d6" font-size="9.5" text-anchor="middle">brown fat: uncoupled respiration</text>
      <text x="492" y="334" fill="#b9a3d6" font-size="9.5" text-anchor="middle">no ATP made — ALL energy → heat</text>
      <!-- bottom note -->
      <text x="330" y="386" fill="#b9a3d6" font-size="10.5" text-anchor="middle">New-borns &amp; hibernators rely on brown fat; adults keep a little around the neck and shoulders</text>
    </svg></body></html>
