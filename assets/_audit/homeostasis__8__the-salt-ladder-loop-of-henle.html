<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="countercurrent multiplier diagram of the loop of henle: descending limb loses water to the salty medulla, ascending limb actively pumps sodium out and is impermeable to water, medulla gradient builds from 300 to 1200 milliosmoles, vasa recta countercurrent protects the gradient">
      <rect width="660" height="440" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE SALT LADDER — LOOP OF HENLE</text>
      <!-- medulla gradient band -->
      <rect x="420" y="60" width="200" height="330" rx="10" fill="rgba(34,211,238,.04)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="520" y="80" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">MEDULLA SALTINESS</text>
      <text x="520" y="120" fill="#4ade80" font-size="11" text-anchor="middle">300 mOsm</text>
      <text x="520" y="220" fill="#fbbf24" font-size="11" text-anchor="middle">~750 mOsm</text>
      <text x="520" y="360" fill="#ff2ec4" font-size="11" text-anchor="middle">~1200 mOsm</text>
      <!-- descending limb -->
      <path d="M 230 70 C 230 200 190 300 170 350" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
      <text x="110" y="120" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">DESCENDING</text>
      <text x="110" y="138" fill="#b9a3d6" font-size="9.5" text-anchor="middle">water OUT (leaves),</text>
      <text x="110" y="152" fill="#b9a3d6" font-size="9.5" text-anchor="middle">salts stay → filtrate</text>
      <text x="110" y="166" fill="#b9a3d6" font-size="9.5" text-anchor="middle">gets saltier</text>
      <!-- ascending limb -->
      <path d="M 170 350 C 150 300 110 200 110 70" fill="none" stroke="#ff2ec4" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="240" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">ASCENDING</text>
      <text x="30" y="258" fill="#b9a3d6" font-size="9.5" text-anchor="middle">Na⁺ pumped OUT (active),</text>
      <text x="30" y="272" fill="#b9a3d6" font-size="9.5" text-anchor="middle">water can't follow →</text>
      <text x="30" y="286" fill="#b9a3d6" font-size="9.5" text-anchor="middle">filtrate gets dilute</text>
      <!-- Na+ pumps -->
      <circle cx="200" cy="200" r="8" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="215" y="204" fill="#ff2ec4" font-size="9" font-weight="800">Na⁺</text>
      <circle cx="180" cy="260" r="8" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="195" y="264" fill="#ff2ec4" font-size="9" font-weight="800">Na⁺</text>
      <circle cx="150" cy="320" r="8" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="165" y="324" fill="#ff2ec4" font-size="9" font-weight="800">Na⁺</text>
      <!-- water leaving descending -->
      <circle cx="270" cy="180" r="6" fill="rgba(34,211,238,.3)" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="290" cy="260" r="6" fill="rgba(34,211,238,.3)" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="280" cy="330" r="6" fill="rgba(34,211,238,.3)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="310" y="200" fill="#22d3ee" font-size="9.5" text-anchor="middle">H₂O out</text>
      <!-- vasa recta -->
      <path d="M 370 70 L 370 400" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 4"/>
      <text x="395" y="240" fill="#fbbf24" font-size="9.5" text-anchor="middle">vasa recta (countercurrent,</text>
      <text x="395" y="256" fill="#fbbf24" font-size="9.5" text-anchor="middle">keeps gradient intact)</text>
      <!-- multiplier note -->
      <text x="330" y="420" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Why "multiplier": salt pumped out of the ascending limb pulls water out of the descending limb → saltier filtrate → more salt pumped… each cycle amplifies the gradient</text>
    </svg></body></html>
