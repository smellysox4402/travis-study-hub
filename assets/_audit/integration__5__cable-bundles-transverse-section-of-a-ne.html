<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="transverse section of a nerve showing the protective sheath around a bundle of nerve fibres, with myelinated fibres shown as dark rings around axons and unmyelinated fibres shown as plain circles, plus a legend comparing conduction speed">
      <rect width="660" height="380" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">CABLE BUNDLES — TRANSVERSE SECTION OF A NERVE</text>
      <!-- outer sheath -->
      <circle cx="250" cy="200" r="120" fill="rgba(168,85,247,.05)" stroke="#a855f7" stroke-width="3"/>
      <text x="250" y="86" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">PROTECTIVE SHEATH</text>
      <text x="250" y="102" fill="#b9a3d6" font-size="9" text-anchor="middle">wraps the whole bundle</text>
      <!-- myelinated fibres -->
      <circle cx="210" cy="180" r="24" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="6"/>
      <circle cx="210" cy="180" r="12" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="280" cy="160" r="22" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="5.5"/>
      <circle cx="280" cy="160" r="11" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="240" cy="240" r="20" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="5"/>
      <circle cx="240" cy="240" r="10" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="2"/>
      <!-- unmyelinated fibres -->
      <circle cx="310" cy="220" r="14" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="2"/>
      <circle cx="190" cy="230" r="12" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="2"/>
      <circle cx="330" cy="180" r="10" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="2"/>
      <!-- labels -->
      <text x="120" y="300" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">MYELINATED</text>
      <text x="120" y="316" fill="#b9a3d6" font-size="9" text-anchor="middle">dark myelin ring around axon</text>
      <text x="120" y="330" fill="#b9a3d6" font-size="9" text-anchor="middle">insulated → FAST conduction</text>
      <text x="390" y="300" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">UNMYELINATED</text>
      <text x="390" y="316" fill="#b9a3d6" font-size="9" text-anchor="middle">no sheath around axon</text>
      <text x="390" y="330" fill="#b9a3d6" font-size="9" text-anchor="middle">SLOWER conduction</text>
      <!-- facts -->
      <text x="560" y="120" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">SIZE RANGE</text>
      <text x="560" y="138" fill="#b9a3d6" font-size="9" text-anchor="middle">sciatic ~20 mm wide</text>
      <text x="560" y="154" fill="#b9a3d6" font-size="9" text-anchor="middle">optic: 0.77 – 1.7 M fibres</text>
      <text x="560" y="170" fill="#b9a3d6" font-size="9" text-anchor="middle">small nerves &lt; 100 fibres</text>
      <text x="560" y="196" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">MIXED BUNDLES</text>
      <text x="560" y="214" fill="#b9a3d6" font-size="9" text-anchor="middle">most nerves: sensory + motor</text>
      <text x="560" y="230" fill="#b9a3d6" font-size="9" text-anchor="middle">optic = sensory only</text>
      <text x="560" y="246" fill="#b9a3d6" font-size="9" text-anchor="middle">oculomotor = motor only</text>
      <text x="330" y="366" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Myelin sheath = Schwann cell wrapping · speeds up impulse conduction</text>
    </svg></body></html>
