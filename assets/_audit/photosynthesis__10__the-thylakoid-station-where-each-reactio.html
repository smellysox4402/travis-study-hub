<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="chloroplast cutaway showing the thylakoid system: grana are stacks of disc thylakoids, stroma lamellae connect the stacks, photosystem II and photolysis are found in the grana while photosystem I and ATP synthase sit in the stroma lamellae, and the Calvin cycle runs in the stroma fluid">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <defs>
        <marker id="arA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#22d3ee"/></marker>
      </defs>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE THYLAKOID STATION — WHERE EACH REACTION LIVES</text>

      <!-- chloroplast envelope -->
      <rect x="40" y="44" width="580" height="256" rx="18" fill="rgba(255,46,196,0.04)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="330" y="64" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">CHLOROPLAST</text>
      <rect x="56" y="80" width="548" height="200" rx="12" fill="none" stroke="rgba(185,163,214,0.4)" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- granum 1 -->
      <ellipse cx="140" cy="120" rx="52" ry="13" fill="rgba(34,211,238,0.22)" stroke="#22d3ee" stroke-width="2"/>
      <ellipse cx="140" cy="146" rx="52" ry="13" fill="rgba(34,211,238,0.22)" stroke="#22d3ee" stroke-width="2"/>
      <ellipse cx="140" cy="172" rx="52" ry="13" fill="rgba(34,211,238,0.22)" stroke="#22d3ee" stroke-width="2"/>
      <ellipse cx="140" cy="198" rx="52" ry="13" fill="rgba(34,211,238,0.22)" stroke="#22d3ee" stroke-width="2"/>

      <!-- granum 2 -->
      <ellipse cx="330" cy="120" rx="52" ry="13" fill="rgba(34,211,238,0.22)" stroke="#22d3ee" stroke-width="2"/>
      <ellipse cx="330" cy="146" rx="52" ry="13" fill="rgba(34,211,238,0.22)" stroke="#22d3ee" stroke-width="2"/>
      <ellipse cx="330" cy="172" rx="52" ry="13" fill="rgba(34,211,238,0.22)" stroke="#22d3ee" stroke-width="2"/>
      <ellipse cx="330" cy="198" rx="52" ry="13" fill="rgba(34,211,238,0.22)" stroke="#22d3ee" stroke-width="2"/>

      <!-- stroma lamellae -->
      <path d="M 192 120 L 278 120" stroke="#a855f7" stroke-width="4" fill="none"/>
      <path d="M 192 172 L 278 172" stroke="#a855f7" stroke-width="4" fill="none"/>
      <path d="M 382 146 L 468 146" stroke="#a855f7" stroke-width="4" fill="none"/>
      <text x="235" y="106" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">grana — stacks of disc thylakoids</text>
      <text x="235" y="232" text-anchor="middle" fill="#a855f7" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">stroma lamellae (unstacked) connect the stacks</text>

      <!-- zoning labels with arrows -->
      <path d="M 456 130 L 420 148" stroke="#22d3ee" stroke-width="2" marker-end="url(#arA)" fill="none"/>
      <text x="468" y="112" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">PSII + photolysis</text>
      <text x="468" y="128" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">concentrated in the grana</text>
      <path d="M 468 176 L 452 168" stroke="#a855f7" stroke-width="2" marker-end="url(#arA)" fill="none"/>
      <text x="480" y="166" fill="#a855f7" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">PSI + ATP synthase</text>
      <text x="480" y="182" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">in the stroma lamellae</text>
      <text x="480" y="210" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">Calvin cycle</text>
      <text x="480" y="226" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">runs in the stroma fluid</text>
      <text x="480" y="244" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">tiny lumen volume</text>
      <text x="480" y="260" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">→ steep H⁺ gradient from few protons</text>

      <text x="330" y="282" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">one membrane = the whole light-dependent factory: absorb light · split water · pump protons · make ATP + reduced NADP</text>
      <text x="330" y="302" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">cyanobacteria: thylakoids attached to the plasma membrane · plants and algae: grana + stroma lamellae</text>
      <text x="330" y="322" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">ATP + reduced NADP diffuse into the stroma; ADP + NADP diffuse back — the two halves trade constantly</text>
    </svg></body></html>
