<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="photolysis in photosystem II: the oxygen-evolving complex splits two water molecules into oxygen gas, four protons released into the thylakoid space, and four electrons that replace the electrons P680 lost">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <defs>
        <marker id="arG3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ade80"/></marker>
        <marker id="arC3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker>
        <marker id="arP3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff2ec4"/></marker>
        <marker id="arY3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
      </defs>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE WATER SPLITTER — PHOTOLYSIS IN PSII</text>

      <!-- thylakoid cross-section -->
      <rect x="60" y="46" width="540" height="58" rx="10" fill="rgba(34,211,238,0.07)" stroke="#22d3ee" stroke-width="2"/>
      <text x="595" y="80" text-anchor="end" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">thylakoid space (lumen)</text>
      <rect x="60" y="104" width="540" height="30" fill="rgba(168,85,247,0.18)" stroke="#a855f7" stroke-width="2"/>
      <text x="600" y="124" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">membrane</text>
      <rect x="60" y="134" width="540" height="180" rx="10" fill="rgba(74,222,128,0.04)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="600" y="154" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">stroma</text>

      <!-- OEC -->
      <circle cx="150" cy="119" r="19" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="150" y="124" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800">OEC</text>
      <text x="150" y="84" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">oxygen-evolving</text>
      <text x="150" y="98" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">complex</text>

      <!-- water in -->
      <rect x="60" y="286" width="110" height="38" rx="8" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="115" y="300" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">2H₂O in</text>
      <text x="115" y="316" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9">from the soil via xylem</text>
      <path d="M 115 286 L 140 140" fill="none" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arC3)"/>

      <!-- electrons to P680 -->
      <path d="M 169 119 L 300 119" fill="none" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#arP3)"/>
      <text x="300" y="96" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">4e⁻ replace P680's lost electrons</text>

      <!-- protons to lumen -->
      <path d="M 185 104 L 185 84" fill="none" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arC3)"/>
      <text x="330" y="60" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">4H⁺ released into the thylakoid space — feeds the proton gradient</text>

      <!-- O2 out -->
      <path d="M 150 100 L 150 68" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arG3)"/>
      <text x="200" y="78" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">O₂ waste — diffuses out</text>

      <text x="330" y="208" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="900">2H₂O → O₂ + 4H⁺ + 4e⁻</text>
      <text x="330" y="228" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">only happens in the light — P680 must first be excited to pull the electrons</text>
      <text x="330" y="252" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">Early cyanobacteria flooded the oceans with this O₂ → iron rusted into banded iron formations</text>
      <text x="330" y="272" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">then the atmosphere went oxygen-rich → aerobic respiration → complex life</text>
      <text x="330" y="300" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">every O₂ in your breath was split from water by a P680</text>
    </svg></body></html>
