<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 440" role="img" aria-label="The four quantum numbers as an electron address book: n principal shell with values 1 2 3 4, l subshell shape with 0 s sphere 1 p dumbbell 2 d 3 f, ml magnetic orientation from minus l to plus l, ms spin plus or minus half, with a worked address for nitrogen's last 2p electron n equals 2 l equals 1 ml equals minus 1 ms equals plus half">
      <rect x="0" y="0" width="640" height="440" rx="18" fill="#1d0f33"/>
      <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#f3e8ff" font-family="Segoe UI">THE ADDRESS BOOK — ONE ELECTRON, ONE POSTCODE</text>

      <rect x="20" y="46" width="290" height="126" rx="10" fill="#150a26" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="36" y="68" font-size="13" font-weight="800" fill="#22d3ee" font-family="Segoe UI">n — PRINCIPAL</text>
      <text x="36" y="90" font-size="11" fill="#b9a3d6" font-family="Segoe UI">the shell: energy level + distance</text>
      <text x="36" y="114" font-size="14" font-weight="800" fill="#ff2ec4" font-family="Segoe UI">1, 2, 3, 4, …</text>
      <text x="36" y="142" font-size="10" fill="#b9a3d6" font-family="Segoe UI">higher n → higher energy, further out</text>

      <rect x="330" y="46" width="290" height="126" rx="10" fill="#150a26" stroke="#a855f7" stroke-width="1.2"/>
      <text x="346" y="68" font-size="13" font-weight="800" fill="#a855f7" font-family="Segoe UI">l — ANGULAR MOMENTUM</text>
      <text x="346" y="90" font-size="11" fill="#b9a3d6" font-family="Segoe UI">the subshell: SHAPE of the orbital</text>
      <text x="346" y="114" font-size="12" font-weight="800" fill="#f3e8ff" font-family="Segoe UI">0 → s (sphere) · 1 → p (dumbbell)</text>
      <text x="346" y="142" font-size="10" fill="#b9a3d6" font-family="Segoe UI">2 → d · 3 → f · l runs 0 … n − 1</text>

      <rect x="20" y="184" width="290" height="126" rx="10" fill="#150a26" stroke="#4ade80" stroke-width="1.2"/>
      <text x="36" y="206" font-size="13" font-weight="800" fill="#4ade80" font-family="Segoe UI">mₗ — MAGNETIC</text>
      <text x="36" y="228" font-size="11" fill="#b9a3d6" font-family="Segoe UI">orientation of the orbital in 3D space</text>
      <text x="36" y="252" font-size="14" font-weight="800" fill="#ff2ec4" font-family="Segoe UI">−l … 0 … +l</text>
      <text x="36" y="280" font-size="10" fill="#b9a3d6" font-family="Segoe UI">orbitals per subshell: s 1 · p 3 · d 5 · f 7</text>

      <rect x="330" y="184" width="290" height="126" rx="10" fill="#150a26" stroke="#ff2ec4" stroke-width="1.2"/>
      <text x="346" y="206" font-size="13" font-weight="800" fill="#ff2ec4" font-family="Segoe UI">mₛ — SPIN</text>
      <text x="346" y="228" font-size="11" fill="#b9a3d6" font-family="Segoe UI">the electron's intrinsic spin</text>
      <text x="346" y="252" font-size="14" font-weight="800" fill="#22d3ee" font-family="Segoe UI">+½ (up) · −½ (down)</text>
      <text x="346" y="280" font-size="10" fill="#b9a3d6" font-family="Segoe UI">Pauli: no two electrons share one orbital spin</text>

      <rect x="20" y="322" width="600" height="88" rx="10" fill="#150a26" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="320" y="345" text-anchor="middle" font-size="12" font-weight="800" fill="#fbbf24" font-family="Segoe UI">WORKED ADDRESS — the last electron of nitrogen (2p³)</text>
      <text x="320" y="371" text-anchor="middle" font-size="15" font-weight="800" fill="#ff2ec4" font-family="Segoe UI">n = 2 · l = 1 · mₗ = −1 · mₛ = +½</text>
      <text x="320" y="392" text-anchor="middle" font-size="11" fill="#b9a3d6" font-family="Segoe UI">every electron in the atom carries a unique 4-number postcode</text>
    </svg></body></html>
