<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of the ABO blood group system: three alleles IA IB and i producing four phenotypes A B AB and O with red blood cell glycoproteins and transfusion compatibility">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">ABO — 3 ALLELES, 4 BLOOD TYPES</text>
      <text x="320" y="48" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">one gene, three alleles in the gene pool: Iᴬ (A glycoprotein) · Iᴮ (B) · i (none)</text>
      <!-- 4 phenotype rows -->
      <g font-size="10.5" font-weight="800">
        <rect x="60" y="68" width="120" height="52" rx="8" fill="rgba(255,46,196,.10)" stroke="#ff2ec4" stroke-width="1.5"/>
        <text x="120" y="90" fill="#ff2ec4" text-anchor="middle">TYPE A</text>
        <text x="120" y="108" fill="#b9a3d6" font-size="9.5" font-weight="600" text-anchor="middle">IᴬIᴬ or Iᴬi</text>
        <rect x="60" y="128" width="120" height="52" rx="8" fill="rgba(34,211,238,.10)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="120" y="150" fill="#22d3ee" text-anchor="middle">TYPE B</text>
        <text x="120" y="168" fill="#b9a3d6" font-size="9.5" font-weight="600" text-anchor="middle">IᴮIᴮ or Iᴮi</text>
        <rect x="60" y="188" width="120" height="52" rx="8" fill="rgba(251,191,36,.10)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="120" y="210" fill="#fbbf24" text-anchor="middle">TYPE AB</text>
        <text x="120" y="228" fill="#b9a3d6" font-size="9.5" font-weight="600" text-anchor="middle">IᴬIᴮ — both show</text>
        <rect x="60" y="248" width="120" height="52" rx="8" fill="rgba(168,85,247,.10)" stroke="#a855f7" stroke-width="1.5"/>
        <text x="120" y="270" fill="#a855f7" text-anchor="middle">TYPE O</text>
        <text x="120" y="288" fill="#b9a3d6" font-size="9.5" font-weight="600" text-anchor="middle">ii — neither</text>
      </g>
      <!-- RBC icons -->
      <g>
        <circle cx="240" cy="94" r="17" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="2"/>
        <text x="240" y="98" fill="#ff2ec4" font-size="11" font-weight="900" text-anchor="middle">A</text>
        <text x="265" y="94" fill="#b9a3d6" font-size="9" font-weight="600">anti-B ab</text>
        <circle cx="240" cy="154" r="17" fill="rgba(34,211,238,.12)" stroke="#22d3ee" stroke-width="2"/>
        <text x="240" y="158" fill="#22d3ee" font-size="11" font-weight="900" text-anchor="middle">B</text>
        <text x="265" y="154" fill="#b9a3d6" font-size="9" font-weight="600">anti-A ab</text>
        <circle cx="240" cy="214" r="17" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="2"/>
        <text x="230" y="210" fill="#fbbf24" font-size="10" font-weight="900">A</text>
        <text x="240" y="222" fill="#fbbf24" font-size="10" font-weight="900">B</text>
        <text x="265" y="214" fill="#b9a3d6" font-size="9" font-weight="600">no antibodies</text>
        <circle cx="240" cy="274" r="17" fill="rgba(168,85,247,.12)" stroke="#a855f7" stroke-width="2"/>
        <text x="265" y="274" fill="#b9a3d6" font-size="9" font-weight="600">anti-A + anti-B</text>
      </g>
      <!-- codominance note -->
      <rect x="330" y="68" width="250" height="88" rx="10" fill="rgba(251,191,36,.06)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="455" y="90" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">CODOMINANCE</text>
      <text x="455" y="108" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">IᴬIᴮ shows BOTH glycoproteins</text>
      <text x="455" y="122" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">— a dual phenotype, not a blend</text>
      <text x="455" y="140" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">→ different from incomplete dominance</text>
      <rect x="330" y="168" width="250" height="88" rx="10" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="455" y="190" fill="#22d3ee" font-size="11" font-weight="900" text-anchor="middle">INCOMPLETE DOMINANCE</text>
      <text x="455" y="208" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">Mirabilis jalapa flowers: CᴿCᴿ red,</text>
      <text x="455" y="222" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">CᴿCᵂ pink (intermediate), CᵂCᵂ white</text>
      <text x="455" y="240" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">one copy = half the pigment</text>
      <!-- donation strip -->
      <rect x="80" y="330" width="480" height="60" rx="10" fill="rgba(74,222,128,.06)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="320" y="354" fill="#4ade80" font-size="11.5" font-weight="900" text-anchor="middle">TRANSFUSION — matching the tickets</text>
      <text x="320" y="374" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">O = universal donor (no glycoproteins) · AB = universal recipient (no antibodies)</text>
      <text x="320" y="408" fill="#ff2ec4" font-size="11" font-weight="900" text-anchor="middle">antibodies form against glycoproteins you DON'T have</text>
      <text x="320" y="430" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">wrong type → agglutination (clumping) of donated red cells</text>
    </svg></body></html>
