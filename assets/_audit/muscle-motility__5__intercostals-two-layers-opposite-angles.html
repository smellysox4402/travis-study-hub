<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of intercostal muscles: external layer lifting ribs for inhalation, internal layer lowering ribs for exhalation">
      <rect width="640" height="380" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">INTERCOSTALS — TWO LAYERS, OPPOSITE ANGLES</text>
      <!-- ribs -->
      <g stroke="#b9a3d6" stroke-width="8" fill="none" stroke-linecap="round">
        <path d="M 60 70 Q 170 40 300 55"/>
        <path d="M 60 130 Q 170 100 300 115"/>
        <path d="M 60 190 Q 170 160 300 175"/>
      </g>
      <!-- external fibres (down-left) -->
      <g stroke="#22d3ee" stroke-width="4" opacity=".9" stroke-linecap="round">
        <line x1="120" y1="88" x2="230" y2="118"/>
        <line x1="185" y1="78" x2="290" y2="108"/>
        <line x1="120" y1="148" x2="230" y2="178"/>
        <line x1="185" y1="138" x2="290" y2="168"/>
      </g>
      <!-- internal fibres (down-right) -->
      <g stroke="#ff2ec4" stroke-width="4" opacity=".55" stroke-linecap="round">
        <line x1="170" y1="86" x2="80" y2="122"/>
        <line x1="240" y1="76" x2="150" y2="112"/>
        <line x1="170" y1="146" x2="80" y2="182"/>
        <line x1="240" y1="136" x2="150" y2="172"/>
      </g>
      <!-- arrows up -->
      <g stroke="#67e8f9" stroke-width="3" fill="none">
        <path d="M 330 110 L 330 60 M 326 64 L 330 56 L 334 64"/>
        <path d="M 380 130 L 380 80 M 376 84 L 380 76 L 384 84"/>
        <path d="M 430 150 L 430 100 M 426 104 L 430 96 L 434 104"/>
      </g>
      <text x="448" y="58" fill="#67e8f9" font-size="11.5" font-weight="800">Ribs UP &amp; OUT →</text>
      <text x="448" y="74" fill="#67e8f9" font-size="11.5" font-weight="800">volume ↑ = inhale</text>
      <!-- labels -->
      <line x1="98" y1="96" x2="70" y2="80" stroke="#22d3ee" stroke-width="1"/>
      <text x="30" y="78" fill="#22d3ee" font-size="11" font-weight="800">EXTERNAL</text>
      <text x="30" y="98" fill="#22d3ee" font-size="11" font-weight="800">(contracts → inhale)</text>
      <line x1="96" y1="110" x2="64" y2="126" stroke="#ff2ec4" stroke-width="1"/>
      <text x="28" y="138" fill="#ff2ec4" font-size="11" font-weight="800">INTERNAL</text>
      <text x="28" y="158" fill="#ff2ec4" font-size="11" font-weight="800">(contracts → exhale)</text>
      <text x="320" y="240" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">fibre angle decides the direction of rib movement</text>
      <text x="320" y="260" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">contracting one layer stretches the other → PE stored in titin</text>
      <text x="320" y="296" fill="#fbbf24" font-size="11.5" font-weight="800" text-anchor="middle">external ↑ up-&-out (in) · internal ↓ down-&-in (out)</text>
    </svg></body></html>
