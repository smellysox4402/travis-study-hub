<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sensory and motor pathway diagram: receptor in the foot sends signal up a sensory neuron to the spinal cord and brain, motor output from the cerebral hemispheres travels down motor neurons to skeletal muscle causing contraction">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">WIRED MICS — SENSORY IN, MOTOR OUT</text>
      <!-- brain -->
      <ellipse cx="330" cy="86" rx="80" ry="44" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="330" y="84" fill="#ff2ec4" font-size="11" font-weight="900" text-anchor="middle">CEREBRAL HEMISPHERES</text>
      <text x="330" y="100" fill="#b9a3d6" font-size="9" text-anchor="middle">primary motor cortex starts</text>
      <text x="330" y="113" fill="#b9a3d6" font-size="9" text-anchor="middle">the voluntary signal</text>

      <!-- spinal cord -->
      <rect x="305" y="160" width="50" height="130" rx="10" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2"/>
      <text x="330" y="185" fill="#a855f7" font-size="9" font-weight="800" text-anchor="middle">SPINAL</text>
      <text x="330" y="197" fill="#a855f7" font-size="9" font-weight="800" text-anchor="middle">CORD</text>
      <text x="330" y="236" fill="#b9a3d6" font-size="8.5" text-anchor="middle">grey matter:</text>
      <text x="330" y="249" fill="#b9a3d6" font-size="8.5" text-anchor="middle">motor neuron</text>
      <text x="330" y="262" fill="#b9a3d6" font-size="8.5" text-anchor="middle">cell bodies</text>

      <!-- sensory side -->
      <path d="M 130 300 L 130 240 C 130 220 250 200 300 200" stroke="#22d3ee" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <rect x="40" y="300" width="150" height="40" rx="10" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="2"/>
      <text x="115" y="316" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">RECEPTOR (foot)</text>
      <text x="115" y="332" fill="#b9a3d6" font-size="8.5" text-anchor="middle">nerve ending / receptor cell</text>
      <text x="180" y="282" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">SENSORY NEURON · afferent</text>
      <text x="180" y="296" fill="#b9a3d6" font-size="9" text-anchor="middle">input → CNS · axon up to ~1 m</text>

      <!-- motor side -->
      <path d="M 355 200 C 400 200 480 220 500 300" stroke="#4ade80" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <path d="M 355 230 L 400 230" stroke="#4ade80" stroke-width="3" fill="none"/>
      <text x="470" y="250" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">MOTOR NEURON · efferent</text>
      <text x="470" y="264" fill="#b9a3d6" font-size="9" text-anchor="middle">output → muscle</text>
      <rect x="440" y="300" width="160" height="40" rx="10" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="520" y="316" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">SKELETAL MUSCLE</text>
      <text x="520" y="332" fill="#b9a3d6" font-size="8.5" text-anchor="middle">fibres contract · or gland secretes</text>

      <!-- descending path from brain -->
      <path d="M 330 130 L 330 156" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="372" y="148" fill="#ff2ec4" font-size="9" text-anchor="middle">↓ motor output</text>

      <!-- ascending note -->
      <text x="330" y="346" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Sensory = in (afferent) · Motor = out (efferent) · two neurons relay the voluntary motor signal</text>
    </svg></body></html>
