<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="thylakoid cross-section showing chemiosmosis: photosystem II passes electrons along an electron transport chain that pumps protons into the thylakoid space, photosystem I reduces NADP to reduced NADP, and protons flowing back through ATP synthase drive ATP production">
      <rect x="0" y="0" width="660" height="360" rx="14" fill="#150a26"/>
      <defs>
        <marker id="arC4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker>
        <marker id="arP4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff2ec4"/></marker>
        <marker id="arG4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ade80"/></marker>
        <marker id="arY4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
      </defs>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE PROTON RIVER — CHEMIOSMOSIS AND NADP</text>

      <!-- thylakoid -->
      <rect x="60" y="48" width="540" height="66" rx="10" fill="rgba(34,211,238,0.07)" stroke="#22d3ee" stroke-width="2"/>
      <text x="600" y="70" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">thylakoid space</text>
      <rect x="60" y="114" width="540" height="26" fill="rgba(168,85,247,0.18)" stroke="#a855f7" stroke-width="2"/>
      <rect x="60" y="140" width="540" height="196" rx="10" fill="rgba(74,222,128,0.04)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="600" y="250" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">stroma</text>

      <!-- PSII -->
      <rect x="90" y="96" width="76" height="62" rx="10" fill="rgba(255,46,196,0.12)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="128" y="118" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">PSII</text>
      <text x="128" y="136" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10">P680</text>
      <path d="M 110 48 L 110 92" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arY4)"/>
      <path d="M 146 48 L 146 92" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arY4)"/>
      <text x="128" y="40" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800">light</text>

      <!-- ETC carriers -->
      <circle cx="230" cy="127" r="10" fill="rgba(168,85,247,0.4)" stroke="#a855f7" stroke-width="2"/>
      <circle cx="285" cy="127" r="10" fill="rgba(168,85,247,0.4)" stroke="#a855f7" stroke-width="2"/>
      <circle cx="340" cy="127" r="10" fill="rgba(168,85,247,0.4)" stroke="#a855f7" stroke-width="2"/>
      <path d="M 166 127 L 216 127" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arP4)"/>
      <path d="M 240 127 L 271 127" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arP4)"/>
      <path d="M 295 127 L 326 127" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arP4)"/>
      <text x="240" y="116" fill="#a855f7" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">e⁻</text>
      <text x="285" y="104" text-anchor="middle" fill="#a855f7" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">electron transport chain</text>
      <text x="285" y="88" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">plastoquinone → cytochrome b₆f → plastocyanin</text>

      <!-- proton pumping -->
      <path d="M 230 140 L 230 120" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arC4)"/>
      <path d="M 285 140 L 285 120" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arC4)"/>
      <path d="M 340 140 L 340 120" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arC4)"/>
      <text x="285" y="168" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">H⁺ pumped into the thylakoid space</text>

      <!-- PSI -->
      <rect x="400" y="96" width="76" height="62" rx="10" fill="rgba(255,46,196,0.12)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="438" y="118" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">PSI</text>
      <text x="438" y="136" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10">P700</text>
      <path d="M 350 127 L 396 127" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arP4)"/>

      <!-- NADP reductase -->
      <rect x="470" y="162" width="130" height="36" rx="8" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="2"/>
      <text x="535" y="185" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">NADP reductase</text>
      <path d="M 438 158 L 480 172" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arG4)"/>
      <text x="450" y="172" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">2e⁻</text>
      <text x="535" y="152" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">NADP + 2e⁻ + H⁺ → reduced NADP</text>

      <!-- ATP synthase -->
      <rect x="560" y="96" width="66" height="62" rx="10" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="593" y="120" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800">ATP</text>
      <text x="593" y="136" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800">synthase</text>
      <path d="M 593 114 L 593 140" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arY4)"/>
      <text x="593" y="108" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">H⁺ flow</text>
      <text x="593" y="212" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">ADP + Pi → ATP</text>

      <text x="330" y="248" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">the proton gradient is the proton motive force — small lumen volume means few protons make a big gradient</text>
      <text x="330" y="268" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">non-cyclic: PSII → chain → PSI → NADP (makes ATP + reduced NADP)</text>
      <text x="330" y="288" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">cyclic: PSI's electrons loop back to the chain — ATP alone, no reduced NADP</text>
      <text x="330" y="312" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">Jagendorf's acid-bath experiment: thylakoids soaked in acid, then shifted to ADP in the dark, made ATP — proof the gradient drives the enzyme</text>
      <text x="330" y="334" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">reduced NADP is the other battery — it carries the hydrogen/electrons to the Calvin cycle</text>
    </svg></body></html>
