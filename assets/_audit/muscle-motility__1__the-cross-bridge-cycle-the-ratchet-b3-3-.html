<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of the cross-bridge cycle: myosin head binding actin, power stroke, ATP binding and release, re-cocking and binding the next site">
      <rect width="640" height="320" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE CROSS-BRIDGE CYCLE — THE RATCHET (B3.3.2)</text>
      <!-- panel separators -->
      <g stroke="rgba(255,255,255,.14)" stroke-width="1.5" stroke-dasharray="4 4">
        <line x1="162" y1="44" x2="162" y2="232"/>
        <line x1="317" y1="44" x2="317" y2="232"/>
        <line x1="472" y1="44" x2="472" y2="232"/>
      </g>
      <!-- stage badges -->
      <g font-size="12" font-weight="900" fill="#0b0214">
        <circle cx="30" cy="44" r="12" fill="#4ade80"/><text x="30" y="48" text-anchor="middle">1</text>
        <circle cx="185" cy="44" r="12" fill="#67e8f9"/><text x="185" y="48" text-anchor="middle">2</text>
        <circle cx="340" cy="44" r="12" fill="#fbbf24"/><text x="340" y="48" text-anchor="middle">3</text>
        <circle cx="495" cy="44" r="12" fill="#ff2ec4"/><text x="495" y="48" text-anchor="middle">4</text>
      </g>
      <g font-size="10.5" font-weight="800">
        <text x="50" y="48" fill="#4ade80">CROSS-BRIDGE FORMS</text>
        <text x="205" y="48" fill="#67e8f9">POWER STROKE</text>
        <text x="360" y="48" fill="#fbbf24">ATP BINDS → LET GO</text>
        <text x="515" y="48" fill="#ff2ec4">RE-COCK + REBIND</text>
      </g>
      <!-- actin filament -->
      <line x1="18" y1="90" x2="622" y2="90" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
      <!-- binding sites -->
      <g stroke="#fbbf24" stroke-width="2.5">
        <line x1="40" y1="82" x2="40" y2="98"/><line x1="70" y1="82" x2="70" y2="98"/><line x1="100" y1="82" x2="100" y2="98"/><line x1="130" y1="82" x2="130" y2="98"/>
        <line x1="160" y1="82" x2="160" y2="98"/><line x1="190" y1="82" x2="190" y2="98"/><line x1="220" y1="82" x2="220" y2="98"/><line x1="250" y1="82" x2="250" y2="98"/>
        <line x1="280" y1="82" x2="280" y2="98"/><line x1="310" y1="82" x2="310" y2="98"/><line x1="340" y1="82" x2="340" y2="98"/><line x1="370" y1="82" x2="370" y2="98"/>
        <line x1="400" y1="82" x2="400" y2="98"/><line x1="430" y1="82" x2="430" y2="98"/><line x1="460" y1="82" x2="460" y2="98"/><line x1="490" y1="82" x2="490" y2="98"/>
        <line x1="520" y1="82" x2="520" y2="98"/><line x1="550" y1="82" x2="550" y2="98"/><line x1="580" y1="82" x2="580" y2="98"/><line x1="610" y1="82" x2="610" y2="98"/>
      </g>
      <!-- myosin backbones -->
      <g fill="rgba(255,46,196,.55)">
        <rect x="35" y="185" width="100" height="16" rx="4"/>
        <rect x="180" y="185" width="110" height="16" rx="4"/>
        <rect x="335" y="185" width="110" height="16" rx="4"/>
        <rect x="490" y="185" width="110" height="16" rx="4"/>
      </g>
      <!-- P1: head attached straight -->
      <rect x="92" y="98" width="16" height="20" fill="#ff2ec4"/>
      <line x1="100" y1="118" x2="100" y2="185" stroke="#ff2ec4" stroke-width="6"/>
      <!-- P2: power stroke, head leans left, actin pulled -->
      <polygon points="84,96 100,96 112,120 96,120" fill="#ff2ec4"/>
      <line x1="96" y1="120" x2="96" y2="185" stroke="#ff2ec4" stroke-width="6"/>
      <line x1="215" y1="120" x2="155" y2="120" stroke="#67e8f9" stroke-width="4" marker-end="url(#arr2)"/>
      <text x="238" y="114" fill="#67e8f9" font-size="9.5" font-weight="700">← actin slides ~8–10 nm</text>
      <text x="240" y="142" fill="#b9a3d6" font-size="9" font-weight="700">ADP + Pi released</text>
      <!-- P3: ATP binds, head detached -->
      <rect x="92" y="125" width="16" height="20" fill="#ff2ec4" opacity=".85"/>
      <line x1="100" y1="145" x2="100" y2="185" stroke="#ff2ec4" stroke-width="6" opacity=".85"/>
      <circle cx="128" cy="108" r="10" fill="rgba(251,191,36,.25)" stroke="#fbbf24" stroke-width="2"/>
      <text x="128" y="112" fill="#fbbf24" font-size="9" font-weight="900" text-anchor="middle">ATP</text>
      <text x="398" y="145" fill="#b9a3d6" font-size="9" font-weight="700" text-anchor="middle">head lets go of actin</text>
      <!-- P4: re-cocked, bound at next site -->
      <rect x="122" y="98" width="16" height="20" fill="#ff2ec4"/>
      <line x1="130" y1="118" x2="130" y2="185" stroke="#ff2ec4" stroke-width="6"/>
      <text x="547" y="110" fill="#b9a3d6" font-size="9" font-weight="700" text-anchor="middle">ATP → ADP + Pi</text>
      <text x="547" y="126" fill="#b9a3d6" font-size="9" font-weight="700" text-anchor="middle">binds NEXT site →</text>
      <!-- captions -->
      <g font-size="9.5" font-weight="700" fill="#b9a3d6" text-anchor="middle">
        <text x="82" y="236">head grips a</text>
        <text x="82" y="252">binding site</text>
        <text x="237" y="236">head swivels,</text>
        <text x="237" y="252">pulls actin inwards</text>
        <text x="392" y="236">no ATP = locked</text>
        <text x="392" y="252">(rigor mortis)</text>
        <text x="547" y="236">cycle repeats</text>
        <text x="547" y="252">thousands of times</text>
      </g>
      <text x="320" y="290" fill="#fbbf24" font-size="11.5" font-weight="800" text-anchor="middle">RATCHET: many heads × asynchronous strokes = smooth, powerful slide — dark band never changes length</text>
      <defs>
        <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M 0 0 L 8 4 L 0 8 Z" fill="#67e8f9"/>
        </marker>
      </defs>
    </svg></body></html>
