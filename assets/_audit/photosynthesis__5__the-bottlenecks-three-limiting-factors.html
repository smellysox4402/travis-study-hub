<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="three graphs of limiting factors: rate of photosynthesis against light intensity rises then plateaus, against carbon dioxide concentration rises then plateaus, and against temperature rises to an optimum then falls as enzymes denature">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE BOTTLENECKS — THREE LIMITING FACTORS</text>

      <!-- graph A: light -->
      <line x1="45" y1="200" x2="215" y2="200" stroke="#b9a3d6" stroke-width="1.5"/>
      <line x1="45" y1="60" x2="45" y2="200" stroke="#b9a3d6" stroke-width="1.5"/>
      <polyline points="45,190 75,165 105,130 145,92 170,80 200,80" fill="none" stroke="#ff2ec4" stroke-width="3"/>
      <text x="130" y="218" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">LIGHT INTENSITY</text>
      <text x="130" y="236" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">plateau = CO₂ or temperature now limiting</text>

      <!-- graph B: CO2 -->
      <line x1="255" y1="200" x2="425" y2="200" stroke="#b9a3d6" stroke-width="1.5"/>
      <line x1="255" y1="60" x2="255" y2="200" stroke="#b9a3d6" stroke-width="1.5"/>
      <polyline points="255,190 285,165 315,130 355,92 380,80 410,80" fill="none" stroke="#22d3ee" stroke-width="3"/>
      <text x="340" y="218" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">CO₂ CONCENTRATION</text>
      <text x="340" y="236" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">plateau = light or temperature now limiting</text>

      <!-- graph C: temperature -->
      <line x1="465" y1="200" x2="635" y2="200" stroke="#b9a3d6" stroke-width="1.5"/>
      <line x1="465" y1="60" x2="465" y2="200" stroke="#b9a3d6" stroke-width="1.5"/>
      <polyline points="465,190 495,140 525,100 555,72 585,92 615,140 635,165" fill="none" stroke="#fbbf24" stroke-width="3"/>
      <text x="550" y="218" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">TEMPERATURE</text>
      <text x="550" y="236" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">enzymes denature past the optimum</text>

      <!-- method cards -->
      <rect x="30" y="254" width="190" height="56" rx="8" fill="rgba(255,46,196,0.06)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="125" y="274" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">pondweed bubble count</text>
      <text x="125" y="294" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">vary CO₂ with NaHCO₃ · count O₂ bubbles</text>

      <rect x="235" y="254" width="190" height="56" rx="8" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="330" y="274" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">floating leaf discs</text>
      <text x="330" y="294" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">vary light distance (1/d²) · discs float faster</text>

      <rect x="440" y="254" width="190" height="56" rx="8" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="535" y="274" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">fermenter + algae</text>
      <text x="535" y="294" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">vary temperature · O₂ electrode or pH probe</text>

      <text x="330" y="326" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">independent variable = what you change · dependent variable = what you measure · hypotheses need repeated testing (NOS)</text>
    </svg></body></html>
