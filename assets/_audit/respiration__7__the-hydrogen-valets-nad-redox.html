<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the hydrogen valet service: a substrate is oxidised by removal of two hydrogen atoms, NAD plus accepts two electrons and one proton becoming reduced NAD or NADH with one proton released, and a Benedict's test panel showing blue Cu two plus ions gaining electrons to become red copper atoms while the sugar is oxidised">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE HYDROGEN VALETS — NAD + REDOX</text>

      <rect x="30" y="52" width="190" height="110" rx="9" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="125" y="74" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">SUBSTRATE</text>
      <text x="125" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">removed: 2 H atoms</text>
      <text x="125" y="112" fill="#b9a3d6" font-size="9" text-anchor="middle">(= 2 e⁻ + 2 H⁺)</text>
      <text x="125" y="136" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">OXIDISED (lost electrons)</text>

      <path d="M 224 108 L 258 108" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah8)" fill="none"/>
      <defs><marker id="ah8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>
      <text x="241" y="96" fill="#22d3ee" font-size="8.5" font-weight="800" text-anchor="middle">2H</text>

      <rect x="264" y="52" width="180" height="110" rx="9" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2"/>
      <text x="354" y="74" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">NAD⁺ (oxidised)</text>
      <text x="354" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">nicotinamide adenine</text>
      <text x="354" y="112" fill="#b9a3d6" font-size="9" text-anchor="middle">dinucleotide · 2 nucleotides</text>
      <text x="354" y="136" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">accepts 2 e⁻ + 1 H⁺ → NADH</text>
      <text x="354" y="152" fill="#b9a3d6" font-size="9" text-anchor="middle">other H⁺ released</text>

      <rect x="470" y="52" width="160" height="110" rx="9" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="2"/>
      <text x="550" y="74" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">REDUCED NAD</text>
      <text x="550" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">= NADH + H⁺</text>
      <text x="550" y="112" fill="#b9a3d6" font-size="9" text-anchor="middle">carries 2 e⁻ + energy</text>
      <text x="550" y="136" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">→ to the ETC (Act 15)</text>

      <rect x="30" y="190" width="600" height="116" rx="9" fill="rgba(251,191,36,.07)" stroke="rgba(251,191,36,.5)" stroke-width="1.5"/>
      <text x="330" y="212" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">BENEDICT'S TEST — THE LAB EXAMPLE OF REDOX</text>
      <text x="330" y="234" fill="#b9a3d6" font-size="9.5" text-anchor="middle">Cu²⁺ (blue) + 2 e⁻ from sugar → Cu atoms (red/orange precipitate)</text>
      <text x="330" y="254" fill="#b9a3d6" font-size="9.5" text-anchor="middle">copper ions are REDUCED (gain electrons) · the sugar is OXIDISED (lost electrons)</text>
      <text x="330" y="280" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">oxidation + reduction always occur together — redox is electron transfer</text>

      <text x="330" y="336" fill="#b9a3d6" font-size="9.5" text-anchor="middle">hydrogens are removed as atoms (e⁻ + H⁺), not as bare H⁺ — otherwise no electrons would be lost and nothing would be oxidised</text>
    </svg></body></html>
