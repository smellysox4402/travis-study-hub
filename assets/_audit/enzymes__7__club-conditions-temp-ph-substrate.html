<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="three neon graphs on a club wall: left a temperature curve rising with kinetic energy then falling with denaturation with the optimum marked and a note that optimum is not always 40 degrees; middle a bell shaped pH curve with a note one unit equals ten times acidity and the detergent protease optimum 9 to 10; right a substrate concentration curve that rises then flattens and never quite reaches a maximum because active sites saturate">
      <defs><marker id="ah8" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker></defs>
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">CLUB CONDITIONS — TEMP · pH · SUBSTRATE</text>

      <rect x="30" y="52" width="190" height="170" rx="9" fill="rgba(34,211,238,.07)" stroke="rgba(34,211,238,.4)" stroke-width="1.5"/>
      <text x="125" y="72" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">TEMPERATURE</text>
      <path d="M 55 210 L 55 80 M 55 210 L 205 210" stroke="#b9a3d6" stroke-width="1.5"/>
      <path d="M 55 200 C 90 120, 115 92, 130 90 C 150 100, 175 170, 200 205" stroke="#22d3ee" stroke-width="2.5" fill="none"/>
      <circle cx="130" cy="90" r="4" fill="#fbbf24"/>
      <path d="M 130 90 L 130 210" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="130" y="222" fill="#fbbf24" font-size="8.5" font-weight="800" text-anchor="middle">OPTIMUM</text>
      <text x="125" y="240" fill="#b9a3d6" font-size="8.5" text-anchor="middle">kinetic energy ↑ → faster</text>
      <text x="125" y="254" fill="#ff2ec4" font-size="8.5" text-anchor="middle">denaturation ↓ beyond</text>
      <text x="125" y="268" fill="#fbbf24" font-size="8.5" font-weight="700" text-anchor="middle">optimum ≠ always 40°C</text>

      <rect x="235" y="52" width="190" height="170" rx="9" fill="rgba(168,85,247,.07)" stroke="rgba(168,85,247,.4)" stroke-width="1.5"/>
      <text x="330" y="72" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">pH (LOGARITHMIC)</text>
      <path d="M 260 210 L 260 80 M 260 210 L 400 210" stroke="#b9a3d6" stroke-width="1.5"/>
      <path d="M 260 205 C 280 205, 300 95, 330 95 C 360 95, 380 205, 400 205" stroke="#a855f7" stroke-width="2.5" fill="none"/>
      <circle cx="330" cy="95" r="4" fill="#fbbf24"/>
      <text x="330" y="222" fill="#fbbf24" font-size="8.5" font-weight="800" text-anchor="middle">optimum</text>
      <text x="330" y="240" fill="#b9a3d6" font-size="8.5" text-anchor="middle">1 unit = 10× acidity</text>
      <text x="330" y="254" fill="#4ade80" font-size="8.5" font-weight="700" text-anchor="middle">detergent protease: 9–10</text>
      <text x="330" y="268" fill="#b9a3d6" font-size="8.5" text-anchor="middle">ionic bonds altered → shape</text>

      <rect x="440" y="52" width="190" height="170" rx="9" fill="rgba(74,222,128,.07)" stroke="rgba(74,222,128,.4)" stroke-width="1.5"/>
      <text x="535" y="72" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">[SUBSTRATE]</text>
      <path d="M 465 210 L 465 80 M 465 210 L 605 210" stroke="#b9a3d6" stroke-width="1.5"/>
      <path d="M 465 208 C 490 150, 520 118, 580 98 C 595 93, 605 92, 605 92" stroke="#4ade80" stroke-width="2.5" fill="none"/>
      <path d="M 585 92 L 600 92" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="535" y="240" fill="#b9a3d6" font-size="8.5" text-anchor="middle">rises, less and less steeply</text>
      <text x="535" y="254" fill="#fbbf24" font-size="8.5" font-weight="700" text-anchor="middle">never quite a maximum</text>
      <text x="535" y="268" fill="#b9a3d6" font-size="8.5" text-anchor="middle">active sites saturate</text>

      <text x="330" y="316" fill="#b9a3d6" font-size="10.5" text-anchor="middle">hot-spring organisms: optimum temp much higher than 40°C · alkaline lakes: high-pH enzymes</text>
      <text x="330" y="338" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">denaturation at extremes of temp or pH is irreversible</text>
    </svg></body></html>
