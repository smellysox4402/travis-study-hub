<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="token recycling loop: ATP is spent by active cell processes becoming ADP plus phosphate, and ATP is reminted from ADP plus phosphate using energy from cell respiration, photosynthesis or chemosynthesis, with a counter showing 120 moles used per day while only 0.2 moles are present so each token is recycled about 600 times a day">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">TOKEN TURNOVER — THE RECYCLING LOOP</text>

      <rect x="200" y="52" width="260" height="56" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="74" fill="#4ade80" font-size="12" font-weight="800" text-anchor="middle">ATP  (energy-rich token)</text>
      <text x="330" y="94" fill="#b9a3d6" font-size="9" text-anchor="middle">more chemical potential energy than ADP</text>

      <path d="M 330 108 L 330 138" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#ah3)" fill="none"/>
      <defs><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2ec4"/></marker></defs>
      <text x="352" y="126" fill="#ff2ec4" font-size="9.5" font-weight="800">HYDROLYSIS</text>
      <text x="352" y="140" fill="#b9a3d6" font-size="8.5">energy released · small, sufficient</text>

      <rect x="200" y="144" width="260" height="56" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="166" fill="#ff2ec4" font-size="12" font-weight="800" text-anchor="middle">ADP + phosphate (Pi)</text>
      <text x="330" y="186" fill="#b9a3d6" font-size="9" text-anchor="middle">active cell processes: synthesis · pumps · movement</text>

      <path d="M 330 200 L 330 230" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah3b)" fill="none"/>
      <defs><marker id="ah3b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>
      <text x="352" y="220" fill="#22d3ee" font-size="9.5" font-weight="800">CONDENSATION</text>
      <text x="352" y="234" fill="#b9a3d6" font-size="8.5">energy needed to rebuild ATP</text>

      <rect x="150" y="236" width="360" height="52" rx="9" fill="rgba(34,211,238,.07)" stroke="rgba(34,211,238,.5)" stroke-width="1.5"/>
      <text x="330" y="258" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">ENERGY SUPPLY: cell respiration · photosynthesis · chemosynthesis</text>
      <text x="330" y="276" fill="#b9a3d6" font-size="9" text-anchor="middle">oxidising carbs/fats/proteins · light energy · oxidising inorganic substances (e.g. sulfides)</text>

      <text x="330" y="316" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">~120 moles used per day · only ~0.2 moles present → each token recycled ~600×</text>
      <text x="330" y="340" fill="#b9a3d6" font-size="9.5" text-anchor="middle">transfers are not 100% efficient — some energy is always lost as heat</text>
    </svg></body></html>
