<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="neon diagram of the ATP token: adenine base linked to ribose sugar linked to a chain of three phosphate groups, with the third phosphate marked as easily removed by hydrolysis, and a list of the four properties that make ATP the energy currency: soluble in water, stable at neutral pH, cannot pass the phospholipid bilayer, small energy release on hydrolysis">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE ENERGY CURRENCY — ATP (A NUCLEOTIDE)</text>

      <rect x="40" y="56" width="150" height="54" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="115" y="80" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">ADENINE</text>
      <text x="115" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">nitrogen base</text>

      <rect x="210" y="56" width="140" height="54" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="280" y="80" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">RIBOSE</text>
      <text x="280" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">5-carbon sugar</text>

      <circle cx="420" cy="83" r="24" fill="rgba(34,211,238,.12)" stroke="#22d3ee" stroke-width="2"/>
      <text x="420" y="88" fill="#22d3ee" font-size="12" font-weight="800" text-anchor="middle">P</text>
      <circle cx="478" cy="83" r="24" fill="rgba(34,211,238,.12)" stroke="#22d3ee" stroke-width="2"/>
      <text x="478" y="88" fill="#22d3ee" font-size="12" font-weight="800" text-anchor="middle">P</text>
      <circle cx="536" cy="83" r="24" fill="rgba(74,222,128,.15)" stroke="#4ade80" stroke-width="2.5"/>
      <text x="536" y="88" fill="#4ade80" font-size="12" font-weight="800" text-anchor="middle">P</text>
      <text x="536" y="132" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">third phosphate</text>
      <text x="536" y="144" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">pops off EASILY</text>
      <path d="M 360 83 L 392 83" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah1)" fill="none"/>
      <path d="M 448 83 L 452 83" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah1)" fill="none"/>
      <path d="M 506 83 L 510 83" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah1)" fill="none"/>
      <defs><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b9a3d6"/></marker></defs>

      <rect x="40" y="176" width="580" height="128" rx="9" fill="rgba(168,85,247,.07)" stroke="rgba(168,85,247,.45)" stroke-width="1.5"/>
      <text x="330" y="198" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">WHY ATP IS THE PERFECT TOKEN</text>
      <text x="330" y="222" fill="#b9a3d6" font-size="10" text-anchor="middle">✔ soluble in water → moves freely through cytoplasm</text>
      <text x="330" y="242" fill="#b9a3d6" font-size="10" text-anchor="middle">✔ stable at neutral pH (cytoplasm conditions)</text>
      <text x="330" y="262" fill="#b9a3d6" font-size="10" text-anchor="middle">✔ cannot pass phospholipid bilayer → can't leak out, movement controlled</text>
      <text x="330" y="282" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">✔ third phosphate removed by hydrolysis → small, usable energy release</text>

      <text x="330" y="336" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">ATP + H₂O → ADP + phosphate + energy  (hydrolysis)  ·  condensation rebuilds it</text>
    </svg></body></html>
