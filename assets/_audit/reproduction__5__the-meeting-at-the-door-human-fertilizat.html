<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="an egg at the club door surrounded by its zona pellucida and follicle cells, a cloud of sperm swimming toward egg chemicals, one sperm fusing first through the door, with a note that the zona hardens and blocks more sperm and the tail and mitochondria stay outside">

      <text x="360" y="106" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">zona pellucida — glycoprotein coat</text>

      <text x="535" y="104" fill="#b9a3d6" font-size="9" text-anchor="middle">sperm nucleus enters egg</text>

      <text x="330" y="326" fill="#b9a3d6" font-size="9.5" text-anchor="middle">first sperm fuses → zona hardens → door slams shut — diploid zygote (2n)</text>
