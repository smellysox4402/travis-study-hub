<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="overlay of an absorption spectrum and an action spectrum of photosynthesis: both have matching peaks in blue and red light and a trough in green, showing that the wavelengths absorbed are the wavelengths that drive photosynthesis">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">SPECTRA TWINS — ABSORPTION vs ACTION</text>

      <rect x="150" y="44" width="14" height="14" rx="3" fill="#ff2ec4"/>
      <text x="170" y="56" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">absorption spectrum (pigment, spectrophotometer)</text>
      <rect x="150" y="66" width="14" height="14" rx="3" fill="#4ade80"/>
      <text x="170" y="78" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">action spectrum (whole plant: O₂ produced / CO₂ used)</text>

      <line x1="80" y1="52" x2="80" y2="280" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="80" y1="280" x2="620" y2="280" stroke="#b9a3d6" stroke-width="2"/>
      <text x="70" y="108" text-anchor="end" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">absorption</text>
      <text x="70" y="124" text-anchor="end" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">+ action rate</text>
      <text x="160" y="310" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="11">400</text>
      <text x="320" y="310" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="11">500</text>
      <text x="470" y="310" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="11">600</text>
      <text x="620" y="310" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="11">700</text>
      <text x="350" y="326" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">wavelength / nm</text>
      <rect x="80" y="284" width="540" height="12" rx="4" fill="url(#specbar)"/>

      <polyline points="80,238 110,220 150,128 200,150 280,225 380,250 480,205 540,150 620,112" fill="none" stroke="#ff2ec4" stroke-width="3"/>
      <polyline points="80,244 115,228 158,138 205,162 285,232 385,252 470,215 545,160 620,128" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="7 5"/>

      <text x="145" y="112" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">blue peak ~450 nm</text>
      <text x="600" y="96" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">red peak ~670 nm</text>
      <text x="430" y="170" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">green trough ~550 nm — least photosynthesis happens in green light</text>
      <text x="330" y="270" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">same shape = the wavelengths absorbed are the wavelengths used</text>
    </svg></body></html>
