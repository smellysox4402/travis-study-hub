<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rate meter dashboard: three dials for measuring the respiration rate — oxygen uptake, carbon dioxide production, and consumption of glucose or other respiratory substrates — with the formula rate equals amount divided by time using the example 50 cubic millimetres in 10 minutes equals 5 per minute, and a list of independent variables: temperature, type of organism, active versus inactive, while temperature and pressure must be controlled">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE RATE METER — MEASURING RESPIRATION RATE</text>

      <rect x="30" y="52" width="192" height="96" rx="9" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2"/>
      <text x="126" y="74" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">DIAL 1 · O₂ UPTAKE</text>
      <text x="126" y="98" fill="#b9a3d6" font-size="9" text-anchor="middle">usual measure of aerobic rate</text>
      <text x="126" y="114" fill="#b9a3d6" font-size="9" text-anchor="middle">NOT from lung air (other gases)</text>
      <text x="126" y="130" fill="#b9a3d6" font-size="9" text-anchor="middle">respirometer does this</text>

      <rect x="234" y="52" width="192" height="96" rx="9" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="74" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">DIAL 2 · CO₂ PRODUCTION</text>
      <text x="330" y="98" fill="#b9a3d6" font-size="9" text-anchor="middle">amount of carbon dioxide made</text>
      <text x="330" y="114" fill="#b9a3d6" font-size="9" text-anchor="middle">mass loss in yeast flasks</text>
      <text x="330" y="130" fill="#b9a3d6" font-size="9" text-anchor="middle">(data-logged on a balance)</text>

      <rect x="438" y="52" width="192" height="96" rx="9" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="534" y="74" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">DIAL 3 · SUBSTRATE USE</text>
      <text x="534" y="98" fill="#b9a3d6" font-size="9" text-anchor="middle">consumption of glucose or</text>
      <text x="534" y="114" fill="#b9a3d6" font-size="9" text-anchor="middle">other respiratory substrates</text>

      <rect x="30" y="170" width="600" height="58" rx="9" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="192" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">RATE = AMOUNT ÷ TIME</text>
      <text x="330" y="214" fill="#b9a3d6" font-size="9.5" text-anchor="middle">50 mm³ O₂ in 10 min → 5 mm³ O₂ per minute · calculated rate = dependent variable</text>

      <text x="330" y="262" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">INDEPENDENT VARIABLES TO PLAY WITH</text>
      <text x="330" y="284" fill="#b9a3d6" font-size="9.5" text-anchor="middle">temperature · type of organism · active vs inactive organisms · substrate available</text>
      <text x="330" y="306" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">change ONE variable, keep all others constant</text>
      <text x="330" y="330" fill="#b9a3d6" font-size="9.5" text-anchor="middle">control temperature + pressure — volume, pressure and temperature interact</text>
    </svg></body></html>
