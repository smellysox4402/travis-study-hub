<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the conveyor belt of the electron transport chain in the inner mitochondrial membrane: reduced NAD delivers an electron pair to the first carrier and reduced FAD delivers its pair part way along, the three main carriers pump protons from the matrix into the intermembrane space, the first two pumping four protons each and the third pumping two for a total of ten protons per pair from reduced NAD and six from reduced FAD, creating a proton gradient with high proton concentration in the intermembrane space and low in the matrix">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE CONVEYOR BELT — ETC + PROTON GRADIENT</text>

      <rect x="30" y="52" width="600" height="44" rx="8" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="330" y="70" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">INTERMEMBRANE SPACE — HIGH [H⁺]</text>
      <text x="330" y="88" fill="#b9a3d6" font-size="8.5" text-anchor="middle">protons pile up here · 10 from reduced NAD · 6 from reduced FAD</text>

      <rect x="60" y="130" width="110" height="52" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="115" y="152" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">CARRIER 1</text>
      <text x="115" y="170" fill="#b9a3d6" font-size="8.5" text-anchor="middle">+4 H⁺ pumped</text>
      <rect x="230" y="130" width="110" height="52" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="285" y="152" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">CARRIER 2</text>
      <text x="285" y="170" fill="#b9a3d6" font-size="8.5" text-anchor="middle">+4 H⁺ pumped</text>
      <rect x="400" y="130" width="110" height="52" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="455" y="152" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">CARRIER 3</text>
      <text x="455" y="170" fill="#b9a3d6" font-size="8.5" text-anchor="middle">+2 H⁺ pumped</text>

      <path d="M 115 104 L 115 126" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah15)" fill="none"/>
      <defs><marker id="ah15" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>
      <path d="M 285 104 L 285 126" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah15b)" fill="none"/>
      <defs><marker id="ah15b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>
      <path d="M 455 104 L 455 126" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah15c)" fill="none"/>
      <defs><marker id="ah15c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>
      <text x="100" y="120" fill="#22d3ee" font-size="8.5" font-weight="800">H⁺↑</text>
      <text x="270" y="120" fill="#22d3ee" font-size="8.5" font-weight="800">H⁺↑</text>
      <text x="440" y="120" fill="#22d3ee" font-size="8.5" font-weight="800">H⁺↑</text>

      <path d="M 60 156 L 66 156" stroke="#4ade80" stroke-width="0" fill="none"/>
      <rect x="30" y="208" width="600" height="88" rx="8" fill="rgba(255,46,196,.06)" stroke="rgba(255,46,196,.45)" stroke-width="1.5"/>
      <text x="330" y="230" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">MATRIX — LOW [H⁺]</text>
      <text x="330" y="252" fill="#b9a3d6" font-size="9.5" text-anchor="middle">reduced NAD → first carrier (back to NAD, energy gained) · reduced FAD → part way (less energy)</text>
      <text x="330" y="272" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">cristae = infoldings → more membrane → more ETCs</text>
      <text x="330" y="290" fill="#b9a3d6" font-size="9" text-anchor="middle">pumping against the gradient stores energy as the proton gradient</text>

      <text x="330" y="330" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">10 H⁺ per electron pair from reduced NAD · 6 H⁺ per pair from reduced FAD</text>
      <text x="330" y="350" fill="#b9a3d6" font-size="9" text-anchor="middle">role of the ETC: generate and maintain the proton gradient across the inner membrane</text>
    </svg></body></html>
