<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ticket booth with two VIP ticket types: a slim fast male courier ticket that is small motile and mass-produced, versus a large cushioned female lounge ticket with food reserves for the embryo, both haploid n while body cells are diploid 2n">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE HALF-PRICE TICKETS — ANISOGAMY</text>

      <rect x="40" y="56" width="270" height="160" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="175" y="76" fill="#22d3ee" font-size="11.5" font-weight="800" text-anchor="middle">♂ VIP COURIER — MALE GAMETE</text>
      <text x="175" y="98" fill="#b9a3d6" font-size="9.5" text-anchor="middle">small · motile</text>
      <text x="175" y="114" fill="#b9a3d6" font-size="9.5" text-anchor="middle">travels TO the female</text>
      <text x="175" y="130" fill="#b9a3d6" font-size="9.5" text-anchor="middle">few food reserves</text>
      <text x="175" y="146" fill="#b9a3d6" font-size="9.5" text-anchor="middle">produced in huge numbers</text>
      <text x="175" y="170" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">n · haploid</text>

      <rect x="350" y="56" width="270" height="160" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="485" y="76" fill="#ff2ec4" font-size="11.5" font-weight="800" text-anchor="middle">♀ VIP LOUNGE — FEMALE GAMETE</text>
      <text x="485" y="98" fill="#b9a3d6" font-size="9.5" text-anchor="middle">large · sessile</text>
      <text x="485" y="114" fill="#b9a3d6" font-size="9.5" text-anchor="middle">stays put</text>
      <text x="485" y="130" fill="#b9a3d6" font-size="9.5" text-anchor="middle">big food reserves for embryo</text>
      <text x="485" y="146" fill="#b9a3d6" font-size="9.5" text-anchor="middle">few in number — sometimes one</text>
      <text x="485" y="170" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">n · haploid</text>

      <text x="330" y="266" fill="#b9a3d6" font-size="10.5" text-anchor="middle">All plants and animals are anisogamous — two distinct gamete types</text>
      <text x="330" y="320" fill="#4ade80" font-size="10.5" font-weight="700" text-anchor="middle">Gametes haploid (n) · body cells diploid (2n) — the half-price ticket carries half the set</text>
    </svg></body></html>
