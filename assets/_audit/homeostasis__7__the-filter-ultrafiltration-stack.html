<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ultrafiltration filter diagram: fenestrated capillary endothelium, negatively charged basement membrane, podocyte foot processes with slits, showing small molecules passing through while blood cells and plasma proteins are held back; PCT reabsorption shown with microvilli and mitochondria">
      <rect width="660" height="430" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE FILTER — ULTRAFILTRATION STACK</text>
      <!-- capillary -->
      <rect x="80" y="60" width="500" height="60" rx="10" fill="rgba(255,46,196,.06)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="330" y="82" fill="#ff2ec4" font-size="12" font-weight="800" text-anchor="middle">GLOMERULAR CAPILLARY (high pressure)</text>
      <text x="330" y="100" fill="#b9a3d6" font-size="10" text-anchor="middle">fenestrated endothelium — pores ~100 nm</text>
      <!-- held back -->
      <circle cx="150" cy="118" r="12" fill="rgba(255,46,196,.2)" stroke="#ff2ec4" stroke-width="1.5"/>
      <circle cx="190" cy="116" r="8" fill="rgba(168,85,247,.25)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="170" y="142" fill="#ff2ec4" font-size="9.5" text-anchor="middle">cells + platelets</text>
      <text x="300" y="120" fill="#a855f7" font-size="9.5" text-anchor="middle">plasma proteins ✗ (repelled by −charge)</text>
      <!-- basement membrane -->
      <rect x="80" y="150" width="500" height="26" fill="rgba(251,191,36,.14)" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="168" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">BASEMENT MEMBRANE — the real filter (negatively charged glycoprotein mesh)</text>
      <!-- podocytes -->
      <rect x="80" y="210" width="500" height="40" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="226" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">PODOCYTE FOOT PROCESSES</text>
      <text x="330" y="242" fill="#b9a3d6" font-size="10" text-anchor="middle">slit pores between the "feet" → filtrate passes</text>
      <!-- passing particles -->
      <text x="580" y="196" fill="#22d3ee" font-size="9.5" text-anchor="middle">↓ water · ions</text>
      <text x="580" y="210" fill="#22d3ee" font-size="9.5" text-anchor="middle">↓ glucose · amino</text>
      <text x="580" y="224" fill="#22d3ee" font-size="9.5" text-anchor="middle">↓ acids · urea</text>
      <path d="M 560 130 L 560 176 L 560 208" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <!-- Bowman's space -->
      <rect x="80" y="290" width="500" height="34" rx="8" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="330" y="312" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">BOWMAN'S SPACE → filtrate enters the tubule</text>
      <!-- PCT reabsorption -->
      <rect x="80" y="350" width="500" height="60" rx="10" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="330" y="372" fill="#a855f7" font-size="12" font-weight="800" text-anchor="middle">PCT — SELECTIVE REABSORPTION</text>
      <text x="330" y="392" fill="#b9a3d6" font-size="10" text-anchor="middle">microvilli surface · tight junctions · mitochondria power active transport</text>
      <text x="330" y="408" fill="#b9a3d6" font-size="10" text-anchor="middle">ALL glucose &amp; amino acids · ~80% water &amp; ions back to blood</text>
      <text x="330" y="424" fill="#b9a3d6" font-size="9.5" text-anchor="middle">glucose rides in with Na⁺ (cotransport) → no glucose in healthy urine</text>
    </svg></body></html>
