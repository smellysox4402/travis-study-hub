<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="thin-layer chromatography of leaf pigments: a strip shows six separated bands with Rf values, carotene 0.98 travelling furthest, then phaeophytin 0.81, chlorophyll a 0.59, chlorophyll b 0.42, xanthophyll 1 0.28 and xanthophyll 2 0.15">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE SPICE RACK — CHROMATOGRAPHY SEPARATES THE PIGMENTS</text>

      <!-- strip -->
      <rect x="130" y="46" width="100" height="252" fill="rgba(185,163,214,0.06)" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="130" y1="66" x2="230" y2="66" stroke="#b9a3d6" stroke-width="1.5" stroke-dasharray="5 4"/>
      <line x1="130" y1="288" x2="230" y2="288" stroke="#b9a3d6" stroke-width="1.5"/>
      <text x="120" y="60" text-anchor="end" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">solvent front</text>
      <text x="120" y="292" text-anchor="end" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">origin (spot)</text>

      <!-- bands -->
      <rect x="130" y="72" width="100" height="14" fill="#f97316"/>
      <rect x="130" y="112" width="100" height="14" fill="#a3a635"/>
      <rect x="130" y="152" width="100" height="14" fill="#22d3ee"/>
      <rect x="130" y="192" width="100" height="14" fill="#84cc16"/>
      <rect x="130" y="232" width="100" height="14" fill="#fbbf24"/>
      <rect x="130" y="266" width="100" height="14" fill="#eab308"/>

      <!-- labels -->
      <text x="252" y="84" fill="#f97316" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">carotene · Rf 0.98</text>
      <text x="252" y="124" fill="#a3a635" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">phaeophytin · Rf 0.81</text>
      <text x="252" y="164" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">chlorophyll a · Rf 0.59</text>
      <text x="252" y="204" fill="#84cc16" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">chlorophyll b · Rf 0.42</text>
      <text x="252" y="244" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">xanthophyll 1 · Rf 0.28</text>
      <text x="252" y="278" fill="#eab308" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">xanthophyll 2 · Rf 0.15</text>

      <!-- Rf formula -->
      <rect x="440" y="60" width="190" height="104" rx="10" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="2"/>
      <text x="535" y="84" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">Rf = distance moved by pigment</text>
      <text x="535" y="104" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">÷ distance moved by solvent</text>
      <text x="535" y="128" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">always between 0 and 1</text>
      <text x="535" y="148" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">identify pigments by colour + Rf value</text>

      <text x="440" y="196" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">Highest Rf = travelled furthest with the solvent</text>
      <text x="440" y="216" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">carotene is least polar, most solvent-loving</text>
      <text x="440" y="236" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">Rf is constant for a pigment in a fixed system</text>

      <text x="330" y="306" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">TLC method: extract pigments in propanone → spot 10 mm from the strip's end → stand in solvent → let it climb</text>
      <text x="330" y="326" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">use a pencil for lines, never pen (ink would run too) · the pigments travel at different speeds and separate</text>
    </svg></body></html>
