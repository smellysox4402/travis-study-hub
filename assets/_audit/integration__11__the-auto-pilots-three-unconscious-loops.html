<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="three autopilot systems diagram: heart with SAN pacemaker and medulla feedback via baroreceptors and chemoreceptors, lungs with respiratory centres and pH chemoreceptors, gut with enteric nervous system driving peristalsis waves of circular and longitudinal muscle">
      <rect width="660" height="400" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE AUTO-PILOTS — THREE UNCONSCIOUS LOOPS</text>
      <!-- heart panel -->
      <rect x="20" y="56" width="300" height="150" rx="12" fill="rgba(255,46,196,.05)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="170" y="76" fill="#ff2ec4" font-size="11.5" font-weight="900" text-anchor="middle">HEART RATE · C3.1.14</text>
      <path d="M 170 120 a 30 30 0 0 1 60 0 a 30 30 0 0 1 -60 0 Z" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="2"/>
      <circle cx="200" cy="120" r="6" fill="#22d3ee"/>
      <text x="236" y="116" fill="#b9a3d6" font-size="8.5" text-anchor="middle">SAN</text>
      <text x="170" y="150" fill="#b9a3d6" font-size="9" text-anchor="middle">medulla: sympathetic ↑ · vagus ↓</text>
      <text x="170" y="164" fill="#b9a3d6" font-size="9" text-anchor="middle">baroreceptors: blood pressure</text>
      <text x="170" y="178" fill="#b9a3d6" font-size="9" text-anchor="middle">chemoreceptors: O₂ + pH</text>
      <text x="170" y="196" fill="#b9a3d6" font-size="9" text-anchor="middle">low BP → speed up (negative feedback)</text>
      <!-- lungs panel -->
      <rect x="340" y="56" width="300" height="150" rx="12" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2"/>
      <text x="490" y="76" fill="#22d3ee" font-size="11.5" font-weight="900" text-anchor="middle">VENTILATION · C3.1.15</text>
      <ellipse cx="440" cy="140" rx="34" ry="44" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <ellipse cx="540" cy="140" rx="34" ry="44" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="490" y="150" fill="#b9a3d6" font-size="9" text-anchor="middle">diaphragm + intercostals</text>
      <text x="490" y="164" fill="#b9a3d6" font-size="9" text-anchor="middle">stretch receptors stop over-inflation</text>
      <text x="490" y="178" fill="#b9a3d6" font-size="9" text-anchor="middle">chemoreceptors: blood pH</text>
      <text x="490" y="196" fill="#b9a3d6" font-size="9" text-anchor="middle">CO₂ ↑ → pH ↓ → breathe faster</text>
      <!-- gut panel -->
      <rect x="20" y="226" width="620" height="150" rx="12" fill="rgba(74,222,128,.05)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="246" fill="#4ade80" font-size="11.5" font-weight="900" text-anchor="middle">PERISTALSIS · C3.1.16 — THE GUT'S OWN NERVOUS SYSTEM</text>
      <!-- gut tube -->
      <rect x="60" y="280" width="540" height="40" rx="20" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="2"/>
      <text x="105" y="306" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">FOOD →</text>
      <!-- contraction rings -->
      <rect x="300" y="272" width="26" height="56" rx="6" fill="rgba(255,46,196,.35)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="313" y="264" fill="#ff2ec4" font-size="8.5" text-anchor="middle">circular</text>
      <text x="313" y="274" fill="#ff2ec4" font-size="8.5" text-anchor="middle">squeeze</text>
      <rect x="420" y="272" width="26" height="56" rx="6" fill="rgba(255,46,196,.35)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="433" y="264" fill="#ff2ec4" font-size="8.5" text-anchor="middle">circular</text>
      <text x="433" y="274" fill="#ff2ec4" font-size="8.5" text-anchor="middle">squeeze</text>
      <text x="330" y="330" fill="#b9a3d6" font-size="9.5" text-anchor="middle">outer longitudinal + inner circular smooth muscle · waves push food one way (away from mouth)</text>
      <text x="330" y="346" fill="#b9a3d6" font-size="9.5" text-anchor="middle">enteric nervous system microcircuits run it WITHOUT CNS input · swallowing starts voluntary, ENS finishes it</text>
      <text x="330" y="366" fill="#b9a3d6" font-size="9.5" text-anchor="middle">normal blood pH 7.35 – 7.45 · below 6.8 = fatal</text>
    </svg></body></html>
