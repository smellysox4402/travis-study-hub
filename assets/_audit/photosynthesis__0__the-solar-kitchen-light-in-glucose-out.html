<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="overview of a chloroplast as a solar kitchen: sunlight hits solar-panel photosystems on the roof, carbon dioxide and water enter on the left, glucose leaves on the right and oxygen is a by-product that diffuses out">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <defs>
        <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M 0 0 L 8 3 L 0 6 Z" fill="#22d3ee"/>
        </marker>
      </defs>
      <text x="330" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE SOLAR KITCHEN — LIGHT IN, GLUCOSE OUT</text>
      <!-- sun -->
      <circle cx="88" cy="70" r="26" fill="rgba(251,191,36,.18)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="88" y="76" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">sun</text>
      <!-- solar panels -->
      <rect x="225" y="84" width="62" height="24" rx="4" fill="rgba(74,222,128,.25)" stroke="#4ade80" stroke-width="2"/>
      <rect x="299" y="76" width="62" height="24" rx="4" fill="rgba(74,222,128,.25)" stroke="#4ade80" stroke-width="2"/>
      <rect x="373" y="84" width="62" height="24" rx="4" fill="rgba(74,222,128,.25)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="66" fill="#b9a3d6" font-size="10" text-anchor="middle">solar panels = photosystems</text>
      <!-- light arrow -->
      <path d="M 116 66 C 160 60 190 66 221 78" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="150" y="54" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">light energy</text>
      <!-- chloroplast -->
      <rect x="210" y="128" width="280" height="132" rx="16" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="350" y="152" fill="#22d3ee" font-size="12" font-weight="800" text-anchor="middle">CHLOROPLAST = THE KITCHEN</text>
      <text x="350" y="174" fill="#b9a3d6" font-size="10.5" text-anchor="middle">thylakoid membranes = solar-panel roof</text>
      <text x="350" y="192" fill="#b9a3d6" font-size="10.5" text-anchor="middle">stroma = the assembly-line floor</text>
      <text x="350" y="210" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">light energy → chemical energy</text>
      <text x="350" y="228" fill="#b9a3d6" font-size="10.5" text-anchor="middle">(ATP + reduced NADP → glucose)</text>
      <text x="350" y="246" fill="#b9a3d6" font-size="10" text-anchor="middle">carbon compounds: carbs · proteins · lipids · nucleic acids</text>
      <!-- inputs -->
      <rect x="40" y="150" width="112" height="46" rx="10" fill="rgba(255,46,196,.07)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="96" y="171" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">CO₂</text>
      <text x="96" y="188" fill="#b9a3d6" font-size="9.5" text-anchor="middle">carbon dioxide in</text>
      <rect x="40" y="212" width="112" height="46" rx="10" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="2"/>
      <text x="96" y="233" fill="#22d3ee" font-size="13" font-weight="900" text-anchor="middle">H₂O</text>
      <text x="96" y="250" fill="#b9a3d6" font-size="9.5" text-anchor="middle">water in (the hydrogen source)</text>
      <path d="M 152 173 L 206 173" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 152 235 L 206 235" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <!-- outputs -->
      <rect x="508" y="150" width="112" height="46" rx="10" fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-width="2"/>
      <text x="564" y="171" fill="#fbbf24" font-size="12" font-weight="900" text-anchor="middle">glucose</text>
      <text x="564" y="188" fill="#b9a3d6" font-size="9.5" text-anchor="middle">C₆H₁₂O₆ out</text>
      <rect x="508" y="212" width="112" height="46" rx="10" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="564" y="233" fill="#4ade80" font-size="13" font-weight="900" text-anchor="middle">O₂</text>
      <text x="564" y="250" fill="#b9a3d6" font-size="9.5" text-anchor="middle">by-product (waste)</text>
      <path d="M 494 173 L 504 173" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 494 235 L 504 235" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <!-- oxygen diffusing out -->
      <path d="M 560 212 C 556 170 540 130 530 92" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="4 3"/>
      <text x="580" y="140" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">O₂ diffuses out</text>
      <text x="580" y="156" fill="#b9a3d6" font-size="9.5" text-anchor="middle">via stomata</text>
      <text x="330" y="322" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Every carbon atom in every living thing was fixed in a kitchen like this one</text>
    </svg></body></html>
