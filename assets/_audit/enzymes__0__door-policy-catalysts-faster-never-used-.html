<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="club door scene: a substrate VIP approaches the active site door of the enzyme bouncer and is converted into a product that enters the club, while the bouncer itself is unchanged and a loop arrow shows the same enzyme catalysing again and again, never used up">
      <defs><marker id="ah1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker></defs>
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">DOOR POLICY — CATALYSTS: FASTER, NEVER USED UP</text>

      <rect x="30" y="52" width="150" height="90" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="105" y="78" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">SUBSTRATE</text>
      <text x="105" y="96" fill="#b9a3d6" font-size="9.5" text-anchor="middle">the guest with a ticket</text>
      <text x="105" y="112" fill="#b9a3d6" font-size="9.5" text-anchor="middle">reactant molecule</text>
      <text x="105" y="128" fill="#b9a3d6" font-size="9.5" text-anchor="middle">needs the door to open</text>

      <path d="M 185 97 L 232 97" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah1)" fill="none"/>

      <rect x="240" y="52" width="180" height="90" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="78" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">ENZYME · BOUNCER</text>
      <text x="330" y="96" fill="#b9a3d6" font-size="9.5" text-anchor="middle">biological catalyst</text>
      <text x="330" y="112" fill="#b9a3d6" font-size="9.5" text-anchor="middle">active site = the door</text>
      <text x="330" y="128" fill="#b9a3d6" font-size="9.5" text-anchor="middle">NOT changed by the reaction</text>

      <path d="M 425 97 L 472 97" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah1)" fill="none"/>

      <rect x="480" y="52" width="150" height="90" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="555" y="78" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">PRODUCT</text>
      <text x="555" y="96" fill="#b9a3d6" font-size="9.5" text-anchor="middle">partygoer inside</text>
      <text x="555" y="112" fill="#b9a3d6" font-size="9.5" text-anchor="middle">converted from substrate</text>
      <text x="555" y="128" fill="#b9a3d6" font-size="9.5" text-anchor="middle">reaction product</text>

      <path d="M 330 190 C 330 250, 60 250, 60 190" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>
      <path d="M 60 190 L 60 152" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah1)" fill="none"/>
      <text x="120" y="252" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">LOOP: SAME BOUNCER, NEXT GUEST</text>
      <text x="330" y="300" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Catalysts are not used up → small amounts catalyse many reactions</text>
      <text x="330" y="322" fill="#4ade80" font-size="10.5" font-weight="700" text-anchor="middle">Without enzymes: respiration, digestion, growth, movement would be very slow</text>
    </svg></body></html>
