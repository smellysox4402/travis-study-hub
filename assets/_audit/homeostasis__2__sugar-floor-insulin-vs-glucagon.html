<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="blood glucose regulation diagram: pancreas with beta cells releasing insulin when glucose is high, lowering glucose by glycogen formation, glucose uptake and respiration; alpha cells releasing glucagon when glucose is low, raising glucose by glycogen breakdown and glucose release">
      <rect width="660" height="452" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">SUGAR FLOOR — INSULIN vs GLUCAGON</text>
      <!-- set point -->
      <rect x="225" y="180" width="210" height="56" rx="12" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="330" y="203" fill="#fbbf24" font-size="12" font-weight="900" text-anchor="middle">BLOOD GLUCOSE ≈ 5 mmol L⁻¹</text>
      <text x="330" y="221" fill="#b9a3d6" font-size="10.5" text-anchor="middle">the dance floor's target capacity</text>
      <!-- high state (top left) -->
      <rect x="30" y="60" width="250" height="88" rx="12" fill="rgba(255,46,196,.07)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="155" y="82" fill="#ff2ec4" font-size="12" font-weight="800" text-anchor="middle">GLUCOSE HIGH ⬆ (after a meal)</text>
      <text x="155" y="100" fill="#b9a3d6" font-size="10.5" text-anchor="middle">β cells secrete INSULIN</text>
      <text x="155" y="116" fill="#b9a3d6" font-size="10.5" text-anchor="middle">→ glucose → glycogen (liver)</text>
      <text x="155" y="132" fill="#b9a3d6" font-size="10.5" text-anchor="middle">→ uptake by liver + fat</text>
      <text x="155" y="146" fill="#b9a3d6" font-size="10.5" text-anchor="middle">→ faster respiration (ATP)</text>
      <!-- low state (bottom left) -->
      <rect x="30" y="290" width="250" height="88" rx="12" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="155" y="312" fill="#22d3ee" font-size="12" font-weight="800" text-anchor="middle">GLUCOSE LOW ⬇ (after exercise)</text>
      <text x="155" y="330" fill="#b9a3d6" font-size="10.5" text-anchor="middle">α cells secrete GLUCAGON</text>
      <text x="155" y="346" fill="#b9a3d6" font-size="10.5" text-anchor="middle">→ glycogen → glucose (liver)</text>
      <text x="155" y="362" fill="#b9a3d6" font-size="10.5" text-anchor="middle">→ glucose released to blood</text>
      <text x="155" y="376" fill="#b9a3d6" font-size="10.5" text-anchor="middle">→ slower respiration</text>
      <!-- pancreas -->
      <ellipse cx="560" cy="215" rx="70" ry="44" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="560" y="208" fill="#a855f7" font-size="12" font-weight="800" text-anchor="middle">PANCREAS</text>
      <text x="560" y="224" fill="#b9a3d6" font-size="10" text-anchor="middle">islets of Langerhans</text>
      <text x="560" y="240" fill="#b9a3d6" font-size="10" text-anchor="middle">β cells: insulin · α: glucagon</text>
      <!-- arrows high → pancreas -->
      <path d="M 280 104 L 488 190" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="5 4"/>
      <text x="370" y="130" fill="#ff2ec4" font-size="10.5" font-weight="700" text-anchor="middle">detects high → insulin</text>
      <!-- arrows low → pancreas -->
      <path d="M 280 334 L 488 240" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="5 4"/>
      <text x="360" y="300" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">detects low → glucagon</text>
      <!-- feedback arrows down/up -->
      <path d="M 560 171 L 560 60 L 330 60 L 330 176" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="3 4"/>
      <text x="440" y="52" fill="#ff2ec4" font-size="10.5" font-weight="700" text-anchor="middle">insulin lowers glucose</text>
      <path d="M 560 259 L 560 400 L 330 400 L 330 240" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="3 4"/>
      <text x="440" y="412" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">glucagon raises glucose</text>
      <!-- loop label -->
      <text x="330" y="438" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Two antagonistic hormones, one negative feedback loop — the DJ pair keeps the floor at capacity</text>
    </svg></body></html>
