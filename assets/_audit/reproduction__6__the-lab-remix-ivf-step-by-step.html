<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IVF protocol as five steps: down-regulation mutes the cycle for two weeks, daily FSH injections grow 8 to 15 follicles to 18 mm, hCG triggers final maturation with egg collection 34 to 35 hours later, the dish mixes egg with 50000 to 100000 sperm at 37 degrees, embryo transfer at 48 hours with extra progesterone">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE LAB REMIX — IVF STEP BY STEP</text>

      <rect x="205" y="52" width="250" height="42" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="330" y="70" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">1 · DOWN-REGULATION</text>
      <text x="330" y="84" fill="#b9a3d6" font-size="9" text-anchor="middle">drug stops pituitary FSH + LH (~2 weeks) → cycle suspended</text>
      <path d="M 330 94 L 330 102" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="205" y="106" width="250" height="42" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="124" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">2 · FSH INJECTIONS</text>
      <text x="330" y="138" fill="#b9a3d6" font-size="9" text-anchor="middle">daily 7–12 days → 8–15 follicles (each ~18 mm)</text>
      <path d="M 330 148 L 330 156" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="205" y="160" width="250" height="42" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="178" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">3 · hCG TRIGGER</text>
      <text x="330" y="192" fill="#b9a3d6" font-size="9" text-anchor="middle">final maturation; eggs collected 34–35 h later</text>
      <path d="M 330 202 L 330 210" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="205" y="214" width="250" height="42" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="232" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">4 · THE DISH</text>
      <text x="330" y="246" fill="#b9a3d6" font-size="9" text-anchor="middle">egg + 50,000–100,000 sperm · 37 °C incubation</text>
      <path d="M 330 256 L 330 264" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="205" y="268" width="250" height="42" rx="9" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="330" y="286" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">5 · EMBRYO TRANSFER</text>
      <text x="330" y="300" fill="#b9a3d6" font-size="9" text-anchor="middle">~48 h embryos into uterus · extra progesterone (tablet) holds the lining</text>

      <text x="330" y="340" fill="#b9a3d6" font-size="9.5" text-anchor="middle">IVF = the lab remix: doctors control timing the natural cycle hides</text>
    </svg></body></html>
