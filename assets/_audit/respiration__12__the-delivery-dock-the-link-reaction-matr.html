<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="delivery dock at the mitochondrion: pyruvate three-carbon arrives through a transporter in the outer membrane into the matrix, the three-enzyme complex removes carbon dioxide by decarboxylation, oxidises by removing two electrons accepted by NAD becoming reduced NAD, and binds the acetyl group to coenzyme A producing acetyl coenzyme A two-carbon, which then feeds the Krebs cycle">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE DELIVERY DOCK — THE LINK REACTION (MATRIX)</text>

      <ellipse cx="330" cy="230" rx="300" ry="120" fill="rgba(34,211,238,.04)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="330" y="196" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">MITOCHONDRIAL MATRIX</text>

      <rect x="40" y="60" width="130" height="56" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="105" y="84" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">PYRUVATE</text>
      <text x="105" y="102" fill="#b9a3d6" font-size="9" text-anchor="middle">3C · from cytoplasm</text>

      <rect x="40" y="140" width="130" height="34" rx="7" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="105" y="162" fill="#fbbf24" font-size="8.5" font-weight="800" text-anchor="middle">transporter protein</text>
      <text x="105" y="182" fill="#b9a3d6" font-size="8.5" text-anchor="middle">(outer membrane)</text>

      <path d="M 174 88 L 236 88" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah13)" fill="none"/>
      <defs><marker id="ah13" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b9a3d6"/></marker></defs>

      <rect x="242" y="56" width="200" height="116" rx="9" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="342" y="76" fill="#a855f7" font-size="10" font-weight="800" text-anchor="middle">COMPLEX OF 3 ENZYMES</text>
      <text x="342" y="98" fill="#b9a3d6" font-size="9" text-anchor="middle">1 · decarboxylation: −CO₂ (3C → 2C)</text>
      <text x="342" y="116" fill="#b9a3d6" font-size="9" text-anchor="middle">2 · oxidation: −2 e⁻ → NAD → reduced NAD</text>
      <text x="342" y="134" fill="#b9a3d6" font-size="9" text-anchor="middle">3 · binding: acetyl + coenzyme A</text>
      <text x="342" y="158" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">→ ACETYL COENZYME A (2C)</text>

      <path d="M 446 88 L 508 88" stroke="#4ade80" stroke-width="2" marker-end="url(#ah13b)" fill="none"/>
      <defs><marker id="ah13b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker></defs>

      <rect x="514" y="60" width="116" height="56" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="572" y="84" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">ACETYL CoA</text>
      <text x="572" y="102" fill="#b9a3d6" font-size="9" text-anchor="middle">2C → Krebs cycle</text>

      <text x="330" y="252" fill="#b9a3d6" font-size="9.5" text-anchor="middle">CO₂ released (waste) · per glucose: 2 pyruvate → 2 acetyl CoA + 2 CO₂ + 2 reduced NAD</text>
      <text x="330" y="276" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">all the carbon in sugars and fats is removed as CO₂ here or in the Krebs cycle</text>
      <text x="330" y="300" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">only happens if oxygen is available — the aerobic road ahead</text>
      <text x="330" y="330" fill="#b9a3d6" font-size="9.5" text-anchor="middle">lipids and carbohydrates are both metabolised to 2C acetyl groups carried by coenzyme A</text>
    </svg></body></html>
