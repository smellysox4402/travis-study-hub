<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of the five stages of mitosis: interphase with dispersed chromatin, prophase with condensed chromosomes, metaphase with chromosomes on the equator, anaphase with sister chromatids separating to opposite poles, telophase with nuclei reforming and a cleavage furrow">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">MITOSIS — ONE NUCLEUS IN, TWO OUT</text>
      <!-- panel 1 interphase -->
      <text x="75" y="54" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">INTERPHASE</text>
      <circle cx="75" cy="175" r="42" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="75" cy="175" r="26" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M 58 168 C 66 162 70 170 78 164 C 84 160 88 170 94 164" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
      <text x="75" y="240" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">chromatin spread out</text>
      <text x="75" y="255" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">(not visible)</text>
      <!-- panel 2 prophase -->
      <text x="195" y="54" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">PROPHASE</text>
      <circle cx="195" cy="175" r="42" fill="rgba(255,46,196,.06)" stroke="#ff2ec4" stroke-width="2.5"/>
      <circle cx="195" cy="175" r="26" fill="none" stroke="#ff2ec4" stroke-width="1.5" stroke-dasharray="3 3"/>
      <g stroke="#ff2ec4" stroke-width="2" stroke-linecap="round">
        <path d="M 186 158 L 196 168 M 196 158 L 186 168"/>
        <path d="M 200 184 L 210 194 M 210 184 L 200 194"/>
      </g>
      <circle cx="191" cy="163" r="1.8" fill="#fbbf24"/>
      <circle cx="205" cy="189" r="1.8" fill="#fbbf24"/>
      <text x="195" y="240" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">chromosomes condense</text>
      <text x="195" y="255" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">→ visible</text>
      <!-- panel 3 metaphase -->
      <text x="315" y="54" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">METAPHASE</text>
      <circle cx="315" cy="175" r="42" fill="rgba(251,191,36,.06)" stroke="#fbbf24" stroke-width="2.5"/>
      <line x1="315" y1="135" x2="315" y2="215" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3"/>
      <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
        <path d="M 305 160 L 315 170 M 315 160 L 305 170"/>
        <path d="M 315 172 L 325 182 M 325 172 L 315 182"/>
        <path d="M 305 184 L 315 194 M 315 184 L 305 194"/>
      </g>
      <text x="315" y="240" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">aligned on the equator</text>
      <text x="315" y="255" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">spindle attached</text>
      <!-- panel 4 anaphase -->
      <text x="435" y="54" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">ANAPHASE</text>
      <circle cx="435" cy="175" r="42" fill="rgba(74,222,128,.06)" stroke="#4ade80" stroke-width="2.5"/>
      <line x1="435" y1="135" x2="435" y2="215" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="4 3"/>
      <g stroke="#4ade80" stroke-width="2" stroke-linecap="round">
        <path d="M 412 155 L 418 167 M 418 155 L 412 167"/>
        <path d="M 405 180 L 411 192 M 411 180 L 405 192"/>
        <path d="M 458 155 L 464 167 M 464 155 L 458 167"/>
        <path d="M 465 180 L 471 192 M 471 180 L 465 192"/>
      </g>
      <text x="435" y="240" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">cohesin cut</text>
      <text x="435" y="255" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">→ to opposite poles</text>
      <!-- panel 5 telophase -->
      <text x="555" y="54" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">TELOPHASE</text>
      <circle cx="555" cy="175" r="42" fill="rgba(168,85,247,.06)" stroke="#a855f7" stroke-width="2.5"/>
      <circle cx="543" cy="160" r="15" fill="none" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="567" cy="190" r="15" fill="none" stroke="#a855f7" stroke-width="1.5"/>
      <path d="M 555 133 Q 548 140 555 147" fill="none" stroke="#ff2ec4" stroke-width="2"/>
      <path d="M 555 203 Q 548 210 555 217" fill="none" stroke="#ff2ec4" stroke-width="2"/>
      <text x="555" y="240" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">nuclei reform</text>
      <text x="555" y="255" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">cytokinesis begins</text>
      <!-- bottom -->
      <text x="320" y="300" fill="#f3e8ff" font-size="12" font-weight="800" text-anchor="middle">PMAT = Prophase · Metaphase · Anaphase · Telophase</text>
      <text x="320" y="322" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">condense → line up → split apart → reform · then cytokinesis halves the cell</text>
    </svg></body></html>
