<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 480 300" role="img" aria-label="Orbital box diagrams for nitrogen and manganese showing Pauli exclusion and Hund's rule">
      <rect x="0" y="0" width="480" height="300" rx="18" fill="#1d0f33"/>
      <text x="240" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#f3e8ff" font-family="Segoe UI">ORBITAL BOX DIAGRAMS — PAULI + HUND IN ACTION</text>
      <!-- nitrogen -->
      <text x="40" y="70" font-size="13" font-weight="800" fill="#22d3ee" font-family="Segoe UI">NITROGEN · 1s² 2s² 2p³</text>
      <rect x="40" y="85" width="26" height="26" fill="#150a26" stroke="#ff2ec4" stroke-width="1.5"/><text x="53" y="103" text-anchor="middle" font-size="13" fill="#ff2ec4" font-family="Segoe UI">↑</text><text x="53" y="118" text-anchor="middle" font-size="9" fill="#b9a3d6" font-family="Segoe UI">↓</text>
      <rect x="74" y="85" width="26" height="26" fill="#150a26" stroke="#ff2ec4" stroke-width="1.5"/><text x="87" y="103" text-anchor="middle" font-size="13" fill="#ff2ec4" font-family="Segoe UI">↑</text><text x="87" y="118" text-anchor="middle" font-size="9" fill="#b9a3d6" font-family="Segoe UI">↓</text>
      <rect x="130" y="85" width="26" height="26" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><text x="143" y="103" text-anchor="middle" font-size="13" fill="#22d3ee" font-family="Segoe UI">↑</text>
      <rect x="164" y="85" width="26" height="26" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><text x="177" y="103" text-anchor="middle" font-size="13" fill="#22d3ee" font-family="Segoe UI">↑</text>
      <rect x="198" y="85" width="26" height="26" fill="#150a26" stroke="#22d3ee" stroke-width="1.5"/><text x="211" y="103" text-anchor="middle" font-size="13" fill="#22d3ee" font-family="Segoe UI">↑</text>
      <text x="40" y="135" font-size="10" fill="#b9a3d6" font-family="Segoe UI">3 p electrons SINGLY occupied, same spin — Hund's rule</text>
      <text x="40" y="150" font-size="10" fill="#b9a3d6" font-family="Segoe UI">(pairing costs repulsion energy — spread out first)</text>
      <!-- manganese -->
      <text x="40" y="185" font-size="13" font-weight="800" fill="#22d3ee" font-family="Segoe UI">MANGANESE · [Ar] 4s² 3d⁵</text>
      <rect x="40" y="200" width="26" height="26" fill="#150a26" stroke="#ff2ec4" stroke-width="1.5"/><text x="53" y="218" text-anchor="middle" font-size="13" fill="#ff2ec4" font-family="Segoe UI">↑</text><text x="53" y="233" text-anchor="middle" font-size="9" fill="#b9a3d6" font-family="Segoe UI">↓</text>
      <text x="74" y="218" font-size="10" fill="#b9a3d6" font-family="Segoe UI">4s</text>
      <rect x="130" y="200" width="26" height="26" fill="#150a26" stroke="#a855f7" stroke-width="1.5"/><text x="143" y="218" text-anchor="middle" font-size="13" fill="#a855f7" font-family="Segoe UI">↑</text>
      <rect x="164" y="200" width="26" height="26" fill="#150a26" stroke="#a855f7" stroke-width="1.5"/><text x="177" y="218" text-anchor="middle" font-size="13" fill="#a855f7" font-family="Segoe UI">↑</text>
      <rect x="198" y="200" width="26" height="26" fill="#150a26" stroke="#a855f7" stroke-width="1.5"/><text x="211" y="218" text-anchor="middle" font-size="13" fill="#a855f7" font-family="Segoe UI">↑</text>
      <rect x="232" y="200" width="26" height="26" fill="#150a26" stroke="#a855f7" stroke-width="1.5"/><text x="245" y="218" text-anchor="middle" font-size="13" fill="#a855f7" font-family="Segoe UI">↑</text>
      <rect x="266" y="200" width="26" height="26" fill="#150a26" stroke="#a855f7" stroke-width="1.5"/><text x="279" y="218" text-anchor="middle" font-size="13" fill="#a855f7" font-family="Segoe UI">↑</text>
      <text x="300" y="218" font-size="10" fill="#b9a3d6" font-family="Segoe UI">3d — 5 singly = half-filled</text>
      <text x="40" y="250" font-size="10" fill="#b9a3d6" font-family="Segoe UI">Mn²⁺ loses 4s electrons FIRST → [Ar]3d⁵ (half-filled = extra stable)</text>
      <text x="240" y="286" text-anchor="middle" font-size="11" fill="#4ade80" font-family="Segoe UI" font-weight="700">half-filled (d⁵, p³) and full (d¹⁰, p⁶) sublevels are extra stable</text>
    </svg></body></html>
