<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a ball-and-socket hip joint in cross-section: pelvis socket, femur ball, articular cartilage, synovial fluid, synovial membrane, ligament, joint capsule, tendon and muscle">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE HIP — BALL-AND-SOCKET VIP DOOR</text>
      <!-- femur: neck + shaft (head circle drawn on top so edges merge) -->
      <path d="M 255 215 Q 248 260 238 300 Q 228 345 216 390 Q 208 425 220 445 L 318 445 Q 322 415 308 380 Q 296 345 296 300 Q 296 262 318 222 Z" fill="rgba(185,163,214,.16)" stroke="#b9a3d6" stroke-width="3"/>
      <!-- pelvis: bone arch over the socket, cup open at the bottom -->
      <path d="M 239 201 Q 218 190 205 165 Q 195 140 208 112 Q 225 82 265 68 Q 305 55 345 66 Q 385 78 400 108 Q 415 140 404 168 Q 394 192 372 200 L 351 201 A 62 62 0 1 0 239 201 Z" fill="rgba(185,163,214,.16)" stroke="#b9a3d6" stroke-width="3"/>
      <!-- femoral head (ball) — covers the neck top seam -->
      <circle cx="300" cy="180" r="50" fill="rgba(185,163,214,.16)" stroke="#b9a3d6" stroke-width="3"/>
      <!-- articular cartilage: cyan caps on BOTH articulating surfaces -->
      <path d="M 347 194 A 62 62 0 1 0 242 194" stroke="#22d3ee" stroke-width="5" fill="none" opacity=".9"/>
      <path d="M 340 201 A 50 50 0 1 0 250 201" stroke="#22d3ee" stroke-width="5" fill="none" opacity=".9"/>
      <!-- synovial fluid: dashed arc filling the gap between the two cartilages -->
      <path d="M 347.6 194.2 A 56 56 0 1 0 242.4 194.2" stroke="#67e8f9" stroke-width="2.5" fill="none" stroke-dasharray="3 4"/>
      <!-- joint capsule: dashed sleeve from socket rim down around the femoral neck -->
      <path d="M 239 205 Q 192 262 234 314 Q 250 330 262 300" stroke="#a855f7" stroke-width="3.5" fill="none" stroke-dasharray="6 4"/>
      <path d="M 351 205 Q 414 258 372 308 Q 358 318 298 300" stroke="#a855f7" stroke-width="3.5" fill="none" stroke-dasharray="6 4"/>
      <!-- ligament: capsular thickening (yellow band on the capsule) -->
      <path d="M 240 214 Q 186 262 230 310" stroke="#fbbf24" stroke-width="6" fill="none" opacity=".95" stroke-linecap="round"/>
      <!-- synovial membrane: thin pink lining on the inside of the capsule -->
      <path d="M 248 222 Q 210 258 240 306" stroke="#f472b6" stroke-width="2" fill="none" stroke-dasharray="2 3"/>
      <path d="M 356 226 Q 402 258 358 306 Q 348 312 302 302" stroke="#f472b6" stroke-width="2" fill="none" stroke-dasharray="2 3"/>
      <!-- muscle (gluteus) + tendon to femur -->
      <path d="M 418 208 C 470 215 520 250 522 300 C 524 350 470 372 430 358 C 452 330 450 290 440 255 C 432 228 424 215 418 208 Z" fill="rgba(255,46,196,.2)" stroke="#ff2ec4" stroke-width="3"/>
      <path d="M 434 354 Q 380 352 302 342" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
      <!-- labels + leader lines -->
      <text x="490" y="58" fill="#b9a3d6" font-size="11.5" font-weight="800" text-anchor="middle">PELVIS (socket)</text>
      <line x1="472" y1="64" x2="392" y2="94" stroke="#b9a3d6" stroke-width="1"/>
      <text x="500" y="130" fill="#22d3ee" font-size="11.5" font-weight="800" text-anchor="middle">ARTICULAR CARTILAGE</text>
      <line x1="475" y1="140" x2="348" y2="193" stroke="#22d3ee" stroke-width="1"/>
      <text x="105" y="180" fill="#fbbf24" font-size="11.5" font-weight="800" text-anchor="middle">LIGAMENT</text>
      <line x1="120" y1="186" x2="211" y2="240" stroke="#fbbf24" stroke-width="1"/>
      <text x="122" y="252" fill="#67e8f9" font-size="11.5" font-weight="800" text-anchor="middle">SYNOVIAL FLUID</text>
      <line x1="130" y1="246" x2="252" y2="210" stroke="#67e8f9" stroke-width="1"/>
      <text x="480" y="260" fill="#ff2ec4" font-size="11.5" font-weight="800" text-anchor="middle">MUSCLE</text>
      <text x="480" y="277" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">(the force)</text>
      <text x="115" y="330" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">JOINT CAPSULE</text>
      <text x="115" y="348" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">(ligament bag, seals joint)</text>
      <line x1="128" y1="322" x2="222" y2="296" stroke="#a855f7" stroke-width="1"/>
      <text x="110" y="400" fill="#f472b6" font-size="11" font-weight="800" text-anchor="middle">SYNOVIAL MEMBRANE</text>
      <line x1="120" y1="392" x2="232" y2="300" stroke="#f472b6" stroke-width="1"/>
      <text x="500" y="400" fill="#4ade80" font-size="11.5" font-weight="800" text-anchor="middle">TENDON</text>
      <text x="500" y="417" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">(muscle → bone)</text>
      <line x1="483" y1="394" x2="440" y2="358" stroke="#4ade80" stroke-width="1"/>
      <text x="140" y="428" fill="#b9a3d6" font-size="11.5" font-weight="800" text-anchor="middle">FEMUR (ball)</text>
      <line x1="150" y1="420" x2="218" y2="418" stroke="#b9a3d6" stroke-width="1"/>
    </svg></body></html>
