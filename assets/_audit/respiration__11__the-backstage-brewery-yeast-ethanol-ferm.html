<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="backstage brewery flow: pyruvate loses carbon dioxide in a decarboxylation stage one becoming ethanal, then reduced NAD transfers two hydrogens to ethanal in stage two making ethanol and regenerating NAD, with two side cards — baking where carbon dioxide bubbles get trapped in viscous dough making it rise while ethanol evaporates, and brewing where fermentation stops when sugar runs out or ethanol reaches about 15 percent by volume and becomes toxic to yeast">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE BACKSTAGE BREWERY — YEAST ETHANOL FERMENTATION</text>

      <rect x="30" y="52" width="150" height="60" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="105" y="76" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">PYRUVATE (3C)</text>
      <text x="105" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">from glycolysis</text>

      <path d="M 184 82 L 246 82" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah12)" fill="none"/>
      <defs><marker id="ah12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker></defs>
      <text x="215" y="70" fill="#fbbf24" font-size="8.5" font-weight="800" text-anchor="middle">−CO₂</text>
      <text x="215" y="104" fill="#b9a3d6" font-size="8.5" text-anchor="middle">stage 1 · decarboxylation</text>

      <rect x="252" y="52" width="150" height="60" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="327" y="76" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">ETHANAL (2C)</text>
      <text x="327" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">CO₂ removed from pyruvate</text>

      <path d="M 406 82 L 468 82" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah12b)" fill="none"/>
      <defs><marker id="ah12b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs>
      <text x="437" y="70" fill="#22d3ee" font-size="8.5" font-weight="800" text-anchor="middle">+2H</text>
      <text x="437" y="104" fill="#b9a3d6" font-size="8.5" text-anchor="middle">stage 2 · reduced NAD</text>

      <rect x="474" y="52" width="156" height="60" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="552" y="76" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">ETHANOL (2C)</text>
      <text x="552" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">NAD regenerated</text>

      <rect x="30" y="140" width="290" height="100" rx="9" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="175" y="162" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">🍞 BAKING — BREAD RISES</text>
      <text x="175" y="184" fill="#b9a3d6" font-size="9" text-anchor="middle">CO₂ bubbles trapped in viscous dough</text>
      <text x="175" y="202" fill="#b9a3d6" font-size="9" text-anchor="middle">→ dough swells and rises</text>
      <text x="175" y="220" fill="#b9a3d6" font-size="9" text-anchor="middle">ethanol evaporates during baking</text>

      <rect x="340" y="140" width="290" height="100" rx="9" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="485" y="162" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">🍺 BREWING — ETHANOL IS THE POINT</text>
      <text x="485" y="184" fill="#b9a3d6" font-size="9" text-anchor="middle">wine: grape juice · beer: barley starch</text>
      <text x="485" y="202" fill="#b9a3d6" font-size="9" text-anchor="middle">+ amylase (yeast can't use starch)</text>
      <text x="485" y="220" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">stops at ~15% ethanol — toxic to yeast</text>

      <text x="330" y="280" fill="#b9a3d6" font-size="10" text-anchor="middle">yeast = facultative anaerobe · aerobic first, anaerobic once O₂ is used up</text>
      <text x="330" y="306" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">glucose → ethanol + CO₂  (2 ATP per glucose, cytoplasm)</text>
      <text x="330" y="332" fill="#b9a3d6" font-size="9.5" text-anchor="middle">bioethanol: sugar cane + corn fermented by yeast, purified by distillation — renewable fuel</text>
    </svg></body></html>
