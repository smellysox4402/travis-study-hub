<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cross section of an artery wall showing three layers: outer tunica externa of collagen fibres, middle tunica media of smooth muscle and elastic fibres, inner tunica intima of endothelium, plus a diagram of elastic recoil where the artery stretches during systole and recoils during diastole to keep blood flowing">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE PRESSURE PIPE — ARTERY WALL LAYERS</text>
      <!-- arrows -->
      <defs>
        <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M 0 0 L 8 3 L 0 6 Z" fill="#22d3ee"/>
        </marker>
      </defs>
      <!-- wedge -->
      <circle cx="150" cy="200" r="110" fill="none" stroke="#ff2ec4" stroke-width="3"/>
      <circle cx="150" cy="200" r="74" fill="none" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="150" cy="200" r="40" fill="rgba(11,2,20,.9)" stroke="#4ade80" stroke-width="2.5"/>
      <path d="M 150 200 L 214 264" stroke="#ff2ec4" stroke-width="2"/>
      <path d="M 150 200 L 86 264" stroke="#ff2ec4" stroke-width="2"/>
      <text x="150" y="196" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">LUMEN</text>
      <!-- layer labels -->
      <line x1="224" y1="150" x2="300" y2="118" stroke="#ff2ec4" stroke-width="1.2"/>
      <text x="306" y="116" fill="#ff2ec4" font-size="11" font-weight="800">TUNICA EXTERNA</text>
      <text x="306" y="134" fill="#b9a3d6" font-size="9.5">collagen fibres — stop bulging</text>
      <text x="306" y="150" fill="#b9a3d6" font-size="9.5">and bursting (aneurysm)</text>
      <line x1="200" y1="222" x2="300" y2="222" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="306" y="216" fill="#22d3ee" font-size="11" font-weight="800">TUNICA MEDIA</text>
      <text x="306" y="234" fill="#b9a3d6" font-size="9.5">smooth muscle + elastic fibres</text>
      <text x="306" y="250" fill="#b9a3d6" font-size="9.5">(up to ~50% dry mass near heart)</text>
      <line x1="176" y1="290" x2="300" y2="296" stroke="#4ade80" stroke-width="1.2"/>
      <text x="306" y="292" fill="#4ade80" font-size="11" font-weight="800">TUNICA INTIMA</text>
      <text x="306" y="310" fill="#b9a3d6" font-size="9.5">endothelium — smooth lining</text>
      <!-- elastic recoil panel -->
      <rect x="420" y="80" width="210" height="52" rx="10" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="2"/>
      <text x="525" y="100" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">SYSTOLE — heart beats</text>
      <text x="525" y="118" fill="#b9a3d6" font-size="9.5" text-anchor="middle">artery stretches, stores energy</text>
      <rect x="420" y="150" width="210" height="52" rx="10" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2"/>
      <text x="525" y="170" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">DIASTOLE — heart relaxes</text>
      <text x="525" y="188" fill="#b9a3d6" font-size="9.5" text-anchor="middle">elastic recoil squeezes blood on</text>
      <path d="M 525 132 L 525 146" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="525" y="222" fill="#b9a3d6" font-size="10" text-anchor="middle">flow stays smooth between beats</text>
      <text x="525" y="240" fill="#b9a3d6" font-size="10" text-anchor="middle">→ less work for the heart</text>
      <text x="525" y="262" fill="#b9a3d6" font-size="9.5" text-anchor="middle">narrow lumen keeps pressure high</text>
      <text x="525" y="316" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">pulse wave = stretch + recoil</text>
      <text x="525" y="334" fill="#b9a3d6" font-size="9.5" text-anchor="middle">travelling down the pipes</text>
    </svg></body></html>
