<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="heart with coronary arteries branching off the aorta, one artery narrowed by an atheroma deposit and blocked by a thrombus, plus a scatter graph showing a strong positive correlation between saturated fat intake and coronary heart disease death rate with the warning that correlation does not prove causation">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE BLOCKED BACKSTAGE — CORONARY OCCLUSION</text>
      <!-- aorta -->
      <path d="M 150 50 C 150 20 210 20 210 50 L 210 90 L 150 90 Z" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="180" y="70" fill="#22d3ee" font-size="9.5" font-weight="800" text-anchor="middle">AORTA</text>
      <!-- coronary branches -->
      <path d="M 165 88 C 130 130 110 170 110 210" fill="none" stroke="#ff2ec4" stroke-width="3"/>
      <path d="M 195 88 C 220 130 240 170 250 200" fill="none" stroke="#ff2ec4" stroke-width="3"/>
      <path d="M 195 88 C 210 120 235 130 270 135" fill="none" stroke="#ff2ec4" stroke-width="3"/>
      <text x="96" y="238" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="end">coronary arteries</text>
      <text x="96" y="254" fill="#b9a3d6" font-size="9" text-anchor="end">first branches of aorta</text>
      <text x="96" y="270" fill="#b9a3d6" font-size="9" text-anchor="end">3 main arteries</text>
      <!-- heart -->
      <path d="M 110 230 C 90 270 130 320 180 320 C 220 320 240 300 250 280 C 260 300 280 320 320 320 C 370 320 410 270 390 230 C 380 210 360 200 340 205 C 330 195 310 190 300 195 C 290 190 270 195 260 205 C 240 200 220 200 210 205 C 190 195 170 195 160 205 C 140 200 120 210 110 230 Z" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="250" y="272" fill="#f3e8ff" font-size="10.5" font-weight="800" text-anchor="middle">HEART MUSCLE</text>
      <text x="250" y="290" fill="#b9a3d6" font-size="9" text-anchor="middle">needs O₂ + glucose</text>
      <text x="250" y="306" fill="#b9a3d6" font-size="9" text-anchor="middle">from coronary blood</text>
      <!-- blocked artery zoom -->
      <rect x="420" y="70" width="220" height="96" rx="10" fill="rgba(251,191,36,.06)" stroke="#fbbf24" stroke-width="2"/>
      <text x="530" y="90" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">ATHEROMA + THROMBUS</text>
      <path d="M 440 120 L 620 120" stroke="#ff2ec4" stroke-width="14" fill="none"/>
      <path d="M 490 112 L 540 128 L 500 132" fill="rgba(251,191,36,.5)" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M 556 108 L 590 132 L 566 136" fill="rgba(255,46,196,.5)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="530" y="150" fill="#b9a3d6" font-size="9" text-anchor="middle">fatty deposit narrows lumen</text>
      <text x="530" y="164" fill="#b9a3d6" font-size="9" text-anchor="middle">+ clot → total block (MI)</text>
      <text x="530" y="188" fill="#ff2ec4" font-size="9.5" font-weight="700" text-anchor="middle">angina · shortness of breath</text>
      <text x="530" y="204" fill="#b9a3d6" font-size="9" text-anchor="middle">on exertion → heart attack</text>
      <!-- scatter graph -->
      <line x1="420" y1="246" x2="420" y2="330" stroke="#b9a3d6" stroke-width="1.5"/>
      <line x1="420" y1="330" x2="640" y2="330" stroke="#b9a3d6" stroke-width="1.5"/>
      <circle cx="450" cy="312" r="4" fill="#4ade80"/>
      <circle cx="490" cy="298" r="4" fill="#4ade80"/>
      <circle cx="520" cy="288" r="4" fill="#4ade80"/>
      <circle cx="560" cy="266" r="4" fill="#4ade80"/>
      <circle cx="600" cy="252" r="4" fill="#4ade80"/>
      <path d="M 440 316 L 610 248" stroke="#4ade80" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="530" y="236" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">SATURATED FAT vs CHD</text>
      <text x="634" y="347" fill="#b9a3d6" font-size="9" text-anchor="end">fat intake →</text>
      <text x="418" y="248" fill="#b9a3d6" font-size="9" text-anchor="start">CHD ↑</text>
      <text x="530" y="318" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">STRONG correlation ≠ causation</text>
      <text x="530" y="334" fill="#b9a3d6" font-size="9" text-anchor="middle">r ≈ +0.9 — but correlation is not proof</text>
    </svg></body></html>
