<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cerebellum coordination diagram: cerebellum at the rear base of the brain coordinates timing of skeletal muscle contractions and balance, receiving inputs from balance organs and muscles while motor cortex decides which muscles contract">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE FLOOR MANAGER — CEREBELLUM</text>
      <!-- brain outline -->
      <ellipse cx="330" cy="150" rx="140" ry="90" fill="rgba(168,85,247,.06)" stroke="#a855f7" stroke-width="2"/>
      <text x="330" y="110" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">CEREBRAL HEMISPHERES</text>
      <text x="330" y="128" fill="#b9a3d6" font-size="9.5" text-anchor="middle">decide WHICH muscles contract</text>
      <text x="330" y="142" fill="#b9a3d6" font-size="9.5" text-anchor="middle">(primary motor cortex)</text>
      <!-- cerebellum -->
      <ellipse cx="330" cy="248" rx="95" ry="42" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="330" y="240" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="middle">CEREBELLUM</text>
      <text x="330" y="258" fill="#b9a3d6" font-size="9.5" text-anchor="middle">fine-tunes TIMING of contractions</text>
      <text x="330" y="274" fill="#b9a3d6" font-size="9.5" text-anchor="middle">balance · posture · muscle tone</text>
      <!-- inputs -->
      <text x="110" y="210" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">inputs:</text>
      <text x="110" y="228" fill="#b9a3d6" font-size="9.5" text-anchor="middle">inner-ear balance organs</text>
      <text x="110" y="244" fill="#b9a3d6" font-size="9.5" text-anchor="middle">muscle stretch receptors</text>
      <path d="M 165 220 L 232 232" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <!-- outputs -->
      <text x="545" y="210" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">output:</text>
      <text x="545" y="228" fill="#b9a3d6" font-size="9.5" text-anchor="middle">timing corrections to</text>
      <text x="545" y="244" fill="#b9a3d6" font-size="9.5" text-anchor="middle">skeletal muscles</text>
      <path d="M 428 242 L 495 232" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <!-- examples -->
      <text x="330" y="330" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">riding a bike · typing · standing still — smooth because the floor manager adjusts timing</text>
      <text x="330" y="348" fill="#b9a3d6" font-size="9.5" text-anchor="middle">damage → clumsy, uncoordinated, off-balance (ataxia) · never initiates a contraction</text>
    </svg></body></html>
