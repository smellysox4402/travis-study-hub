<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of the sexual life cycle: haploid gametes from each parent fuse to form a diploid zygote, restoring two of each chromosome type">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE GUEST LIST — n + n = 2n</text>
      <!-- mother 2n -->
      <circle cx="140" cy="100" r="46" fill="rgba(255,46,196,.07)" stroke="#ff2ec4" stroke-width="3"/>
      <g stroke="#ff2ec4" stroke-width="3" stroke-linecap="round">
        <path d="M 122 84 L 134 96 M 134 84 L 122 96"/>
        <path d="M 146 112 L 158 124 M 158 112 L 146 124"/>
      </g>
      <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
        <path d="M 146 84 L 158 96 M 158 84 L 146 96"/>
        <path d="M 122 112 L 134 124 M 134 112 L 122 124"/>
      </g>
      <text x="140" y="162" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">MOTHER 2n = 4</text>
      <!-- father 2n -->
      <circle cx="500" cy="100" r="46" fill="rgba(255,46,196,.07)" stroke="#ff2ec4" stroke-width="3"/>
      <g stroke="#ff2ec4" stroke-width="3" stroke-linecap="round">
        <path d="M 482 84 L 494 96 M 494 84 L 482 96"/>
        <path d="M 506 112 L 518 124 M 518 112 L 506 124"/>
      </g>
      <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
        <path d="M 506 84 L 518 96 M 518 84 L 506 96"/>
        <path d="M 482 112 L 494 124 M 494 112 L 482 124"/>
      </g>
      <text x="500" y="162" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">FATHER 2n = 4</text>
      <!-- meiosis arrows -->
      <text x="140" y="192" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">MEIOSIS halves</text>
      <line x1="140" y1="205" x2="140" y2="228" stroke="#ff2ec4" stroke-width="1.5" marker-end="url(#arrP)"/>
      <text x="500" y="192" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">MEIOSIS halves</text>
      <line x1="500" y1="205" x2="500" y2="228" stroke="#ff2ec4" stroke-width="1.5" marker-end="url(#arrP)"/>
      <!-- gametes n=2 -->
      <circle cx="140" cy="272" r="34" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="2.5"/>
      <g stroke="#ff2ec4" stroke-width="2.5" stroke-linecap="round">
        <path d="M 128 260 L 138 270 M 138 260 L 128 270"/>
      </g>
      <g stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
        <path d="M 152 278 L 162 288 M 162 278 L 152 288"/>
      </g>
      <text x="140" y="322" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">EGG n = 2</text>
      <circle cx="500" cy="272" r="34" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="2.5"/>
      <g stroke="#ff2ec4" stroke-width="2.5" stroke-linecap="round">
        <path d="M 488 260 L 498 270 M 498 260 L 488 270"/>
      </g>
      <g stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
        <path d="M 512 278 L 522 288 M 522 278 L 512 288"/>
      </g>
      <text x="500" y="322" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">SPERM n = 2</text>
      <!-- fusion arrows -->
      <line x1="176" y1="272" x2="272" y2="340" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrG)"/>
      <line x1="464" y1="272" x2="368" y2="340" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrG)"/>
      <text x="320" y="330" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">FUSION (fertilisation)</text>
      <!-- zygote 2n -->
      <circle cx="320" cy="392" r="42" fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-width="3"/>
      <g stroke="#ff2ec4" stroke-width="3" stroke-linecap="round">
        <path d="M 304 378 L 316 390 M 316 378 L 304 390"/>
        <path d="M 324 402 L 336 414 M 336 402 L 324 414"/>
      </g>
      <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
        <path d="M 336 378 L 348 390 M 348 378 L 336 390"/>
        <path d="M 304 402 L 316 414 M 316 402 L 304 414"/>
      </g>
      <text x="320" y="452" fill="#fbbf24" font-size="11.5" font-weight="800" text-anchor="middle">ZYGOTE 2n = 4 — two of each type</text>
      <defs>
        <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff2ec4"/></marker>
        <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
      </defs>
    </svg></body></html>
