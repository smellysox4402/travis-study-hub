<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="structure of a photosystem: an antenna array of about one hundred chlorophyll and accessory pigment molecules funnels excitation energy to a reaction centre with a special chlorophyll pair, P680 in photosystem II or P700 in photosystem I, which emits an excited electron">
      <rect x="0" y="0" width="660" height="340" rx="14" fill="#150a26"/>
      <defs>
        <marker id="arG2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ade80"/></marker>
        <marker id="arY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
      </defs>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE SOLAR PANELS — ONE PHOTOSYSTEM</text>
      <text x="330" y="46" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">antenna: ~100 chlorophyll + ~30 accessory pigments</text>

      <!-- photosystem body -->
      <rect x="170" y="76" width="320" height="140" rx="14" fill="rgba(34,211,238,0.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="330" y="96" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">PHOTOSYSTEM (in the thylakoid membrane)</text>

      <!-- antenna pigment circles -->
      <circle cx="205" cy="124" r="9" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="235" cy="114" r="9" fill="rgba(251,191,36,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="265" cy="128" r="9" fill="rgba(255,46,196,0.3)" stroke="#ff2ec4" stroke-width="1.5"/>
      <circle cx="295" cy="114" r="9" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="325" cy="126" r="9" fill="rgba(251,191,36,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="205" cy="164" r="9" fill="rgba(251,191,36,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="235" cy="154" r="9" fill="rgba(255,46,196,0.3)" stroke="#ff2ec4" stroke-width="1.5"/>
      <circle cx="265" cy="168" r="9" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="295" cy="156" r="9" fill="rgba(255,46,196,0.3)" stroke="#ff2ec4" stroke-width="1.5"/>
      <circle cx="325" cy="166" r="9" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1.5"/>

      <!-- energy funnel arrows -->
      <path d="M 300 130 L 348 128" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arY)"/>
      <path d="M 296 160 L 348 148" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arY)"/>
      <path d="M 330 100 L 356 128" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arY)"/>

      <!-- reaction centre -->
      <circle cx="372" cy="142" r="13" fill="rgba(255,46,196,0.25)" stroke="#ff2ec4" stroke-width="2.5"/>
      <circle cx="392" cy="142" r="13" fill="rgba(255,46,196,0.25)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="382" y="146" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800">RC</text>
      <text x="430" y="132" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">reaction centre:</text>
      <text x="430" y="150" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">special chlorophyll pair</text>

      <!-- excited electron -->
      <path d="M 382 128 C 400 100 420 80 460 64" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arG2)"/>
      <text x="465" y="58" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">excited electron emitted</text>
      <text x="465" y="76" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">captured by the electron transport chain</text>

      <!-- light in -->
      <path d="M 110 120 L 195 124" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arY)"/>
      <path d="M 110 148 L 195 148" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arY)"/>
      <text x="105" y="108" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">light in</text>
      <text x="105" y="176" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">photons strike any</text>
      <text x="105" y="192" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">antenna pigment</text>

      <text x="330" y="252" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">energy hops molecule to molecule in femtoseconds — funnelled to the centre, like a bucket chain</text>
      <text x="330" y="272" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">the array catches ~100× more photons than a lone molecule · a single pigment is useless alone</text>
      <text x="330" y="292" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10.5">in low light, more than 99% of absorbed photons still produce excited electrons</text>
      <text x="330" y="312" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">PSII's centre = P680 · PSI's centre = P700 (named for their absorption peaks)</text>
      <text x="330" y="330" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">PSII sits mostly in the grana; PSI mostly in the stroma lamellae</text>
    </svg></body></html>
