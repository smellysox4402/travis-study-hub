<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="circadian rhythm diagram: 24 hour timeline with day and night bands, melatonin curve rising in the evening peaking at night and falling at dawn, SCN clock in the hypothalamus controlling the pineal gland, blue light detected by retinal ganglion cells resets the clock">
      <rect width="660" height="380" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE NIGHT SHIFT — CIRCADIAN RHYTHM</text>

      <rect x="60" y="70" width="540" height="24" rx="6" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="150" y="86" fill="#fbbf24" font-size="9" text-anchor="middle">DAY ☀</text>
      <rect x="390" y="70" width="120" height="24" rx="6" fill="rgba(168,85,247,.25)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="450" y="86" fill="#a855f7" font-size="9" text-anchor="middle">NIGHT 🌙</text>
      <rect x="510" y="70" width="90" height="24" rx="6" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="555" y="86" fill="#fbbf24" font-size="9" text-anchor="middle">DAY ☀</text>
      <text x="60" y="62" fill="#b9a3d6" font-size="9" text-anchor="middle">morning</text>
      <text x="330" y="62" fill="#b9a3d6" font-size="9" text-anchor="middle">evening</text>
      <text x="600" y="62" fill="#b9a3d6" font-size="9" text-anchor="middle">dawn</text>
      <!-- melatonin curve -->
      <path d="M 60 300 C 150 300 200 300 230 300 C 280 300 330 150 390 130 C 450 110 480 170 510 230 C 540 290 570 300 600 300" fill="none" stroke="#22d3ee" stroke-width="3.5"/>
      <circle cx="390" cy="130" r="5" fill="#22d3ee"/>
      <text x="390" y="112" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">MELATONIN PEAK</text>
      <text x="390" y="126" fill="#b9a3d6" font-size="8.5" text-anchor="middle">night · deep sleep</text>
      <text x="205" y="318" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">rises at dusk → drowsy</text>
      <text x="530" y="318" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">falls at dawn → wake</text>
      <!-- clock chain -->
      <rect x="60" y="140" width="150" height="52" rx="10" fill="rgba(255,46,196,.07)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="135" y="158" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">RETINAL GANGLION CELLS</text>
      <text x="135" y="174" fill="#b9a3d6" font-size="8.5" text-anchor="middle">detect blue light 460–480 nm</text>
      <path d="M 210 166 L 252 166" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <rect x="256" y="140" width="150" height="52" rx="10" fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-width="2"/>
      <text x="331" y="158" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">SCN · HYPOTHALAMUS</text>
      <text x="331" y="174" fill="#b9a3d6" font-size="8.5" text-anchor="middle">the internal ~24 h clock</text>
      <path d="M 406 166 L 448 166" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <rect x="452" y="140" width="150" height="52" rx="10" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="527" y="158" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">PINEAL GLAND</text>
      <text x="527" y="174" fill="#b9a3d6" font-size="8.5" text-anchor="middle">secretes melatonin</text>
      <!-- melatonin to curve -->
      <path d="M 527 192 C 527 230 420 250 400 135" stroke="#4ade80" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)" fill="none"/>
      <!-- bottom -->
      <text x="330" y="366" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Without light cues the rhythm runs slightly longer than 24 h — light resets it daily</text>
    </svg></body></html>
