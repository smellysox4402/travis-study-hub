<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="three communication channels diagram: nervous signalling as a wired microphone from brain directly to a muscle, hormonal signalling as radio waves broadcast from a gland through the blood to cells with receptors, blood transport as a truck carrying glucose and oxygen while removing carbon dioxide">
      <rect width="660" height="380" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE THREE CHANNELS — HOW THE CONDUCTOR TALKS</text>
      <!-- brain centre -->
      <rect x="250" y="52" width="160" height="52" rx="12" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="330" y="72" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="middle">THE CONDUCTOR</text>
      <text x="330" y="90" fill="#b9a3d6" font-size="9.5" text-anchor="middle">brain · DJ + manager</text>

      <!-- channel 1: nervous (wired mic) -->
      <path d="M 250 78 L 120 78" stroke="#22d3ee" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <text x="185" y="68" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">WIRED MIC · nervous</text>
      <rect x="20" y="140" width="170" height="64" rx="10" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="2"/>
      <text x="105" y="160" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">MUSCLE / GLAND</text>
      <text x="105" y="176" fill="#b9a3d6" font-size="9.5" text-anchor="middle">one target, one message</text>
      <text x="105" y="192" fill="#b9a3d6" font-size="9.5" text-anchor="middle">milliseconds · precise</text>

      <!-- channel 2: hormonal (radio) -->
      <rect x="250" y="160" width="160" height="52" rx="12" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="330" y="180" fill="#a855f7" font-size="12" font-weight="900" text-anchor="middle">GLAND</text>
      <text x="330" y="198" fill="#b9a3d6" font-size="9.5" text-anchor="middle">broadcasts a hormone</text>
      <path d="M 330 212 C 330 260 160 250 150 300" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)" fill="none"/>
      <path d="M 330 212 C 330 280 500 260 510 300" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)" fill="none"/>
      <text x="330" y="248" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">RADIO SIGNAL · hormonal</text>
      <text x="330" y="264" fill="#b9a3d6" font-size="9.5" text-anchor="middle">reaches every cell —</text>
      <text x="330" y="278" fill="#b9a3d6" font-size="9.5" text-anchor="middle">only tuned-in receptors respond</text>
      <circle cx="150" cy="320" r="16" fill="rgba(168,85,247,.15)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="150" y="317" fill="#a855f7" font-size="8.5" text-anchor="middle">tuned</text>
      <text x="150" y="328" fill="#a855f7" font-size="8.5" text-anchor="middle">cell</text>
      <circle cx="510" cy="320" r="16" fill="rgba(168,85,247,.06)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="510" y="317" fill="#b9a3d6" font-size="8" text-anchor="middle">ignores</text>
      <text x="510" y="328" fill="#b9a3d6" font-size="8" text-anchor="middle">signal</text>

      <!-- channel 3: blood (roadies) -->
      <rect x="440" y="52" width="200" height="90" rx="12" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2.5"/>
      <text x="540" y="72" fill="#4ade80" font-size="11.5" font-weight="900" text-anchor="middle">BLOOD · the roadies</text>
      <text x="540" y="90" fill="#b9a3d6" font-size="9.5" text-anchor="middle">carries glucose · O₂ · amino acids</text>
      <text x="540" y="106" fill="#b9a3d6" font-size="9.5" text-anchor="middle">+ energy between organs</text>
      <text x="540" y="122" fill="#b9a3d6" font-size="9.5" text-anchor="middle">hauls away CO₂ + wastes</text>
      <path d="M 540 142 L 540 190" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="580" y="170" fill="#4ade80" font-size="9.5" text-anchor="middle">to every room</text>

      <!-- bottom note -->
      <text x="330" y="366" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Nerves = fast, focused · Hormones = slow, widespread · Blood = transport for both + everything else</text>
    </svg></body></html>
