<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="capillary network diagram: an arteriole branches into many narrow capillaries that weave through tissue and rejoin into a venule, with a zoomed circle showing a capillary wall one endothelium cell thick on a basement membrane, with a fenestration pore and red blood cells staying inside while plasma leaks out">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE VIP CORRIDORS — CAPILLARY NETWORK</text>
      <!-- arteriole -->
      <rect x="30" y="130" width="80" height="28" rx="14" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="70" y="148" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">ARTERIOLE</text>
      <text x="70" y="120" fill="#b9a3d6" font-size="10" text-anchor="middle">high pressure</text>
      <!-- venule -->
      <rect x="550" y="130" width="80" height="28" rx="14" fill="rgba(168,85,247,.15)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="590" y="148" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">VENULE</text>
      <text x="590" y="120" fill="#b9a3d6" font-size="10" text-anchor="middle">low pressure</text>
      <!-- capillary strands -->
      <path d="M 110 144 C 200 120 260 168 340 144 C 420 120 480 168 550 144" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
      <path d="M 110 144 C 180 96 260 90 350 108 C 430 122 490 120 550 144" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M 110 144 C 190 200 280 210 360 186 C 430 168 490 158 550 144" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M 110 144 C 220 168 300 150 380 176 C 450 196 500 170 550 144" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
      <text x="330" y="84" fill="#b9a3d6" font-size="10.5" text-anchor="middle">branch + rejoin → huge surface area</text>
      <text x="330" y="234" fill="#b9a3d6" font-size="10.5" text-anchor="middle">~10 µm — red blood cells squeeze through single file</text>
      <!-- zoom circle -->
      <circle cx="330" cy="284" r="46" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="330" y="252" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">ZOOM: WALL</text>
      <!-- wall rings inside zoom -->
      <circle cx="330" cy="288" r="26" fill="rgba(255,46,196,.06)" stroke="#ff2ec4" stroke-width="3"/>
      <circle cx="330" cy="288" r="32" fill="none" stroke="#b9a3d6" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- fenestration gap -->
      <path d="M 330 256 A 32 32 0 0 1 360 264" fill="none" stroke="#4ade80" stroke-width="3"/>
      <!-- rbc inside -->
      <circle cx="324" cy="292" r="4" fill="#ff2ec4"/>
      <circle cx="340" cy="296" r="4" fill="#ff2ec4"/>
      <circle cx="333" cy="282" r="3.5" fill="#ff2ec4"/>
      <!-- labels right of zoom -->
      <line x1="376" y1="262" x2="452" y2="262" stroke="#ff2ec4" stroke-width="1.2"/>
      <text x="458" y="260" fill="#f3e8ff" font-size="10" font-weight="700">endothelium — one cell thick</text>
      <text x="458" y="278" fill="#b9a3d6" font-size="9.5">basement membrane = protein gel filter</text>
      <line x1="360" y1="305" x2="452" y2="316" stroke="#4ade80" stroke-width="1.2"/>
      <text x="458" y="314" fill="#4ade80" font-size="10" font-weight="700">fenestration: big pore</text>
      <text x="458" y="332" fill="#b9a3d6" font-size="9.5">fast exchange (glomerulus, gut)</text>
      <text x="330" y="336" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">RBCs stay in · plasma leaks out → tissue fluid</text>
    </svg></body></html>
