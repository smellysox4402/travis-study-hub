<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="respirometer apparatus: a sealed flask holding a wire basket with living tissue and a filter-paper wick soaked in potassium hydroxide to absorb carbon dioxide, connected to a capillary tube containing a fluid drop that moves as oxygen is used up, the whole set-up inside a thermostatically controlled water bath, with an identical control flask without tissue on the left to correct for pressure and temperature changes">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE RESPIROMETER — MEASURING O₂ UPTAKE</text>

      <rect x="60" y="52" width="200" height="120" rx="9" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2"/>
      <text x="160" y="74" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">CONTROL FLASK</text>
      <text x="160" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">identical to test flask</text>
      <text x="160" y="112" fill="#b9a3d6" font-size="9" text-anchor="middle">NO respiring tissue</text>
      <text x="160" y="128" fill="#b9a3d6" font-size="9" text-anchor="middle">corrects for changes in</text>
      <text x="160" y="144" fill="#b9a3d6" font-size="9" text-anchor="middle">pressure + temperature</text>

      <rect x="400" y="52" width="200" height="120" rx="9" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="500" y="74" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">TEST FLASK</text>
      <text x="500" y="96" fill="#b9a3d6" font-size="9" text-anchor="middle">wire basket: living tissue</text>
      <text x="500" y="112" fill="#b9a3d6" font-size="9" text-anchor="middle">filter-paper wick + KOH</text>
      <text x="500" y="128" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">KOH absorbs ALL the CO₂</text>
      <text x="500" y="144" fill="#b9a3d6" font-size="9" text-anchor="middle">→ volume change = O₂ only</text>

      <rect x="275" y="82" width="110" height="20" rx="5" fill="rgba(74,222,128,.12)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="330" y="96" fill="#4ade80" font-size="8.5" font-weight="800" text-anchor="middle">CAPILLARY · FLUID</text>
      <path d="M 260 92 L 271 92" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah7)" fill="none"/>
      <defs><marker id="ah7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b9a3d6"/></marker></defs>
      <path d="M 389 92 L 400 92" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah7b)" fill="none"/>
      <defs><marker id="ah7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b9a3d6"/></marker></defs>
      <text x="330" y="70" fill="#b9a3d6" font-size="8.5" text-anchor="middle">fluid moves → O₂ consumed</text>

      <rect x="40" y="200" width="580" height="72" rx="9" fill="rgba(34,211,238,.07)" stroke="rgba(34,211,238,.5)" stroke-width="1.5"/>
      <text x="330" y="222" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">THERMOSTATICALLY CONTROLLED WATER BATH</text>
      <text x="330" y="244" fill="#b9a3d6" font-size="9.5" text-anchor="middle">constant temperature → no thermal expansion of air to fake a reading</text>
      <text x="330" y="262" fill="#b9a3d6" font-size="9.5" text-anchor="middle">heat from respiring organisms would otherwise expand the air and inflate the volume</text>

      <text x="330" y="306" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">rate = volume of O₂ used ÷ time  (e.g. 50 mm³ in 10 min = 5 mm³ min⁻¹)</text>
      <text x="330" y="330" fill="#b9a3d6" font-size="9.5" text-anchor="middle">convert mm of fluid movement to volume using the internal diameter of the capillary</text>
    </svg></body></html>
