<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hierarchy ladder of body subsystems: organelles inside cells, cells forming tissues, tissues forming organs, organs forming organ systems, organ systems forming the whole organism, with a note that the cheetah sprint emerges only when all systems integrate">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE CONDUCTOR — HIERARCHY OF SUBSYSTEMS</text>
      <!-- ladder rungs -->
      <rect x="230" y="52" width="200" height="38" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="68" fill="#ff2ec4" font-size="11.5" font-weight="800" text-anchor="middle">ORGANISM</text>
      <text x="330" y="82" fill="#b9a3d6" font-size="9.5" text-anchor="middle">the whole club — cheetah sprinting</text>

      <rect x="230" y="110" width="200" height="38" rx="9" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="330" y="126" fill="#a855f7" font-size="11.5" font-weight="800" text-anchor="middle">ORGAN SYSTEMS</text>
      <text x="330" y="140" fill="#b9a3d6" font-size="9.5" text-anchor="middle">11 in humans · e.g. circulatory</text>

      <rect x="230" y="168" width="200" height="38" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="184" fill="#fbbf24" font-size="11.5" font-weight="800" text-anchor="middle">ORGANS</text>
      <text x="330" y="198" fill="#b9a3d6" font-size="9.5" text-anchor="middle">groups of tissues · e.g. kidney</text>

      <rect x="230" y="226" width="200" height="38" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="330" y="242" fill="#22d3ee" font-size="11.5" font-weight="800" text-anchor="middle">TISSUES</text>
      <text x="330" y="256" fill="#b9a3d6" font-size="9.5" text-anchor="middle">groups of cells · sometimes 2+ types</text>

      <rect x="230" y="284" width="200" height="38" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="300" fill="#4ade80" font-size="11.5" font-weight="800" text-anchor="middle">CELLS</text>
      <text x="330" y="314" fill="#b9a3d6" font-size="9.5" text-anchor="middle">organelles are their components</text>

      <!-- up arrows between rungs -->
      <path d="M 330 90 L 330 106" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 330 148 L 330 164" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 330 206 L 330 222" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 330 264 L 330 280" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <!-- side notes -->
      <text x="60" y="200" fill="#ff2ec4" font-size="10.5" font-weight="700" text-anchor="middle">EMERGENT PROPERTY</text>
      <text x="60" y="216" fill="#b9a3d6" font-size="9.5" text-anchor="middle">sprint speed can't be</text>
      <text x="60" y="230" fill="#b9a3d6" font-size="9.5" text-anchor="middle">predicted from one system</text>
      <text x="600" y="200" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">FRAGILE CLUB</text>
      <text x="600" y="216" fill="#b9a3d6" font-size="9.5" text-anchor="middle">one failing cell group</text>
      <text x="600" y="230" fill="#b9a3d6" font-size="9.5" text-anchor="middle">(kidney) can kill the organism</text>
      <text x="330" y="346" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Each level is a subsystem of the level above — integration runs both ways</text>
    </svg></body></html>
