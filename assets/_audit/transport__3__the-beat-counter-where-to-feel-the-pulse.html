<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pulse measurement diagram: a wrist showing the radial pulse on the thumb side, a neck showing the carotid pulse in the groove beside the windpipe, a pressure wave line showing one wave per heartbeat, and a fingertip pulse oximeter using red and infrared light">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE BEAT COUNTER — WHERE TO FEEL THE PULSE</text>
      <!-- wrist -->
      <rect x="60" y="110" width="150" height="70" rx="30" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="135" y="90" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">RADIAL PULSE</text>
      <text x="135" y="106" fill="#b9a3d6" font-size="9.5" text-anchor="middle">wrist · thumb side</text>
      <circle cx="130" cy="145" r="8" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"/>
      <text x="135" y="160" fill="#b9a3d6" font-size="9" text-anchor="middle">feel here</text>
      <text x="135" y="204" fill="#b9a3d6" font-size="9.5" text-anchor="middle">artery runs over bone</text>
      <text x="135" y="220" fill="#b9a3d6" font-size="9.5" text-anchor="middle">near the surface</text>
      <!-- neck -->
      <rect x="60" y="244" width="150" height="70" rx="30" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2.5"/>
      <text x="135" y="234" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">CAROTID PULSE</text>
      <text x="135" y="250" fill="#b9a3d6" font-size="9.5" text-anchor="middle">neck · beside windpipe</text>
      <circle cx="130" cy="279" r="8" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"/>
      <text x="155" y="283" fill="#b9a3d6" font-size="9" text-anchor="middle">groove beside windpipe</text>
      <!-- pressure wave -->
      <path d="M 270 180 C 290 120 310 120 330 180 C 350 240 370 240 390 180 C 410 120 430 120 450 180 C 470 240 490 240 510 180" fill="none" stroke="#22d3ee" stroke-width="3"/>
      <text x="390" y="96" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">1 pulse = 1 heartbeat</text>
      <text x="390" y="112" fill="#b9a3d6" font-size="9.5" text-anchor="middle">pressure wave from left ventricle</text>
      <text x="390" y="262" fill="#b9a3d6" font-size="10" text-anchor="middle">count 30 s × 2 = bpm</text>
      <text x="390" y="280" fill="#b9a3d6" font-size="10" text-anchor="middle">rest ≈ 60–100 bpm</text>
      <!-- oximeter -->
      <rect x="540" y="150" width="90" height="80" rx="14" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="2.5"/>
      <text x="585" y="140" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">PULSE OXIMETER</text>
      <rect x="560" y="176" width="50" height="28" rx="8" fill="rgba(255,46,196,.3)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="585" y="194" fill="#ff2ec4" font-size="9" font-weight="800" text-anchor="middle">FINGER</text>
      <text x="585" y="222" fill="#b9a3d6" font-size="9" text-anchor="middle">red + IR light</text>
      <text x="585" y="238" fill="#b9a3d6" font-size="9" text-anchor="middle">absorption pulses</text>
      <text x="585" y="254" fill="#b9a3d6" font-size="9" text-anchor="middle">→ bpm + SpO₂</text>
      <text x="330" y="316" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">NEVER use your thumb — it has its own pulse and you'll count the wrong heart</text>
    </svg></body></html>
