<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the club power grid: fuel tank supplying glucose and fatty acids into the generator which oxidises carbon compounds to produce ATP tokens, with oxygen entering and carbon dioxide leaving by simple diffusion across the membrane, and a note that gas exchange and cell respiration are interdependent because respiration creates the concentration gradients that drive diffusion">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE POWER SYSTEM — RESPIRATION + GAS EXCHANGE</text>

      <rect x="40" y="60" width="150" height="88" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="115" y="82" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">FUEL TANK</text>
      <text x="115" y="104" fill="#b9a3d6" font-size="9" text-anchor="middle">glucose (main)</text>
      <text x="115" y="120" fill="#b9a3d6" font-size="9" text-anchor="middle">fatty acids (main)</text>
      <text x="115" y="136" fill="#b9a3d6" font-size="9" text-anchor="middle">+ wide range of C-compounds</text>

      <path d="M 194 104 L 238 104" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah4)" fill="none"/>
      <defs><marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker></defs>

      <rect x="244" y="60" width="190" height="88" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="339" y="82" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">THE GENERATOR</text>
      <text x="339" y="102" fill="#b9a3d6" font-size="9" text-anchor="middle">carbon compounds oxidised</text>
      <text x="339" y="118" fill="#b9a3d6" font-size="9" text-anchor="middle">energy released → used to</text>
      <text x="339" y="134" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">produce ATP</text>

      <path d="M 438 104 L 482 104" stroke="#4ade80" stroke-width="2" marker-end="url(#ah4b)" fill="none"/>
      <defs><marker id="ah4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker></defs>

      <rect x="488" y="60" width="132" height="88" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="554" y="82" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">ATP OUT</text>
      <text x="554" y="104" fill="#b9a3d6" font-size="9" text-anchor="middle">energy currency</text>
      <text x="554" y="120" fill="#b9a3d6" font-size="9" text-anchor="middle">powers the club</text>

      <rect x="40" y="196" width="580" height="100" rx="9" fill="rgba(34,211,238,.07)" stroke="rgba(34,211,238,.5)" stroke-width="1.5"/>
      <text x="330" y="218" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">GAS EXCHANGE — O₂ IN, CO₂ OUT (simple diffusion, independently)</text>
      <text x="330" y="240" fill="#b9a3d6" font-size="9.5" text-anchor="middle">O₂ enters cells through the plasma membrane · CO₂ exits the same way</text>
      <text x="330" y="258" fill="#b9a3d6" font-size="9.5" text-anchor="middle">not a one-for-one swap — both move by simple diffusion, driven by gradients</text>
      <text x="330" y="280" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">respiration creates the O₂/CO₂ gradients · gradients drive gas exchange → interdependent</text>

      <text x="330" y="330" fill="#b9a3d6" font-size="10" text-anchor="middle">without gas exchange respiration stops (no O₂, excess CO₂) · without respiration gas exchange stops (no gradients)</text>
    </svg></body></html>
