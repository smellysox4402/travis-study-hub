<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 370" role="img" aria-label="Rutherford gold foil experiment: alpha particles fired at a gold foil, most pass straight through, some deflect, a few bounce back from the nucleus">
      <rect x="0" y="0" width="640" height="370" rx="18" fill="#1d0f33"/>
      <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#f3e8ff" font-family="Segoe UI">RUTHERFORD 1911 — SHOOTING BULLETS AT GOLD FOIL</text>
      <!-- alpha source -->
      <rect x="18" y="150" width="66" height="46" rx="8" fill="#150a26" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="51" y="171" text-anchor="middle" font-size="10" fill="#ff2ec4" font-family="Segoe UI" font-weight="700">α SOURCE</text>
      <text x="51" y="186" text-anchor="middle" font-size="9" fill="#b9a3d6" font-family="Segoe UI">alpha particles</text>
      <!-- gold foil -->
      <line x1="250" y1="70" x2="250" y2="330" stroke="#fbbf24" stroke-width="3"/>
      <text x="250" y="342" text-anchor="middle" font-size="11" fill="#fbbf24" font-family="Segoe UI" font-weight="700">gold foil</text>
      <!-- nucleus -->
      <circle cx="250" cy="210" r="10" fill="#ff2ec4"/>
      <text x="250" y="214" text-anchor="middle" font-size="11" font-weight="900" fill="#0b0214" font-family="Segoe UI">+</text>
      <!-- undeflected rays -->
      <line x1="86" y1="158" x2="240" y2="178" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="86" y1="175" x2="240" y2="200" stroke="#22d3ee" stroke-width="2.5"/>
      <line x1="86" y1="192" x2="240" y2="240" stroke="#22d3ee" stroke-width="2.5"/>
      <!-- deflected ray -->
      <path d="M86,205 L240,235 L330,270" fill="none" stroke="#a855f7" stroke-width="2.5"/>
      <path d="M86,170 L240,186 L330,160" fill="none" stroke="#a855f7" stroke-width="2.5"/>
      <!-- bouncing ray -->
      <path d="M86,188 L240,214 L120,260" fill="none" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="118" y="282" text-anchor="middle" font-size="10" fill="#ff2ec4" font-family="Segoe UI" font-weight="700">BOUNCES BACK!</text>
      <!-- detector -->
      <path d="M330,110 A160,150 0 0 1 560,270" fill="none" stroke="#b9a3d6" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="560" y="252" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">movable detector</text>
      <!-- observations -->
      <text x="430" y="110" text-anchor="middle" font-size="12" fill="#22d3ee" font-family="Segoe UI" font-weight="700">MOST: straight through</text>
      <text x="430" y="128" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">→ atom is mostly empty space</text>
      <text x="390" y="160" text-anchor="middle" font-size="12" fill="#a855f7" font-family="Segoe UI" font-weight="700">SOME: deflect slightly</text>
      <text x="390" y="178" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">→ pass near a positive nucleus</text>
      <text x="452" y="322" text-anchor="middle" font-size="12" fill="#ff2ec4" font-family="Segoe UI" font-weight="700">A FEW: bounce straight back</text>
      <text x="452" y="340" text-anchor="middle" font-size="10" fill="#b9a3d6" font-family="Segoe UI">→ tiny, dense, positive nucleus</text>
      <text x="320" y="362" text-anchor="middle" font-size="12" fill="#22d3ee" font-family="Segoe UI" font-weight="700">conclusion: the plum-pudding model is dead — long live the nuclear atom</text>
    </svg></body></html>
