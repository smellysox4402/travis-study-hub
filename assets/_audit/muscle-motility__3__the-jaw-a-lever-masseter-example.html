<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of the jaw as a lever: fulcrum at the joint, effort from the masseter muscle, load at the front teeth">
      <rect width="640" height="340" rx="14" fill="#150a26"/>
      <text x="320" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE JAW = A LEVER (masseter example)</text>
      <!-- skull -->
      <circle cx="90" cy="140" r="46" fill="rgba(185,163,214,.14)" stroke="#b9a3d6" stroke-width="3"/>
      <circle cx="70" cy="128" r="10" fill="rgba(185,163,214,.25)"/>
      <circle cx="108" cy="122" r="8" fill="rgba(185,163,214,.25)"/>
      <!-- mandible -->
      <path d="M 96 186 L 300 240 L 360 250 L 400 258" stroke="#b9a3d6" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 96 186 L 96 178" stroke="#b9a3d6" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- fulcrum -->
      <circle cx="96" cy="182" r="10" fill="#fbbf24"/>
      <text x="96" y="252" fill="#fbbf24" font-size="11.5" font-weight="800" text-anchor="middle">FULCRUM = jaw joint</text>
      <line x1="96" y1="192" x2="96" y2="242" stroke="#fbbf24" stroke-width="1.2"/>
      <!-- effort: masseter -->
      <path d="M 120 105 L 175 205" stroke="#ff2ec4" stroke-width="14" stroke-linecap="round" opacity=".85"/>
      <text x="150" y="98" fill="#ff2ec4" font-size="11.5" font-weight="800" text-anchor="middle">EFFORT = masseter muscle</text>
      <line x1="150" y1="110" x2="148" y2="160" stroke="#ff2ec4" stroke-width="1.2"/>
      <text x="150" y="176" fill="#ff2ec4" font-size="10.5" font-weight="700" text-anchor="middle">(origin: cheekbone · insertion: jawbone)</text>
      <!-- load -->
      <path d="M 400 240 L 400 150" stroke="#22d3ee" stroke-width="5" marker-end="url(#arr)"/>
      <text x="412" y="170" fill="#22d3ee" font-size="11.5" font-weight="800">LOAD = force at</text>
      <text x="412" y="189" fill="#22d3ee" font-size="11.5" font-weight="800">the front teeth</text>
      <!-- arrow def -->
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M 0 0 L 8 4 L 0 8 Z" fill="#22d3ee"/>
        </marker>
      </defs>
      <text x="320" y="308" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">effort sits NEAR the fulcrum → the jaw trades force for range of movement</text>
    </svg></body></html>
