<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="three rooms where ATP tokens are spent: the synthesis bar where monomers link into DNA RNA and protein using one or more ATP per link; the pump room where an ion pump protein changes conformation to push ions against the gradient; and the dance floor where chromosomes move in mitosis, cells pinch in cytokinesis, phagocytes crawl and muscle actin and myosin filaments slide">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">TOKENS AT WORK — THREE WAYS ATP GETS SPENT</text>

      <rect x="30" y="52" width="192" height="180" rx="9" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="126" y="72" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">1 · SYNTHESIS BAR</text>
      <text x="126" y="94" fill="#b9a3d6" font-size="9" text-anchor="middle">monomers → polymers</text>
      <text x="126" y="110" fill="#b9a3d6" font-size="9" text-anchor="middle">DNA replication</text>
      <text x="126" y="126" fill="#b9a3d6" font-size="9" text-anchor="middle">RNA transcription</text>
      <text x="126" y="142" fill="#b9a3d6" font-size="9" text-anchor="middle">protein translation</text>
      <text x="126" y="166" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">≥1 ATP per monomer link</text>
      <text x="126" y="200" fill="#b9a3d6" font-size="9" text-anchor="middle">anabolic · endothermic</text>
      <text x="126" y="216" fill="#b9a3d6" font-size="9" text-anchor="middle">coupled to ATP → ADP</text>

      <rect x="234" y="52" width="192" height="180" rx="9" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2"/>
      <text x="330" y="72" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">2 · PUMP ROOM</text>
      <text x="330" y="94" fill="#b9a3d6" font-size="9" text-anchor="middle">ions against gradient</text>
      <rect x="258" y="104" width="144" height="34" rx="7" fill="rgba(34,211,238,.12)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="330" y="125" fill="#22d3ee" font-size="8.5" font-weight="800" text-anchor="middle">PUMP PROTEIN</text>
      <text x="330" y="154" fill="#b9a3d6" font-size="9" text-anchor="middle">ATP changes its SHAPE</text>
      <text x="330" y="170" fill="#b9a3d6" font-size="9" text-anchor="middle">(conformational change)</text>
      <text x="330" y="186" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">particle in one shape, out the other</text>
      <text x="330" y="210" fill="#b9a3d6" font-size="9" text-anchor="middle">stable → less stable shape costs ATP</text>

      <rect x="438" y="52" width="192" height="180" rx="9" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="2"/>
      <text x="534" y="72" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">3 · DANCE FLOOR</text>
      <text x="534" y="94" fill="#b9a3d6" font-size="9" text-anchor="middle">chromosomes → poles (mitosis)</text>
      <text x="534" y="110" fill="#b9a3d6" font-size="9" text-anchor="middle">vesicles moved</text>
      <text x="534" y="126" fill="#b9a3d6" font-size="9" text-anchor="middle">cytokinesis pinch</text>
      <text x="534" y="142" fill="#b9a3d6" font-size="9" text-anchor="middle">phagocytes crawl</text>
      <text x="534" y="158" fill="#b9a3d6" font-size="9" text-anchor="middle">muscle: actin + myosin slide</text>
      <text x="534" y="186" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">big moves = many ATP</text>

      <text x="330" y="272" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Every process spends the same token: ATP → ADP + phosphate (Pi) + energy</text>
      <text x="330" y="310" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">muscle cramp? neurons silent? = the tokens ran out</text>
      <text x="330" y="336" fill="#b9a3d6" font-size="9.5" text-anchor="middle">without ATP, cells start to degrade within minutes — damage soon irreparable</text>
    </svg></body></html>
