<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 350" role="img" aria-label="Colour wheel showing complementary colours and d-orbital splitting in a complex ion">
      <defs>
        <marker id="arrCW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
      </defs>
      <rect x="0" y="0" width="640" height="350" rx="18" fill="#1d0f33"/>
      <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#f3e8ff" font-family="Segoe UI">THE COLOUR WHEEL — ABSORB ONE, SEE ITS OPPOSITE</text>
      <!-- colour wheel -->
      <circle cx="200" cy="180" r="90" fill="none" stroke="#b9a3d6" stroke-width="1.5"/>
      <path d="M200,90 A90,90 0 0 1 278,128 L242,155 A45,45 0 0 0 200,135 Z" fill="#ff2ec4"/>
      <path d="M278,128 A90,90 0 0 1 290,180 L245,180 A45,45 0 0 0 242,155 Z" fill="#ff7a45"/>
      <path d="M290,180 A90,90 0 0 1 278,232 L242,205 A45,45 0 0 0 245,180 Z" fill="#fbbf24"/>
      <path d="M278,232 A90,90 0 0 1 200,270 L200,225 A45,45 0 0 0 242,205 Z" fill="#4ade80"/>
      <path d="M200,270 A90,90 0 0 1 122,232 L158,205 A45,45 0 0 0 200,225 Z" fill="#22d3ee"/>
      <path d="M122,232 A90,90 0 0 1 110,180 L155,180 A45,45 0 0 0 158,205 Z" fill="#a855f7"/>
      <path d="M110,180 A90,90 0 0 1 122,128 L158,155 A45,45 0 0 0 155,180 Z" fill="#4ade80" opacity=".7"/>
      <path d="M122,128 A90,90 0 0 1 200,90 L200,135 A45,45 0 0 0 158,155 Z" fill="#fbbf24" opacity=".7"/>
      <!-- labels -->
      <text x="200" y="72" text-anchor="middle" font-size="10" fill="#ff2ec4" font-family="Segoe UI">red 700</text>
      <text x="300" y="110" text-anchor="middle" font-size="10" fill="#ff7a45" font-family="Segoe UI">orange 647</text>
      <text x="312" y="178" text-anchor="middle" font-size="10" fill="#fbbf24" font-family="Segoe UI">yellow 585</text>
      <text x="298" y="248" text-anchor="middle" font-size="10" fill="#4ade80" font-family="Segoe UI">green 491</text>
      <text x="196" y="292" text-anchor="middle" font-size="10" fill="#22d3ee" font-family="Segoe UI">blue 424</text>
      <text x="92" y="248" text-anchor="middle" font-size="10" fill="#a855f7" font-family="Segoe UI">violet 400</text>
      <!-- complementary pair arrows -->
      <line x1="200" y1="135" x2="200" y2="225" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCW)"/>
      <text x="172" y="190" font-size="9" fill="#22d3ee" font-family="Segoe UI">complements</text>
      <!-- d splitting -->
      <rect x="360" y="70" width="240" height="250" rx="12" fill="#150a26" stroke="#a855f7" stroke-width="1.2"/>
      <text x="480" y="94" text-anchor="middle" font-size="13" font-weight="800" fill="#f3e8ff" font-family="Segoe UI">d-ORBITAL SPLITTING</text>
      <line x1="400" y1="110" x2="560" y2="110" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="575" y="114" font-size="10" fill="#22d3ee" font-family="Segoe UI">upper set</text>
      <line x1="400" y1="200" x2="560" y2="200" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="575" y="204" font-size="10" fill="#ff2ec4" font-family="Segoe UI">lower set</text>
      <line x1="480" y1="110" x2="480" y2="200" stroke="#4ade80" stroke-width="2" marker-end="url(#arrCW)"/>
      <text x="470" y="162" font-size="9" fill="#4ade80" font-family="Segoe UI">ΔE</text>
      <text x="440" y="226" font-size="10" fill="#b9a3d6" font-family="Segoe UI">free ion: 5 degenerate d orbitals</text>
      <text x="440" y="242" font-size="10" fill="#b9a3d6" font-family="Segoe UI">complex: split by ligands</text>
      <text x="440" y="268" font-size="10" fill="#4ade80" font-family="Segoe UI">ΔE matches visible λ absorbed</text>
      <text x="440" y="284" font-size="10" fill="#f3e8ff" font-family="Segoe UI">[CuCl₄]²⁻ absorbs 491 nm →</text>
      <text x="440" y="298" font-size="10" fill="#ff2ec4" font-family="Segoe UI" font-weight="700">appears orange-red (647 nm)</text>
      <text x="320" y="336" text-anchor="middle" font-size="12" fill="#22d3ee" font-family="Segoe UI" font-weight="700">stronger ligand → bigger split → higher-energy (shorter λ) light absorbed</text>
    </svg></body></html>
