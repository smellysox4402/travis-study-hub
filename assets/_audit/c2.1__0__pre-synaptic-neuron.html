<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a chemical synapse: acetylcholine crossing the cleft and opening a ligand-gated sodium channel">
          <rect width="640" height="440" rx="14" fill="#150a26"/>
          <!-- presynaptic terminal -->
          <path d="M 60 80 C 150 58 212 90 216 160 L 219 265 C 219 322 160 372 70 362 C 20 357 25 292 28 212 C 30 142 25 97 60 80 Z" fill="rgba(168,85,247,.13)" stroke="#a855f7" stroke-width="3"/>
          <text x="58" y="58" fill="#a855f7" font-size="13" font-weight="800">PRE-SYNAPTIC NEURON</text>
          <!-- Ca2+ entry: nerve impulse trigger (textbook C2.1.8 sequence) -->
          <line x1="170" y1="26" x2="170" y2="52" stroke="#67e8f9" stroke-width="2.5"/>
          <polygon points="166,44 170,56 174,44" fill="#67e8f9"/>
          <text x="170" y="20" fill="#67e8f9" font-size="10.5" font-weight="800" text-anchor="middle">nerve impulse</text>
          <text x="144" y="72" fill="#67e8f9" font-size="9.5" font-weight="800">Ca²⁺</text>
          <text x="168" y="72" fill="#67e8f9" font-size="9.5" font-weight="800">Ca²⁺</text>
          <text x="192" y="72" fill="#67e8f9" font-size="9.5" font-weight="800">Ca²⁺</text>
          <text x="160" y="98" fill="#67e8f9" font-size="9.5" font-weight="700">Ca²⁺ in → fuse</text>
          <!-- vesicles -->
          <circle cx="118" cy="150" r="14" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="2.5"/>
          <circle cx="120" cy="152" r="4" fill="#fbbf24"/>
          <circle cx="162" cy="205" r="14" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="2.5"/>
          <circle cx="164" cy="207" r="4" fill="#fbbf24"/>
          <circle cx="108" cy="250" r="14" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="2.5"/>
          <circle cx="110" cy="252" r="4" fill="#fbbf24"/>
          <text x="62" y="296" fill="#fbbf24" font-size="11" font-weight="700">vesicles = ACh</text>
          <text x="62" y="313" fill="#fbbf24" font-size="11" font-weight="700">in packets</text>
          <!-- fusing vesicle at membrane -->
          <circle cx="212" cy="185" r="12" fill="rgba(251,191,36,.2)" stroke="#fbbf24" stroke-width="2"/>
          <circle cx="224" cy="183" r="3.5" fill="#fbbf24"/>
          <!-- cleft -->
          <rect x="222" y="150" width="70" height="215" rx="10" fill="rgba(34,211,238,.07)"/>
          <text x="240" y="135" fill="#67e8f9" font-size="10" font-weight="800" text-anchor="middle">SYNAPTIC CLEFT</text>
          <!-- ACh dots crossing -->
          <circle cx="240" cy="200" r="6" fill="#fbbf24"/>
          <circle cx="258" cy="218" r="6" fill="#fbbf24"/>
          <circle cx="244" cy="240" r="6" fill="#fbbf24"/>
          <text x="258" y="262" fill="#fbbf24" font-size="11" font-weight="800">ACh</text>
          <!-- postsynaptic membrane -->
          <rect x="292" y="120" width="18" height="280" rx="6" fill="rgba(34,211,238,.2)" stroke="#22d3ee" stroke-width="2.5"/>
          <text x="301" y="105" fill="#22d3ee" font-size="13" font-weight="800">POST-SYNAPTIC CELL</text>
          <!-- ligand-gated channel -->
          <rect x="294" y="170" width="14" height="95" rx="4" fill="#ff2ec4"/>
          <rect x="298" y="182" width="6" height="72" rx="3" fill="#150a26"/>
          <text x="352" y="186" fill="#ff2ec4" font-size="11.5" font-weight="800">ligand-gated</text>
          <text x="352" y="203" fill="#ff2ec4" font-size="11.5" font-weight="800">Na⁺ channel</text>
          <text x="352" y="220" fill="#ff2ec4" font-size="11.5" font-weight="800">(opens)</text>
          <line x1="343" y1="205" x2="310" y2="212" stroke="#ff2ec4" stroke-width="1.5"/>
          <!-- Na+ flow -->
          <circle cx="330" cy="235" r="9" fill="#f87171"/><text x="326" y="239" fill="#fff" font-size="9" font-weight="800">Na⁺</text>
          <circle cx="362" cy="255" r="9" fill="#f87171"/><text x="358" y="259" fill="#fff" font-size="9" font-weight="800">Na⁺</circle>
          <circle cx="394" cy="275" r="9" fill="#f87171"/><text x="390" y="279" fill="#fff" font-size="9" font-weight="800">Na⁺</text>
          <text x="472" y="260" fill="#f87171" font-size="11.5" font-weight="800">Na⁺ floods in →</text>
          <text x="472" y="278" fill="#f87171" font-size="11.5" font-weight="800">local depolarisation</text>
          <line x1="463" y1="240" x2="410" y2="270" stroke="#f87171" stroke-width="1.5"/>
          <!-- acetylcholinesterase -->
          <circle cx="252" cy="330" r="13" fill="#4ade80"/>
          <path d="M 252 330 L 241 320 A 13 13 0 0 0 241 340 Z" fill="#150a26"/>
          <text x="276" y="336" fill="#4ade80" font-size="11" font-weight="800">AChE chews up ACh →</text>
          <text x="276" y="368" fill="#4ade80" font-size="11" font-weight="800">no continued stimulation</text>
          <circle cx="233" cy="355" r="3.5" fill="#fbbf24"/>
          <circle cx="245" cy="360" r="3" fill="#fbbf24"/>
        </svg></body></html>
