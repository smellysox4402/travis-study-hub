<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dashboard of four homeostatic set point dials in a nightclub mixer: core temperature 37 degrees, blood pH 7.4, blood glucose 5 mmol per litre and blood osmotic concentration 300 milliosmoles, each with a tolerance band and a needle pinned at the set point">
      <rect width="660" height="320" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">CLUB SETPOINT — THE FOUR DIALS</text>
      <!-- dial 1: temperature -->
      <g>
        <circle cx="110" cy="160" r="72" fill="rgba(255,46,196,.05)" stroke="#ff2ec4" stroke-width="2.5"/>
        <path d="M 110 160 A 72 72 0 0 1 179 122" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
        <path d="M 41 122 A 72 72 0 0 1 110 88" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
        <line x1="110" y1="160" x2="152" y2="106" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
        <circle cx="110" cy="160" r="7" fill="#fbbf24"/>
        <text x="110" y="252" fill="#f3e8ff" font-size="15" font-weight="900" text-anchor="middle">37°C</text>
        <text x="110" y="272" fill="#b9a3d6" font-size="11" text-anchor="middle">core temperature</text>
        <text x="110" y="292" fill="#b9a3d6" font-size="10.5" text-anchor="middle">36–38°C band</text>
      </g>
      <!-- dial 2: pH -->
      <g>
        <circle cx="286" cy="160" r="72" fill="rgba(168,85,247,.05)" stroke="#a855f7" stroke-width="2.5"/>
        <path d="M 286 160 A 72 72 0 0 1 355 122" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
        <path d="M 217 122 A 72 72 0 0 1 286 88" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
        <line x1="286" y1="160" x2="326" y2="104" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
        <circle cx="286" cy="160" r="7" fill="#fbbf24"/>
        <text x="286" y="252" fill="#f3e8ff" font-size="15" font-weight="900" text-anchor="middle">pH 7.4</text>
        <text x="286" y="272" fill="#b9a3d6" font-size="11" text-anchor="middle">blood pH</text>
        <text x="286" y="292" fill="#b9a3d6" font-size="10.5" text-anchor="middle">7.35–7.45 band</text>
      </g>
      <!-- dial 3: glucose -->
      <g>
        <circle cx="462" cy="160" r="72" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
        <path d="M 462 160 A 72 72 0 0 1 531 122" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
        <path d="M 393 122 A 72 72 0 0 1 462 88" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
        <line x1="462" y1="160" x2="502" y2="104" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
        <circle cx="462" cy="160" r="7" fill="#fbbf24"/>
        <text x="462" y="252" fill="#f3e8ff" font-size="15" font-weight="900" text-anchor="middle">≈5 mmol L⁻¹</text>
        <text x="462" y="272" fill="#b9a3d6" font-size="11" text-anchor="middle">blood glucose</text>
        <text x="462" y="292" fill="#b9a3d6" font-size="10.5" text-anchor="middle">narrow range</text>
      </g>
      <!-- dial 4: osmolarity -->
      <g>
        <circle cx="582" cy="130" r="58" fill="rgba(74,222,128,.05)" stroke="#4ade80" stroke-width="2.5"/>
        <line x1="582" y1="130" x2="612" y2="92" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
        <circle cx="582" cy="130" r="6" fill="#fbbf24"/>
        <text x="582" y="212" fill="#f3e8ff" font-size="14" font-weight="900" text-anchor="middle">≈300 mOsm</text>
        <text x="582" y="232" fill="#b9a3d6" font-size="11" text-anchor="middle">blood osmolarity</text>
        <text x="582" y="252" fill="#b9a3d6" font-size="10.5" text-anchor="middle">osmoles L⁻¹</text>
      </g>
      <text x="330" y="310" fill="#b9a3d6" font-size="11" text-anchor="middle">Needle pinned on the set point — every system on this page exists to drag it back when it drifts</text>
    </svg></body></html>
