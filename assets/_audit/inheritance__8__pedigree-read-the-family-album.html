<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled pedigree chart showing three generations: unaffected carrier parents produce an affected child in generation 2, demonstrating a recessive inheritance pattern, with squares for males circles for females and shading for affected">
      <rect width="640" height="460" rx="14" fill="#150a26"/>

      <text x="320" y="48" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">key: □ male · ○ female · ■/● affected · half-filled = carrier (assumed)</text>
      <!-- generation I -->
      <text x="52" y="118" fill="#22d3ee" font-size="13" font-weight="900">I</text>
      <rect x="150" y="104" width="34" height="34" fill="rgba(255,46,196,.08)" stroke="#b9a3d6" stroke-width="2"/>
      <text x="167" y="152" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">1</text>

      <text x="260" y="125" fill="#fbbf24" font-size="9.5" font-weight="700">both carriers (Aa)</text>
      <!-- generation II -->
      <line x1="167" y1="138" x2="167" y2="190" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="167" y1="190" x2="384" y2="190" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="257" y1="190" x2="257" y2="223" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="320" y1="190" x2="320" y2="223" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="384" y1="190" x2="384" y2="223" stroke="#b9a3d6" stroke-width="2"/>
      <text x="52" y="248" fill="#22d3ee" font-size="13" font-weight="900">II</text>
      <circle cx="167" cy="206" r="17" fill="rgba(255,46,196,.08)" stroke="#b9a3d6" stroke-width="2"/>
      <text x="167" y="236" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">1</text>
      <rect x="240" y="189" width="34" height="34" fill="rgba(255,46,196,.25)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="257" y="236" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">2</text>
      <circle cx="320" cy="206" r="17" fill="rgba(255,46,196,.08)" stroke="#b9a3d6" stroke-width="2"/>
      <text x="320" y="236" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">3</text>
      <circle cx="384" cy="206" r="17" fill="rgba(255,46,196,.08)" stroke="#b9a3d6" stroke-width="2"/>
      <text x="384" y="236" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">4</text>
      <text x="257" y="268" fill="#ff2ec4" font-size="10" font-weight="900" text-anchor="middle">AFFECTED (aa)</text>
      <text x="300" y="268" fill="#b9a3d6" font-size="9.5" font-weight="700">siblings 1,3,4 unaffected</text>
      <!-- generation III -->
      <text x="52" y="378" fill="#22d3ee" font-size="13" font-weight="900">III</text>
      <line x1="257" y1="272" x2="257" y2="318" stroke="#b9a3d6" stroke-width="2"/>

      <line x1="257" y1="318" x2="257" y2="351" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="320" y1="318" x2="320" y2="351" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="389" y1="318" x2="389" y2="351" stroke="#b9a3d6" stroke-width="2"/>
      <rect x="240" y="334" width="34" height="34" fill="rgba(255,46,196,.08)" stroke="#b9a3d6" stroke-width="2"/>
      <text x="257" y="382" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">1</text>
      <circle cx="320" cy="351" r="17" fill="rgba(255,46,196,.08)" stroke="#b9a3d6" stroke-width="2"/>
      <text x="320" y="382" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">2</text>

      <text x="389" y="382" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">3</text>
      <text x="320" y="408" fill="#4ade80" font-size="11" font-weight="900" text-anchor="middle">again: unaffected parents → affected child = RECESSIVE</text>
      <text x="320" y="430" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">trait skips a generation · carriers invisible unless marked</text>
      <text x="320" y="448" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">dominant pattern: affected child ALWAYS has an affected parent</text>
    </svg></body></html>
