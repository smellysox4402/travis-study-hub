<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pregnancy test stick drawn as a rent check slip: urine flows from the tip past a mobile anti-hCG antibody with blue dye to an immobilised antibody test line and a control line, two blue bands means positive, with notes that hCG keeps the corpus luteum producing progesterone until the placenta takes over at 8 to 12 weeks">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE RENT CHECK — hCG PREGNANCY TESTING (AHL)</text>

      <rect x="60" y="120" width="540" height="66" rx="9" fill="rgba(243,232,255,.06)" stroke="#b9a3d6" stroke-width="2"/>
      <rect x="60" y="120" width="80" height="66" rx="9" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="100" y="150" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">urine sample</text>
      <text x="100" y="166" fill="#b9a3d6" font-size="8" text-anchor="middle">hCG present?</text>
      <rect x="180" y="120" width="110" height="66" rx="9" fill="rgba(34,211,238,.12)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="235" y="150" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">mobile anti-hCG</text>
      <text x="235" y="166" fill="#b9a3d6" font-size="8" text-anchor="middle">antibody + blue dye</text>
      <rect x="340" y="120" width="80" height="66" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="1.5"/>
      <rect x="355" y="148" width="50" height="10" rx="4" fill="#60a5fa"/>
      <rect x="460" y="120" width="80" height="66" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="1.5"/>
      <rect x="475" y="148" width="50" height="10" rx="4" fill="#60a5fa"/>

      <text x="235" y="110" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">mobile antibody + dye</text>
      <text x="380" y="110" fill="#ff2ec4" font-size="9" font-weight="800" text-anchor="middle">test line (C)</text>
      <text x="500" y="110" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">control (D)</text>

      <path d="M 145 153 L 173 153" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 295 153 L 333 153" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 425 153 L 453 153" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="500" y="205" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">2 blue bands = POSITIVE ✓</text>

      <rect x="60" y="220" width="260" height="78" rx="9" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="190" y="240" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">hCG = the tenant's 'alive' signal</text>
      <text x="190" y="256" fill="#b9a3d6" font-size="9" text-anchor="middle">trophoblast → hCG → corpus luteum</text>
      <text x="190" y="270" fill="#b9a3d6" font-size="9" text-anchor="middle">→ progesterone → endometrium kept</text>
      <text x="190" y="284" fill="#b9a3d6" font-size="8.5" text-anchor="middle">prevents miscarriage</text>

      <rect x="340" y="220" width="260" height="78" rx="9" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="470" y="240" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">~8–12 weeks: placenta takes over</text>
      <text x="470" y="256" fill="#b9a3d6" font-size="9" text-anchor="middle">progesterone secretion</text>
      <text x="470" y="270" fill="#b9a3d6" font-size="9" text-anchor="middle">corpus luteum degenerates</text>
      <text x="470" y="284" fill="#b9a3d6" font-size="8.5" text-anchor="middle">hCG in urine = the clue</text>

      <text x="330" y="336" fill="#b9a3d6" font-size="9.5" text-anchor="middle">2 blue bands = pregnant · control band proves the test worked — monoclonal antibodies do the detecting</text>
    </svg></body></html>
