<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="nephron structure diagram: glomerulus inside bowman's capsule, proximal convoluted tubule, loop of henle with descending and ascending limbs in the medulla, distal convoluted tubule, collecting duct, vasa recta, cortex and medulla labelled">
      <rect width="660" height="460" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE KIDNEY CLUB — ONE NEPHRON</text>
      <!-- cortex band -->
      <rect x="20" y="60" width="620" height="120" rx="8" fill="rgba(168,85,247,.05)" stroke="none"/>
      <text x="330" y="78" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">CORTEX (outer)</text>
      <!-- medulla band -->
      <rect x="20" y="180" width="620" height="240" rx="8" fill="rgba(34,211,238,.04)" stroke="none"/>
      <text x="330" y="406" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">MEDULLA (inner — salty gradient 300 → 1200 mOsm)</text>
      <!-- glomerulus + bowman's -->
      <circle cx="180" cy="120" r="26" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="180" y="124" fill="#ff2ec4" font-size="9" text-anchor="middle">glomerulus</text>
      <path d="M 180 94 A 40 40 0 0 1 220 130 A 40 40 0 0 1 180 168 A 40 40 0 0 1 150 130 A 30 30 0 0 1 180 94 Z" fill="none" stroke="#a855f7" stroke-width="2.5"/>
      <text x="180" y="185" fill="#a855f7" font-size="9.5" text-anchor="middle">Bowman's capsule</text>
      <!-- PCT -->
      <path d="M 220 130 C 280 110 320 100 340 120 C 360 140 380 130 380 110" fill="none" stroke="#fbbf24" stroke-width="3"/>
      <text x="300" y="100" fill="#fbbf24" font-size="9.5" text-anchor="middle">PCT</text>
      <!-- loop of Henle -->
      <path d="M 380 110 C 380 170 340 300 320 340 C 300 380 280 300 260 340 C 240 380 230 240 230 180" fill="none" stroke="#4ade80" stroke-width="3"/>
      <text x="430" y="290" fill="#4ade80" font-size="9.5" text-anchor="middle">loop of Henle</text>
      <text x="430" y="306" fill="#b9a3d6" font-size="9" text-anchor="middle">descending ↓ / ascending ↑</text>
      <!-- DCT -->
      <path d="M 230 180 C 220 160 210 140 260 140 C 310 140 320 130 340 130" fill="none" stroke="#fbbf24" stroke-width="3"/>
      <text x="290" y="152" fill="#fbbf24" font-size="9.5" text-anchor="middle">DCT</text>
      <!-- collecting duct -->
      <path d="M 500 130 L 500 410" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
      <text x="530" y="270" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">collecting duct</text>
      <text x="530" y="288" fill="#b9a3d6" font-size="9" text-anchor="middle">ADH-controlled water loss</text>
      <!-- vasa recta -->
      <path d="M 555 130 L 555 410" stroke="#ff2ec4" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="596" y="270" fill="#ff2ec4" font-size="9.5" text-anchor="middle">vasa recta</text>
      <!-- flow arrows -->
      <path d="M 40 120 L 130 120" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="60" y="110" fill="#b9a3d6" font-size="9" text-anchor="middle">blood in (afferent)</text>
      <path d="M 226 120 L 320 120" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="500" y="60" fill="#b9a3d6" font-size="9.5" text-anchor="middle">filtrate path: PCT → loop → DCT → collecting duct</text>
      <text x="330" y="440" fill="#b9a3d6" font-size="10.5" text-anchor="middle">~180 L filtered daily · ~1.5 L urine out · the rest reabsorbed</text>
    </svg></body></html>
