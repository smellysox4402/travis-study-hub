<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="bar chart of blood distribution across organs during exercise, sleep and wakeful rest: skeletal muscle huge during exercise, gut and kidneys reduced during exercise, brain constant at about 20 percent of cardiac output">
      <rect width="660" height="430" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE BLOOD ROUTER — WHO GETS THE BLOOD?</text>
      <!-- axes -->
      <line x1="80" y1="70" x2="80" y2="380" stroke="#b9a3d6" stroke-width="2"/>
      <line x1="80" y1="380" x2="620" y2="380" stroke="#b9a3d6" stroke-width="2"/>
      <text x="40" y="90" fill="#b9a3d6" font-size="10" text-anchor="middle">high</text>
      <text x="40" y="380" fill="#b9a3d6" font-size="10" text-anchor="middle">low</text>
      <text x="350" y="410" fill="#b9a3d6" font-size="10.5" text-anchor="middle">skeletal muscle · gut · kidneys · brain</text>
      <!-- muscle -->
      <rect x="110" y="120" width="52" height="260" fill="rgba(255,46,196,.35)" stroke="#ff2ec4" stroke-width="2"/>
      <rect x="170" y="300" width="52" height="80" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="1.5"/>
      <rect x="230" y="220" width="52" height="160" fill="rgba(255,46,196,.25)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="136" y="108" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">EXERCISE</text>
      <text x="196" y="288" fill="#b9a3d6" font-size="9" text-anchor="middle">SLEEP</text>
      <text x="256" y="208" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">REST</text>
      <!-- gut -->
      <rect x="320" y="260" width="52" height="120" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="1.5"/>
      <rect x="380" y="200" width="52" height="180" fill="rgba(34,211,238,.3)" stroke="#22d3ee" stroke-width="2"/>
      <rect x="440" y="240" width="52" height="140" fill="rgba(34,211,238,.22)" stroke="#22d3ee" stroke-width="2"/>
      <text x="346" y="250" fill="#b9a3d6" font-size="9" text-anchor="middle">EX</text>
      <text x="406" y="190" fill="#22d3ee" font-size="9.5" font-weight="800" text-anchor="middle">REST</text>
      <text x="466" y="230" fill="#b9a3d6" font-size="9" text-anchor="middle">SL</text>
      <!-- kidneys -->
      <rect x="490" y="250" width="42" height="130" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="540" y="240" width="42" height="140" fill="rgba(251,191,36,.25)" stroke="#fbbf24" stroke-width="2"/>
      <rect x="580" y="270" width="42" height="110" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="511" y="240" fill="#b9a3d6" font-size="9" text-anchor="middle">EX</text>
      <text x="561" y="230" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">REST</text>
      <text x="601" y="260" fill="#b9a3d6" font-size="9" text-anchor="middle">SL</text>
      <!-- brain -->
      <rect x="110" y="330" width="52" height="50" fill="rgba(74,222,128,.35)" stroke="#4ade80" stroke-width="2"/>
      <rect x="170" y="330" width="52" height="50" fill="rgba(74,222,128,.35)" stroke="#4ade80" stroke-width="2"/>
      <rect x="230" y="330" width="52" height="50" fill="rgba(74,222,128,.35)" stroke="#4ade80" stroke-width="2"/>
      <text x="196" y="322" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">brain: ~20% always</text>
      <text x="196" y="398" fill="#b9a3d6" font-size="9.5" text-anchor="middle">constant, all states — can't store fuel</text>
      <!-- note -->
      <text x="350" y="60" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Arterioles + precapillary sphincters + shunt vessels = the traffic-light system</text>
      <text x="330" y="426" fill="#b9a3d6" font-size="10" text-anchor="middle">Exercise ~25 L min⁻¹ · rest ~5 · sleep ~4 · brain ~20% of cardiac output</text>
    </svg></body></html>
