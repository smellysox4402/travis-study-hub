<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of chromosome structure before and after DNA replication: single chromatid with one DNA molecule, then a chromosome with two sister chromatids held by cohesin loops, centromere and kinetochore">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">CHROMOSOME — BEFORE &amp; AFTER REPLICATION</text>
      <text x="160" y="58" fill="#22d3ee" font-size="12.5" font-weight="800" text-anchor="middle">BEFORE (G1)</text>
      <text x="160" y="76" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">one long DNA molecule</text>
      <path d="M 160 100 C 135 130 185 150 160 180 C 135 210 185 230 160 260 C 135 290 185 310 160 340" fill="none" stroke="#ff2ec4" stroke-width="4" stroke-linecap="round"/>
      <text x="212" y="195" fill="#ff2ec4" font-size="11" font-weight="800">single chromatid</text>
      <line x1="205" y1="191" x2="172" y2="191" stroke="#ff2ec4" stroke-width="1"/>
      <text x="212" y="233" fill="#b9a3d6" font-size="10" font-weight="700">(1 DNA molecule)</text>
      <line x1="205" y1="229" x2="178" y2="229" stroke="#b9a3d6" stroke-width="1"/>
      <text x="320" y="250" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">DNA REPLICATION (S phase)</text>
      <line x1="255" y1="268" x2="300" y2="268" stroke="#fbbf24" stroke-width="1.5"/>
      <line x1="385" y1="268" x2="340" y2="268" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="480" y="58" fill="#4ade80" font-size="12.5" font-weight="800" text-anchor="middle">AFTER (S → G2)</text>
      <text x="480" y="76" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">two identical DNA molecules</text>
      <line x1="450" y1="110" x2="510" y2="330" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
      <line x1="510" y1="110" x2="450" y2="330" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
      <circle cx="480" cy="220" r="9" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="480" cy="220" r="14" fill="none" stroke="#ff2ec4" stroke-width="2"/>
      <circle cx="462" cy="140" r="6" fill="rgba(168,85,247,.2)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2"/>
      <circle cx="498" cy="170" r="6" fill="rgba(168,85,247,.2)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2"/>
      <circle cx="462" cy="300" r="6" fill="rgba(168,85,247,.2)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2"/>
      <circle cx="498" cy="270" r="6" fill="rgba(168,85,247,.2)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="545" y="130" fill="#4ade80" font-size="11" font-weight="800">SISTER CHROMATIDS</text>
      <text x="545" y="148" fill="#b9a3d6" font-size="9.5" font-weight="700">(identical DNA)</text>
      <line x1="538" y1="138" x2="512" y2="150" stroke="#4ade80" stroke-width="1"/>
      <text x="545" y="240" fill="#a855f7" font-size="11" font-weight="800">COHESIN LOOPS</text>
      <text x="545" y="258" fill="#b9a3d6" font-size="9.5" font-weight="700">(hold twins together)</text>
      <line x1="538" y1="246" x2="500" y2="246" stroke="#a855f7" stroke-width="1"/>
      <text x="545" y="315" fill="#fbbf24" font-size="11" font-weight="800">CENTROMERE</text>
      <text x="545" y="333" fill="#b9a3d6" font-size="9.5" font-weight="700">+ kinetochore</text>
      <line x1="538" y1="308" x2="494" y2="224" stroke="#fbbf24" stroke-width="1"/>
      <text x="320" y="425" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">cohesin is CUT at the start of anaphase → sister chromatids finally separate</text>
      <text x="320" y="443" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">kinetochore = where spindle microtubules attach (MTOC end)</text>
    </svg></body></html>
