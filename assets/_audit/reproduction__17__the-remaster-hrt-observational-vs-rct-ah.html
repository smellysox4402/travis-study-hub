<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="two remastered album covers for HRT evidence: the observational mix suggested lower CHD risk but was confounded by affluent women with better healthcare, the RCT remix showed slightly elevated CHD breast cancer and stroke risk, with the lesson correlation is not causation">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE REMASTER — HRT: OBSERVATIONAL VS RCT (AHL)</text>

      <rect x="50" y="60" width="270" height="180" rx="9" fill="rgba(255,46,196,.06)" stroke="#ff2ec4" stroke-width="2"/>
      <circle cx="80" cy="205" r="26" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <circle cx="80" cy="205" r="6" fill="#ff2ec4"/>
      <text x="185" y="90" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">OBSERVATIONAL MIX</text>
      <text x="185" y="118" fill="#b9a3d6" font-size="9.5" text-anchor="middle">early studies: HRT users</text>
      <text x="185" y="134" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">→ lower CHD risk</text>
      <text x="185" y="152" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">BUT confounders:</text>
      <text x="185" y="168" fill="#b9a3d6" font-size="9.5" text-anchor="middle">affluent women with better</text>
      <text x="185" y="184" fill="#b9a3d6" font-size="9.5" text-anchor="middle">healthcare took HRT</text>
      <text x="185" y="202" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">correlation ≠ causation</text>

      <rect x="340" y="60" width="270" height="180" rx="9" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="580" cy="205" r="26" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="580" cy="205" r="6" fill="#22d3ee"/>
      <text x="475" y="90" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">RCT REMIX</text>
      <text x="475" y="118" fill="#b9a3d6" font-size="9.5" text-anchor="middle">randomised controlled trials:</text>
      <text x="475" y="134" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">slightly ELEVATED risk of</text>
      <text x="475" y="150" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">CHD · breast cancer · stroke</text>
      <text x="475" y="168" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">→ HRT use declined</text>
      <text x="475" y="184" fill="#b9a3d6" font-size="9.5" text-anchor="middle">since the early 2000s</text>

      <text x="330" y="272" fill="#b9a3d6" font-size="9.5" text-anchor="middle">HRT: supplements oestrogen + progesterone after menopause</text>
      <text x="330" y="290" fill="#b9a3d6" font-size="9.5" text-anchor="middle">relieves hot flushes · night sweats · mood swings · vaginal dryness · low sex drive</text>
      <text x="330" y="308" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">also helps prevent osteoporosis</text>
      <text x="330" y="326" fill="#b9a3d6" font-size="9.5" text-anchor="middle">discrepancy: women in early menopause vs years post · observational vs RCT design</text>
      <text x="330" y="344" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">affluent women confounded the early data — correlation ≠ causation</text>
    </svg></body></html>
