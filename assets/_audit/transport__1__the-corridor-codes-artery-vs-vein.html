<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="side by side cross sections of an artery and a vein: the artery has a thick wall with a narrow circular lumen and corrugated inner surface, the vein has a thin wall with a wide flattened lumen and smooth inner surface">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE CORRIDOR CODES — ARTERY vs VEIN</text>
      <!-- artery -->
      <circle cx="165" cy="180" r="95" fill="rgba(255,46,196,.05)" stroke="#ff2ec4" stroke-width="3"/>
      <circle cx="165" cy="180" r="58" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="2"/>
      <circle cx="165" cy="180" r="26" fill="rgba(11,2,20,.9)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="165" y="176" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">LUMEN</text>
      <text x="165" y="192" fill="#b9a3d6" font-size="9.5" text-anchor="middle">narrow</text>
      <text x="165" y="66" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">ARTERY</text>
      <text x="165" y="84" fill="#b9a3d6" font-size="10" text-anchor="middle">thick wall · circular</text>
      <text x="165" y="292" fill="#b9a3d6" font-size="10" text-anchor="middle">corrugated inner surface</text>
      <!-- vein -->
      <ellipse cx="495" cy="180" rx="95" ry="80" fill="rgba(168,85,247,.05)" stroke="#a855f7" stroke-width="3"/>
      <ellipse cx="495" cy="180" rx="72" ry="58" fill="rgba(168,85,247,.12)" stroke="#a855f7" stroke-width="2"/>
      <ellipse cx="495" cy="180" rx="48" ry="34" fill="rgba(11,2,20,.9)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="495" y="176" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">LUMEN</text>
      <text x="495" y="192" fill="#b9a3d6" font-size="9.5" text-anchor="middle">wide</text>
      <text x="495" y="66" fill="#a855f7" font-size="13" font-weight="900" text-anchor="middle">VEIN</text>
      <text x="495" y="84" fill="#b9a3d6" font-size="10" text-anchor="middle">thin wall · may flatten</text>
      <text x="495" y="292" fill="#b9a3d6" font-size="10" text-anchor="middle">smooth inner surface</text>
      <!-- bottom line -->
      <text x="330" y="326" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">READ THE SLIDE: wall thickness ÷ lumen width — thick + corrugated = artery</text>
    </svg></body></html>
