<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of phenotypic plasticity: two pumpkin seedlings with identical genotype, one grown in darkness growing tall and pale, one grown in light growing green and compact">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">SAME GENES, DIFFERENT VIBE</text>
      <text x="320" y="50" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">phenotypic plasticity — one genotype, environment decides the look</text>
      <!-- dark seedling -->
      <text x="160" y="84" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">DARK</text>
      <path d="M 160 190 L 160 100" stroke="#b9a3d6" stroke-width="4"/>
      <path d="M 160 190 L 130 160 M 160 190 L 190 150" stroke="#b9a3d6" stroke-width="3" stroke-linecap="round"/>
      <path d="M 152 105 L 140 88 M 168 105 L 180 88" stroke="#b9a3d6" stroke-width="2.5" stroke-linecap="round"/>
      <text x="160" y="215" fill="#b9a3d6" font-size="10" font-weight="800" text-anchor="middle">tall + pale</text>
      <text x="160" y="232" fill="#b9a3d6" font-size="9.5" font-weight="600" text-anchor="middle">little chlorophyll</text>
      <!-- light seedling -->
      <text x="480" y="84" fill="#4ade80" font-size="12" font-weight="900" text-anchor="middle">LIGHT</text>
      <path d="M 480 190 L 480 140" stroke="#4ade80" stroke-width="4"/>
      <ellipse cx="458" cy="128" rx="22" ry="10" fill="rgba(74,222,128,.25)" stroke="#4ade80" stroke-width="2"/>
      <ellipse cx="502" cy="122" rx="22" ry="10" fill="rgba(74,222,128,.25)" stroke="#4ade80" stroke-width="2"/>
      <path d="M 480 190 L 450 165 M 480 190 L 510 160" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <text x="480" y="215" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">short + green</text>
      <text x="480" y="232" fill="#b9a3d6" font-size="9.5" font-weight="600" text-anchor="middle">full chlorophyll</text>
      <!-- genotype line -->
      <rect x="150" y="268" width="340" height="46" rx="10" fill="rgba(168,85,247,.10)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="320" y="288" fill="#a855f7" font-size="12" font-weight="900" text-anchor="middle">IDENTICAL GENOTYPE — same seed variety</text>
      <text x="320" y="304" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">no new alleles, just genes switched on/off</text>
      <!-- sun arrows -->
      <text x="480" y="336" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">☀ more chlorophyll</text>
      <text x="160" y="336" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">🌑 less pigment</text>
      <text x="320" y="392" fill="#4ade80" font-size="12" font-weight="900" text-anchor="middle">REVERSIBLE — switch the environment back, the look reverts</text>
      <text x="320" y="414" fill="#b9a3d6" font-size="10.5" font-weight="700" text-anchor="middle">tan fades when the sun goes · dark-grown seedling greens up in light</text>
      <text x="320" y="444" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">plasticity ≠ new alleles — it's gene EXPRESSION that changes</text>
    </svg></body></html>
