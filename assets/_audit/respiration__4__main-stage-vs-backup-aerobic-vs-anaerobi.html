<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="two generators side by side: the main stage aerobic generator burns glucose plus oxygen to carbon dioxide plus water with over 30 ATP and uses mitochondria, while the emergency backup anaerobic generator converts glucose to lactate with only 2 ATP in the cytoplasm with no mitochondria needed, and a meter showing the oxygen debt bill after vigorous exercise">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">MAIN STAGE VS BACKUP — AEROBIC VS ANAEROBIC</text>

      <rect x="30" y="52" width="290" height="150" rx="9" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="2"/>
      <text x="175" y="72" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">MAIN STAGE · AEROBIC</text>
      <text x="175" y="96" fill="#b9a3d6" font-size="9.5" text-anchor="middle">glucose + oxygen → CO₂ + water</text>
      <text x="175" y="118" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">&gt;30 ATP per glucose</text>
      <text x="175" y="140" fill="#b9a3d6" font-size="9.5" text-anchor="middle">oxygen = electron acceptor</text>
      <text x="175" y="156" fill="#b9a3d6" font-size="9.5" text-anchor="middle">substrates: carbs + lipids + amino acids</text>
      <text x="175" y="172" fill="#b9a3d6" font-size="9.5" text-anchor="middle">cytoplasm THEN mitochondria</text>
      <text x="175" y="190" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">waste: CO₂ + water</text>

      <rect x="340" y="52" width="290" height="150" rx="9" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="485" y="72" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">BACKUP · ANAEROBIC (HUMANS)</text>
      <text x="485" y="96" fill="#b9a3d6" font-size="9.5" text-anchor="middle">glucose → lactate</text>
      <text x="485" y="118" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">only 2 ATP per glucose</text>
      <text x="485" y="140" fill="#b9a3d6" font-size="9.5" text-anchor="middle">other substances act as acceptors</text>
      <text x="485" y="156" fill="#b9a3d6" font-size="9.5" text-anchor="middle">only carbohydrates usable</text>
      <text x="485" y="172" fill="#b9a3d6" font-size="9.5" text-anchor="middle">cytoplasm ONLY · no mitochondria</text>
      <text x="485" y="190" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">waste: lactate (no water)</text>

      <rect x="160" y="226" width="340" height="52" rx="9" fill="rgba(251,191,36,.08)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="330" y="248" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">WHEN? max power bursts — weightlifters · sprinters ≤400 m · sprint finishes</text>
      <text x="330" y="266" fill="#b9a3d6" font-size="9" text-anchor="middle">lactate tolerance limits duration → that's the ~400 m sprint limit</text>

      <text x="330" y="310" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">OXYGEN DEBT = the bill after the party</text>
      <text x="330" y="334" fill="#b9a3d6" font-size="9.5" text-anchor="middle">lactate breakdown needs O₂ — takes several minutes to clear → the demand that builds up is the oxygen debt</text>
    </svg></body></html>
