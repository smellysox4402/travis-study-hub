<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram comparing mitosis and meiosis: a diploid 2n=4 parent cell producing two identical diploid daughter cells by mitosis, or four haploid varied daughter cells by meiosis">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">MITOSIS vs MEIOSIS — CONTINUITY vs CHANGE</text>
      <!-- parent cell 2n=4 -->
      <circle cx="320" cy="110" r="50" fill="rgba(255,46,196,.07)" stroke="#ff2ec4" stroke-width="3"/>
      <g stroke="#ff2ec4" stroke-width="3" stroke-linecap="round">
        <path d="M 292 86 L 308 102 M 308 86 L 292 102"/>
        <path d="M 332 118 L 348 134 M 348 118 L 332 134"/>
      </g>
      <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
        <path d="M 332 86 L 348 102 M 348 86 L 332 102"/>
        <path d="M 292 118 L 308 134 M 308 118 L 292 134"/>
      </g>
      <circle cx="300" cy="94" r="2.5" fill="#fbbf24"/>
      <circle cx="340" cy="126" r="2.5" fill="#fbbf24"/>
      <circle cx="340" cy="94" r="2.5" fill="#fbbf24"/>
      <circle cx="300" cy="126" r="2.5" fill="#fbbf24"/>
      <text x="320" y="180" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">PARENT (2n = 4) — homologous pairs</text>
      <!-- mitosis branch -->
      <text x="150" y="200" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">MITOSIS</text>
      <text x="150" y="218" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">one division · identical</text>
      <line x1="300" y1="160" x2="165" y2="225" stroke="#ff2ec4" stroke-width="2" marker-end="url(#arrP)"/>
      <circle cx="115" cy="290" r="44" fill="rgba(255,46,196,.05)" stroke="#ff2ec4" stroke-width="2.5"/>
      <circle cx="210" cy="290" r="44" fill="rgba(255,46,196,.05)" stroke="#ff2ec4" stroke-width="2.5"/>
      <g stroke="#ff2ec4" stroke-width="2.5" stroke-linecap="round">
        <path d="M 97 270 L 107 280 M 107 270 L 97 280"/>
        <path d="M 127 300 L 137 310 M 137 300 L 127 310"/>
      </g>
      <g stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
        <path d="M 127 270 L 137 280 M 137 270 L 127 280"/>
        <path d="M 97 300 L 107 310 M 107 300 L 97 310"/>
      </g>
      <g stroke="#ff2ec4" stroke-width="2.5" stroke-linecap="round">
        <path d="M 192 270 L 202 280 M 202 270 L 192 280"/>
        <path d="M 222 300 L 232 310 M 232 300 L 222 310"/>
      </g>
      <g stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
        <path d="M 222 270 L 232 280 M 232 270 L 222 280"/>
        <path d="M 192 300 L 202 310 M 202 300 L 192 310"/>
      </g>
      <text x="162" y="352" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">2 daughter cells</text>
      <text x="162" y="370" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">2n = 4 · IDENTICAL</text>
      <!-- meiosis branch -->
      <text x="470" y="200" fill="#22d3ee" font-size="13" font-weight="900" text-anchor="middle">MEIOSIS</text>
      <text x="470" y="218" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">two divisions · variation</text>
      <line x1="340" y1="160" x2="470" y2="225" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrC)"/>
      <circle cx="400" cy="300" r="34" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="530" cy="300" r="34" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="400" cy="380" r="34" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="530" cy="380" r="34" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2.5"/>
      <g stroke="#ff2ec4" stroke-width="3" stroke-linecap="round">
        <line x1="386" y1="296" x2="402" y2="292"/>
        <line x1="516" y1="292" x2="532" y2="296"/>
        <line x1="386" y1="376" x2="402" y2="372"/>
        <line x1="516" y1="372" x2="532" y2="376"/>
      </g>
      <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
        <line x1="388" y1="308" x2="404" y2="304"/>
        <line x1="514" y1="304" x2="530" y2="308"/>
        <line x1="388" y1="388" x2="404" y2="384"/>
        <line x1="514" y1="384" x2="530" y2="388"/>
      </g>
      <text x="465" y="262" fill="#b9a3d6" font-size="10.5" font-weight="700" text-anchor="middle">4 daughter cells</text>
      <text x="465" y="434" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">n = 2 · VARIED</text>
      <defs>
        <marker id="arrP" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ff2ec4"/></marker>
        <marker id="arrC" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#22d3ee"/></marker>
      </defs>
      <text x="320" y="448" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">mitosis = same genome (continuity) · meiosis = half the set + new combos (change)</text>
    </svg></body></html>
