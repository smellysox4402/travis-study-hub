<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of autosomal gene linkage: two genes on the same chromosome produce mostly parental allele combinations with rare recombinants from crossing over, versus unlinked genes giving a 1 to 1 to 1 to 1 ratio">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">LINKAGE — GENES THAT RIDE TOGETHER (AHL)</text>
      <!-- unlinked -->
      <text x="150" y="56" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">UNLINKED — different chromosomes</text>
      <g stroke="#ff2ec4" stroke-width="3" stroke-linecap="round">
        <path d="M 100 80 L 120 96 M 120 80 L 100 96"/>
      </g>
      <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
        <path d="M 170 80 L 190 96 M 190 80 L 170 96"/>
      </g>
      <circle cx="110" cy="82" r="3.5" fill="#fbbf24"/>
      <circle cx="180" cy="82" r="3.5" fill="#4ade80"/>
      <text x="150" y="118" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">genes on different chromosomes</text>
      <text x="150" y="132" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">assort independently</text>
      <text x="150" y="156" fill="#4ade80" font-size="10.5" font-weight="900" text-anchor="middle">test cross → 1 : 1 : 1 : 1</text>
      <text x="150" y="172" fill="#b9a3d6" font-size="9" font-weight="600" text-anchor="middle">all four gamete combos equal</text>
      <!-- linked -->
      <text x="470" y="56" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="middle">LINKED — same chromosome</text>
      <g stroke="#a855f7" stroke-width="3" stroke-linecap="round">
        <path d="M 420 80 L 440 96 M 440 80 L 420 96"/>
        <path d="M 490 80 L 510 96 M 510 80 L 490 96"/>
      </g>
      <circle cx="430" cy="82" r="3.5" fill="#fbbf24"/>
      <circle cx="500" cy="82" r="3.5" fill="#4ade80"/>
      <text x="470" y="118" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">genes close on ONE chromosome</text>
      <text x="470" y="132" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">alleles travel together</text>
      <text x="470" y="156" fill="#ff2ec4" font-size="10.5" font-weight="900" text-anchor="middle">parentals ≫ recombinants</text>
      <text x="470" y="172" fill="#b9a3d6" font-size="9" font-weight="600" text-anchor="middle">ratio skews away from 1:1:1:1</text>
      <!-- crossover -->
      <line x1="210" y1="210" x2="430" y2="210" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="320" y="200" fill="#fbbf24" font-size="10.5" font-weight="900" text-anchor="middle">CROSSING OVER in meiosis</text>
      <text x="320" y="228" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">swaps segments → NEW combinations = recombinants</text>
      <text x="320" y="242" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">the farther apart the loci, the more recombinants</text>
      <!-- chi squared -->
      <rect x="80" y="268" width="480" height="118" rx="10" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="320" y="292" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">THE χ² TEST — DO THE RATIOS LIE?</text>
      <text x="320" y="316" fill="#f3e8ff" font-size="11.5" font-weight="800" text-anchor="middle">χ² = Σ (observed − expected)² ÷ expected</text>
      <text x="320" y="338" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">H₀ (null): traits fit the predicted ratio · H₁: they don't</text>
      <text x="320" y="356" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">degrees of freedom = classes − 1 (4 phenotypes → 3 df)</text>
      <text x="320" y="374" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">critical value at p = 0.05, 3 df → 7.815</text>
      <text x="320" y="406" fill="#4ade80" font-size="11" font-weight="900" text-anchor="middle">χ² &lt; critical → keep H₀ (fits) · χ² &gt; critical → reject (linkage!)</text>
      <text x="320" y="428" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">example: Bateson's chickens 111:37:34:8 vs 9:3:3:1 → χ² = 1.56 &lt; 7.815 → unlinked</text>
      <text x="320" y="446" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">corn test cross: 638 + 21,379 + 21,096 + 672 → parentals dominate → LINKED</text>
    </svg></body></html>
