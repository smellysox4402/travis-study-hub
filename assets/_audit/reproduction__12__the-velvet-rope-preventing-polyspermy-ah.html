<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="velvet rope at the egg's door: sperm one releases acrosome enzymes that digest the zona pellucida and push through, then the cortical reaction hardens the zona and changes binding glycoproteins, sperm two bounces off blocked, note that a triploid zygote from two sperm is non-viable">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE VELVET ROPE — PREVENTING POLYSPERMY (AHL)</text>

      <rect x="30" y="56" width="210" height="92" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="135" y="76" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">1 · ACROSOME REACTION</text>
      <text x="135" y="92" fill="#b9a3d6" font-size="9" text-anchor="middle">sperm binds zona glycoproteins</text>
      <text x="135" y="106" fill="#b9a3d6" font-size="9" text-anchor="middle">enzymes digest → tail pushes</text>
      <text x="135" y="120" fill="#b9a3d6" font-size="9" text-anchor="middle">through to egg membrane</text>

      <circle cx="330" cy="210" r="74" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"/>
      <circle cx="330" cy="210" r="52" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="118" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">zona pellucida</text>
      <text x="330" y="214" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">EGG (n)</text>

      <circle cx="200" cy="215" r="5" fill="#22d3ee"/><line x1="200" y1="215" x2="165" y2="208" stroke="#22d3ee" stroke-width="2"/>
      <text x="150" y="235" fill="#22d3ee" font-size="8.5" text-anchor="middle">sperm 1</text>

      <rect x="420" y="56" width="210" height="92" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="525" y="76" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">2 · CORTICAL REACTION</text>
      <text x="525" y="92" fill="#b9a3d6" font-size="9" text-anchor="middle">granules exocytose → zona</text>
      <text x="525" y="106" fill="#b9a3d6" font-size="9" text-anchor="middle">toughens + binding sites change</text>
      <text x="525" y="120" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">door slams shut</text>

      <circle cx="470" cy="255" r="5" fill="#ff2ec4"/><line x1="470" y1="255" x2="505" y2="248" stroke="#ff2ec4" stroke-width="2"/>
      <text x="470" y="275" fill="#ff2ec4" font-size="9" font-weight="800" text-anchor="middle">sperm 2 ✗ blocked</text>

      <text x="330" y="326" fill="#b9a3d6" font-size="9.5" text-anchor="middle">only ONE guest gets in — polyspermy → triploid zygote → non-viable, dies</text>
      <text x="330" y="344" fill="#b9a3d6" font-size="9.5" text-anchor="middle">the egg activates once — the first nucleus triggers the lock-down</text>
    </svg></body></html>
