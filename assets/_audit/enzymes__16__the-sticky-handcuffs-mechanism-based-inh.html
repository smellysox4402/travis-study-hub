<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="a bouncer enzyme handcuffed forever by a sticky inhibitor molecule: the inhibitor forms a permanent covalent bond with the active site shown as handcuffs, the bouncer slumps and cannot work again; side panels show mercury and lead ions gluing to the cysteine SH groups of any enzyme, and penicillin handcuffing transpeptidase so bacterial cell wall cross links fail and the wall bursts">

      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE STICKY HANDCUFFS — MECHANISM-BASED INHIBITION</text>

      <text x="120" y="114" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">Hg²⁺</text>
      <circle cx="230" cy="110" r="16" fill="rgba(251,191,36,.3)" stroke="#fbbf24" stroke-width="2"/>
      <text x="230" y="114" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">Pb²⁺</text>
      <rect x="160" y="136" width="90" height="26" rx="6" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="205" y="153" fill="#22d3ee" font-size="8.5" font-weight="800" text-anchor="middle">CYS –SH</text>

      <text x="175" y="172" fill="#b9a3d6" font-size="9" text-anchor="middle">glue –SH groups irreversibly</text>
      <text x="175" y="184" fill="#b9a3d6" font-size="9" text-anchor="middle">non-specific · very toxic</text>

      <text x="480" y="176" fill="#b9a3d6" font-size="9" text-anchor="middle">cross-links fail → wall bursts (lysis)</text>

      <rect x="120" y="200" width="420" height="58" rx="9" fill="rgba(168,85,247,.08)" stroke="rgba(168,85,247,.4)" stroke-width="1.5"/>
      <text x="330" y="222" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">1 INHIBITOR MOLECULE = 1 ENZYME DEAD, PERMANENTLY</text>
      <text x="330" y="242" fill="#b9a3d6" font-size="9.5" text-anchor="middle">structurally similar to substrate → binds active site → covalent bond forms during catalysis</text>

      <text x="330" y="284" fill="#b9a3d6" font-size="10" text-anchor="middle">Novichok agents: mechanism-based inhibitors of acetylcholinesterase — lethal in minute quantities</text>
      <text x="330" y="306" fill="#b9a3d6" font-size="10" text-anchor="middle">penicillin resistance: bacteria change transpeptidase's active site</text>
      <text x="330" y="332" fill="#4ade80" font-size="10.5" font-weight="700" text-anchor="middle">reversible inhibitors let go · mechanism-based inhibitors never do</text>
    </svg></body></html>
