<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="two DJ decks side by side: left LOOP deck playing the same record producing identical clones by mitosis, right REMIX deck producing genetically different offspring via meiosis and fusion, with a cycle diagram showing 2n halved by meiosis to n and doubled back to 2n by gamete fusion">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE LOOP VS THE REMIX — SEXUAL VS ASEXUAL</text>

      <rect x="30" y="52" width="290" height="108" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="175" y="70" fill="#22d3ee" font-size="11.5" font-weight="800" text-anchor="middle">LOOP · ASEXUAL</text>
      <text x="175" y="88" fill="#b9a3d6" font-size="9.5" text-anchor="middle">one parent · no gamete fusion</text>
      <text x="175" y="102" fill="#b9a3d6" font-size="9.5" text-anchor="middle">mitosis throughout</text>
      <text x="175" y="116" fill="#b9a3d6" font-size="9.5" text-anchor="middle">offspring identical clones</text>
      <text x="175" y="130" fill="#b9a3d6" font-size="9.5" text-anchor="middle">no variation · continuity</text>
      <text x="175" y="144" fill="#b9a3d6" font-size="9.5" text-anchor="middle">fits unchanging environments</text>

      <rect x="340" y="52" width="290" height="108" rx="9" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="485" y="70" fill="#a855f7" font-size="11.5" font-weight="800" text-anchor="middle">REMIX · SEXUAL</text>
      <text x="485" y="88" fill="#b9a3d6" font-size="9.5" text-anchor="middle">two parents · gametes fuse</text>
      <text x="485" y="102" fill="#b9a3d6" font-size="9.5" text-anchor="middle">meiosis once per generation</text>
      <text x="485" y="116" fill="#b9a3d6" font-size="9.5" text-anchor="middle">offspring genetically different</text>
      <text x="485" y="130" fill="#b9a3d6" font-size="9.5" text-anchor="middle">variation → new mashups</text>
      <text x="485" y="144" fill="#b9a3d6" font-size="9.5" text-anchor="middle">fits changing environments</text>

      <rect x="60" y="220" width="130" height="46" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="125" y="247" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">2n · body cells</text>
      <path d="M 195 243 L 243 243" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="219" y="232" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">meiosis · halve</text>

      <rect x="250" y="220" width="130" height="46" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="315" y="247" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">n · gametes</text>
      <path d="M 385 243 L 433 243" stroke="#4ade80" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="409" y="232" fill="#4ade80" font-size="9.5" font-weight="700" text-anchor="middle">fusion · double</text>

      <rect x="440" y="220" width="130" height="46" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="505" y="247" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">2n · zygote</text>

      <text x="330" y="316" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Without meiosis the chromosome number would double every generation — halving + doubling keep it constant</text>
    </svg></body></html>
