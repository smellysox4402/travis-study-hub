<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="epinephrine effects diagram: adrenal gland above the kidney secretes epinephrine into the blood, radio signal reaches heart to speed up, airways to dilate, muscle and liver to release glucose, and redirects blood flow away from gut kidney and skin toward muscle">
      <rect width="660" height="380" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE OVERDRIVE — EPINEPHRINE BROADCAST</text>
      <!-- adrenal + kidney -->
      <ellipse cx="150" cy="170" rx="46" ry="30" fill="rgba(251,191,36,.12)" stroke="#fbbf24" stroke-width="2"/>
      <text x="150" y="166" fill="#fbbf24" font-size="10" font-weight="900" text-anchor="middle">ADRENAL</text>
      <text x="150" y="180" fill="#fbbf24" font-size="10" font-weight="900" text-anchor="middle">GLAND</text>
      <ellipse cx="150" cy="250" rx="52" ry="34" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="150" y="246" fill="#a855f7" font-size="10" font-weight="800" text-anchor="middle">KIDNEY</text>
      <text x="150" y="260" fill="#b9a3d6" font-size="8.5" text-anchor="middle">(gland sits on top)</text>
      <!-- broadcast -->
      <path d="M 196 170 C 260 170 260 120 330 120" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)" fill="none"/>
      <path d="M 196 170 C 280 220 300 300 380 310" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)" fill="none"/>
      <path d="M 196 170 C 300 170 400 170 460 150" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)" fill="none"/>
      <text x="260" y="110" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">epinephrine → blood</text>
      <!-- heart -->
      <rect x="330" y="96" width="150" height="52" rx="10" fill="rgba(255,46,196,.07)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="405" y="114" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">HEART (SAN)</text>
      <text x="405" y="130" fill="#b9a3d6" font-size="8.5" text-anchor="middle">faster rate → cardiac output ↑</text>
      <!-- airways -->
      <rect x="330" y="170" width="150" height="52" rx="10" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="2"/>
      <text x="405" y="188" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">AIRWAYS</text>
      <text x="405" y="204" fill="#b9a3d6" font-size="8.5" text-anchor="middle">bronchi dilate → easier breathing</text>
      <!-- muscle + liver -->
      <rect x="380" y="244" width="120" height="52" rx="10" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="440" y="262" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">MUSCLE + LIVER</text>
      <text x="440" y="278" fill="#b9a3d6" font-size="8.5" text-anchor="middle">glycogen → glucose</text>
      <!-- blood routing -->
      <rect x="510" y="280" width="130" height="60" rx="10" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2"/>
      <text x="575" y="298" fill="#a855f7" font-size="10" font-weight="800" text-anchor="middle">BLOOD ROUTING</text>
      <text x="575" y="314" fill="#4ade80" font-size="8.5" text-anchor="middle">muscle/liver: dilated</text>
      <text x="575" y="328" fill="#ff2ec4" font-size="8.5" text-anchor="middle">gut/kidney/skin: constricted</text>
      <text x="330" y="366" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Brain → adrenal glands → epinephrine → fuel + air + pump + routing, all at once</text>
    </svg></body></html>
