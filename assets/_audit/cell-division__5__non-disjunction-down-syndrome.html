<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of non-disjunction in anaphase I producing an n+1 gamete with two copies of chromosome 21 and an n-1 gamete, then fertilisation producing a trisomy 21 zygote with Down syndrome">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">NON-DISJUNCTION → DOWN SYNDROME</text>
      <text x="320" y="52" fill="#b9a3d6" font-size="11" font-weight="800" text-anchor="middle">ANAPHASE I ERROR — the chr 21 pair both go to one pole</text>
      <circle cx="320" cy="120" r="48" fill="rgba(255,46,196,.06)" stroke="#ff2ec4" stroke-width="2.5"/>
      <line x1="320" y1="76" x2="320" y2="164" stroke="#ff2ec4" stroke-width="1.2" stroke-dasharray="4 3"/>
      <g stroke="#ff2ec4" stroke-width="2.5" stroke-linecap="round">
        <path d="M 296 92 L 308 104 M 308 92 L 296 104"/>
        <path d="M 336 96 L 348 108 M 348 96 L 336 108"/>
      </g>
      <g stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
        <path d="M 290 150 L 302 162 M 302 150 L 290 162"/>
        <path d="M 348 148 L 360 160 M 360 148 L 348 160"/>
      </g>
      <text x="320" y="195" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">both chr 21 copies dragged to the same pole</text>
      <!-- gametes -->
      <text x="320" y="235" fill="#fbbf24" font-size="11.5" font-weight="800" text-anchor="middle">GAMETES AFTER MEIOSIS</text>
      <circle cx="205" cy="305" r="42" fill="rgba(251,191,36,.06)" stroke="#fbbf24" stroke-width="2.5"/>
      <g stroke="#ff2ec4" stroke-width="2.5" stroke-linecap="round">
        <path d="M 190 288 L 200 298 M 200 288 L 190 298"/>
        <path d="M 216 292 L 226 302 M 226 292 L 216 302"/>
      </g>
      <g stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
        <path d="M 200 320 L 210 330 M 210 320 L 200 330"/>
      </g>
      <text x="205" y="360" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">n + 1 gamete</text>
      <text x="205" y="376" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">(2 × chr 21)</text>
      <circle cx="435" cy="305" r="42" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="2.5"/>
      <g stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
        <path d="M 420 298 L 430 308 M 430 298 L 420 308"/>
      </g>
      <text x="435" y="360" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">n − 1 gamete</text>
      <text x="435" y="376" fill="#b9a3d6" font-size="9.5" font-weight="700" text-anchor="middle">(0 × chr 21 → dies)</text>
      <!-- fertilisation -->
      <text x="320" y="410" fill="#4ade80" font-size="11.5" font-weight="800" text-anchor="middle">n+1 gamete + normal gamete → ZYGOTE</text>
      <text x="320" y="432" fill="#ff2ec4" font-size="12.5" font-weight="900" text-anchor="middle">TRISOMY 21 = DOWN SYNDROME</text>
    </svg></body></html>
