<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="28 day menstrual cycle chart with stylised curves for FSH LH oestradiol and progesterone, ovulation marked at day 14, phases labelled follicular luteal and menstruation, with notes on the corpus luteum and feedback loops">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE MONTHLY BOOKING — THE MENSTRUAL CYCLE (~28 DAYS)</text>

      <line x1="100" y1="250" x2="500" y2="250" stroke="#b9a3d6" stroke-width="1.5"/>
      <line x1="295" y1="64" x2="295" y2="250" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="295" y="54" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">DAY 14 — OVULATION</text>

      <path d="M 100 240 C 140 215 165 170 189 158 C 215 185 250 210 300 222 C 380 232 450 236 500 238" stroke="#22d3ee" stroke-width="3" fill="none"/>
      <path d="M 100 242 C 200 240 260 238 285 232 C 290 160 292 130 295 108 C 298 130 300 170 305 232 C 350 238 420 240 500 242" stroke="#a855f7" stroke-width="3" fill="none"/>
      <path d="M 100 240 C 180 220 240 130 280 105 C 310 110 340 190 400 205 C 440 210 480 220 500 225" stroke="#ff2ec4" stroke-width="3" fill="none"/>
      <path d="M 100 246 C 250 245 280 244 300 242 C 340 200 370 170 400 162 C 440 165 480 200 500 220" stroke="#fbbf24" stroke-width="3" fill="none"/>

      <line x1="528" y1="92" x2="540" y2="92" stroke="#22d3ee" stroke-width="3"/>
      <text x="552" y="96" fill="#22d3ee" font-size="10" font-weight="800">FSH</text>
      <line x1="528" y1="120" x2="540" y2="120" stroke="#a855f7" stroke-width="3"/>
      <text x="552" y="124" fill="#a855f7" font-size="10" font-weight="800">LH</text>
      <line x1="528" y1="148" x2="540" y2="148" stroke="#ff2ec4" stroke-width="3"/>
      <text x="552" y="152" fill="#ff2ec4" font-size="10" font-weight="800">oestradiol</text>
      <line x1="528" y1="176" x2="540" y2="176" stroke="#fbbf24" stroke-width="3"/>
      <text x="552" y="180" fill="#fbbf24" font-size="10" font-weight="800">progesterone</text>

      <text x="100" y="270" fill="#b9a3d6" font-size="9.5" text-anchor="middle">1</text>
      <text x="189" y="270" fill="#b9a3d6" font-size="9.5" text-anchor="middle">7</text>
      <text x="295" y="270" fill="#b9a3d6" font-size="9.5" text-anchor="middle">14</text>
      <text x="396" y="270" fill="#b9a3d6" font-size="9.5" text-anchor="middle">21</text>
      <text x="500" y="270" fill="#b9a3d6" font-size="9.5" text-anchor="middle">28</text>

      <text x="110" y="292" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">menstruation</text>
      <text x="230" y="292" fill="#b9a3d6" font-size="9.5" text-anchor="middle">follicular phase</text>
      <text x="425" y="292" fill="#b9a3d6" font-size="9.5" text-anchor="middle">luteal phase</text>

      <text x="330" y="314" fill="#b9a3d6" font-size="9.5" text-anchor="middle">corpus luteum secretes progesterone → endometrium maintained</text>
      <text x="330" y="332" fill="#b9a3d6" font-size="9.5" text-anchor="middle">no embryo → corpus luteum breaks down → menstruation (Day 1)</text>
      <text x="330" y="350" fill="#22d3ee" font-size="9.5" text-anchor="middle">oestradiol: boosts FSH receptors (positive feedback) then −FSH, +LH at high levels</text>
    </svg></body></html>
