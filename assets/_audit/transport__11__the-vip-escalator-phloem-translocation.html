<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="phloem translocation diagram: a sieve tube made of sieve tube elements with perforated sieve plates, paired with companion cells full of mitochondria connected by plasmodesmata, sucrose actively loaded at the source leaf creating high pressure and unloaded at the sink root creating low pressure, so sap flows from source to sink">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE VIP ESCALATOR — PHLOEM TRANSLOCATION</text>
      <!-- sieve tube -->
      <rect x="140" y="60" width="80" height="250" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2.5"/>
      <!-- sieve plates -->
      <line x1="140" y1="130" x2="220" y2="130" stroke="#4ade80" stroke-width="3"/>
      <circle cx="160" cy="130" r="3" fill="#150a26"/>
      <circle cx="180" cy="130" r="3" fill="#150a26"/>
      <circle cx="200" cy="130" r="3" fill="#150a26"/>
      <line x1="140" y1="220" x2="220" y2="220" stroke="#4ade80" stroke-width="3"/>
      <circle cx="160" cy="220" r="3" fill="#150a26"/>
      <circle cx="180" cy="220" r="3" fill="#150a26"/>
      <circle cx="200" cy="220" r="3" fill="#150a26"/>
      <text x="180" y="88" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">SIEVE</text>
      <text x="180" y="102" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">TUBE</text>
      <text x="180" y="172" fill="#b9a3d6" font-size="9" text-anchor="middle">no nucleus,</text>
      <text x="180" y="186" fill="#b9a3d6" font-size="9" text-anchor="middle">little cytoplasm</text>
      <text x="180" y="264" fill="#b9a3d6" font-size="9" text-anchor="middle">sieve plate:</text>
      <text x="180" y="278" fill="#b9a3d6" font-size="9" text-anchor="middle">perforated end wall</text>
      <!-- companion cells -->
      <rect x="240" y="70" width="46" height="52" rx="8" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="258" cy="88" r="5" fill="rgba(251,191,36,.5)"/>
      <circle cx="272" cy="100" r="4" fill="rgba(251,191,36,.5)"/>
      <rect x="240" y="160" width="46" height="52" rx="8" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="258" cy="178" r="5" fill="rgba(251,191,36,.5)"/>
      <circle cx="272" cy="190" r="4" fill="rgba(251,191,36,.5)"/>
      <rect x="240" y="250" width="46" height="52" rx="8" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="258" cy="268" r="5" fill="rgba(251,191,36,.5)"/>
      <circle cx="272" cy="280" r="4" fill="rgba(251,191,36,.5)"/>
      <text x="263" y="62" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">COMPANION</text>
      <text x="263" y="74" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">CELLS</text>
      <text x="263" y="140" fill="#b9a3d6" font-size="8.5" text-anchor="middle">many</text>
      <text x="263" y="152" fill="#b9a3d6" font-size="8.5" text-anchor="middle">mitochondria</text>
      <text x="263" y="236" fill="#b9a3d6" font-size="8.5" text-anchor="middle">ATP for</text>
      <text x="263" y="248" fill="#b9a3d6" font-size="8.5" text-anchor="middle">loading</text>
      <!-- plasmodesmata -->
      <line x1="220" y1="96" x2="240" y2="96" stroke="#fbbf24" stroke-width="2"/>
      <line x1="220" y1="186" x2="240" y2="186" stroke="#fbbf24" stroke-width="2"/>
      <line x1="220" y1="276" x2="240" y2="276" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="96" fill="#fbbf24" font-size="9" font-weight="800">PLASMODESMATA</text>
      <text x="330" y="110" fill="#b9a3d6" font-size="9">cytoplasmic bridges</text>
      <text x="330" y="124" fill="#b9a3d6" font-size="9">sucrose + ATP pass</text>
      <!-- source / sink -->
      <rect x="420" y="70" width="200" height="66" rx="10" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="520" y="92" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">SOURCE — leaf</text>
      <text x="520" y="110" fill="#b9a3d6" font-size="9.5" text-anchor="middle">sucrose actively loaded</text>
      <text x="520" y="124" fill="#b9a3d6" font-size="9.5" text-anchor="middle">→ water in by osmosis</text>
      <rect x="420" y="220" width="200" height="66" rx="10" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="520" y="242" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">SINK — root / fruit</text>
      <text x="520" y="260" fill="#b9a3d6" font-size="9.5" text-anchor="middle">unloading → water out</text>
      <text x="520" y="274" fill="#b9a3d6" font-size="9.5" text-anchor="middle">→ pressure falls</text>
      <!-- pressure arrows -->
      <path d="M 420 103 L 340 103" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 420 253 L 340 253" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="380" y="160" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">HIGH pressure at source</text>
      <text x="380" y="176" fill="#b9a3d6" font-size="9" text-anchor="middle">↓</text>
      <text x="380" y="190" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">LOW pressure at sink</text>
      <text x="380" y="204" fill="#b9a3d6" font-size="9" text-anchor="middle">→ sap flows down the gradient</text>
      <text x="330" y="316" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">Sucrose can go UP or DOWN — it flows source → sink, wherever the sugar is needed</text>
    </svg></body></html>
