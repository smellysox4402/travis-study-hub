<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the final customer at the end of the conveyor belt: oxygen has the strongest electron affinity so it accepts the spent electrons from the last carrier plus protons from the matrix and produces water about half a litre per day in humans, with a warning panel showing that without oxygen the chain backs up, reduced NAD accumulates, the link reaction and Krebs cycle stop, and only glycolysis continues at 2 ATP versus 32 aerobic">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE FINAL CUSTOMER — OXYGEN, TERMINAL ELECTRON ACCEPTOR</text>

      <rect x="30" y="52" width="340" height="52" rx="9" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="200" y="72" fill="#a855f7" font-size="10" font-weight="800" text-anchor="middle">END OF THE CONVEYOR BELT</text>
      <text x="200" y="92" fill="#b9a3d6" font-size="9" text-anchor="middle">last carrier has the strongest affinity so far…</text>

      <path d="M 374 78 L 430 78" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah17)" fill="none"/>
      <defs><marker id="ah17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker></defs>
      <text x="402" y="66" fill="#4ade80" font-size="8.5" font-weight="800">e⁻</text>

      <circle cx="505" cy="78" r="40" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="505" y="74" fill="#22d3ee" font-size="13" font-weight="900" text-anchor="middle">O₂</text>
      <text x="505" y="92" fill="#b9a3d6" font-size="8.5" text-anchor="middle">strongest affinity</text>
      <text x="505" y="104" fill="#b9a3d6" font-size="8.5" text-anchor="middle">takes the spent e⁻</text>

      <rect x="560" y="52" width="70" height="52" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="595" y="74" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="middle">H₂O</text>
      <text x="595" y="92" fill="#b9a3d6" font-size="8" text-anchor="middle">+ H⁺ from matrix</text>

      <rect x="30" y="136" width="600" height="120" rx="9" fill="rgba(255,46,196,.06)" stroke="rgba(255,46,196,.5)" stroke-width="1.5"/>
      <text x="330" y="158" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">⚠ BLACKOUT — IF OXYGEN RUNS OUT</text>
      <text x="330" y="182" fill="#b9a3d6" font-size="9.5" text-anchor="middle">electrons not removed → all ETC carriers stay reduced → nothing accepted from reduced NAD</text>
      <text x="330" y="202" fill="#b9a3d6" font-size="9.5" text-anchor="middle">reduced NAD accumulates → all NAD reduced → link reaction + Krebs cycle STOP</text>
      <text x="330" y="224" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">only glycolysis continues: 2 ATP per glucose vs 32 with aerobic respiration</text>
      <text x="330" y="244" fill="#b9a3d6" font-size="9" text-anchor="middle">anaerobic NAD regeneration (lactate / ethanol) keeps the 2 ATP flowing</text>

      <text x="330" y="292" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">water production: ~0.5 L per day in humans (metabolic water)</text>
      <text x="330" y="316" fill="#b9a3d6" font-size="9.5" text-anchor="middle">O₂ + electrons from ETC + protons from matrix → water</text>
      <text x="330" y="340" fill="#b9a3d6" font-size="9.5" text-anchor="middle">making water also helps maintain the proton gradient across the inner membrane</text>
    </svg></body></html>
