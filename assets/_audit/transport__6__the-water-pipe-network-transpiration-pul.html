<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="transpiration pull diagram: water evaporates from spongy mesophyll cell walls in the leaf and diffuses out through stomata, capillary action draws water through cellulose walls, tension pulls the continuous cohesive water column up the xylem vessel from the roots, with adhesion to the vessel walls and cohesion between water molecules shown">
      <rect width="660" height="400" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE WATER PIPE NETWORK — TRANSPIRATION PULL</text>
      <!-- leaf -->
      <path d="M 240 60 C 280 44 380 44 420 60 C 380 96 280 96 240 60 Z" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2.5"/>
      <text x="330" y="76" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">LEAF</text>
      <text x="330" y="120" fill="#b9a3d6" font-size="9.5" text-anchor="middle">spongy mesophyll cell walls</text>
      <text x="330" y="136" fill="#b9a3d6" font-size="9.5" text-anchor="middle">evaporation → diffusion out</text>
      <text x="330" y="152" fill="#b9a3d6" font-size="9.5" text-anchor="middle">through stomata</text>
      <path d="M 300 102 C 290 116 295 128 302 136" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 360 102 C 370 116 365 128 358 136" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <!-- xylem vessel -->
      <rect x="318" y="180" width="24" height="200" fill="rgba(34,211,238,.12)" stroke="#22d3ee" stroke-width="2"/>
      <!-- water column inside -->
      <rect x="322" y="184" width="16" height="192" fill="rgba(34,211,238,.25)"/>
      <circle cx="330" cy="200" r="5" fill="#22d3ee"/>
      <circle cx="330" cy="224" r="5" fill="#22d3ee"/>
      <circle cx="330" cy="248" r="5" fill="#22d3ee"/>
      <circle cx="330" cy="272" r="5" fill="#22d3ee"/>
      <circle cx="330" cy="296" r="5" fill="#22d3ee"/>
      <circle cx="330" cy="320" r="5" fill="#22d3ee"/>
      <circle cx="330" cy="344" r="5" fill="#22d3ee"/>
      <text x="330" y="178" fill="#22d3ee" font-size="9.5" font-weight="800" text-anchor="middle">XYLEM</text>
      <!-- tension arrow up -->
      <path d="M 358 300 C 400 280 400 240 366 200" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah)" fill="none" stroke-dasharray="5 4"/>
      <text x="430" y="240" fill="#fbbf24" font-size="10" font-weight="800">TENSION = negative pressure</text>
      <text x="430" y="258" fill="#b9a3d6" font-size="9.5">pulls the whole column up</text>
      <!-- cohesion label -->
      <path d="M 300 290 C 260 300 240 320 248 340" stroke="#a855f7" stroke-width="1.5" fill="none"/>
      <text x="120" y="330" fill="#a855f7" font-size="10" font-weight="800">COHESION</text>
      <text x="120" y="348" fill="#b9a3d6" font-size="9.5">water molecules stick</text>
      <text x="120" y="364" fill="#b9a3d6" font-size="9.5">→ column = one rope</text>
      <text x="120" y="380" fill="#b9a3d6" font-size="9.5">beats the 10.4 m limit</text>
      <!-- adhesion label -->
      <path d="M 346 330 C 380 340 420 350 450 356" stroke="#4ade80" stroke-width="1.5" fill="none"/>
      <text x="470" y="352" fill="#4ade80" font-size="10" font-weight="800">ADHESION</text>
      <text x="470" y="370" fill="#b9a3d6" font-size="9.5">water clings to cellulose</text>
      <text x="470" y="386" fill="#b9a3d6" font-size="9.5">walls (hydrogen bonds)</text>
      <!-- root -->
      <path d="M 300 380 C 310 392 320 392 330 384 C 340 392 350 392 360 380 L 360 396 L 300 396 Z" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="398" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">ROOT — water absorbed</text>
      <text x="70" y="120" fill="#b9a3d6" font-size="10" text-anchor="middle">sun = the only energy:</text>
      <text x="70" y="138" fill="#b9a3d6" font-size="10" text-anchor="middle">transpiration is PASSIVE</text>
      <text x="70" y="162" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">cavitation:</text>
      <text x="70" y="180" fill="#b9a3d6" font-size="10" text-anchor="middle">bubble breaks a pipe</text>
    </svg></body></html>
