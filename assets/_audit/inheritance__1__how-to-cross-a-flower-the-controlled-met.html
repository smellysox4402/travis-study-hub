<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of the controlled cross method in a flowering plant: anthers supply pollen, stigma receives it, other pollen blocked by removing anthers and bagging the flower">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">HOW TO CROSS A FLOWER — THE CONTROLLED METHOD</text>
      <!-- flower -->
      <g stroke="#22d3ee" stroke-width="2" fill="none">
        <circle cx="150" cy="120" r="26"/>
        <circle cx="104" cy="156" r="16"/>
        <circle cx="196" cy="156" r="16"/>
        <circle cx="150" cy="190" r="12"/>
      </g>
      <line x1="150" y1="146" x2="150" y2="212" stroke="#4ade80" stroke-width="3"/>
      <ellipse cx="150" cy="238" rx="30" ry="20" fill="rgba(74,222,128,.15)" stroke="#4ade80" stroke-width="2.5"/>
      <circle cx="150" cy="120" r="7" fill="#ff2ec4"/>
      <text x="150" y="98" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">ANTHERS</text>
      <text x="150" y="110" fill="#b9a3d6" font-size="9" font-weight="700" text-anchor="middle">(male · pollen)</text>
      <text x="222" y="120" fill="#22d3ee" font-size="10" font-weight="800">STIGMA</text>
      <line x1="214" y1="120" x2="182" y2="120" stroke="#22d3ee" stroke-width="1"/>
      <text x="224" y="250" fill="#4ade80" font-size="10" font-weight="800">OVARY</text>
      <text x="222" y="264" fill="#b9a3d6" font-size="9" font-weight="700">(female gametes</text>
      <text x="222" y="277" fill="#b9a3d6" font-size="9" font-weight="700">in ovules)</text>
      <text x="86" y="268" fill="#4ade80" font-size="10" font-weight="800">STYLE</text>
      <line x1="100" y1="262" x2="140" y2="238" stroke="#4ade80" stroke-width="1"/>
      <!-- steps -->
      <text x="380" y="70" fill="#22d3ee" font-size="12" font-weight="900">THE 4-STEP CROSS</text>
      <g font-size="11" font-weight="700">
        <text x="380" y="100" fill="#f3e8ff">1. Cut off own anthers</text>
        <text x="396" y="118" fill="#b9a3d6" font-size="9.5" font-weight="600">before pollen matures</text>
        <text x="380" y="146" fill="#f3e8ff">2. Enclose flower in a paper bag</text>
        <text x="396" y="164" fill="#b9a3d6" font-size="9.5" font-weight="600">no insects, no wind, no self-pollination</text>
        <text x="380" y="192" fill="#f3e8ff">3. Dust donor pollen on the stigma</text>
        <text x="396" y="210" fill="#b9a3d6" font-size="9.5" font-weight="600">paintbrush or dab an anther</text>
        <text x="380" y="238" fill="#f3e8ff">4. Pollen tube → ovary → seeds</text>
        <text x="396" y="256" fill="#b9a3d6" font-size="9.5" font-weight="600">each seed = one F₁ embryo</text>
      </g>
      <!-- generations -->
      <text x="320" y="330" fill="#fbbf24" font-size="12" font-weight="900" text-anchor="middle">GENERATIONS — P → F₁ → F₂</text>
      <rect x="70" y="352" width="120" height="40" rx="10" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="130" y="377" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">P parents</text>
      <rect x="260" y="352" width="120" height="40" rx="10" fill="rgba(34,211,238,.12)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="320" y="377" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">F₁ hybrid</text>
      <rect x="450" y="352" width="120" height="40" rx="10" fill="rgba(74,222,128,.12)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="510" y="377" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">F₂ offspring</text>
      <line x1="190" y1="372" x2="258" y2="372" stroke="#b9a3d6" stroke-width="1.5"/>
      <line x1="380" y1="372" x2="448" y2="372" stroke="#b9a3d6" stroke-width="1.5"/>
      <text x="320" y="426" fill="#b9a3d6" font-size="10.5" font-weight="700" text-anchor="middle">tall × dwarf → ALL tall (F₁) → 3 tall : 1 dwarf (F₂)</text>
    </svg></body></html>
