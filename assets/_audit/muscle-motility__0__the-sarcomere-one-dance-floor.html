<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a sarcomere relaxed and contracted: Z-discs, actin thin filaments, myosin thick filaments, light bands, dark bands and titin">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE SARCOMERE — ONE DANCE FLOOR</text>

      <!-- ═══ RELAXED PANEL ═══ -->
      <text x="320" y="62" fill="#67e8f9" font-size="12.5" font-weight="800" text-anchor="middle">RELAXED — Z-discs far apart · light bands WIDE</text>
      <!-- band shading -->
      <rect x="80" y="78" width="140" height="110" fill="rgba(255,255,255,.06)"/>
      <rect x="420" y="78" width="140" height="110" fill="rgba(255,255,255,.06)"/>
      <rect x="220" y="78" width="200" height="110" fill="rgba(168,85,247,.10)"/>
      <!-- Z-discs -->
      <line x1="80" y1="78" x2="80" y2="188" stroke="#ff2ec4" stroke-width="7"/>
      <line x1="560" y1="78" x2="560" y2="188" stroke="#ff2ec4" stroke-width="7"/>
      <!-- actin thin filaments -->
      <line x1="80" y1="102" x2="330" y2="102" stroke="#22d3ee" stroke-width="3"/>
      <line x1="80" y1="132" x2="330" y2="132" stroke="#22d3ee" stroke-width="3"/>
      <line x1="80" y1="162" x2="330" y2="162" stroke="#22d3ee" stroke-width="3"/>
      <line x1="560" y1="102" x2="310" y2="102" stroke="#22d3ee" stroke-width="3"/>
      <line x1="560" y1="132" x2="310" y2="132" stroke="#22d3ee" stroke-width="3"/>
      <line x1="560" y1="162" x2="310" y2="162" stroke="#22d3ee" stroke-width="3"/>
      <!-- myosin thick filaments with heads -->
      <g stroke="#ff2ec4" stroke-width="2.5" fill="#ff2ec4">
        <rect x="215" y="110" width="210" height="6" rx="3"/>
        <rect x="215" y="126" width="210" height="6" rx="3"/>
        <rect x="215" y="142" width="210" height="6" rx="3"/>
        <!-- heads -->
        <circle cx="225" cy="102" r="3.5"/><circle cx="255" cy="102" r="3.5"/><circle cx="285" cy="102" r="3.5"/>
        <circle cx="225" cy="168" r="3.5"/><circle cx="255" cy="168" r="3.5"/><circle cx="285" cy="168" r="3.5"/>
        <circle cx="355" cy="102" r="3.5"/><circle cx="385" cy="102" r="3.5"/><circle cx="415" cy="102" r="3.5"/>
        <circle cx="355" cy="168" r="3.5"/><circle cx="385" cy="168" r="3.5"/><circle cx="415" cy="168" r="3.5"/>
      </g>
      <!-- titin -->
      <path d="M 215 132 Q 195 118 180 132 Q 165 146 150 132 Q 135 118 120 132 Q 105 146 90 132" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
      <path d="M 425 132 Q 445 118 460 132 Q 475 146 490 132 Q 505 118 520 132 Q 535 146 550 132" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="640" y="0" fill="none"> </text>
      <line x1="90" y1="188" x2="90" y2="204" stroke="#b9a3d6" stroke-width="1"/>
      <line x1="560" y1="188" x2="560" y2="204" stroke="#b9a3d6" stroke-width="1"/>

      <!-- ═══ CONTRACTED PANEL ═══ -->
      <text x="320" y="252" fill="#67e8f9" font-size="12.5" font-weight="800" text-anchor="middle">CONTRACTED — Z-discs pulled together · light bands NARROW · dark band SAME LENGTH</text>
      <rect x="150" y="268" width="70" height="110" fill="rgba(255,255,255,.06)"/>
      <rect x="420" y="268" width="70" height="110" fill="rgba(255,255,255,.06)"/>
      <rect x="220" y="268" width="200" height="110" fill="rgba(168,85,247,.10)"/>
      <line x1="150" y1="268" x2="150" y2="378" stroke="#ff2ec4" stroke-width="7"/>
      <line x1="490" y1="268" x2="490" y2="378" stroke="#ff2ec4" stroke-width="7"/>
      <line x1="150" y1="292" x2="400" y2="292" stroke="#22d3ee" stroke-width="3"/>
      <line x1="150" y1="322" x2="400" y2="322" stroke="#22d3ee" stroke-width="3"/>
      <line x1="150" y1="352" x2="400" y2="352" stroke="#22d3ee" stroke-width="3"/>
      <line x1="490" y1="292" x2="240" y2="292" stroke="#22d3ee" stroke-width="3"/>
      <line x1="490" y1="322" x2="240" y2="322" stroke="#22d3ee" stroke-width="3"/>
      <line x1="490" y1="352" x2="240" y2="352" stroke="#22d3ee" stroke-width="3"/>
      <g stroke="#ff2ec4" stroke-width="2.5" fill="#ff2ec4">
        <rect x="215" y="300" width="210" height="6" rx="3"/>
        <rect x="215" y="316" width="210" height="6" rx="3"/>
        <rect x="215" y="332" width="210" height="6" rx="3"/>
        <circle cx="225" cy="292" r="3.5"/><circle cx="255" cy="292" r="3.5"/><circle cx="285" cy="292" r="3.5"/>
        <circle cx="225" cy="358" r="3.5"/><circle cx="255" cy="358" r="3.5"/><circle cx="285" cy="358" r="3.5"/>
        <circle cx="355" cy="292" r="3.5"/><circle cx="385" cy="292" r="3.5"/><circle cx="415" cy="292" r="3.5"/>
        <circle cx="355" cy="358" r="3.5"/><circle cx="385" cy="358" r="3.5"/><circle cx="415" cy="358" r="3.5"/>
      </g>
      <path d="M 215 322 Q 195 308 180 322 Q 165 336 158 322" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
      <path d="M 425 322 Q 445 308 460 322 Q 475 336 482 322" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>

      <!-- labels -->
      <line x1="80" y1="40" x2="80" y2="78" stroke="#ff2ec4" stroke-width="1.2"/>
      <text x="80" y="50" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">Z-DISC</text>
      <!-- actin + myosin filament labels (Fig 9) -->
      <text x="130" y="208" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">ACTIN (thin)</text>
      <line x1="130" y1="195" x2="130" y2="165" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="400" y="208" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">MYOSIN (thick)</text>
      <line x1="400" y1="195" x2="400" y2="150" stroke="#ff2ec4" stroke-width="1.2"/>
      <line x1="150" y1="240" x2="150" y2="268" stroke="#ff2ec4" stroke-width="1.2"/>
      <text x="150" y="230" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">Z-DISC</text>
      <text x="320" y="410" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">light band (I) = actin only · dark band (A) = myosin zone</text>
      <text x="320" y="432" fill="#b9a3d6" font-size="11.5" font-weight="700" text-anchor="middle">actin slides over myosin → overlap ↑ · filaments never shrink</text>
      <text x="320" y="454" fill="#fbbf24" font-size="11.5" font-weight="700" text-anchor="middle">gold zigzag = titin (elastic spring, holds myosin centred)</text>
    </svg></body></html>
