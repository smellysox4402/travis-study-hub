<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of a receptor tyrosine kinase: insulin docking, dimerisation, cross-phosphorylation and GLUT4 vesicle fusion">
          <rect width="640" height="450" rx="14" fill="#150a26"/>
          <defs>
            <marker id="rtkarw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fbbf24"/></marker>
            <marker id="rtkred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f87171"/></marker>
          </defs>
          <!-- membrane -->
          <rect x="30" y="160" width="580" height="26" rx="6" fill="rgba(34,211,238,.16)" stroke="#22d3ee" stroke-width="2"/>
          <text x="600" y="185" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="end">PLASMA MEMBRANE</text>
          <!-- insulin -->
          <circle cx="118" cy="108" r="15" fill="rgba(251,191,36,.15)" stroke="#fbbf24" stroke-width="3"/>
          <text x="118" y="112" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">insulin</text>
          <!-- two monomers -->
          <rect x="88" y="128" width="24" height="32" rx="6" fill="rgba(168,85,247,.25)" stroke="#a855f7" stroke-width="2.5"/>
          <rect x="88" y="186" width="24" height="92" rx="6" fill="rgba(255,46,196,.18)" stroke="#ff2ec4" stroke-width="2.5"/>
          <rect x="152" y="128" width="24" height="32" rx="6" fill="rgba(168,85,247,.25)" stroke="#a855f7" stroke-width="2.5"/>
          <rect x="152" y="186" width="24" height="92" rx="6" fill="rgba(255,46,196,.18)" stroke="#ff2ec4" stroke-width="2.5"/>
          <text x="100" y="252" fill="#ff2ec4" font-size="9" font-weight="800" text-anchor="middle" transform="rotate(-90 100 252)">kinase tail</text>
          <text x="164" y="252" fill="#ff2ec4" font-size="9" font-weight="800" text-anchor="middle" transform="rotate(-90 164 252)">kinase tail</text>
          <text x="118" y="320" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">1 · insulin docks</text>
          <text x="118" y="338" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">→ two monomers</text>
          <text x="118" y="356" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">come together</text>
          <!-- dimer -->
          <rect x="330" y="128" width="22" height="32" rx="6" fill="rgba(168,85,247,.35)" stroke="#a855f7" stroke-width="2.5"/>
          <rect x="372" y="128" width="22" height="32" rx="6" fill="rgba(168,85,247,.35)" stroke="#a855f7" stroke-width="2.5"/>
          <rect x="330" y="186" width="22" height="100" rx="6" fill="rgba(255,46,196,.28)" stroke="#ff2ec4" stroke-width="2.5"/>
          <rect x="372" y="186" width="22" height="100" rx="6" fill="rgba(255,46,196,.28)" stroke="#ff2ec4" stroke-width="2.5"/>
          <circle cx="362" cy="215" r="6.5" fill="#fbbf24"/><text x="362" y="219" fill="#150a26" font-size="8" font-weight="900" text-anchor="middle">P</text>
          <circle cx="362" cy="245" r="6.5" fill="#fbbf24"/><text x="362" y="249" fill="#150a26" font-size="8" font-weight="900" text-anchor="middle">P</text>
          <circle cx="362" cy="272" r="6.5" fill="#fbbf24"/><text x="362" y="276" fill="#150a26" font-size="8" font-weight="900" text-anchor="middle">P</text>
          <text x="362" y="180" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">Y</text>
          <text x="362" y="322" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">2 · dimer, cross-</text>
          <text x="362" y="340" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">phosphorylate (ATP→P)</text>
          <!-- relay proteins -->
          <circle cx="330" cy="398" r="10" fill="rgba(74,222,128,.3)" stroke="#4ade80" stroke-width="2"/>
          <text x="330" y="402" fill="#4ade80" font-size="7" font-weight="800" text-anchor="middle">relay</text>
          <circle cx="372" cy="414" r="10" fill="rgba(74,222,128,.3)" stroke="#4ade80" stroke-width="2"/>
          <text x="372" y="418" fill="#4ade80" font-size="7" font-weight="800" text-anchor="middle">relay</text>
          <text x="415" y="398" fill="#4ade80" font-size="11" font-weight="800">3 · relay proteins dock,</text>
          <text x="415" y="416" fill="#4ade80" font-size="11" font-weight="800">activate pathways</text>
          <path d="M 341 290 L 336 386" stroke="#4ade80" stroke-width="2"/>
          <path d="M 383 290 L 378 402" stroke="#4ade80" stroke-width="2"/>
          <!-- GLUT4 vesicle up -->
          <circle cx="520" cy="372" r="17" fill="rgba(251,191,36,.22)" stroke="#fbbf24" stroke-width="2.5"/>
          <text x="520" y="376" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">GLUT4</text>
          <path d="M 520 353 L 520 200" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#rtkarw)"/>
          <text x="525" y="318" fill="#fbbf24" font-size="10" font-weight="800">4 · vesicle moves up</text>
          <text x="525" y="336" fill="#fbbf24" font-size="10" font-weight="800">and fuses → GLUT4</text>
          <text x="525" y="354" fill="#fbbf24" font-size="10" font-weight="800">channel in membrane</text>
          <!-- glucose in -->
          <polygon points="548,58 556,63 556,73 548,78 540,73 540,63" fill="#f87171"/>
          <text x="548" y="71" fill="#fff" font-size="8" font-weight="800" text-anchor="middle">G</text>
          <path d="M 548 80 L 548 186" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#rtkred)"/>
          <text x="562" y="122" fill="#f87171" font-size="10" font-weight="800">glucose in</text>
          <text x="562" y="140" fill="#f87171" font-size="10" font-weight="800">(facilitated</text>
          <text x="562" y="158" fill="#f87171" font-size="10" font-weight="800">diffusion)</text>
        </svg></body></html>
