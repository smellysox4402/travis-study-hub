<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the Calvin cycle drawn as a three-station assembly line: Rubisco joins carbon dioxide to ribulose bisphosphate forming two molecules of glycerate 3-phosphate, which are reduced to triose phosphate using ATP and reduced NADP, then five of every six triose phosphate molecules regenerate ribulose bisphosphate using ATP, while one triose phosphate exits to make glucose and other products">
      <rect x="0" y="0" width="660" height="372" rx="14" fill="#150a26"/>
      <defs>
        <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#ff2ec4"/></marker>
        <marker id="arC5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#22d3ee"/></marker>
        <marker id="arG5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#4ade80"/></marker>
        <marker id="arY5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#fbbf24"/></marker>
      </defs>
      <text x="330" y="26" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE ASSEMBLY LINE — CALVIN CYCLE (IN THE STROMA)</text>

      <!-- CO2 in -->
      <rect x="90" y="52" width="100" height="38" rx="8" fill="rgba(255,46,196,0.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="140" y="76" text-anchor="middle" fill="#ff2ec4" font-family="Segoe UI, sans-serif" font-size="12" font-weight="900">CO₂ in</text>
      <path d="M 190 71 L 246 71" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#arR)" fill="none"/>

      <!-- Rubisco fact box -->
      <rect x="450" y="40" width="190" height="92" rx="10" fill="rgba(74,222,128,0.07)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="545" y="60" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">RUBISCO — THE HEAD CHEF</text>
      <text x="545" y="78" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">most abundant enzyme on Earth (~0.7 Gt)</text>
      <text x="545" y="94" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">slow: ~3 CO₂ per second → needs bulk</text>
      <text x="545" y="110" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">ineffective at low CO₂ (limits the cycle)</text>

      <!-- RuBP -->
      <rect x="60" y="120" width="180" height="54" rx="10" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="150" y="142" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="900">RuBP (5C)</text>
      <text x="150" y="162" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">ribulose bisphosphate</text>

      <!-- carboxylation arrow -->
      <path d="M 240 147 L 330 147" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#arR)" fill="none"/>
      <text x="285" y="136" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">Rubisco joins them</text>
      <text x="285" y="176" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">unstable 6C → splits instantly</text>

      <!-- GP -->
      <rect x="340" y="122" width="230" height="54" rx="10" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="455" y="142" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="900">2 × glycerate 3-phosphate (3C)</text>
      <text x="455" y="162" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">GP — first stable product · carries the carboxyl group</text>

      <!-- reduction arrow -->
      <path d="M 455 176 L 390 240" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arC5)" fill="none"/>
      <text x="545" y="214" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">reduction: 2 ATP + 2 reduced NADP</text>
      <text x="545" y="232" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">ATP = energy · reduced NADP = hydrogen/electrons</text>

      <!-- TP -->
      <rect x="200" y="252" width="260" height="54" rx="10" fill="rgba(74,222,128,0.1)" stroke="#4ade80" stroke-width="2.5"/>
      <text x="330" y="272" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="900">2 × triose phosphate (3C)</text>
      <text x="330" y="292" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">TP — the first carbohydrate · aldehyde group</text>

      <!-- regeneration arrow -->
      <path d="M 200 262 L 150 178" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arY5)" fill="none"/>
      <text x="120" y="224" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">5 of 6 TP → 3 RuBP</text>
      <text x="120" y="242" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="9.5">regeneration · uses ATP</text>

      <!-- exit -->
      <path d="M 330 306 L 330 330" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arG5)" fill="none"/>
      <text x="330" y="352" text-anchor="middle" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800">1 of 6 TP exits → hexose → starch · sucrose · fatty acids · amino acids</text>
      <text x="330" y="368" text-anchor="middle" fill="#b9a3d6" font-family="Segoe UI, sans-serif" font-size="10">per CO₂ fixed: 3 ATP + 2 reduced NADP · six turns → 1 glucose: 18 ATP + 12 reduced NADP</text>
    </svg></body></html>
