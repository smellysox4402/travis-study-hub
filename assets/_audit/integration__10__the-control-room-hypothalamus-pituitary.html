<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hypothalamus pituitary control diagram: hypothalamus with sensors for temperature glucose osmolarity and hormones, pituitary with anterior lobe releasing HGH TSH LH FSH prolactin and posterior lobe releasing ADH and oxytocin, hormones into blood capillaries">
      <rect width="660" height="380" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE CONTROL ROOM — HYPOTHALAMUS + PITUITARY</text>
      <!-- hypothalamus -->
      <rect x="60" y="70" width="220" height="86" rx="12" fill="rgba(255,46,196,.08)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="170" y="92" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="middle">HYPOTHALAMUS</text>
      <text x="170" y="110" fill="#b9a3d6" font-size="9" text-anchor="middle">sensors: blood temp · glucose</text>
      <text x="170" y="124" fill="#b9a3d6" font-size="9" text-anchor="middle">osmolarity · hormone levels</text>
      <text x="170" y="140" fill="#b9a3d6" font-size="9" text-anchor="middle">+ inputs from senses, medulla, amygdala</text>
      <!-- stalk -->
      <path d="M 170 156 L 170 186" stroke="#ff2ec4" stroke-width="3" marker-end="url(#ah)" fill="none"/>
      <text x="200" y="176" fill="#b9a3d6" font-size="8.5" text-anchor="middle">narrow stalk</text>
      <!-- anterior -->
      <rect x="60" y="192" width="220" height="74" rx="12" fill="rgba(34,211,238,.07)" stroke="#22d3ee" stroke-width="2"/>
      <text x="170" y="212" fill="#22d3ee" font-size="11" font-weight="900" text-anchor="middle">ANTERIOR PITUITARY</text>
      <text x="170" y="230" fill="#b9a3d6" font-size="9" text-anchor="middle">HGH · TSH · LH · FSH · prolactin</text>
      <text x="170" y="246" fill="#b9a3d6" font-size="9" text-anchor="middle">→ blood capillaries</text>
      <!-- posterior -->
      <rect x="60" y="282" width="220" height="74" rx="12" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="170" y="302" fill="#4ade80" font-size="11" font-weight="900" text-anchor="middle">POSTERIOR PITUITARY</text>
      <text x="170" y="320" fill="#b9a3d6" font-size="9" text-anchor="middle">ADH · oxytocin</text>
      <text x="170" y="336" fill="#b9a3d6" font-size="9" text-anchor="middle">released on hypothalamus orders</text>
      <!-- examples -->
      <rect x="360" y="86" width="270" height="74" rx="12" fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-width="2"/>
      <text x="495" y="106" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">EXAMPLE 1 · OSMOREGULATION</text>
      <text x="495" y="124" fill="#b9a3d6" font-size="9" text-anchor="middle">blood too salty → osmoreceptors</text>
      <text x="495" y="140" fill="#b9a3d6" font-size="9" text-anchor="middle">→ ADH from posterior pituitary</text>
      <rect x="360" y="180" width="270" height="74" rx="12" fill="rgba(74,222,128,.07)" stroke="#4ade80" stroke-width="2"/>
      <text x="495" y="200" fill="#4ade80" font-size="11" font-weight="900" text-anchor="middle">EXAMPLE 2 · PUBERTY</text>
      <text x="495" y="218" fill="#b9a3d6" font-size="9" text-anchor="middle">hypothalamus → GnRH → LH + FSH</text>
      <text x="495" y="234" fill="#b9a3d6" font-size="9" text-anchor="middle">→ testosterone / oestradiol + progesterone</text>
      <text x="495" y="300" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Nervous system in, hormones out —</text>
      <text x="495" y="318" fill="#b9a3d6" font-size="10.5" text-anchor="middle">the bridge between both channels</text>
      <text x="330" y="370" fill="#b9a3d6" font-size="10.5" text-anchor="middle">Hypothalamus senses and decides · pituitary broadcasts · blood delivers</text>
    </svg></body></html>
