<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="plan diagrams side by side: dicot stem cross section with epidermis, cortex, a ring of vascular bundles each with xylem inner and phloem outer and pith in the centre; dicot root cross section with epidermis and root hairs, cortex, endodermis, and central star shaped xylem with phloem between the points">
      <rect width="660" height="340" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE FLOOR PLANS — STEM vs ROOT (plan diagrams)</text>
      <!-- stem -->
      <circle cx="165" cy="200" r="110" fill="rgba(74,222,128,.06)" stroke="#4ade80" stroke-width="2.5"/>
      <circle cx="165" cy="200" r="84" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="165" cy="200" r="40" fill="rgba(168,85,247,.08)" stroke="#a855f7" stroke-width="2"/>
      <!-- stem bundles -->
      <g fill="rgba(255,46,196,.25)" stroke="#ff2ec4" stroke-width="1.5">
        <circle cx="165" cy="112" r="12"/>
        <circle cx="210" cy="128" r="12"/>
        <circle cx="240" cy="165" r="12"/>
        <circle cx="240" cy="235" r="12"/>
        <circle cx="210" cy="272" r="12"/>
        <circle cx="165" cy="288" r="12"/>
        <circle cx="120" cy="272" r="12"/>
        <circle cx="90" cy="235" r="12"/>
        <circle cx="90" cy="165" r="12"/>
        <circle cx="120" cy="128" r="12"/>
      </g>
      <text x="165" y="60" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">STEM</text>
      <text x="165" y="78" fill="#b9a3d6" font-size="9.5" text-anchor="middle">bundles in a ring near edge</text>
      <text x="165" y="200" fill="#a855f7" font-size="9.5" font-weight="800" text-anchor="middle">PITH</text>
      <line x1="240" y1="200" x2="330" y2="200" stroke="#ff2ec4" stroke-width="1.2"/>
      <text x="336" y="196" fill="#ff2ec4" font-size="10" font-weight="800">VASCULAR BUNDLE</text>
      <text x="336" y="212" fill="#b9a3d6" font-size="9.5">xylem INNER + phloem OUTER</text>
      <text x="336" y="226" fill="#b9a3d6" font-size="9.5">cambium between them</text>
      <line x1="120" y1="120" x2="60" y2="110" stroke="#4ade80" stroke-width="1.2"/>
      <text x="54" y="106" fill="#4ade80" font-size="10" font-weight="800" text-anchor="end">EPIDERMIS</text>
      <text x="54" y="122" fill="#b9a3d6" font-size="9.5" text-anchor="end">waterproofing</text>
      <text x="54" y="150" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="end">CORTEX</text>
      <text x="54" y="166" fill="#b9a3d6" font-size="9.5" text-anchor="end">support + photosynthesis</text>
      <!-- root -->
      <circle cx="495" cy="200" r="110" fill="rgba(74,222,128,.06)" stroke="#4ade80" stroke-width="2.5"/>
      <circle cx="495" cy="200" r="84" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2"/>
      <!-- star xylem -->
      <g fill="rgba(255,46,196,.35)" stroke="#ff2ec4" stroke-width="2">
        <polygon points="495,140 502,176 538,188 508,202 520,238 495,216 470,238 482,202 452,188 488,176"/>
      </g>
      <!-- phloem between points -->
      <g fill="rgba(34,211,238,.4)">
        <circle cx="538" cy="210" r="7"/>
        <circle cx="510" cy="252" r="7"/>
        <circle cx="470" cy="250" r="7"/>
        <circle cx="452" cy="206" r="7"/>
        <circle cx="482" cy="162" r="7"/>
      </g>
      <text x="495" y="60" fill="#ff2ec4" font-size="13" font-weight="900" text-anchor="middle">ROOT</text>
      <text x="495" y="78" fill="#b9a3d6" font-size="9.5" text-anchor="middle">vascular tissue CENTRAL</text>
      <!-- root hairs -->
      <path d="M 400 150 C 380 144 372 150 380 156" stroke="#4ade80" stroke-width="1.5" fill="none"/>
      <path d="M 402 220 C 378 218 370 226 382 232" stroke="#4ade80" stroke-width="1.5" fill="none"/>
      <text x="360" y="140" fill="#4ade80" font-size="9.5" font-weight="800" text-anchor="end">ROOT HAIRS</text>
      <text x="360" y="156" fill="#b9a3d6" font-size="9" text-anchor="end">absorb water + ions</text>
      <line x1="556" y1="240" x2="610" y2="260" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="616" y="256" fill="#22d3ee" font-size="10" font-weight="800">PHLOEM</text>
      <text x="616" y="272" fill="#b9a3d6" font-size="9.5">between star points</text>
      <text x="616" y="286" fill="#b9a3d6" font-size="9.5">of the xylem star</text>
      <line x1="556" y1="180" x2="610" y2="180" stroke="#ff2ec4" stroke-width="1.2"/>
      <text x="616" y="176" fill="#ff2ec4" font-size="10" font-weight="800">XYLEM STAR</text>
      <text x="616" y="192" fill="#b9a3d6" font-size="9.5">thick-walled, central</text>
      <text x="616" y="320" fill="#4ade80" font-size="9.5" text-anchor="start">endodermis wraps the centre</text>
      <text x="330" y="332" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">PLAN DIAGRAM = single lines for tissue boundaries · no individual cells</text>
    </svg></body></html>
