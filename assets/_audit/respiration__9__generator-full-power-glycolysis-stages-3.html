<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="generator paying out: each triose phosphate is oxidised with hydrogen accepted by NAD to become reduced NAD producing bisphosphoglycerate, then ATP formation transfers phosphates to ADP producing 4 ATP, final outputs are 2 pyruvate three-carbon molecules, 2 reduced NAD and a net 2 ATP after repaying the 2 ATP invested">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">GENERATOR FULL POWER — GLYCOLYSIS STAGES 3–4</text>

      <rect x="30" y="52" width="290" height="110" rx="9" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="2"/>
      <text x="175" y="74" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">STAGE 3 · OXIDATION (×2 halves)</text>
      <text x="175" y="98" fill="#b9a3d6" font-size="9" text-anchor="middle">hydrogen removed from triose phosphate</text>
      <text x="175" y="114" fill="#b9a3d6" font-size="9" text-anchor="middle">accepted by NAD → reduced NAD</text>
      <text x="175" y="130" fill="#b9a3d6" font-size="9" text-anchor="middle">oxidation of sugar → organic acid</text>
      <text x="175" y="146" fill="#4ade80" font-size="9" font-weight="800" text-anchor="middle">+ phosphate → bisphosphoglycerate</text>

      <rect x="340" y="52" width="290" height="110" rx="9" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="2"/>
      <text x="485" y="74" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">STAGE 4 · ATP FORMATION (×2 halves)</text>
      <text x="485" y="98" fill="#b9a3d6" font-size="9" text-anchor="middle">phosphate groups transferred to ADP</text>
      <text x="485" y="114" fill="#b9a3d6" font-size="9" text-anchor="middle">2 phosphates × 2 molecules =</text>
      <text x="485" y="134" fill="#4ade80" font-size="12" font-weight="800" text-anchor="middle">4 ATP produced per glucose</text>
      <text x="485" y="152" fill="#b9a3d6" font-size="9" text-anchor="middle">glycerate → pyruvate (end product)</text>

      <rect x="60" y="196" width="160" height="56" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="140" y="218" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">2 PYRUVATE</text>
      <text x="140" y="238" fill="#b9a3d6" font-size="9" text-anchor="middle">3C each · end product</text>

      <rect x="250" y="196" width="160" height="56" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="330" y="218" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">2 REDUCED NAD</text>
      <text x="330" y="238" fill="#b9a3d6" font-size="9" text-anchor="middle">2 NAD → 2 reduced NAD</text>

      <rect x="440" y="196" width="160" height="56" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="520" y="218" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">NET 2 ATP</text>
      <text x="520" y="238" fill="#b9a3d6" font-size="9" text-anchor="middle">4 made − 2 invested = 2</text>

      <text x="330" y="290" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">net: glucose (6C) → 2 pyruvate (3C) + 2 reduced NAD + 2 ATP</text>
      <text x="330" y="316" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">no oxygen required — small yield but always available</text>
      <text x="330" y="340" fill="#b9a3d6" font-size="9.5" text-anchor="middle">a different enzyme catalyses each step of the pathway</text>
    </svg></body></html>
