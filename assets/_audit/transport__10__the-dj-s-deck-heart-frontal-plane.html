<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="frontal plane of the heart: vena cava into right atrium, through right atrioventricular valve into right ventricle and pulmonary artery; pulmonary veins into left atrium, through left atrioventricular valve into left ventricle and aorta; septum, SA node pacemaker, semilunar valves, and thicker left ventricle wall, plus a cardiac cycle strip showing atrial systole, ventricular systole and diastole">
      <rect width="660" height="440" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE DJ'S DECK — HEART FRONTAL PLANE</text>
      <!-- vena cava -->
      <rect x="70" y="50" width="26" height="80" rx="8" fill="rgba(34,211,238,.2)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="83" y="42" fill="#22d3ee" font-size="9.5" font-weight="800" text-anchor="middle">VENA CAVA</text>
      <!-- pulmonary artery -->
      <path d="M 150 120 C 130 90 90 80 60 80 L 60 66 C 100 60 150 70 175 100 Z" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="72" y="100" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">PULMONARY</text>
      <text x="72" y="112" fill="#22d3ee" font-size="9" font-weight="800" text-anchor="middle">ARTERY</text>
      <!-- right atrium -->
      <path d="M 80 140 C 80 110 150 110 170 140 C 185 165 175 200 150 210 L 100 210 C 80 200 80 160 80 140 Z" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="132" y="172" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">RIGHT</text>
      <text x="132" y="186" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">ATRIUM</text>
      <!-- SA node -->
      <circle cx="118" cy="128" r="7" fill="rgba(251,191,36,.4)" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="118" y="142" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">SA node</text>
      <!-- right ventricle -->
      <path d="M 95 225 C 90 260 110 300 150 300 C 190 300 210 270 215 240 C 200 225 160 220 130 222 Z" fill="rgba(34,211,238,.2)" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="152" y="262" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">RIGHT</text>
      <text x="152" y="276" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">VENTRICLE</text>
      <!-- pulmonary veins -->
      <rect x="560" y="130" width="26" height="60" rx="8" fill="rgba(255,46,196,.2)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="573" y="120" fill="#ff2ec4" font-size="9" font-weight="800" text-anchor="middle">PULMONARY</text>
      <text x="573" y="132" fill="#ff2ec4" font-size="9" font-weight="800" text-anchor="middle">VEINS</text>
      <!-- aorta -->
      <path d="M 480 140 C 500 120 540 100 570 100 L 580 86 C 540 80 490 100 465 125 Z" fill="rgba(255,46,196,.25)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="545" y="100" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">AORTA</text>
      <!-- left atrium -->
      <path d="M 470 140 C 470 110 500 110 510 140 C 525 165 515 200 490 210 L 440 210 C 425 200 425 160 470 140 Z" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="2.5"/>
      <text x="468" y="172" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">LEFT</text>
      <text x="468" y="186" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">ATRIUM</text>
      <!-- left ventricle (thicker wall) -->
      <path d="M 440 225 C 435 260 455 305 495 305 C 535 305 555 275 550 240 C 535 225 495 220 470 222 Z" fill="rgba(255,46,196,.2)" stroke="#ff2ec4" stroke-width="4"/>
      <text x="495" y="262" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">LEFT</text>
      <text x="495" y="276" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">VENTRICLE</text>
      <text x="495" y="294" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">thickest wall</text>
      <!-- septum -->
      <line x1="310" y1="150" x2="310" y2="300" stroke="#b9a3d6" stroke-width="2.5" stroke-dasharray="6 4"/>
      <text x="310" y="318" fill="#b9a3d6" font-size="9.5" font-weight="800" text-anchor="middle">SEPTUM</text>
      <text x="310" y="332" fill="#b9a3d6" font-size="9" text-anchor="middle">no mixing of</text>
      <text x="310" y="344" fill="#b9a3d6" font-size="9" text-anchor="middle">the two sides</text>
      <!-- AV valves -->
      <path d="M 105 210 L 150 225 L 130 235 Z" fill="rgba(251,191,36,.4)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="60" y="226" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="end">AV valves</text>
      <text x="60" y="240" fill="#b9a3d6" font-size="9" text-anchor="end">tricuspid (R)</text>
      <text x="60" y="254" fill="#b9a3d6" font-size="9" text-anchor="end">bicuspid (L)</text>
      <path d="M 440 212 L 485 225 L 460 235 Z" fill="rgba(251,191,36,.4)" stroke="#fbbf24" stroke-width="1.5"/>
      <!-- semilunar valves -->
      <path d="M 150 120 L 162 130 L 148 136 Z" fill="rgba(74,222,128,.4)" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M 460 130 L 472 140 L 458 146 Z" fill="rgba(74,222,128,.4)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="192" y="110" fill="#4ade80" font-size="9" font-weight="800">SEMILUNAR VALVES</text>
      <text x="192" y="124" fill="#b9a3d6" font-size="9">at artery exits</text>
      <!-- flow arrows -->
      <path d="M 83 140 L 110 165" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 140 190 L 140 218" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 120 225 C 100 200 90 150 85 125" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 505 160 L 480 180" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 470 200 L 470 218" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 480 228 C 500 200 520 160 540 130" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <!-- cardiac cycle strip -->
      <line x1="30" y1="370" x2="630" y2="370" stroke="#a855f7" stroke-width="1.5"/>
      <text x="330" y="358" fill="#a855f7" font-size="11" font-weight="800" text-anchor="middle">THE BEAT SEQUENCE (cardiac cycle, ~0.8 s at 75 bpm)</text>
      <rect x="40" y="380" width="180" height="44" rx="10" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="130" y="398" fill="#fbbf24" font-size="9.5" font-weight="800" text-anchor="middle">ATRIAL SYSTOLE</text>
      <text x="130" y="414" fill="#b9a3d6" font-size="9" text-anchor="middle">SA node fires · atria push</text>
      <rect x="240" y="380" width="180" height="44" rx="10" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="398" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">VENTRICULAR SYSTOLE</text>
      <text x="330" y="414" fill="#b9a3d6" font-size="9" text-anchor="middle">AV shut · blood into arteries</text>
      <rect x="440" y="380" width="180" height="44" rx="10" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="530" y="398" fill="#22d3ee" font-size="9.5" font-weight="800" text-anchor="middle">DIASTOLE</text>
      <text x="530" y="414" fill="#b9a3d6" font-size="9" text-anchor="middle">relax · semilunar shut · refill</text>
      <path d="M 220 402 L 236 402" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <path d="M 420 402 L 436 402" stroke="#ff2ec4" stroke-width="2.5" marker-end="url(#ah)" fill="none"/>
      <text x="330" y="434" fill="#b9a3d6" font-size="9.5" text-anchor="middle">blood flows ONE way: vena cava → RA → RV → pulmonary artery → lungs → pulmonary veins → LA → LV → aorta</text>
    </svg></body></html>
