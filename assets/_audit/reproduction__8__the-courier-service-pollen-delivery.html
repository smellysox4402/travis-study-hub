<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="courier dispatch board: pollen delivered between plant A and plant B is cross-pollination giving variation and hybrid vigour, same-plant pollen is rejected by self-incompatibility when S-alleles match, and three timing tricks protandry protogyny and dioecy separate the sexes">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE COURIER SERVICE — POLLEN DELIVERY</text>

      <rect x="50" y="64" width="150" height="86" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="125" y="84" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">PLANT A</text>
      <text x="125" y="100" fill="#b9a3d6" font-size="9" text-anchor="middle">anther → pollen</text>
      <text x="125" y="114" fill="#b9a3d6" font-size="9" text-anchor="middle">its own S-alleles</text>

      <rect x="50" y="160" width="150" height="86" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="125" y="180" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">PLANT B</text>
      <text x="125" y="196" fill="#b9a3d6" font-size="9" text-anchor="middle">stigma catches pollen</text>
      <text x="125" y="210" fill="#b9a3d6" font-size="9" text-anchor="middle">different S-alleles</text>

      <path d="M 200 100 C 300 100 300 208 200 206" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)" fill="none"/>

      <rect x="330" y="140" width="190" height="80" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="425" y="160" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">CROSS-POLLINATION</text>
      <text x="425" y="176" fill="#b9a3d6" font-size="9" text-anchor="middle">anther → stigma of another</text>
      <text x="425" y="190" fill="#b9a3d6" font-size="9" text-anchor="middle">plant: variation +</text>
      <text x="425" y="204" fill="#b9a3d6" font-size="9" text-anchor="middle">hybrid vigour</text>

      <rect x="440" y="64" width="180" height="100" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="530" y="84" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">REJECTED ✗</text>
      <text x="530" y="100" fill="#b9a3d6" font-size="9" text-anchor="middle">same-plant pollen</text>
      <text x="530" y="114" fill="#b9a3d6" font-size="9" text-anchor="middle">S-alleles match →</text>
      <text x="530" y="128" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">SELF-INCOMPATIBILITY</text>
      <text x="530" y="142" fill="#b9a3d6" font-size="9" text-anchor="middle">pollen tube stops growing</text>

      <rect x="40" y="250" width="180" height="84" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="130" y="270" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">PROTANDRY</text>
      <text x="130" y="286" fill="#b9a3d6" font-size="9" text-anchor="middle">anthers mature first</text>
      <text x="130" y="300" fill="#b9a3d6" font-size="9" text-anchor="middle">e.g. foxglove</text>
      <rect x="240" y="250" width="180" height="84" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="330" y="270" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">PROTOGYNY</text>
      <text x="330" y="286" fill="#b9a3d6" font-size="9" text-anchor="middle">stigma matures first</text>
      <text x="330" y="300" fill="#b9a3d6" font-size="9" text-anchor="middle">e.g. sacred lotus</text>
      <rect x="440" y="250" width="180" height="84" rx="9" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="530" y="270" fill="#a855f7" font-size="10" font-weight="800" text-anchor="middle">DIOECY</text>
      <text x="530" y="286" fill="#b9a3d6" font-size="9" text-anchor="middle">♂ and ♀ on separate</text>
      <text x="530" y="300" fill="#b9a3d6" font-size="9" text-anchor="middle">plants · ginkgo · nettle</text>

      <text x="330" y="350" fill="#b9a3d6" font-size="9.5" text-anchor="middle">self-pollination = extreme inbreeding → inbreeding depression (premature death, failure to thrive, infertility)</text>
    </svg></body></html>
