<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="labelled diagram of haemophilia inheritance: carrier mother XH Xh crossed with normal father XH Y showing sons 50 percent affected and daughters 50 percent carriers">
      <rect width="640" height="460" rx="14" fill="#150a26"/>
      <text x="320" y="26" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">HAEMOPHILIA — X-LINKED RECESSIVE</text>
      <text x="320" y="48" fill="#b9a3d6" font-size="11" font-weight="700" text-anchor="middle">carrier mother (XᴴXʰ) × normal father (XᴴY) — gene for Factor VIII on the X</text>
      <!-- key -->
      <text x="120" y="74" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">Xᴴ = normal clotting</text>
      <text x="320" y="74" fill="#ff2ec4" font-size="10" font-weight="800" text-anchor="middle">Xʰ = haemophilia allele</text>
      <text x="520" y="74" fill="#22d3ee" font-size="10" font-weight="800" text-anchor="middle">Y = no allele</text>
      <!-- gamete labels -->
      <text x="365" y="104" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">Xᴴ</text>
      <text x="445" y="104" fill="#22d3ee" font-size="12" font-weight="900" text-anchor="middle">Y</text>
      <text x="252" y="148" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="end">Xᴴ</text>
      <text x="252" y="228" fill="#ff2ec4" font-size="12" font-weight="900" text-anchor="end">Xʰ</text>
      <text x="150" y="140" fill="#b9a3d6" font-size="10" font-weight="700">mother's</text>
      <text x="150" y="152" fill="#b9a3d6" font-size="10" font-weight="700">gametes</text>
      <!-- grid -->
      <rect x="300" y="124" width="80" height="60" rx="8" fill="rgba(74,222,128,.10)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="340" y="150" fill="#f3e8ff" font-size="12.5" font-weight="900" text-anchor="middle">XᴴXᴴ</text>
      <text x="340" y="170" fill="#4ade80" font-size="9.5" font-weight="700" text-anchor="middle">normal girl</text>
      <rect x="392" y="124" width="80" height="60" rx="8" fill="rgba(34,211,238,.10)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="432" y="150" fill="#f3e8ff" font-size="12.5" font-weight="900" text-anchor="middle">XᴴY</text>
      <text x="432" y="170" fill="#22d3ee" font-size="9.5" font-weight="700" text-anchor="middle">normal boy</text>
      <rect x="300" y="196" width="80" height="60" rx="8" fill="rgba(251,191,36,.10)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="340" y="222" fill="#f3e8ff" font-size="12.5" font-weight="900" text-anchor="middle">XᴴXʰ</text>
      <text x="340" y="242" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">carrier girl</text>
      <rect x="392" y="196" width="80" height="60" rx="8" fill="rgba(255,46,196,.12)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="432" y="222" fill="#f3e8ff" font-size="12.5" font-weight="900" text-anchor="middle">XʰY</text>
      <text x="432" y="242" fill="#ff2ec4" font-size="9.5" font-weight="700" text-anchor="middle">HAEMOPHILIC boy</text>
      <!-- why box -->
      <rect x="100" y="286" width="440" height="90" rx="10" fill="rgba(255,46,196,.06)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="320" y="308" fill="#ff2ec4" font-size="11.5" font-weight="900" text-anchor="middle">WHY BOYS? — males have ONE X, females have TWO</text>
      <text x="320" y="328" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">male: one Xʰ copy → affected (no second X to cover it)</text>
      <text x="320" y="344" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">female: needs XʰXʰ → carrier daughters are symptom-free</text>
      <text x="320" y="362" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">Factor VIII missing → bleeding lasts much longer, internal bleeding</text>
      <text x="320" y="398" fill="#4ade80" font-size="11.5" font-weight="900" text-anchor="middle">sons: 50% affected · daughters: 50% carriers</text>
      <text x="320" y="420" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">no father-to-son transmission — a son's X always comes from mum</text>
      <text x="320" y="444" fill="#b9a3d6" font-size="10" font-weight="700" text-anchor="middle">treatment: infuse Factor VIII purified from donated blood</text>
    </svg></body></html>
