<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="puberty control chain: hypothalamus DJ booth secretes GnRH pulses where lower frequency gives FSH and higher frequency gives LH, pituitary releases FSH and LH, gonads respond, sex steroids testosterone oestradiol and progesterone drive the secondary sexual characteristics">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE DEBUT NIGHT — PUBERTY CONTROL (AHL)</text>

      <rect x="120" y="50" width="420" height="34" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="72" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">HYPOTHALAMUS — GnRH · 10-amino-acid peptide</text>
      <path d="M 330 84 L 330 92" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="120" y="94" width="420" height="34" rx="9" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="2"/>
      <text x="330" y="116" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle">GnRH PULSES — lower frequency → FSH · higher frequency → LH</text>
      <path d="M 330 128 L 330 136" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="120" y="138" width="420" height="34" rx="9" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="2"/>
      <text x="330" y="160" fill="#a855f7" font-size="10.5" font-weight="800" text-anchor="middle">PITUITARY — secretes FSH + LH</text>
      <path d="M 330 172 L 330 180" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="120" y="182" width="420" height="34" rx="9" fill="rgba(251,191,36,.1)" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="204" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">GONADS — testes · ovaries</text>
      <path d="M 330 216 L 330 224" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="120" y="226" width="420" height="34" rx="9" fill="rgba(74,222,128,.1)" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="248" fill="#4ade80" font-size="10.5" font-weight="800" text-anchor="middle">SEX STEROIDS — testosterone · oestradiol · progesterone</text>
      <path d="M 330 260 L 330 268" stroke="#b9a3d6" stroke-width="2" marker-end="url(#ah)" fill="none"/>

      <rect x="120" y="270" width="420" height="34" rx="9" fill="rgba(255,46,196,.1)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="330" y="292" fill="#ff2ec4" font-size="10.5" font-weight="800" text-anchor="middle">BODY CHANGES — ♂ penis · pubic hair · voice · ♀ uterus · breasts · hair</text>

      <text x="330" y="330" fill="#b9a3d6" font-size="9.5" text-anchor="middle">GnRH starts ~10 weeks after fertilization · stops at 4–6 months · resumes at puberty</text>
      <text x="330" y="348" fill="#b9a3d6" font-size="9.5" text-anchor="middle">FSH: testis growth / follicle development · LH: testosterone (Leydig cells) / corpus luteum</text>
    </svg></body></html>
