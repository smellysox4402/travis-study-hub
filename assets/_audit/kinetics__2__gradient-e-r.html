<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 640 400" role="img" aria-label="Arrhenius plot of ln k against 1 over T">
      <!-- axes -->
      <line x1="70" y1="340" x2="625" y2="340" stroke="#b9a3d6" stroke-width="2"/>
      <polygon points="625,340 612,335 612,345" fill="#b9a3d6"/>
      <line x1="70" y1="340" x2="70" y2="40" stroke="#b9a3d6" stroke-width="2"/>
      <polygon points="70,40 65,52 75,52" fill="#b9a3d6"/>
      <!-- line: ln k = -(Ea/R)(1/T) + ln A, negative slope -->
      <line x1="100" y1="95" x2="590" y2="305" stroke="#22d3ee" stroke-width="3"/>
      <!-- data points -->
      <circle cx="190" cy="135" r="6" fill="#ff2ec4"/>
      <circle cx="500" cy="275" r="6" fill="#ff2ec4"/>
      <!-- slope triangle -->
      <line x1="190" y1="275" x2="500" y2="275" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="190" y1="135" x2="190" y2="275" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="345" y="290" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">gradient = −Eₐ/R</text>
      <!-- intercept -->
      <line x1="70" y1="80" x2="100" y2="95" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4"/>
      <text x="70" y="66" fill="#4ade80" font-size="13" font-weight="700" text-anchor="start">intercept = ln A</text>
      <!-- point labels -->
      <text x="196" y="120" fill="#ff2ec4" font-size="12" font-weight="600">(1/T₁, ln k₁)</text>
      <text x="430" y="262" fill="#ff2ec4" font-size="12" font-weight="600">(1/T₂, ln k₂)</text>
      <!-- axis labels -->
      <text x="350" y="382" fill="#b9a3d6" font-size="12" text-anchor="middle">1/T (K⁻¹) →</text>
      <text x="32" y="195" fill="#b9a3d6" font-size="12" text-anchor="middle" transform="rotate(-90 32 195)">ln k →</text>
    </svg></body></html>
