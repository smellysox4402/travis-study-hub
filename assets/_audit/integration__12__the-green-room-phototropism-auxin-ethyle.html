<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="plant phototropism and auxin diagram: shoot bending toward light from the left, auxin concentrated on the shaded side causing faster elongation, auxin efflux carrier pumping auxin out of a cell, ethylene positive feedback loop ripening fruit">
      <rect width="660" height="400" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE GREEN ROOM — PHOTOTROPISM + AUXIN + ETHYLENE</text>
      <!-- light arrows -->
      <text x="40" y="90" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">LIGHT ☀</text>
      <path d="M 60 100 L 120 120" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 60 120 L 120 140" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 60 140 L 120 160" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <!-- shoot -->
      <path d="M 150 350 C 150 280 150 200 150 170" stroke="#4ade80" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M 150 170 C 165 130 190 120 210 118" stroke="#4ade80" stroke-width="10" stroke-linecap="round" fill="none"/>
      <ellipse cx="214" cy="118" rx="26" ry="10" fill="rgba(74,222,128,.3)" stroke="#4ade80" stroke-width="2" transform="rotate(-20 214 118)"/>
      <text x="185" y="160" fill="#4ade80" font-size="9.5" text-anchor="middle">shoot bends toward light</text>
      <!-- shaded side faster -->
      <path d="M 150 170 C 138 150 140 130 150 118" stroke="#ff2ec4" stroke-width="3" stroke-dasharray="4 3" fill="none"/>
      <text x="60" y="220" fill="#ff2ec4" font-size="9.5" font-weight="800" text-anchor="middle">shaded side:</text>
      <text x="60" y="236" fill="#b9a3d6" font-size="9" text-anchor="middle">more auxin → cells</text>
      <text x="60" y="250" fill="#b9a3d6" font-size="9" text-anchor="middle">elongate faster</text>
      <text x="258" y="236" fill="#22d3ee" font-size="9.5" font-weight="800" text-anchor="middle">bright side: less auxin</text>
      <text x="258" y="252" fill="#b9a3d6" font-size="9" text-anchor="middle">slower elongation</text>
      <!-- efflux carrier inset -->
      <rect x="250" y="280" width="380" height="110" rx="12" fill="rgba(34,211,238,.05)" stroke="#22d3ee" stroke-width="2"/>
      <text x="440" y="300" fill="#22d3ee" font-size="11" font-weight="900" text-anchor="middle">AUXIN EFFLUX CARRIER · C3.1.20</text>
      <rect x="330" y="318" width="90" height="34" rx="8" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="375" y="332" fill="#22d3ee" font-size="9" text-anchor="middle">CELL</text>
      <text x="375" y="345" fill="#b9a3d6" font-size="8" text-anchor="middle">cytoplasm</text>
      <rect x="460" y="318" width="120" height="34" rx="8" fill="rgba(168,85,247,.1)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="520" y="332" fill="#a855f7" font-size="9" text-anchor="middle">CELL WALL</text>
      <text x="520" y="345" fill="#b9a3d6" font-size="8" text-anchor="middle">acidic apoplast</text>
      <rect x="420" y="326" width="28" height="18" rx="4" fill="rgba(255,46,196,.3)" stroke="#ff2ec4" stroke-width="1.5"/>
      <text x="434" y="339" fill="#ff2ec4" font-size="8" font-weight="800" text-anchor="middle">PUMP</text>
      <path d="M 420 335 L 408 335 L 402 335" stroke="#ff2ec4" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <text x="300" y="356" fill="#b9a3d6" font-size="8.5" text-anchor="middle">auxin⁻ trapped inside, pumped out →</text>
      <text x="300" y="370" fill="#b9a3d6" font-size="8.5" text-anchor="middle">carriers on one side = directional flow</text>
      <!-- ethylene loop -->
      <rect x="20" y="280" width="200" height="110" rx="12" fill="rgba(74,222,128,.05)" stroke="#4ade80" stroke-width="2"/>
      <text x="120" y="300" fill="#4ade80" font-size="11" font-weight="900" text-anchor="middle">ETHYLENE · C3.1.23</text>
      <circle cx="80" cy="340" r="18" fill="rgba(74,222,128,.15)" stroke="#4ade80" stroke-width="2"/>
      <text x="80" y="336" fill="#4ade80" font-size="8" text-anchor="middle">ripening</text>
      <text x="80" y="347" fill="#4ade80" font-size="8" text-anchor="middle">fruit</text>
      <circle cx="170" cy="340" r="16" fill="rgba(255,46,196,.15)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="170" y="344" fill="#ff2ec4" font-size="8" text-anchor="middle">ethylene</text>
      <path d="M 98 340 C 120 340 130 340 150 340" stroke="#4ade80" stroke-width="2" marker-end="url(#ah)" fill="none"/>
      <path d="M 170 324 C 150 300 100 300 80 318" stroke="#ff2ec4" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)" fill="none"/>
      <text x="120" y="376" fill="#b9a3d6" font-size="8.5" text-anchor="middle">positive feedback: ethylene →</text>
      <text x="120" y="388" fill="#b9a3d6" font-size="8.5" text-anchor="middle">more ripening → more ethylene</text>
    </svg></body></html>
