<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="two gamete production lines: left spermatogenesis factory in seminiferous tubules with endless mitosis, meiosis producing 4 sperm per meiosis, millions per day, Sertoli nurse cells and Leydig cells making testosterone; right oogenesis one-off with 400000 primary follicles at birth, one egg per month and per meiosis, polar bodies discarded">
      <rect width="660" height="360" rx="14" fill="#150a26"/>
      <text x="330" y="28" fill="#ff2ec4" font-size="14" font-weight="900" text-anchor="middle">THE FACTORY VS THE ONE-OFF — GAMETOGENESIS (AHL)</text>

      <rect x="30" y="56" width="290" height="252" rx="9" fill="rgba(255,46,196,.06)" stroke="#ff2ec4" stroke-width="2"/>
      <text x="175" y="76" fill="#ff2ec4" font-size="11" font-weight="800" text-anchor="middle">SPERMATOGENESIS — THE FACTORY</text>
      <text x="175" y="96" fill="#b9a3d6" font-size="9.5" text-anchor="middle">seminiferous tubules · germinal epithelium</text>
      <text x="175" y="112" fill="#b9a3d6" font-size="9.5" text-anchor="middle">mitosis endlessly → spermatocytes (2n)</text>
      <text x="175" y="128" fill="#b9a3d6" font-size="9.5" text-anchor="middle">meiosis I + II → spermatids → sperm</text>
      <text x="175" y="144" fill="#b9a3d6" font-size="9.5" text-anchor="middle">4 sperm per meiosis · millions per day</text>
      <text x="175" y="160" fill="#b9a3d6" font-size="9.5" text-anchor="middle">~75 days per batch · from puberty</text>
      <text x="175" y="176" fill="#b9a3d6" font-size="9.5" text-anchor="middle">Sertoli cells nurse · tail + minimal cytoplasm</text>
      <text x="175" y="192" fill="#b9a3d6" font-size="9.5" text-anchor="middle">Leydig cells → testosterone</text>

      <rect x="340" y="56" width="290" height="252" rx="9" fill="rgba(34,211,238,.06)" stroke="#22d3ee" stroke-width="2"/>
      <text x="485" y="76" fill="#22d3ee" font-size="11" font-weight="800" text-anchor="middle">OOGENESIS — THE ONE-OFF</text>
      <text x="485" y="96" fill="#b9a3d6" font-size="9.5" text-anchor="middle">starts in the FOETUS — no more ever made</text>
      <text x="485" y="112" fill="#b9a3d6" font-size="9.5" text-anchor="middle">~400,000 primary follicles at birth</text>
      <text x="485" y="128" fill="#b9a3d6" font-size="9.5" text-anchor="middle">each cycle: a few develop → usually 1 matures</text>
      <text x="485" y="144" fill="#b9a3d6" font-size="9.5" text-anchor="middle">meiosis I completed at ovulation</text>
      <text x="485" y="160" fill="#b9a3d6" font-size="9.5" text-anchor="middle">meiosis II only after fertilization</text>
      <text x="485" y="176" fill="#b9a3d6" font-size="9.5" text-anchor="middle">1 egg per meiosis — polar bodies discarded</text>
      <text x="485" y="192" fill="#b9a3d6" font-size="9.5" text-anchor="middle">1 per month · Day 14 · puberty → menopause</text>
      <text x="485" y="208" fill="#b9a3d6" font-size="9.5" text-anchor="middle">egg = most cytoplasm of any cell → food reserves</text>

      <text x="330" y="336" fill="#b9a3d6" font-size="9.5" text-anchor="middle">same four stages — mitosis · growth · meiosis ×2 · differentiation — run very differently in each sex</text>
    </svg></body></html>
