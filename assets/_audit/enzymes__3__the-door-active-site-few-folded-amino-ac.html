<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;background:#150a26;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}svg{display:block;width:880px;height:auto}</style></head><body><svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="a globular enzyme protein drawn as a folded blob in neon outline: two amino acids that are far apart in the polypeptide sequence fold together to form the active site door, a substrate molecule fits into the door while other molecules bounce off, with a note that the few amino acids of the active site are brought together by folding">

      <circle cx="196" cy="118" r="9" fill="#ff2ec4"/>

      <circle cx="396" cy="200" r="9" fill="#ff2ec4"/>
      <text x="396" y="203" fill="#0b0214" font-size="8" font-weight="900" text-anchor="middle">217</text>
